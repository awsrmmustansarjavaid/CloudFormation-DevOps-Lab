AWSTemplateFormatVersion: '2010-09-09'

# ============================================================
# Charlie Cafe
# Standalone ECS Fargate + ECR CloudFormation Stack
# ============================================================
#
# PURPOSE
# ============================================================
#
# This template creates the ECS/Fargate application layer for
# Charlie Cafe.
#
# It is a STANDALONE CloudFormation stack.
#
# It is NOT a nested stack.
#
# The VPC, public subnets, private subnets and private route
# table are created by the MAIN CloudFormation infrastructure.
#
# This stack consumes those existing networking resources.
#
# ============================================================
#
# CLOUDFORMATION SERVICE ROLE
# ============================================================
#
# IMPORTANT:
#
# This template DOES NOT create the CloudFormation service role.
#
# The CloudFormation service role already exists:
#
#     CharlieCafe-CloudFormation-ServiceRole
#
# CloudFormation assumes that role when this stack is created,
# updated or deleted.
#
# The role is supplied from GitHub Actions using:
#
#     --role-arn
#
# Example:
#
#     arn:aws:iam::<ACCOUNT_ID>:role/
#     CharlieCafe-CloudFormation-ServiceRole
#
# ============================================================
#
# ECS TASK EXECUTION ROLE
# ============================================================
#
# This is a DIFFERENT IAM role.
#
# CloudFormation creates:
#
#     CharlieCafe-CloudFormation-ECSTaskExecutionRole
#
# This role is assumed by:
#
#     ecs-tasks.amazonaws.com
#
# It allows ECS/Fargate to:
#
#     - Pull images from ECR
#     - Send container logs to CloudWatch Logs
#
# ============================================================
#
# THIS STACK CREATES:
#
# 1. ECR Repository
# 2. ECS Cluster
# 3. CloudWatch Log Group
# 4. ECS Task Execution IAM Role
# 5. ECS Task IAM Role
# 6. VPC Endpoint Security Group
# 7. ECR API VPC Endpoint
# 8. ECR Docker Registry VPC Endpoint
# 9. S3 Gateway VPC Endpoint
# 10. CloudWatch Logs VPC Endpoint
# 11. ALB Security Group
# 12. ECS Task Security Group
# 13. Application Load Balancer
# 14. ALB Target Group
# 15. ALB Listener
# 16. ECS Task Definition
# 17. ECS Fargate Service
#
# ============================================================
#
# ACM CERTIFICATE
# ============================================================
#
# NOT INCLUDED.
#
# This beginner lab intentionally uses:
#
#     HTTP :80
#
# HTTPS + ACM can be added later.
#
# ============================================================


# ============================================================
# HIGH-LEVEL ARCHITECTURE
# ============================================================
#
#
#                         INTERNET
#                             |
#                             |
#                         HTTP :80
#                             |
#                             v
#                  +----------------------+
#                  | Application Load     |
#                  | Balancer             |
#                  | PUBLIC SUBNETS       |
#                  +----------------------+
#                             |
#                             |
#                       Container Port
#                             |
#                             v
#                  +----------------------+
#                  | ECS Fargate Service  |
#                  +----------------------+
#                             |
#                             v
#                  +----------------------+
#                  | ECS Fargate Task     |
#                  | PRIVATE SUBNET       |
#                  | Docker Container     |
#                  +----------------------+
#                             |
#                             v
#                  +----------------------+
#                  | Amazon ECR           |
#                  | Docker Image         |
#                  +----------------------+
#
#
# PRIVATE AWS SERVICE CONNECTIVITY
#
# ECS Fargate Task
#        |
#        +------------------> ECR API Endpoint
#        |
#        +------------------> ECR DKR Endpoint
#        |
#        +------------------> S3 Gateway Endpoint
#        |
#        +------------------> CloudWatch Logs Endpoint
#
#
# No NAT Gateway is required for these AWS service connections.
#
# ============================================================


# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  # ==========================================================
  # 1. EXISTING VPC
  # ==========================================================

  VpcId:
    Type: AWS::EC2::VPC::Id

    Description:
      Existing VPC where ECS and ALB resources will be deployed.


  # ==========================================================
  # 2. PUBLIC SUBNET 1
  # ==========================================================

  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id

    Description:
      First public subnet for the Application Load Balancer.


  # ==========================================================
  # 3. PUBLIC SUBNET 2
  # ==========================================================

  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id

    Description:
      Second public subnet for the Application Load Balancer.


  # ==========================================================
  # 4. PRIVATE SUBNET 1
  # ==========================================================

  PrivateSubnet1:
    Type: AWS::EC2::Subnet::Id

    Description:
      First private subnet for ECS Fargate tasks.


  # ==========================================================
  # 5. PRIVATE SUBNET 2
  # ==========================================================

  PrivateSubnet2:
    Type: AWS::EC2::Subnet::Id

    Description:
      Second private subnet for ECS Fargate tasks.


  # ==========================================================
  # 6. PRIVATE ROUTE TABLE
  # ==========================================================

  PrivateRouteTableId:
    Type: String

    Description:
      Existing private route table used by ECS private subnets.


  # ==========================================================
  # 7. APPLICATION NAME
  # ==========================================================
  #
  # GLOBAL APPLICATION VARIABLE
  #
  # This parameter is reused throughout the template.
  #
  # ==========================================================

  ApplicationName:
    Type: String

    Default: CharlieCafe

    Description:
      Global application name used by Charlie Cafe resources.


  # ==========================================================
  # 8. ECR REPOSITORY NAME
  # ==========================================================

  ECRRepositoryName:
    Type: String

    Default: charlie-cafe

    Description:
      ECR repository name for the Charlie Cafe Docker image.


  # ==========================================================
  # 9. ECS CLUSTER NAME
  # ==========================================================

  ECSClusterName:
    Type: String

    Default: CharlieCafe-Cluster

    Description:
      ECS cluster name.


  # ==========================================================
  # 10. ECS SERVICE NAME
  # ==========================================================

  ECSServiceName:
    Type: String

    Default: CharlieCafe-Service

    Description:
      ECS service name.


  # ==========================================================
  # 11. ECS TASK EXECUTION ROLE NAME
  # ==========================================================
  #
  # IMPORTANT:
  #
  # This name is intentionally DIFFERENT from the old
  # Terraform-managed role:
  #
  #     CharlieCafe-ECSTaskExecutionRole
  #
  # This prevents CloudFormation/Terraform ownership conflicts.
  #
  # ==========================================================

  ECSTaskExecutionRoleName:
    Type: String

    Default: CharlieCafe-CloudFormation-ECSTaskExecutionRole

    Description:
      ECS task execution role created and managed by this CloudFormation stack.


  # ==========================================================
  # 12. ECS TASK ROLE NAME
  # ==========================================================

  ECSTaskRoleName:
    Type: String

    Default: CharlieCafe-ECSTaskRole

    Description:
      IAM role used by the Charlie Cafe application container.


  # ==========================================================
  # 13. CONTAINER PORT
  # ==========================================================

  ContainerPort:
    Type: Number

    Default: 80

    Description:
      Port exposed by the Docker container.


  # ==========================================================
  # 14. ECS TASK CPU
  # ==========================================================

  TaskCpu:
    Type: String

    Default: '256'

    Description:
      Fargate task CPU units.


  # ==========================================================
  # 15. ECS TASK MEMORY
  # ==========================================================

  TaskMemory:
    Type: String

    Default: '512'

    Description:
      Fargate task memory in MB.


  # ==========================================================
  # 16. DESIRED TASK COUNT
  # ==========================================================

  DesiredCount:
    Type: Number

    Default: 0

    Description:
      Number of ECS Fargate tasks.


# ============================================================
# RESOURCES
# ============================================================

Resources:


  # ==========================================================
  # 1. VPC ENDPOINT SECURITY GROUP
  # ==========================================================

  VPCEndpointSecurityGroup:

    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription:
        Allow HTTPS from ECS private subnets to AWS VPC endpoints

      VpcId:
        !Ref VpcId

      SecurityGroupIngress:

        - IpProtocol: tcp

          FromPort: 443

          ToPort: 443

          CidrIp: 10.0.2.0/24

          Description:
            HTTPS from Private Subnet 1


        - IpProtocol: tcp

          FromPort: 443

          ToPort: 443

          CidrIp: 10.0.3.0/24

          Description:
            HTTPS from Private Subnet 2

      SecurityGroupEgress:

        - IpProtocol: -1

          CidrIp: 0.0.0.0/0

      Tags:

        - Key: Name
          Value: !Sub '${ApplicationName}-VPC-Endpoint-SG'

        - Key: Project
          Value: CharlieCafe

        - Key: ManagedBy
          Value: CloudFormation


  # ==========================================================
  # 2. ECR API VPC ENDPOINT
  # ==========================================================

  ECRApiVPCEndpoint:

    Type: AWS::EC2::VPCEndpoint

    Properties:

      VpcId:
        !Ref VpcId

      ServiceName:
        !Sub 'com.amazonaws.${AWS::Region}.ecr.api'

      VpcEndpointType:
        Interface

      PrivateDnsEnabled:
        true

      SubnetIds:

        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

      SecurityGroupIds:

        - !Ref VPCEndpointSecurityGroup

      Tags:

        - Key: Name
          Value: !Sub '${ApplicationName}-ECR-API-VPC-Endpoint'

        - Key: Project
          Value: CharlieCafe


  # ==========================================================
  # 3. ECR DOCKER REGISTRY VPC ENDPOINT
  # ==========================================================

  ECRDkrVPCEndpoint:

    Type: AWS::EC2::VPCEndpoint

    Properties:

      VpcId:
        !Ref VpcId

      ServiceName:
        !Sub 'com.amazonaws.${AWS::Region}.ecr.dkr'

      VpcEndpointType:
        Interface

      PrivateDnsEnabled:
        true

      SubnetIds:

        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

      SecurityGroupIds:

        - !Ref VPCEndpointSecurityGroup

      Tags:

        - Key: Name
          Value: !Sub '${ApplicationName}-ECR-DKR-VPC-Endpoint'

        - Key: Project
          Value: CharlieCafe


  # ==========================================================
  # 4. S3 GATEWAY VPC ENDPOINT
  # ==========================================================

  S3VPCEndpoint:

    Type: AWS::EC2::VPCEndpoint

    Properties:

      VpcId:
        !Ref VpcId

      ServiceName:
        !Sub 'com.amazonaws.${AWS::Region}.s3'

      VpcEndpointType:
        Gateway

      RouteTableIds:

        - !Ref PrivateRouteTableId

      Tags:

        - Key: Name
          Value: !Sub '${ApplicationName}-S3-Gateway-VPC-Endpoint'

        - Key: Project
          Value: CharlieCafe


  # ==========================================================
  # 5. CLOUDWATCH LOGS VPC ENDPOINT
  # ==========================================================

  CloudWatchLogsVPCEndpoint:

    Type: AWS::EC2::VPCEndpoint

    Properties:

      VpcId:
        !Ref VpcId

      ServiceName:
        !Sub 'com.amazonaws.${AWS::Region}.logs'

      VpcEndpointType:
        Interface

      PrivateDnsEnabled:
        true

      SubnetIds:

        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

      SecurityGroupIds:

        - !Ref VPCEndpointSecurityGroup

      Tags:

        - Key: Name
          Value: !Sub '${ApplicationName}-CloudWatch-Logs-VPC-Endpoint'

        - Key: Project
          Value: CharlieCafe


  # ==========================================================
  # 6. ECR REPOSITORY
  # ==========================================================

  ECRRepository:

    Type: AWS::ECR::Repository

    Properties:

      RepositoryName:
        !Ref ECRRepositoryName

      ImageScanningConfiguration:

        ScanOnPush: true

      EncryptionConfiguration:

        EncryptionType: AES256

      ImageTagMutability:
        MUTABLE

      Tags:

        - Key: Name
          Value: !Sub '${ApplicationName}-ECR'

        - Key: Project
          Value: CharlieCafe

        - Key: ManagedBy
          Value: CloudFormation


  # ==========================================================
  # 7. ECS CLUSTER
  # ==========================================================

  ECSCluster:

    Type: AWS::ECS::Cluster

    Properties:

      ClusterName:
        !Ref ECSClusterName

      ClusterSettings:

        - Name: containerInsights

          Value: enabled

      Tags:

        - Key: Name
          Value: !Ref ECSClusterName

        - Key: Project
          Value: CharlieCafe

        - Key: ManagedBy
          Value: CloudFormation


  # ==========================================================
  # 8. CLOUDWATCH LOG GROUP
  # ==========================================================

  ECSLogGroup:

    Type: AWS::Logs::LogGroup

    Properties:

      LogGroupName:
        !Sub '/ecs/${ApplicationName}'

      RetentionInDays:
        30

      Tags:

        - Key: Project
          Value: CharlieCafe

        - Key: ManagedBy
          Value: CloudFormation


  # ==========================================================
  # 9. ECS TASK EXECUTION ROLE
  # ==========================================================
  #
  # IMPORTANT:
  #
  # THIS IS NOT:
  #
  #     CharlieCafe-CloudFormation-ServiceRole
  #
  # This is an ECS task execution role.
  #
  # CloudFormation creates and manages this role.
  #
  # ECS assumes this role.
  #
  # ==========================================================

  ECSTaskExecutionRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Ref ECSTaskExecutionRoleName

      Description:
        IAM execution role for Charlie Cafe ECS Fargate tasks.

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                ecs-tasks.amazonaws.com

            Action:
              sts:AssumeRole

      # ------------------------------------------------------
      # AWS MANAGED POLICY
      #
      # Provides standard ECS task execution permissions:
      #
      # - ECR image pulling
      # - CloudWatch Logs
      # ------------------------------------------------------

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

      Tags:

        - Key: Name
          Value: !Ref ECSTaskExecutionRoleName

        - Key: Project
          Value: CharlieCafe

        - Key: ManagedBy
          Value: CloudFormation


  # ==========================================================
  # 10. ECS TASK ROLE
  # ==========================================================
  #
  # This role is for the APPLICATION running inside the
  # container.
  #
  # It is intentionally empty initially.
  #
  # Add permissions here later if the application needs:
  #
  #     S3
  #     DynamoDB
  #     Secrets Manager
  #     KMS
  #
  # ==========================================================

  ECSTaskRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Ref ECSTaskRoleName

      Description:
        IAM application role for Charlie Cafe ECS tasks.

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                ecs-tasks.amazonaws.com

            Action:
              sts:AssumeRole

      Tags:

        - Key: Name
          Value: !Ref ECSTaskRoleName

        - Key: Project
          Value: CharlieCafe

        - Key: ManagedBy
          Value: CloudFormation


  # ==========================================================
  # 11. ALB SECURITY GROUP
  # ==========================================================

  ALBSecurityGroup:

    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription:
        Allow HTTP traffic to Charlie Cafe Application Load Balancer

      VpcId:
        !Ref VpcId

      SecurityGroupIngress:

        - IpProtocol: tcp

          FromPort: 80

          ToPort: 80

          CidrIp: 0.0.0.0/0

          Description:
            Allow HTTP from Internet

      SecurityGroupEgress:

        - IpProtocol: -1

          CidrIp: 0.0.0.0/0

      Tags:

        - Key: Name
          Value: !Sub '${ApplicationName}-ALB-SG'

        - Key: Project
          Value: CharlieCafe

        - Key: ManagedBy
          Value: CloudFormation


  # ==========================================================
  # 12. ECS TASK SECURITY GROUP
  # ==========================================================

  ECSTaskSecurityGroup:

    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription:
        Allow application traffic only from the ALB

      VpcId:
        !Ref VpcId

      SecurityGroupIngress:

        - IpProtocol: tcp

          FromPort:
            !Ref ContainerPort

          ToPort:
            !Ref ContainerPort

          SourceSecurityGroupId:
            !Ref ALBSecurityGroup

          Description:
            Allow application traffic from ALB

      SecurityGroupEgress:

        - IpProtocol: -1

          CidrIp: 0.0.0.0/0

      Tags:

        - Key: Name
          Value: !Sub '${ApplicationName}-ECS-Task-SG'

        - Key: Project
          Value: CharlieCafe

        - Key: ManagedBy
          Value: CloudFormation


  # ==========================================================
  # 13. APPLICATION LOAD BALANCER
  # ==========================================================

  ApplicationLoadBalancer:

    Type: AWS::ElasticLoadBalancingV2::LoadBalancer

    Properties:

      Name:
        !Sub '${ApplicationName}-ALB'

      Scheme:
        internet-facing

      Type:
        application

      SecurityGroups:

        - !Ref ALBSecurityGroup

      Subnets:

        - !Ref PublicSubnet1
        - !Ref PublicSubnet2

      Tags:

        - Key: Name
          Value: !Sub '${ApplicationName}-ALB'

        - Key: Project
          Value: CharlieCafe

        - Key: ManagedBy
          Value: CloudFormation


  # ==========================================================
  # 14. ALB TARGET GROUP
  # ==========================================================

  ALBTargetGroup:

    Type: AWS::ElasticLoadBalancingV2::TargetGroup

    Properties:

      Name:
        !Sub '${ApplicationName}-TG'

      VpcId:
        !Ref VpcId

      Protocol:
        HTTP

      Port:
        !Ref ContainerPort

      TargetType:
        ip

      HealthCheckEnabled:
        true

      HealthCheckProtocol:
        HTTP

      HealthCheckPath:
        /

      HealthCheckPort:
        traffic-port

      HealthCheckIntervalSeconds:
        30

      HealthCheckTimeoutSeconds:
        5

      HealthyThresholdCount:
        2

      UnhealthyThresholdCount:
        3

      Tags:

        - Key: Name
          Value: !Sub '${ApplicationName}-TG'

        - Key: Project
          Value: CharlieCafe

        - Key: ManagedBy
          Value: CloudFormation


  # ==========================================================
  # 15. ALB LISTENER
  # ==========================================================

  ALBListener:

    Type: AWS::ElasticLoadBalancingV2::Listener

    Properties:

      LoadBalancerArn:
        !Ref ApplicationLoadBalancer

      Port:
        80

      Protocol:
        HTTP

      DefaultActions:

        - Type:
            forward

          TargetGroupArn:
            !Ref ALBTargetGroup


  # ==========================================================
  # 16. ECS TASK DEFINITION
  # ==========================================================

  ECSTaskDefinition:

    Type: AWS::ECS::TaskDefinition

    Properties:

      Family:
        !Ref ApplicationName

      NetworkMode:
        awsvpc

      RequiresCompatibilities:

        - FARGATE

      Cpu:
        !Ref TaskCpu

      Memory:
        !Ref TaskMemory

      # ------------------------------------------------------
      # ECS EXECUTION ROLE
      # ------------------------------------------------------

      ExecutionRoleArn:
        !GetAtt ECSTaskExecutionRole.Arn

      # ------------------------------------------------------
      # APPLICATION ROLE
      # ------------------------------------------------------

      TaskRoleArn:
        !GetAtt ECSTaskRole.Arn

      ContainerDefinitions:

        - Name:
            charlie-cafe

          # --------------------------------------------------
          # CloudFormation creates ECR.
          #
          # GitHub Actions pushes:
          #
          #     charlie-cafe:latest
          #
          # ECS then pulls that image.
          # --------------------------------------------------

          Image:
            !Sub '${ECRRepository.RepositoryUri}:latest'

          Essential:
            true

          PortMappings:

            - ContainerPort:
                !Ref ContainerPort

              Protocol:
                tcp

          LogConfiguration:

            LogDriver:
              awslogs

            Options:

              awslogs-group:
                !Ref ECSLogGroup

              awslogs-region:
                !Ref AWS::Region

              awslogs-stream-prefix:
                ecs


  # ==========================================================
  # 17. ECS FARGATE SERVICE
  # ==========================================================

  ECSService:

    Type: AWS::ECS::Service

    DependsOn:

      - ALBListener

    Properties:

      ServiceName:
        !Ref ECSServiceName

      Cluster:
        !Ref ECSCluster

      LaunchType:
        FARGATE

      DesiredCount:
        !Ref DesiredCount

      TaskDefinition:
        !Ref ECSTaskDefinition

      NetworkConfiguration:

        AwsvpcConfiguration:

          AssignPublicIp:
            DISABLED

          SecurityGroups:

            - !Ref ECSTaskSecurityGroup

          Subnets:

            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2

      LoadBalancers:

        - ContainerName:
            charlie-cafe

          ContainerPort:
            !Ref ContainerPort

          TargetGroupArn:
            !Ref ALBTargetGroup

      DeploymentConfiguration:

        MaximumPercent:
          200

        MinimumHealthyPercent:
          50

      Tags:

        - Key: Name
          Value: !Ref ECSServiceName

        - Key: Project
          Value: CharlieCafe

        - Key: ManagedBy
          Value: CloudFormation


# ============================================================
# OUTPUTS
# ============================================================

Outputs:


  # ==========================================================
  # ECR REPOSITORY NAME
  # ==========================================================

  ECRRepositoryName:

    Description:
      Name of the Charlie Cafe ECR repository.

    Value:
      !Ref ECRRepository


  # ==========================================================
  # ECR REPOSITORY URI
  # ==========================================================

  ECRRepositoryUri:

    Description:
      URI of the Charlie Cafe ECR repository.

    Value:
      !GetAtt ECRRepository.RepositoryUri


  # ==========================================================
  # ECS CLUSTER
  # ==========================================================

  ECSClusterName:

    Description:
      Name of the ECS cluster.

    Value:
      !Ref ECSCluster


  # ==========================================================
  # ECS SERVICE
  # ==========================================================

  ECSServiceName:

    Description:
      Name of the ECS service.

    Value:
      !Ref ECSService


  # ==========================================================
  # ECS TASK DEFINITION
  # ==========================================================

  ECSTaskDefinitionArn:

    Description:
      ARN of the ECS task definition.

    Value:
      !Ref ECSTaskDefinition


  # ==========================================================
  # ECS TASK EXECUTION ROLE ARN
  # ==========================================================

  ECSTaskExecutionRoleArn:

    Description:
      ARN of the ECS task execution role created by CloudFormation.

    Value:
      !GetAtt ECSTaskExecutionRole.Arn


  # ==========================================================
  # ECS TASK ROLE ARN
  # ==========================================================

  ECSTaskRoleArn:

    Description:
      ARN of the application task IAM role.

    Value:
      !GetAtt ECSTaskRole.Arn


  # ==========================================================
  # ALB DNS NAME
  # ==========================================================

  ALBDNSName:

    Description:
      DNS name of the Charlie Cafe Application Load Balancer.

    Value:
      !GetAtt ApplicationLoadBalancer.DNSName


  # ==========================================================
  # APPLICATION URL
  # ==========================================================

  ApplicationURL:

    Description:
      Public HTTP URL for the Charlie Cafe ECS application.

    Value:
      !Sub 'http://${ApplicationLoadBalancer.DNSName}'


  # ==========================================================
  # ALB SECURITY GROUP
  # ==========================================================

  ALBSecurityGroupId:

    Description:
      Security group ID used by the Application Load Balancer.

    Value:
      !Ref ALBSecurityGroup


  # ==========================================================
  # ECS TASK SECURITY GROUP
  # ==========================================================

  ECSTaskSecurityGroupId:

    Description:
      Security group ID used by ECS Fargate tasks.

    Value:
      !Ref ECSTaskSecurityGroup


  # ==========================================================
  # VPC ENDPOINT SECURITY GROUP
  # ==========================================================

  VPCEndpointSecurityGroupId:

    Description:
      Security group ID used by the interface VPC endpoints.

    Value:
      !Ref VPCEndpointSecurityGroup
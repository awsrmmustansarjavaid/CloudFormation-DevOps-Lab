version: "3.9"

# ==========================================================

# AWS CloudFormation DevOps Lab

# Docker Compose

# ==========================================================

services:

aws-cloudformation-lab:

```
# --------------------------------------------------------
# Container Name
# --------------------------------------------------------

container_name: aws-cloudformation-lab

# --------------------------------------------------------
# Docker Image
# --------------------------------------------------------

image: cloudformation-lab

# --------------------------------------------------------
# Build Configuration
# --------------------------------------------------------

build:
  context: ..
  dockerfile: docker/Dockerfile

# --------------------------------------------------------
# Restart Policy
# --------------------------------------------------------

restart: unless-stopped

# --------------------------------------------------------
# Interactive Terminal
# --------------------------------------------------------

stdin_open: true
tty: true

# --------------------------------------------------------
# Working Directory
# --------------------------------------------------------

working_dir: /workspace

# --------------------------------------------------------
# Environment Variables
# --------------------------------------------------------

environment:
  AWS_DEFAULT_REGION: us-east-1
  AWS_PAGER: ""
  PYTHONUNBUFFERED: "1"

# --------------------------------------------------------
# Port Mapping
# --------------------------------------------------------
# EC2 host port 3306 -> Container port 3306
# This allows MariaDB to be accessed through the
# Docker container from the EC2 host.

ports:
  - "3306:3306"

# --------------------------------------------------------
# Volumes
# --------------------------------------------------------

volumes:

  # Mount the entire project
  - ../:/workspace

  # Use AWS credentials from the host machine
  - ${USERPROFILE}/.aws:/root/.aws

  # Persist MariaDB database files
  # Database data will remain even if the container
  # is stopped or recreated.
  - mariadb_data:/var/lib/mysql

# --------------------------------------------------------
# Health Check
# --------------------------------------------------------

healthcheck:
  test: ["CMD", "aws", "--version"]
  interval: 30s
  timeout: 10s
  retries: 3

# --------------------------------------------------------
# Container Startup Command
# --------------------------------------------------------
# Do NOT use:
# command: tail -f /dev/null
#
# That command would override the CMD from the Dockerfile.
#
# The Dockerfile CMD starts MariaDB and keeps the
# container running:
#
# CMD ["bash", "-c", "service mariadb start && tail -f /dev/null"]
#
# Therefore, no "command:" is required here.
```

# ==========================================================

# Named Volumes

# ==========================================================

volumes:

# Persistent MariaDB storage

mariadb_data:

version: "3.9"

# ==========================================================
# AWS CloudFormation DevOps Lab
# Docker Compose
# ==========================================================

services:

  aws-cloudformation-lab:

    container_name: aws-cloudformation-lab

    image: cloudformation-lab

    build:

      context: ..

      dockerfile: docker/Dockerfile

    restart: unless-stopped

    stdin_open: true

    tty: true

    working_dir: /workspace

    environment:

      AWS_DEFAULT_REGION: us-east-1

      AWS_PAGER: ""

      PYTHONUNBUFFERED: "1"

    volumes:

      # Mount the entire project
      - ../:/workspace

      # Use AWS credentials from the host machine
      - ${USERPROFILE}/.aws:/root/.aws

    healthcheck:

      test: ["CMD", "aws", "--version"]

      interval: 30s

      timeout: 10s

      retries: 3

    command: tail -f /dev/null
# ---------------------------------------------------------

# AWS CloudFormation Beginner Lab

#

# Creates:

# - VPC

# - Internet Gateway

# - 1 Public Subnet

# - 2 Private Subnets

# - Public Route Table

# - Private Route Table

# - Web Security Group

# - EC2 through nested CloudFormation stack

# - S3 through nested CloudFormation stack

# - RDS MySQL through nested CloudFormation stack

#

# IMPORTANT:

# Nested CloudFormation templates should be stored in S3.

# GitHub can be used as the source/version-control repository,

# but TemplateURL should point to the S3 copy.

# ---------------------------------------------------------

AWSTemplateFormatVersion: '2010-09-09'

Description: >
Beginner AWS CloudFormation Lab - VPC, EC2, S3, and RDS MySQL

# ---------------------------------------------------------

# PARAMETERS

# ---------------------------------------------------------

Parameters:

# -------------------------------------------------------

# Existing EC2 Key Pair

# -------------------------------------------------------

KeyPairName:
Type: AWS::EC2::KeyPair::KeyName
Description: >
Name of an existing EC2 KeyPair to enable SSH access
to the EC2 instance

# -------------------------------------------------------

# Latest Amazon Linux 2023 AMI

# -------------------------------------------------------

LatestAmiId:
Type: AWS::SSM::Parameter::Value[AWS::EC2::Image::Id](AWS::EC2::Image::Id)
Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
Description: >
Amazon Linux 2023 AMI ID automatically resolved from
the AWS public SSM parameter

# -------------------------------------------------------

# RDS Username

# -------------------------------------------------------

DBMasterUsername:
Type: String
Default: admin
Description: Master username for the RDS MySQL database

# -------------------------------------------------------

# RDS Password

# -------------------------------------------------------

DBMasterPassword:
Type: String
NoEcho: true
MinLength: 8
Description: >
Master password for the RDS MySQL database
(hidden during deployment)

# ---------------------------------------------------------

# RESOURCES

# ---------------------------------------------------------

Resources:

# =======================================================

# VPC

# =======================================================

MyVPC:
Type: AWS::EC2::VPC

```
Properties:
  CidrBlock: 10.0.0.0/16
  EnableDnsSupport: true
  EnableDnsHostnames: true

  Tags:
    - Key: Name
      Value: Lab-VPC
```

# =======================================================

# INTERNET GATEWAY

# =======================================================

MyInternetGateway:
Type: AWS::EC2::InternetGateway

```
Properties:
  Tags:
    - Key: Name
      Value: Lab-InternetGateway
```

# =======================================================

# ATTACH INTERNET GATEWAY TO VPC

# =======================================================

AttachGateway:
Type: AWS::EC2::VPCGatewayAttachment

```
Properties:
  InternetGatewayId: !Ref MyInternetGateway
  VpcId: !Ref MyVPC
```

# =======================================================

# PUBLIC SUBNET

# =======================================================

PublicSubnet:
Type: AWS::EC2::Subnet

```
Properties:
  VpcId: !Ref MyVPC
  CidrBlock: 10.0.1.0/24
  MapPublicIpOnLaunch: true

  AvailabilityZone: !Select
    - 0
    - !GetAZs ''

  Tags:
    - Key: Name
      Value: Public-Subnet
```

# =======================================================

# PRIVATE SUBNET 1

# =======================================================

PrivateSubnet1:
Type: AWS::EC2::Subnet

```
Properties:
  VpcId: !Ref MyVPC
  CidrBlock: 10.0.2.0/24
  MapPublicIpOnLaunch: false

  AvailabilityZone: !Select
    - 0
    - !GetAZs ''

  Tags:
    - Key: Name
      Value: Private-Subnet-1
```

# =======================================================

# PRIVATE SUBNET 2

#

# Must be in a different Availability Zone from

# PrivateSubnet1 because RDS DB subnet groups require

# subnets in at least two Availability Zones.

# =======================================================

PrivateSubnet2:
Type: AWS::EC2::Subnet

```
Properties:
  VpcId: !Ref MyVPC
  CidrBlock: 10.0.3.0/24
  MapPublicIpOnLaunch: false

  AvailabilityZone: !Select
    - 1
    - !GetAZs ''

  Tags:
    - Key: Name
      Value: Private-Subnet-2
```

# =======================================================

# PUBLIC ROUTE TABLE

# =======================================================

PublicRouteTable:
Type: AWS::EC2::RouteTable

```
Properties:
  VpcId: !Ref MyVPC

  Tags:
    - Key: Name
      Value: Public-RouteTable
```

# =======================================================

# DEFAULT INTERNET ROUTE

# =======================================================

DefaultRoute:
Type: AWS::EC2::Route

```
DependsOn: AttachGateway

Properties:
  RouteTableId: !Ref PublicRouteTable
  DestinationCidrBlock: 0.0.0.0/0
  GatewayId: !Ref MyInternetGateway
```

# =======================================================

# PUBLIC SUBNET ROUTE ASSOCIATION

# =======================================================

PublicSubnetRouteAssociation:
Type: AWS::EC2::SubnetRouteTableAssociation

```
Properties:
  RouteTableId: !Ref PublicRouteTable
  SubnetId: !Ref PublicSubnet
```

# =======================================================

# PRIVATE ROUTE TABLE

#

# No NAT Gateway is included in this beginner lab.

# Therefore, private subnets do not have internet access.

# =======================================================

PrivateRouteTable:
Type: AWS::EC2::RouteTable

```
Properties:
  VpcId: !Ref MyVPC

  Tags:
    - Key: Name
      Value: Private-RouteTable
```

# =======================================================

# PRIVATE SUBNET 1 ROUTE ASSOCIATION

# =======================================================

PrivateSubnet1RouteAssociation:
Type: AWS::EC2::SubnetRouteTableAssociation

```
Properties:
  RouteTableId: !Ref PrivateRouteTable
  SubnetId: !Ref PrivateSubnet1
```

# =======================================================

# PRIVATE SUBNET 2 ROUTE ASSOCIATION

# =======================================================

PrivateSubnet2RouteAssociation:
Type: AWS::EC2::SubnetRouteTableAssociation

```
Properties:
  RouteTableId: !Ref PrivateRouteTable
  SubnetId: !Ref PrivateSubnet2
```

# =======================================================

# WEB SECURITY GROUP

#

# Allows:

# - SSH 22

# - HTTP 80

# - HTTPS 443

#

# NOTE:

# SSH from 0.0.0.0/0 is acceptable for a temporary lab,

# but should be restricted to your IP in production.

# =======================================================

WebSecurityGroup:
Type: AWS::EC2::SecurityGroup

```
Properties:
  GroupDescription: Allow SSH, HTTP and HTTPS
  VpcId: !Ref MyVPC

  SecurityGroupIngress:

    # SSH
    - IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: 0.0.0.0/0
      Description: Allow SSH from anywhere

    # HTTP
    - IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0
      Description: Allow HTTP from anywhere

    # HTTPS
    - IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: Allow HTTPS from anywhere

  Tags:
    - Key: Name
      Value: Lab-Web-SG
```

# =======================================================

# NESTED STACK - EC2

# =======================================================

EC2WebServerStack:
Type: AWS::CloudFormation::Stack

```
Properties:

  # IMPORTANT:
  # Replace this with the S3 URL of your EC2 child template.
  #
  # Example:
  # https://your-bucket.s3.amazonaws.com/templates/ec2-webserver.yaml

  TemplateURL: https://YOUR-BUCKET-NAME.s3.amazonaws.com/templates/ec2-webserver.yaml

  Parameters:

    AmiId: !Ref LatestAmiId

    InstanceType: t3.micro

    KeyPair: !Ref KeyPairName

    PublicSubnetId: !Ref PublicSubnet

    SecurityGroupId: !Ref WebSecurityGroup

    UserDataScriptUrl: https://raw.githubusercontent.com/awsrmmustansarjavaid/CloudFormation-DevOps-Lab/main/scripts/ec2-userdata.sh
```

# =======================================================

# NESTED STACK - S3

# =======================================================

S3NestedStack:
Type: AWS::CloudFormation::Stack

```
Properties:

  # Replace with the S3 URL of your S3 child template.

  TemplateURL: https://YOUR-BUCKET-NAME.s3.amazonaws.com/templates/s3.yaml
```

# =======================================================

# NESTED STACK - RDS

# =======================================================

RDSNestedStack:
Type: AWS::CloudFormation::Stack

```
Properties:

  # Replace with the S3 URL of your RDS child template.

  TemplateURL: https://YOUR-BUCKET-NAME.s3.amazonaws.com/templates/aws-rds.yaml

  Parameters:

    # VPC created by the parent stack
    VpcId: !Ref MyVPC

    # Private subnet 1
    PrivateSubnet1: !Ref PrivateSubnet1

    # Private subnet 2
    PrivateSubnet2: !Ref PrivateSubnet2

    # Web security group
    WebSecurityGroupId: !Ref WebSecurityGroup

    # Database username
    DBUsername: !Ref DBMasterUsername

    # Database password
    DBPassword: !Ref DBMasterPassword
```

# ---------------------------------------------------------

# OUTPUTS

# ---------------------------------------------------------

Outputs:

# =======================================================

# VPC

# =======================================================

VPCId:
Description: VPC ID
Value: !Ref MyVPC

# =======================================================

# PUBLIC SUBNET

# =======================================================

PublicSubnetId:
Description: Public Subnet ID
Value: !Ref PublicSubnet

# =======================================================

# PRIVATE SUBNET 1

# =======================================================

PrivateSubnet1Id:
Description: Private Subnet 1 ID
Value: !Ref PrivateSubnet1

# =======================================================

# PRIVATE SUBNET 2

# =======================================================

PrivateSubnet2Id:
Description: Private Subnet 2 ID
Value: !Ref PrivateSubnet2

# =======================================================

# WEB SECURITY GROUP

# =======================================================

SecurityGroupId:
Description: Web Security Group ID
Value: !Ref WebSecurityGroup

# =======================================================

# EC2 INSTANCE ID

# =======================================================

EC2InstanceId:
Description: EC2 Instance ID
Value: !GetAtt EC2WebServerStack.Outputs.InstanceId

# =======================================================

# EC2 PUBLIC IP

# =======================================================

EC2PublicIP:
Description: EC2 Instance Public IP
Value: !GetAtt EC2WebServerStack.Outputs.PublicIP

# =======================================================

# S3 BUCKET

# =======================================================

S3BucketName:
Description: S3 Bucket Name
Value: !GetAtt S3NestedStack.Outputs.BucketName

# =======================================================

# RDS DATABASE ID

# =======================================================

RDSDatabaseId:
Description: RDS Database Identifier
Value: !GetAtt RDSNestedStack.Outputs.RDSDatabaseId

# =======================================================

# RDS ENDPOINT

# =======================================================

RDSEndpoint:
Description: RDS Endpoint Address
Value: !GetAtt RDSNestedStack.Outputs.RDSEndpoint

# =======================================================

# RDS PORT

# =======================================================

RDSPort:
Description: RDS MySQL Port
Value: !GetAtt RDSNestedStack.Outputs.RDSPort

# =======================================================

# RDS SECURITY GROUP

# =======================================================

RDSSecurityGroupId:
Description: RDS Security Group ID
Value: !GetAtt RDSNestedStack.Outputs.RDSSecurityGroupId

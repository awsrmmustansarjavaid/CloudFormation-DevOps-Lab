# ---------------------------------------------------------
# AWS CloudFormation Beginner Lab
# Creates:
# - VPC
# - Internet Gateway
# - Public Subnet
# - Route Table
# - Security Group
# - EC2 Instance
# - S3 Bucket
# ---------------------------------------------------------

AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Beginner AWS CloudFormation Lab

Resources:

  # -------------------------------------------------------
  # Create VPC
  # -------------------------------------------------------
  MyVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: Lab-VPC

  # -------------------------------------------------------
  # Create Internet Gateway
  # -------------------------------------------------------
  MyInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: Lab-InternetGateway

  # -------------------------------------------------------
  # Attach Internet Gateway to VPC
  # -------------------------------------------------------
  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref MyInternetGateway
      VpcId: !Ref MyVPC

  # -------------------------------------------------------
  # Create Public Subnet
  # -------------------------------------------------------
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: Public-Subnet

  # -------------------------------------------------------
  # Create Route Table
  # -------------------------------------------------------
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MyVPC
      Tags:
        - Key: Name
          Value: Public-RouteTable

  # -------------------------------------------------------
  # Default Route to Internet Gateway
  # -------------------------------------------------------
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref MyInternetGateway

  # -------------------------------------------------------
  # Associate Route Table with Public Subnet
  # -------------------------------------------------------
  PublicSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet

  # -------------------------------------------------------
  # Create Security Group
  # -------------------------------------------------------
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH, HTTP and HTTPS
      VpcId: !Ref MyVPC

      SecurityGroupIngress:

        # SSH
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

        # HTTP
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

        # HTTPS
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: Lab-Web-SG

  # -------------------------------------------------------
  # Launch EC2 Instance
  # Replace ImageId and KeyName before deployment
  # -------------------------------------------------------
  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro

      # Replace with Amazon Linux 2023 AMI
      ImageId: ami-0006118602dfc1c09

      # Replace with your EC2 Key Pair
      KeyName: Lab-KeyPair

      SubnetId: !Ref PublicSubnet

      SecurityGroupIds:
        - !Ref WebSecurityGroup

      Tags:
        - Key: Name
          Value: Lab-WebServer

  # -------------------------------------------------------
  # Create S3 Bucket
  # -------------------------------------------------------
  LabBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled

      Tags:
        - Key: Name
          Value: Lab-S3-Bucket

# ---------------------------------------------------------
# CloudFormation Outputs
# ---------------------------------------------------------

Outputs:

  VPCId:
    Description: VPC ID
    Value: !Ref MyVPC

  PublicSubnetId:
    Description: Public Subnet ID
    Value: !Ref PublicSubnet

  SecurityGroupId:
    Description: Security Group ID
    Value: !Ref WebSecurityGroup

  EC2InstanceId:
    Description: EC2 Instance ID
    Value: !Ref WebServer

  S3BucketName:
    Description: S3 Bucket Name
    Value: !Ref LabBucket
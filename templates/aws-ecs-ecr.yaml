AWSTemplateFormatVersion: '2010-09-09'

# ============================================================
# Charlie Cafe
# Standalone ECS Fargate + ECR CloudFormation Stack
# ============================================================
#
# IMPORTANT:
#
# This is a COMPLETELY INDEPENDENT CloudFormation stack.
#
# It is NOT a nested stack.
#
# The VPC, public subnets, private subnets and private route
# table are created by your MAIN CloudFormation stack.
#
# This stack consumes those existing networking resources.
#
# ============================================================
#
# THIS STACK CREATES:
#
# 1. ECR Repository
# 2. ECS Cluster
# 3. CloudWatch Log Group
# 4. ECS Task Execution IAM Role
# 5. ECS Task IAM Role
# 6. VPC Endpoint Security Group
# 7. ECR API VPC Endpoint
# 8. ECR Docker Registry VPC Endpoint
# 9. S3 Gateway VPC Endpoint
# 10. CloudWatch Logs VPC Endpoint
# 11. ALB Security Group
# 12. ECS Task Security Group
# 13. Application Load Balancer
# 14. ALB Target Group
# 15. ALB Listener
# 16. ECS Task Definition
# 17. ECS Fargate Service
#
# ============================================================
#
# ACM CERTIFICATE:
#
# NOT INCLUDED.
#
# We are intentionally using HTTP :80 for this beginner lab.
#
# HTTPS + ACM can be added later.
#
# ============================================================


# ============================================================
# HIGH-LEVEL ARCHITECTURE
# ============================================================
#
#
#                         INTERNET
#                             |
#                             |
#                             | HTTP :80
#                             |
#                             v
#                  +----------------------+
#                  | Application Load     |
#                  | Balancer             |
#                  | PUBLIC SUBNETS       |
#                  +----------------------+
#                             |
#                             |
#                             | Container Port
#                             |
#                             v
#                  +----------------------+
#                  | ECS Fargate Service  |
#                  +----------------------+
#                             |
#                             |
#                             v
#                  +----------------------+
#                  | ECS Fargate Task     |
#                  | PRIVATE SUBNET       |
#                  | Docker Container     |
#                  +----------------------+
#                             |
#                             |
#                             v
#                  +----------------------+
#                  | Amazon ECR           |
#                  | Docker Image         |
#                  +----------------------+
#
#
# PRIVATE AWS SERVICE CONNECTIVITY
#
#
# ECS Fargate Task
#        |
#        +------------------> ECR API Endpoint
#        |
#        +------------------> ECR DKR Endpoint
#        |
#        +------------------> S3 Gateway Endpoint
#        |
#        +------------------> CloudWatch Logs Endpoint
#
#
# No NAT Gateway is required for these AWS service connections.
#
# ============================================================


# ============================================================
# IMPORTANT LEARNING NOTE
# ============================================================
#
# CloudFormation creates the infrastructure first.
#
# The ECR repository starts EMPTY.
#
# This is NORMAL.
#
# CloudFormation creates:
#
#     ECR Repository
#           |
#           v
#     Repository exists
#           |
#           v
#     GitHub Actions builds Docker image
#           |
#           v
#     Docker image
#           |
#           v
#     Push image to ECR
#           |
#           v
#     ECS Fargate pulls image
#           |
#           v
#     Container starts
#
# ============================================================


# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  # ----------------------------------------------------------
  # EXISTING VPC
  # ----------------------------------------------------------
  #
  # The VPC is NOT created by this stack.
  #
  # It already exists in your main CloudFormation stack.
  #
  # Example:
  #
  #     vpc-0123456789abcdef
  #
  # ----------------------------------------------------------

  VpcId:
    Type: AWS::EC2::VPC::Id

    Description:
      Existing VPC where ECS and ALB resources will be deployed.


  # ----------------------------------------------------------
  # PUBLIC SUBNET 1
  # ----------------------------------------------------------
  #
  # ALB uses public subnets.
  #
  # ALB requires subnets in at least two Availability Zones.
  #
  # ----------------------------------------------------------

  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id

    Description:
      First public subnet for the Application Load Balancer.


  # ----------------------------------------------------------
  # PUBLIC SUBNET 2
  # ----------------------------------------------------------

  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id

    Description:
      Second public subnet for the Application Load Balancer.


  # ----------------------------------------------------------
  # PRIVATE SUBNET 1
  # ----------------------------------------------------------
  #
  # ECS Fargate tasks will run here.
  #
  # ----------------------------------------------------------

  PrivateSubnet1:
    Type: AWS::EC2::Subnet::Id

    Description:
      First private subnet for ECS Fargate tasks.


  # ----------------------------------------------------------
  # PRIVATE SUBNET 2
  # ----------------------------------------------------------

  PrivateSubnet2:
    Type: AWS::EC2::Subnet::Id

    Description:
      Second private subnet for ECS Fargate tasks.


  # ----------------------------------------------------------
  # PRIVATE ROUTE TABLE
  # ----------------------------------------------------------
  #
  # The S3 Gateway VPC Endpoint must be associated with the
  # route table used by the private subnets.
  #
  # This route table is created by your MAIN stack.
  #
  # We therefore receive its ID as a parameter.
  #
  # ----------------------------------------------------------

  PrivateRouteTableId:
    Type: String

    Description:
      ID of the existing private route table used by the ECS private subnets.


  # ----------------------------------------------------------
  # APPLICATION NAME
  # ----------------------------------------------------------

  ApplicationName:
    Type: String

    Default: CharlieCafe

    Description:
      Application name used for ECS, ECR and ALB resources.


  # ----------------------------------------------------------
  # CONTAINER PORT
  # ----------------------------------------------------------
  #
  # The Docker application must listen on this port.
  #
  # Examples:
  #
  # Nginx       = 80
  # Apache      = 80
  # Node.js     = 3000
  # Python      = 5000
  #
  # ----------------------------------------------------------

  ContainerPort:
    Type: Number

    Default: 80

    Description:
      Port exposed by the Docker container.


  # ----------------------------------------------------------
  # ECS TASK CPU
  # ----------------------------------------------------------
  #
  # 256 CPU units = 0.25 vCPU
  #
  # ----------------------------------------------------------

  TaskCpu:
    Type: String

    Default: '256'

    Description:
      Fargate task CPU units.


  # ----------------------------------------------------------
  # ECS TASK MEMORY
  # ----------------------------------------------------------
  #
  # 512 MB is suitable for a small beginner lab.
  #
  # ----------------------------------------------------------

  TaskMemory:
    Type: String

    Default: '512'

    Description:
      Fargate task memory in MB.


  # ----------------------------------------------------------
  # DESIRED TASK COUNT
  # ----------------------------------------------------------
  #
  # Number of ECS tasks ECS should keep running.
  #
  # ----------------------------------------------------------

  DesiredCount:
    Type: Number

    Default: 1

    Description:
      Number of ECS Fargate tasks.


# ============================================================
# RESOURCES
# ============================================================

Resources:


  # ==========================================================
  # 1. VPC ENDPOINT SECURITY GROUP
  # ==========================================================
  #
  # This security group belongs to the INTERFACE VPC
  # endpoints.
  #
  # Interface endpoints:
  #
  #     ECR API
  #     ECR DKR
  #     CloudWatch Logs
  #
  # The ECS private subnet traffic reaches these endpoints
  # over HTTPS port 443.
  #
  # ==========================================================

  VPCEndpointSecurityGroup:

    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription:
        Allow HTTPS from ECS private subnets to AWS VPC endpoints

      VpcId:
        !Ref VpcId

      SecurityGroupIngress:

        # ----------------------------------------------------
        # HTTPS from Private Subnet 1
        # ----------------------------------------------------

        - IpProtocol: tcp

          FromPort: 443

          ToPort: 443

          CidrIp: 10.0.2.0/24

          Description:
            HTTPS from Private Subnet 1


        # ----------------------------------------------------
        # HTTPS from Private Subnet 2
        # ----------------------------------------------------

        - IpProtocol: tcp

          FromPort: 443

          ToPort: 443

          CidrIp: 10.0.3.0/24

          Description:
            HTTPS from Private Subnet 2

      SecurityGroupEgress:

        # ----------------------------------------------------
        # Allow outbound traffic.
        # ----------------------------------------------------

        - IpProtocol: -1

          CidrIp: 0.0.0.0/0

      Tags:

        - Key: Name
          Value: CharlieCafe-VPC-Endpoint-SG

        - Key: Project
          Value: CharlieCafe


  # ==========================================================
  # 2. ECR API VPC ENDPOINT
  # ==========================================================
  #
  # This allows the ECS task to communicate with the Amazon
  # ECR API privately.
  #
  # Service:
  #
  #     com.amazonaws.<region>.ecr.api
  #
  # ==========================================================

  ECRApiVPCEndpoint:

    Type: AWS::EC2::VPCEndpoint

    Properties:

      VpcId:
        !Ref VpcId

      ServiceName:
        !Sub 'com.amazonaws.${AWS::Region}.ecr.api'

      VpcEndpointType:
        Interface

      PrivateDnsEnabled:
        true

      SubnetIds:

        - !Ref PrivateSubnet1

        - !Ref PrivateSubnet2

      SecurityGroupIds:

        - !Ref VPCEndpointSecurityGroup

      Tags:

        - Key: Name
          Value: CharlieCafe-ECR-API-VPC-Endpoint

        - Key: Project
          Value: CharlieCafe


  # ==========================================================
  # 3. ECR DOCKER REGISTRY VPC ENDPOINT
  # ==========================================================
  #
  # Docker image pull traffic uses the ECR Docker registry
  # endpoint.
  #
  # Service:
  #
  #     com.amazonaws.<region>.ecr.dkr
  #
  # ==========================================================

  ECRDkrVPCEndpoint:

    Type: AWS::EC2::VPCEndpoint

    Properties:

      VpcId:
        !Ref VpcId

      ServiceName:
        !Sub 'com.amazonaws.${AWS::Region}.ecr.dkr'

      VpcEndpointType:
        Interface

      PrivateDnsEnabled:
        true

      SubnetIds:

        - !Ref PrivateSubnet1

        - !Ref PrivateSubnet2

      SecurityGroupIds:

        - !Ref VPCEndpointSecurityGroup

      Tags:

        - Key: Name
          Value: CharlieCafe-ECR-DKR-VPC-Endpoint

        - Key: Project
          Value: CharlieCafe


  # ==========================================================
  # 4. S3 GATEWAY VPC ENDPOINT
  # ==========================================================
  #
  # IMPORTANT:
  #
  # ECR stores Docker image layers in Amazon S3.
  #
  # Therefore the ECS task needs access to S3 when pulling
  # the image layers.
  #
  # Gateway endpoints are different from interface endpoints.
  #
  # This endpoint is attached to the PRIVATE ROUTE TABLE.
  #
  # ==========================================================

  S3VPCEndpoint:

    Type: AWS::EC2::VPCEndpoint

    Properties:

      VpcId:
        !Ref VpcId

      ServiceName:
        !Sub 'com.amazonaws.${AWS::Region}.s3'

      VpcEndpointType:
        Gateway

      RouteTableIds:

        - !Ref PrivateRouteTableId

      Tags:

        - Key: Name
          Value: CharlieCafe-S3-Gateway-VPC-Endpoint

        - Key: Project
          Value: CharlieCafe


  # ==========================================================
  # 5. CLOUDWATCH LOGS VPC ENDPOINT
  # ==========================================================
  #
  # Your ECS task uses:
  #
  #     LogDriver: awslogs
  #
  # Therefore the container sends stdout/stderr to CloudWatch
  # Logs.
  #
  # Because the ECS task is in a private subnet and we are
  # intentionally NOT using a NAT Gateway, the task needs
  # private connectivity to CloudWatch Logs.
  #
  # Service:
  #
  #     com.amazonaws.<region>.logs
  #
  # ==========================================================

  CloudWatchLogsVPCEndpoint:

    Type: AWS::EC2::VPCEndpoint

    Properties:

      VpcId:
        !Ref VpcId

      ServiceName:
        !Sub 'com.amazonaws.${AWS::Region}.logs'

      VpcEndpointType:
        Interface

      PrivateDnsEnabled:
        true

      SubnetIds:

        - !Ref PrivateSubnet1

        - !Ref PrivateSubnet2

      SecurityGroupIds:

        - !Ref VPCEndpointSecurityGroup

      Tags:

        - Key: Name
          Value: CharlieCafe-CloudWatch-Logs-VPC-Endpoint

        - Key: Project
          Value: CharlieCafe


  # ==========================================================
  # 6. ECR REPOSITORY
  # ==========================================================
  #
  # This is the Docker image registry.
  #
  # IMPORTANT:
  #
  # The repository will initially be EMPTY.
  #
  # That is expected.
  #
  # GitHub Actions will later:
  #
  #     docker build
  #          |
  #          v
  #     docker image
  #          |
  #          v
  #     docker push
  #          |
  #          v
  #     ECR
  #
  # ==========================================================

  ECRRepository:

    Type: AWS::ECR::Repository

    Properties:

      RepositoryName:
        charlie-cafe

      # ------------------------------------------------------
      # Scan Docker images when pushed.
      # ------------------------------------------------------

      ImageScanningConfiguration:

        ScanOnPush: true

      # ------------------------------------------------------
      # Server-side encryption.
      # ------------------------------------------------------

      EncryptionConfiguration:

        EncryptionType: AES256

      # ------------------------------------------------------
      # Mutable tags.
      #
      # This allows:
      #
      #     latest
      #
      # to point to a newer image.
      #
      # Later, you can move to immutable version tags.
      # ------------------------------------------------------

      ImageTagMutability:
        MUTABLE

      Tags:

        - Key: Name
          Value: CharlieCafe-ECR

        - Key: Project
          Value: CharlieCafe


  # ==========================================================
  # 7. ECS CLUSTER
  # ==========================================================
  #
  # Fargate does not require us to create EC2 instances.
  #
  # AWS manages the underlying compute infrastructure.
  #
  # ==========================================================

  ECSCluster:

    Type: AWS::ECS::Cluster

    Properties:

      ClusterName:
        CharlieCafe-Cluster

      ClusterSettings:

        - Name: containerInsights

          Value: enabled

      Tags:

        - Key: Name
          Value: CharlieCafe-Cluster

        - Key: Project
          Value: CharlieCafe


  # ==========================================================
  # 8. CLOUDWATCH LOG GROUP
  # ==========================================================
  #
  # ECS sends Docker stdout/stderr here.
  #
  # ==========================================================

  ECSLogGroup:

    Type: AWS::Logs::LogGroup

    Properties:

      LogGroupName:
        /ecs/charlie-cafe

      RetentionInDays:
        30

      Tags:

        - Key: Project
          Value: CharlieCafe


  # ==========================================================
  # 9. ECS TASK EXECUTION ROLE
  # ==========================================================
  #
  # This role is used by ECS/Fargate.
  #
  # It allows ECS to:
  #
  #     Pull the private image from ECR
  #
  #     Send container logs to CloudWatch Logs
  #
  # This is NOT the application role.
  #
  # ==========================================================

  ECSTaskExecutionRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub '${ApplicationName}-ECSTaskExecutionRole'

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                ecs-tasks.amazonaws.com

            Action:
              sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

      Tags:

        - Key: Name
          Value: CharlieCafe-ECSTaskExecutionRole

        - Key: Project
          Value: CharlieCafe


  # ==========================================================
  # 10. ECS TASK ROLE
  # ==========================================================
  #
  # This role belongs to the APPLICATION running inside the
  # container.
  #
  # Initially we give it no additional permissions.
  #
  # Later, if the application needs:
  #
  #     S3
  #     DynamoDB
  #     Secrets Manager
  #     KMS
  #
  # permissions can be added here.
  #
  # ==========================================================

  ECSTaskRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub '${ApplicationName}-ECSTaskRole'

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service:
                ecs-tasks.amazonaws.com

            Action:
              sts:AssumeRole

      Tags:

        - Key: Name
          Value: CharlieCafe-ECSTaskRole

        - Key: Project
          Value: CharlieCafe


  # ==========================================================
  # 11. ALB SECURITY GROUP
  # ==========================================================
  #
  # Internet
  #    |
  #    | TCP 80
  #    v
  #   ALB
  #
  # Later, when ACM is added:
  #
  # Internet
  #    |
  #    | TCP 443
  #    v
  #   ALB
  #
  # ==========================================================

  ALBSecurityGroup:

    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription:
        Allow HTTP traffic to Charlie Cafe Application Load Balancer

      VpcId:
        !Ref VpcId

      SecurityGroupIngress:

        - IpProtocol: tcp

          FromPort: 80

          ToPort: 80

          CidrIp: 0.0.0.0/0

          Description:
            Allow HTTP from Internet

      SecurityGroupEgress:

        - IpProtocol: -1

          CidrIp: 0.0.0.0/0

      Tags:

        - Key: Name
          Value: CharlieCafe-ALB-SG

        - Key: Project
          Value: CharlieCafe


  # ==========================================================
  # 12. ECS TASK SECURITY GROUP
  # ==========================================================
  #
  # IMPORTANT SECURITY ARCHITECTURE:
  #
  #
  # Internet
  #     |
  #     v
  #    ALB
  #     |
  #     | Container Port
  #     v
  #    ECS
  #
  #
  # ECS does NOT allow:
  #
  #     0.0.0.0/0
  #
  # directly to the container.
  #
  # Only the ALB security group can access the container.
  #
  # ==========================================================

  ECSTaskSecurityGroup:

    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription:
        Allow application traffic only from the ALB

      VpcId:
        !Ref VpcId

      SecurityGroupIngress:

        - IpProtocol: tcp

          FromPort:
            !Ref ContainerPort

          ToPort:
            !Ref ContainerPort

          SourceSecurityGroupId:
            !Ref ALBSecurityGroup

          Description:
            Allow application traffic from ALB

      SecurityGroupEgress:

        - IpProtocol: -1

          CidrIp: 0.0.0.0/0

      Tags:

        - Key: Name
          Value: CharlieCafe-ECS-Task-SG

        - Key: Project
          Value: CharlieCafe


  # ==========================================================
  # 13. APPLICATION LOAD BALANCER
  # ==========================================================
  #
  # The ALB is internet-facing.
  #
  # It is deployed into PUBLIC subnets.
  #
  # ECS tasks remain in PRIVATE subnets.
  #
  # ==========================================================

  ApplicationLoadBalancer:

    Type: AWS::ElasticLoadBalancingV2::LoadBalancer

    Properties:

      Name:
        CharlieCafe-ALB

      Scheme:
        internet-facing

      Type:
        application

      SecurityGroups:

        - !Ref ALBSecurityGroup

      Subnets:

        - !Ref PublicSubnet1

        - !Ref PublicSubnet2

      Tags:

        - Key: Name
          Value: CharlieCafe-ALB

        - Key: Project
          Value: CharlieCafe


  # ==========================================================
  # 14. ALB TARGET GROUP
  # ==========================================================
  #
  # Fargate uses awsvpc networking.
  #
  # Therefore:
  #
  #     TargetType = ip
  #
  # ECS automatically registers the task IP address.
  #
  # ==========================================================

  ALBTargetGroup:

    Type: AWS::ElasticLoadBalancingV2::TargetGroup

    Properties:

      Name:
        CharlieCafe-TG

      VpcId:
        !Ref VpcId

      Protocol:
        HTTP

      Port:
        !Ref ContainerPort

      TargetType:
        ip

      # ------------------------------------------------------
      # Health check
      # ------------------------------------------------------
      #
      # ALB requests:
      #
      #     GET /
      #
      # from the container.
      #
      # ------------------------------------------------------

      HealthCheckEnabled:
        true

      HealthCheckProtocol:
        HTTP

      HealthCheckPath:
        /

      HealthCheckPort:
        traffic-port

      HealthCheckIntervalSeconds:
        30

      HealthCheckTimeoutSeconds:
        5

      HealthyThresholdCount:
        2

      UnhealthyThresholdCount:
        3

      Tags:

        - Key: Name
          Value: CharlieCafe-TG

        - Key: Project
          Value: CharlieCafe


  # ==========================================================
  # 15. ALB LISTENER
  # ==========================================================
  #
  # HTTP listener on port 80.
  #
  # ACM/HTTPS intentionally excluded.
  #
  # ==========================================================

  ALBListener:

    Type: AWS::ElasticLoadBalancingV2::Listener

    Properties:

      LoadBalancerArn:
        !Ref ApplicationLoadBalancer

      Port:
        80

      Protocol:
        HTTP

      DefaultActions:

        - Type:
            forward

          TargetGroupArn:
            !Ref ALBTargetGroup


  # ==========================================================
  # 16. ECS TASK DEFINITION
  # ==========================================================
  #
  # This is the blueprint for the Docker container.
  #
  # It defines:
  #
  #     CPU
  #     Memory
  #     Docker image
  #     Container port
  #     IAM roles
  #     CloudWatch logging
  #
  # ==========================================================

  ECSTaskDefinition:

    Type: AWS::ECS::TaskDefinition

    Properties:

      Family:
        CharlieCafe

      # ------------------------------------------------------
      # Fargate requires awsvpc.
      # ------------------------------------------------------

      NetworkMode:
        awsvpc

      RequiresCompatibilities:

        - FARGATE

      Cpu:
        !Ref TaskCpu

      Memory:
        !Ref TaskMemory

      # ------------------------------------------------------
      # ECS/Fargate uses this role to:
      #
      #     Pull ECR image
      #     Send CloudWatch logs
      #
      # ------------------------------------------------------

      ExecutionRoleArn:
        !GetAtt ECSTaskExecutionRole.Arn

      # ------------------------------------------------------
      # Application IAM role.
      # ------------------------------------------------------

      TaskRoleArn:
        !GetAtt ECSTaskRole.Arn

      # ------------------------------------------------------
      # Container definition
      # ------------------------------------------------------

      ContainerDefinitions:

        - Name:
            charlie-cafe

          # --------------------------------------------------
          # IMPORTANT:
          #
          # CloudFormation creates the repository.
          #
          # GitHub Actions pushes the image.
          #
          # ECS pulls:
          #
          #     charlie-cafe:latest
          #
          # --------------------------------------------------

          Image:
            !Sub '${ECRRepository.RepositoryUri}:latest'

          Essential:
            true

          # --------------------------------------------------
          # Container port
          # --------------------------------------------------

          PortMappings:

            - ContainerPort:
                !Ref ContainerPort

              Protocol:
                tcp

          # --------------------------------------------------
          # CloudWatch logging
          # --------------------------------------------------

          LogConfiguration:

            LogDriver:
              awslogs

            Options:

              awslogs-group:
                !Ref ECSLogGroup

              awslogs-region:
                !Ref AWS::Region

              awslogs-stream-prefix:
                ecs


  # ==========================================================
  # 17. ECS FARGATE SERVICE
  # ==========================================================
  #
  # The ECS Service keeps the desired number of tasks running.
  #
  # DesiredCount = 1
  #
  # If a task crashes, ECS attempts to replace it.
  #
  # ==========================================================

  ECSService:

    Type: AWS::ECS::Service

    DependsOn:

      - ALBListener

    Properties:

      ServiceName:
        CharlieCafe-Service

      Cluster:
        !Ref ECSCluster

      LaunchType:
        FARGATE

      DesiredCount:
        !Ref DesiredCount

      TaskDefinition:
        !Ref ECSTaskDefinition

      # ======================================================
      # NETWORK CONFIGURATION
      # ======================================================
      #
      # Tasks run in private subnets.
      #
      # No public IP.
      #
      # ======================================================

      NetworkConfiguration:

        AwsvpcConfiguration:

          AssignPublicIp:
            DISABLED

          SecurityGroups:

            - !Ref ECSTaskSecurityGroup

          Subnets:

            - !Ref PrivateSubnet1

            - !Ref PrivateSubnet2

      # ======================================================
      # LOAD BALANCER CONFIGURATION
      # ======================================================

      LoadBalancers:

        - ContainerName:
            charlie-cafe

          ContainerPort:
            !Ref ContainerPort

          TargetGroupArn:
            !Ref ALBTargetGroup

      # ======================================================
      # DEPLOYMENT CONFIGURATION
      # ======================================================

      DeploymentConfiguration:

        MaximumPercent:
          200

        MinimumHealthyPercent:
          50

      Tags:

        - Key: Name
          Value: CharlieCafe-Service

        - Key: Project
          Value: CharlieCafe


# ============================================================
# OUTPUTS
# ============================================================

Outputs:


  # ==========================================================
  # ECR REPOSITORY NAME
  # ==========================================================

  ECRRepositoryName:

    Description:
      Name of the Charlie Cafe ECR repository.

    Value:
      !Ref ECRRepository


  # ==========================================================
  # ECR REPOSITORY URI
  # ==========================================================
  #
  # GitHub Actions will use this repository URI when pushing
  # the Docker image.
  #
  # ==========================================================

  ECRRepositoryUri:

    Description:
      URI of the Charlie Cafe ECR repository.

    Value:
      !GetAtt ECRRepository.RepositoryUri


  # ==========================================================
  # ECS CLUSTER
  # ==========================================================

  ECSClusterName:

    Description:
      Name of the ECS cluster.

    Value:
      !Ref ECSCluster


  # ==========================================================
  # ECS SERVICE
  # ==========================================================

  ECSServiceName:

    Description:
      Name of the ECS service.

    Value:
      !Ref ECSService


  # ==========================================================
  # ECS TASK DEFINITION
  # ==========================================================

  ECSTaskDefinitionArn:

    Description:
      ARN of the ECS task definition.

    Value:
      !Ref ECSTaskDefinition


  # ==========================================================
  # ALB DNS NAME
  # ==========================================================
  #
  # You can open this address in your browser after:
  #
  #     1. Docker image exists in ECR
  #     2. ECS task starts
  #     3. Target becomes healthy
  #
  # ==========================================================

  ALBDNSName:

    Description:
      DNS name of the Charlie Cafe Application Load Balancer.

    Value:
      !GetAtt ApplicationLoadBalancer.DNSName


  # ==========================================================
  # APPLICATION URL
  # ==========================================================

  ApplicationURL:

    Description:
      Public HTTP URL for the Charlie Cafe ECS application.

    Value:
      !Sub 'http://${ApplicationLoadBalancer.DNSName}'


  # ==========================================================
  # ALB SECURITY GROUP
  # ==========================================================

  ALBSecurityGroupId:

    Description:
      Security group ID used by the Application Load Balancer.

    Value:
      !Ref ALBSecurityGroup


  # ==========================================================
  # ECS TASK SECURITY GROUP
  # ==========================================================

  ECSTaskSecurityGroupId:

    Description:
      Security group ID used by ECS Fargate tasks.

    Value:
      !Ref ECSTaskSecurityGroup


  # ==========================================================
  # VPC ENDPOINT SECURITY GROUP
  # ==========================================================

  VPCEndpointSecurityGroupId:

    Description:
      Security group ID used by the interface VPC endpoints.

    Value:
      !Ref VPCEndpointSecurityGroup
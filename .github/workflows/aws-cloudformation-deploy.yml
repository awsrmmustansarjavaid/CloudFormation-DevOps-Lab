# ==========================================================

# AWS CloudFormation DevOps Lab

# GitHub Actions Deployment Workflow

# ==========================================================

#

# File:

# .github/workflows/aws-cloudformation-deploy.yml

#

# Purpose:

# ----------------------------------------------------------

# This GitHub Actions workflow validates and deploys the

# AWS CloudFormation infrastructure defined in:

#

# infrastructure/aws-cloudformation/templates/main.yaml

#

# The workflow then builds and tests the Docker application

# and finally triggers the reusable ECS deployment workflow.

#

# ==========================================================

#

# WORKFLOW PIPELINE

# ==========================================================

#

# The complete deployment pipeline is:

#

# GitHub Repository

# |

# v

# CloudFormation Deployment

# |

# v

# AWS Infrastructure

# |

# v

# Docker Build and Test

# |

# v

# Docker Image

# |

# v

# ECS / ECR Deployment

#

# ==========================================================

#

# CLOUDFORMATION DEPLOYMENT JOB

# ==========================================================

#

# The "deploy" job performs the following steps:

#

# 1. Checkout GitHub repository

# 2. Configure AWS credentials

# 3. Verify AWS CLI and AWS identity

# 4. Check required deployment values

# 5. Create or update template bucket CloudFormation stack

# 6. Get template S3 bucket name

# 7. Upload nested CloudFormation templates to S3

# 8. Display repository and deployment information

# 9. Verify CloudFormation templates exist

# 10. Validate the main CloudFormation template

# 11. Check whether the main CloudFormation stack exists

# 12. Display existing CloudFormation stack status

# 13. Display deployment environment

# 14. Create the main CloudFormation stack if required

# 15. Wait for main CloudFormation stack creation

# 16. Update the existing main CloudFormation stack

# 17. Wait for the main CloudFormation stack update

# 18. Get application S3 bucket name

# 19. Verify application files

# 20. Upload static website files to S3

# 21. Verify website files in S3

# 22. Get CloudFront website URL

# 23. Test CloudFront website

# 24. Display website deployment summary

# 25. Display final CloudFormation stack information

# 26. Display CloudFormation stack resources

# 27. Display CloudFormation stack outputs

# 28. Display CloudFormation deployment completion message

#

# ==========================================================

#

# DOCKER BUILD AND TEST JOB

# ==========================================================

#

# The "docker" job runs only after the CloudFormation

# deployment job succeeds.

#

# This job performs the following steps:

#

# 1. Checkout GitHub repository

# 2. Verify Docker and Docker Compose

# 3. Check Docker files

# 4. Validate Docker Compose configuration

# 5. Build Docker image

# 6. Verify Docker image

# 7. Start Docker container

# 8. Check Docker container status

# 9. Wait for application startup

# 10. Test Docker application using HTTP

# 11. Display Docker container logs

# 12. Display final Docker status

# 13. Stop and remove Docker container

# 14. Display Docker job completion message

#

# IMPORTANT:

#

# This Docker job currently performs local CI testing only.

#

# It does NOT directly deploy the Docker image to:

#

# - Amazon ECR

# - Amazon ECS

# - Amazon ECS Fargate

# - Application Load Balancer

#

# The ECS deployment is handled by the separate reusable

# workflow called after this job completes successfully.

#

# ==========================================================

#

# ECS DEPLOYMENT JOB

# ==========================================================

#

# The "ecs-deploy" job runs after the Docker job succeeds.

#

# It calls the reusable workflow:

#

# .github/workflows/aws-cloudformation-ecs-deploy.yml

#

# The reusable workflow is responsible for the ECS/ECR

# deployment process.

#

# The workflow is called using:

#

# uses:

# ./.github/workflows/aws-cloudformation-ecs-deploy.yml

#

# GitHub repository secrets are passed to the reusable

# workflow using:

#

# secrets: inherit

#

# ==========================================================

#

# IMPORTANT RDS SECURITY DESIGN

# ==========================================================

#

# This workflow DOES NOT contain:

#

# DB_MASTER_PASSWORD

# DBMasterPassword

#

# The RDS nested CloudFormation template uses:

#

# ManageMasterUserPassword: true

#

# Therefore the RDS password is managed by AWS.

#

# GitHub Actions

# |

# v

# CloudFormation

# |

# v

# Amazon RDS

# |

# v

# AWS Secrets Manager

#

# RDS automatically creates and manages the master database

# password in AWS Secrets Manager.

#

# GitHub Actions does not receive, store, or display the

# RDS master password.

#

# ==========================================================

#

# MAIN DEPLOYMENT DEPENDENCIES

# ==========================================================

#

# The deployment order is:

#

# deploy

# |

# v

# docker

# |

# v

# ecs-deploy

#

# The Docker job uses:

#

# needs: deploy

#

# Therefore Docker testing starts only after successful

# CloudFormation deployment.

#

# The ECS deployment job uses:

#

# needs:

# - docker

#

# Therefore ECS deployment starts only after successful

# Docker build and testing.

#

# ==========================================================

#

# REQUIRED GITHUB SECRETS

# ==========================================================

#

# The CloudFormation deployment requires:

#

# AWS_ACCESS_KEY_ID

# AWS_SECRET_ACCESS_KEY

#

# The reusable ECS workflow may also require additional

# secrets depending on its configuration.

#

# The RDS database password is intentionally NOT stored as

# a GitHub Actions secret.

#

# ==========================================================

#

# REQUIRED REPOSITORY STRUCTURE

# ==========================================================

#

# The workflow expects the following files/directories:

#

# infrastructure/

# └── aws-cloudformation/

# └── templates/

# ├── main.yaml

# ├── TemplateBucket-MainStack.yaml

# ├── ec2-webserver.yaml

# ├── s3.yaml

# ├── aws-rds.yaml

# └── s3-website-cloudfront.yaml

#

# application/

# └── index.html

#

# docker/

# └── Dockerfile

#

# docker-compose.yml

#

# .github/

# └── workflows/

# ├── aws-cloudformation-deploy.yml

# └── aws-cloudformation-ecs-deploy.yml

#

# ==========================================================

# END WORKFLOW DOCUMENTATION

# ==========================================================



# ----------------------------------------------------------
# Workflow Name
# ----------------------------------------------------------

name: AWS CloudFormation Deployment


# ----------------------------------------------------------
# Workflow Triggers
# ----------------------------------------------------------
#
# The workflow runs:
#
# 1. Automatically when code is pushed to main
# 2. Manually from GitHub Actions
#
# ----------------------------------------------------------

on:

  push:
    branches:
      - main

  workflow_dispatch:


# ----------------------------------------------------------
# Global Environment Variables
# ----------------------------------------------------------

env:

  # ========================================================
  # AWS Region
  # ========================================================

  AWS_REGION: us-east-1


  # ========================================================
  # Main CloudFormation Stack
  # ========================================================
  #
  # This is the main infrastructure stack.
  #
  # It creates:
  #
  # - VPC
  # - Internet Gateway
  # - Subnets
  # - Route Tables
  # - Security Groups
  # - EC2 nested stack
  # - S3 nested stack
  # - RDS nested stack
  #
  # ========================================================

  STACK_NAME: Main-CloudFormation


  # ========================================================
  # EC2 Key Pair
  # ========================================================

  KEY_PAIR_NAME: Lab-KeyPair


  # ========================================================
  # Template Bucket CloudFormation Stack
  # ========================================================
  #
  # This separate stack creates the S3 bucket used to store
  # nested CloudFormation templates.
  #
  # ========================================================

  TEMPLATE_BUCKET_STACK: Lab01-CloudFormation-TemplateBucket


  # ========================================================
  # AWS CloudFormation Base Directory
  # ========================================================

  CLOUDFORMATION_DIR: infrastructure/aws-cloudformation

  # ========================================================
  #
  # Template Bucket CloudFormation Template
  # 
  # TEMPLATE_BUCKET_FILE: infrastructure/aws-cloudformation/templates/TemplateBucket-MainStack.yaml
  #
  # TEMPLATE_BUCKET_FILE: ${{ env.CLOUDFORMATION_DIR }}/templates/TemplateBucket-MainStack.yaml
  #
  # ========================================================

  TEMPLATE_BUCKET_FILE: infrastructure/aws-cloudformation/templates/TemplateBucket-MainStack.yaml


  # ========================================================
  #
  # Main CloudFormation Template
  #
  # TEMPLATE_FILE: infrastructure/aws-cloudformation/templates/main.yaml
  #
  # TEMPLATE_FILE: ${{ env.CLOUDFORMATION_DIR }}/templates/main.yaml
  #
  # ========================================================

  TEMPLATE_FILE: infrastructure/aws-cloudformation/templates/main.yaml

  # ========================================================
  # Application Directory
  # ========================================================
  #
  # Local directory containing the static website files.
  #
  # Current project:
  #
  # application/
  # └── index.html
  #
  # ========================================================

  APPLICATION_DIR: application


  # ========================================================
  # S3 Bucket Output Name
  # ========================================================
  #
  # This is the OutputKey that the MAIN CloudFormation
  # stack should expose for the existing LabBucket.
  #
  # The main stack should eventually contain:
  #
  # Outputs:
  #
  #   S3BucketName:
  #     Value: !GetAtt S3NestedStack.Outputs.BucketName
  #
  # ========================================================

  S3_BUCKET_OUTPUT_KEY: S3BucketName


# ==========================================================
# JOBS
# ==========================================================

jobs:

  deploy:

    # --------------------------------------------------------
    # GitHub-hosted runner
    # --------------------------------------------------------

    runs-on: ubuntu-latest

    name: Validate and Deploy CloudFormation Stack


    # ========================================================
    # STEPS
    # ========================================================

    steps:


      # ======================================================
      # Step 1 - Checkout Repository
      # ======================================================
      #
      # Downloads the GitHub repository onto the GitHub
      # Actions runner.
      #
      # This makes files such as:
      #
      # infrastructure/aws-cloudformation/templates/main.yaml
      # infrastructure/aws-cloudformation/templates/aws-rds.yaml
      # infrastructure/aws-cloudformation/templates/ec2-webserver.yaml
      #
      # available to the workflow.
      #
      # ======================================================

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ======================================================
      # Step 2 - Configure AWS Credentials
      # ======================================================
      #
      # Required GitHub Secrets:
      #
      # AWS_ACCESS_KEY_ID
      # AWS_SECRET_ACCESS_KEY
      #
      # IMPORTANT:
      #
      # DB_MASTER_PASSWORD is NOT required anymore.
      #
      # RDS generates and manages the master password using
      # AWS Secrets Manager.
      #
      # ======================================================

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: ${{ env.AWS_REGION }}


      # ======================================================
      # Step 3 - Verify AWS CLI
      # ======================================================
      #
      # Confirms:
      #
      # 1. AWS CLI is available
      # 2. GitHub Actions can authenticate with AWS
      # 3. The expected AWS account is being used
      #
      # ======================================================

      - name: Verify AWS CLI

        shell: bash

        run: |

          echo "======================================"
          echo "AWS CLI Version"
          echo "======================================"

          aws --version

          echo ""

          echo "======================================"
          echo "AWS Account Information"
          echo "======================================"

          aws sts get-caller-identity \
            --no-cli-pager


      # ======================================================
      # Step 4 - Check Required Deployment Values
      # ======================================================
      #
      # Checks the values required by the main CloudFormation
      # template.
      #
      # Required values:
      #
      # - AWS Region
      # - Stack name
      # - Main template
      # - Template bucket stack
      # - Template bucket template
      # - EC2 Key Pair
      #
      # There is intentionally NO database password check.
      #
      # RDS uses AWS Secrets Manager automatically.
      #
      # ======================================================

      - name: Check Required Deployment Values

        shell: bash

        run: |

          echo "======================================"
          echo "Checking Required Deployment Values"
          echo "======================================"

          echo "AWS Region:"
          echo "$AWS_REGION"

          echo ""

          echo "CloudFormation Stack:"
          echo "$STACK_NAME"

          echo ""

          echo "Main Template:"
          echo "$TEMPLATE_FILE"

          echo ""

          echo "Template Bucket Stack:"
          echo "$TEMPLATE_BUCKET_STACK"

          echo ""

          echo "Template Bucket Template:"
          echo "$TEMPLATE_BUCKET_FILE"

          echo ""

          echo "Key Pair:"
          echo "$KEY_PAIR_NAME"

          echo ""

          # --------------------------------------------------
          # Validate Key Pair
          # --------------------------------------------------

          if [ -z "$KEY_PAIR_NAME" ]; then

            echo "ERROR: KEY_PAIR_NAME is empty."

            exit 1

          fi


          # --------------------------------------------------
          # Validate main template path
          # --------------------------------------------------

          if [ ! -f "$TEMPLATE_FILE" ]; then

            echo "ERROR: Main CloudFormation template does not exist."

            echo "$TEMPLATE_FILE"

            exit 1

          fi


          # --------------------------------------------------
          # Validate template bucket template path
          # --------------------------------------------------

          if [ ! -f "$TEMPLATE_BUCKET_FILE" ]; then

            echo "ERROR: Template bucket CloudFormation template does not exist."

            echo "$TEMPLATE_BUCKET_FILE"

            exit 1

          fi


          echo ""
          echo "All required deployment values are available."


      # ======================================================
      # Step 5 - Create or Update Template Bucket Stack
      # ======================================================
      #
      # This CloudFormation stack creates the S3 bucket that
      # stores the nested CloudFormation templates.
      #
      # Architecture:
      #
      # GitHub Actions
      #       |
      #       v
      # Template Bucket Stack
      #       |
      #       v
      # S3 Template Bucket
      #
      # ======================================================

      - name: Create or Update Template Bucket Stack

        shell: bash

        run: |

          echo "======================================"
          echo "Template Bucket CloudFormation Stack"
          echo "======================================"

          echo "Stack Name:"
          echo "$TEMPLATE_BUCKET_STACK"

          echo ""

          echo "Template:"
          echo "$TEMPLATE_BUCKET_FILE"

          echo ""


          # --------------------------------------------------
          # Validate template bucket template
          # --------------------------------------------------

          echo "Validating template bucket template..."

          aws cloudformation validate-template \
            --template-body "file://$TEMPLATE_BUCKET_FILE" \
            --region "$AWS_REGION" \
            --no-cli-pager


          echo ""

          echo "Template bucket template validation completed."


          # --------------------------------------------------
          # Check whether the template bucket stack exists
          # --------------------------------------------------

          if aws cloudformation describe-stacks \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo ""
            echo "Template bucket stack already exists."


            # ------------------------------------------------
            # Get current stack status
            # ------------------------------------------------

            TEMPLATE_BUCKET_STATUS=$(aws cloudformation describe-stacks \
              --stack-name "$TEMPLATE_BUCKET_STACK" \
              --region "$AWS_REGION" \
              --query "Stacks[0].StackStatus" \
              --output text \
              --no-cli-pager)


            echo ""
            echo "Current Template Bucket Stack Status:"
            echo "$TEMPLATE_BUCKET_STATUS"


            # ------------------------------------------------
            # Do not update a stack that is currently busy.
            # ------------------------------------------------

            case "$TEMPLATE_BUCKET_STATUS" in

              CREATE_IN_PROGRESS|UPDATE_IN_PROGRESS|UPDATE_COMPLETE_CLEANUP_IN_PROGRESS|DELETE_IN_PROGRESS)

                echo ""
                echo "ERROR: Template bucket stack is currently busy."
                echo "Current status: $TEMPLATE_BUCKET_STATUS"

                exit 1

                ;;

            esac


            # ------------------------------------------------
            # Remove old update output
            # ------------------------------------------------

            rm -f /tmp/template-bucket-update.txt


            # ------------------------------------------------
            # Attempt CloudFormation update.
            #
            # 'set +e' allows us to inspect the AWS CLI error
            # and correctly handle "No updates are to be
            # performed."
            # ------------------------------------------------

            set +e

            aws cloudformation update-stack \
              --stack-name "$TEMPLATE_BUCKET_STACK" \
              --template-body "file://$TEMPLATE_BUCKET_FILE" \
              --region "$AWS_REGION" \
              --no-cli-pager \
              2>&1 | tee /tmp/template-bucket-update.txt

            UPDATE_EXIT_CODE=${PIPESTATUS[0]}

            set -e


            # ------------------------------------------------
            # Update started successfully
            # ------------------------------------------------

            if [ "$UPDATE_EXIT_CODE" -eq 0 ]; then

              echo ""
              echo "Template bucket stack update started."

              echo ""
              echo "Waiting for template bucket stack update..."

              aws cloudformation wait stack-update-complete \
                --stack-name "$TEMPLATE_BUCKET_STACK" \
                --region "$AWS_REGION"

              echo ""
              echo "Template bucket stack update completed."


            # ------------------------------------------------
            # No changes detected
            # ------------------------------------------------

            elif grep -qi "No updates are to be performed" \
              /tmp/template-bucket-update.txt
            then

              echo ""
              echo "No template bucket changes detected."

              echo "Existing template bucket will be used."


            # ------------------------------------------------
            # Real error
            # ------------------------------------------------

            else

              echo ""
              echo "ERROR: Template bucket stack update failed."

              echo ""
              echo "AWS CloudFormation Error:"

              cat /tmp/template-bucket-update.txt

              exit "$UPDATE_EXIT_CODE"

            fi


          else

            # ------------------------------------------------
            # Template bucket stack does not exist.
            # ------------------------------------------------

            echo ""
            echo "Template bucket stack does not exist."

            echo ""
            echo "Creating template bucket stack..."


            aws cloudformation create-stack \
              --stack-name "$TEMPLATE_BUCKET_STACK" \
              --template-body "file://$TEMPLATE_BUCKET_FILE" \
              --region "$AWS_REGION" \
              --no-cli-pager


            echo ""
            echo "Template bucket stack creation started."


            echo ""
            echo "Waiting for template bucket stack creation..."


            aws cloudformation wait stack-create-complete \
              --stack-name "$TEMPLATE_BUCKET_STACK" \
              --region "$AWS_REGION"


            echo ""
            echo "Template bucket stack creation completed."

          fi


          echo ""
          echo "======================================"
          echo "Template Bucket Stack Ready"
          echo "======================================"


      # ======================================================
      # Step 6 - Get Template S3 Bucket Name
      # ======================================================
      #
      # Retrieves the bucket name from the template bucket
      # CloudFormation stack output.
      #
      # The value is saved into GITHUB_ENV so later steps
      # can use:
      #
      # $TEMPLATE_BUCKET
      #
      # ======================================================

      - name: Get Template Bucket Name

        shell: bash

        run: |

          echo "======================================"
          echo "Getting Template S3 Bucket Name"
          echo "======================================"


          TEMPLATE_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text \
            --no-cli-pager)


          # --------------------------------------------------
          # Verify bucket name
          # --------------------------------------------------

          if [ -z "$TEMPLATE_BUCKET" ] || [ "$TEMPLATE_BUCKET" = "None" ]; then

            echo "ERROR: Could not retrieve S3 template bucket name."

            echo ""
            echo "Check the template bucket CloudFormation Outputs."

            exit 1

          fi


          # --------------------------------------------------
          # Save bucket name for later steps
          # --------------------------------------------------

          echo "TEMPLATE_BUCKET=$TEMPLATE_BUCKET" >> "$GITHUB_ENV"


          echo ""

          echo "Template S3 Bucket:"
          echo "$TEMPLATE_BUCKET"


      # ======================================================
      # Step 7 - Upload Nested CloudFormation Templates
      # ======================================================
      #
      # Uploads the nested CloudFormation templates to S3.
      #
      # The main template references these files using:
      #
      # https://${TemplateBucketName}.s3.amazonaws.com/
      # templates/<template>.yaml
      #
      # IMPORTANT:
      #
      # The template that creates the bucket itself is excluded.
      #
      # ======================================================

      - name: Upload Nested Templates to S3

        shell: bash

        run: |

          echo "======================================"
          echo "Uploading CloudFormation Templates"
          echo "======================================"

          echo "S3 Bucket:"
          echo "$TEMPLATE_BUCKET"

          echo ""


          # --------------------------------------------------
          # Upload templates.
          #
          # TemplateBucket-MainStack.yaml is excluded because
          # it creates the template bucket itself.
          #
          # main.yaml is uploaded as well because it is part
          # of the repository's CloudFormation templates.
          #
          # templates/ replaced with new ["$CLOUDFORMATION_DIR/templates/" \]
          # --------------------------------------------------

          aws s3 sync \
            "$CLOUDFORMATION_DIR/templates/" \
            "s3://$TEMPLATE_BUCKET/templates/" \
            --exclude "TemplateBucket-MainStack.yaml" \
            --region "$AWS_REGION"


          echo ""

          echo "CloudFormation templates uploaded successfully."


          echo ""
          echo "S3 Template Files:"


          aws s3 ls \
            "s3://$TEMPLATE_BUCKET/templates/" \
            --recursive \
            --region "$AWS_REGION"


      # ======================================================
      # Step 8 - Display Repository Information
      # ======================================================

      - name: Display Environment

        shell: bash

        run: |

          echo "======================================"
          echo "GitHub Runner Information"
          echo "======================================"

          echo "Current Directory:"
          pwd

          echo ""

          echo "Repository Files:"
          ls -la

          echo ""

          echo "Main CloudFormation Template:"
          echo "$TEMPLATE_FILE"

          echo ""

          echo "AWS Region:"
          echo "$AWS_REGION"

          echo ""

          echo "CloudFormation Stack:"
          echo "$STACK_NAME"

          echo ""

          echo "Template Bucket Stack:"
          echo "$TEMPLATE_BUCKET_STACK"

          echo ""

          echo "Template Bucket:"
          echo "$TEMPLATE_BUCKET"


      # ======================================================
      # Step 9 - Verify CloudFormation Templates Exist
      # ======================================================
      #
      # Checks that both local templates required by this
      # workflow are available.
      #
      # ======================================================

      - name: Check CloudFormation Templates

        shell: bash

        run: |

          echo "======================================"
          echo "Checking CloudFormation Templates"
          echo "======================================"


          # --------------------------------------------------
          # Check template bucket template
          # --------------------------------------------------

          if [ ! -f "$TEMPLATE_BUCKET_FILE" ]; then

            echo "ERROR: Template bucket template not found:"
            echo "$TEMPLATE_BUCKET_FILE"

            exit 1

          fi


          echo "Template bucket template found:"
          echo "$TEMPLATE_BUCKET_FILE"


          echo ""


          # --------------------------------------------------
          # Check main template
          # --------------------------------------------------

          if [ ! -f "$TEMPLATE_FILE" ]; then

            echo "ERROR: Main CloudFormation template not found:"
            echo "$TEMPLATE_FILE"

            exit 1

          fi


          echo "Main CloudFormation template found:"
          echo "$TEMPLATE_FILE"


      # ======================================================
      # Step 10 - Validate Main CloudFormation Template
      # ======================================================
      #
      # Validates the main CloudFormation template before
      # attempting deployment.
      #
      # The template now contains:
      #
      # - VPC
      # - EC2 nested stack
      # - S3 nested stack
      # - RDS nested stack
      # - AWS Secrets Manager-managed RDS password
      #
      # ======================================================

      - name: Validate CloudFormation Template

        shell: bash

        run: |

          echo "======================================"
          echo "Validating CloudFormation Template"
          echo "======================================"


          aws cloudformation validate-template \
            --template-body "file://$TEMPLATE_FILE" \
            --region "$AWS_REGION" \
            --no-cli-pager


          echo ""

          echo "CloudFormation template validation completed successfully."


      # ======================================================
      # Step 11 - Check Whether Main Stack Exists
      # ======================================================
      #
      # Stores:
      #
      # exists=true
      #
      # or:
      #
      # exists=false
      #
      # in GitHub Actions output.
      #
      # ======================================================

      - name: Check Stack Status

        id: stack

        shell: bash

        run: |

          echo "======================================"
          echo "Checking CloudFormation Stack"
          echo "======================================"


          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo "CloudFormation stack already exists."

            echo "exists=true" >> "$GITHUB_OUTPUT"

          else

            echo "CloudFormation stack does not exist."

            echo "exists=false" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # Step 12 - Display Existing Stack Status
      # ======================================================

      - name: Display Existing Stack Status

        if: steps.stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "======================================"
          echo "Existing Stack Status"
          echo "======================================"


          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text \
            --no-cli-pager)


          echo "Current Stack Status:"
          echo "$STACK_STATUS"


      # ======================================================
      # Step 13 - Debug Deployment Environment
      # ======================================================
      #
      # This step confirms the deployment configuration.
      #
      # IMPORTANT:
      #
      # There is NO DB_MASTER_PASSWORD here.
      #
      # The RDS password is managed by AWS Secrets Manager.
      #
      # ======================================================

      - name: Debug Deployment Environment

        shell: bash

        run: |

          echo "======================================"
          echo "DEPLOYMENT ENVIRONMENT"
          echo "======================================"

          echo "AWS_REGION=$AWS_REGION"

          echo "STACK_NAME=$STACK_NAME"

          echo "KEY_PAIR_NAME=$KEY_PAIR_NAME"

          echo "TEMPLATE_FILE=$TEMPLATE_FILE"

          echo "TEMPLATE_BUCKET=$TEMPLATE_BUCKET"

          echo ""

          if [ -z "$KEY_PAIR_NAME" ]; then

            echo "KEY_PAIR_NAME: EMPTY"

            exit 1

          else

            echo "KEY_PAIR_NAME: SET"

          fi

          echo ""

          echo "RDS Password Management:"
          echo "AWS Secrets Manager"

          echo ""

          echo "RDS password is NOT stored in GitHub Actions."

          echo ""

          echo "======================================"
          echo "END DEPLOYMENT ENVIRONMENT"
          echo "======================================"


      # ======================================================
      # Step 14 - Create New Main CloudFormation Stack
      # ======================================================
      #
      # Runs only when the main stack does not exist.
      #
      # Parameters passed to the main template:
      #
      # 1. TemplateBucketName
      # 2. KeyPairName
      #
      # DBMasterPassword is NOT passed.
      #
      # RDS creates/manages its password through Secrets Manager.
      #
      # ======================================================

      - name: Create CloudFormation Stack

        if: steps.stack.outputs.exists == 'false'

        shell: bash

        run: |

          echo "======================================"
          echo "Creating CloudFormation Stack"
          echo "======================================"

          echo "Stack Name       : $STACK_NAME"
          echo "Template         : $TEMPLATE_FILE"
          echo "Region           : $AWS_REGION"
          echo "Key Pair         : $KEY_PAIR_NAME"
          echo "Template Bucket  : $TEMPLATE_BUCKET"

          echo ""


          # --------------------------------------------------
          # Validate KeyPairName
          # --------------------------------------------------

          if [ -z "$KEY_PAIR_NAME" ]; then

            echo "ERROR: KEY_PAIR_NAME is empty."

            exit 1

          fi


          # --------------------------------------------------
          # Display deployment parameters.
          #
          # There is intentionally no database password.
          # --------------------------------------------------

          echo "CloudFormation Parameters:"
          echo "  TemplateBucketName = $TEMPLATE_BUCKET"
          echo "  KeyPairName        = $KEY_PAIR_NAME"
          echo "  RDS Password       = Managed by AWS Secrets Manager"

          echo ""


          # --------------------------------------------------
          # Create CloudFormation stack
          # --------------------------------------------------

          echo "Starting CloudFormation stack creation..."


          aws cloudformation create-stack \
            --stack-name "$STACK_NAME" \
            --template-body "file://$TEMPLATE_FILE" \
            --parameters \
              "ParameterKey=TemplateBucketName,ParameterValue=$TEMPLATE_BUCKET" \
              "ParameterKey=KeyPairName,ParameterValue=$KEY_PAIR_NAME" \
            --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --region "$AWS_REGION" \
            --no-cli-pager


          echo ""

          echo "Main CloudFormation stack creation started."


      # ======================================================
      # Step 15 - Wait for Stack Creation
      # ======================================================

      - name: Wait for Stack Creation

        if: steps.stack.outputs.exists == 'false'

        shell: bash

        run: |

          echo "======================================"
          echo "Waiting for Stack Creation"
          echo "======================================"


          aws cloudformation wait stack-create-complete \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION"


          echo ""

          echo "Stack creation completed successfully."


      # ======================================================
      # Step 16 - Update Existing Main CloudFormation Stack
      # ======================================================
      #
      # Runs when the main stack already exists.
      #
      # Only these parameters are supplied:
      #
      # - TemplateBucketName
      # - KeyPairName
      #
      # The RDS password is managed independently by RDS and
      # Secrets Manager.
      #
      # ======================================================

      - name: Update CloudFormation Stack

        if: steps.stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "======================================"
          echo "Updating CloudFormation Stack"
          echo "======================================"

          echo "Stack Name       : $STACK_NAME"
          echo "Template         : $TEMPLATE_FILE"
          echo "Region           : $AWS_REGION"
          echo "Key Pair         : $KEY_PAIR_NAME"
          echo "Template Bucket  : $TEMPLATE_BUCKET"

          echo ""


          # --------------------------------------------------
          # Get current stack status
          # --------------------------------------------------

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text \
            --no-cli-pager)


          echo "Current Stack Status:"
          echo "$STACK_STATUS"


          # --------------------------------------------------
          # Do not update a stack that is currently busy.
          # --------------------------------------------------

          case "$STACK_STATUS" in

            CREATE_IN_PROGRESS|UPDATE_IN_PROGRESS|UPDATE_COMPLETE_CLEANUP_IN_PROGRESS|DELETE_IN_PROGRESS)

              echo ""
              echo "ERROR: Main CloudFormation stack is currently busy."
              echo "Current status: $STACK_STATUS"

              exit 1

              ;;
          ROLLBACK_COMPLETE)

              echo ""
              echo "ERROR: Main CloudFormation stack is in ROLLBACK_COMPLETE."
              echo "The stack must be deleted before it can be recreated."

              exit 1

              ;;    

          esac


          # --------------------------------------------------
          # Remove old update output
          # --------------------------------------------------

          rm -f /tmp/main-stack-update.txt


          # --------------------------------------------------
          # Execute CloudFormation update.
          # --------------------------------------------------

          set +e


          aws cloudformation update-stack \
            --stack-name "$STACK_NAME" \
            --template-body "file://$TEMPLATE_FILE" \
            --parameters \
              "ParameterKey=TemplateBucketName,ParameterValue=$TEMPLATE_BUCKET,UsePreviousValue=false" \
              "ParameterKey=KeyPairName,ParameterValue=$KEY_PAIR_NAME,UsePreviousValue=false" \
            --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --region "$AWS_REGION" \
            --no-cli-pager \
            2>&1 | tee /tmp/main-stack-update.txt


          UPDATE_EXIT_CODE=${PIPESTATUS[0]}


          set -e


          # --------------------------------------------------
          # Successful update
          # --------------------------------------------------

          if [ "$UPDATE_EXIT_CODE" -eq 0 ]; then

            echo ""
            echo "CloudFormation stack update started."


          # --------------------------------------------------
          # No changes detected
          # --------------------------------------------------

          elif grep -qi "No updates are to be performed" \
            /tmp/main-stack-update.txt
          then

            echo ""
            echo "No main stack changes detected."

            echo "Existing CloudFormation infrastructure will be used."


          # --------------------------------------------------
          # Real error
          # --------------------------------------------------

          else

            echo ""
            echo "ERROR: Main CloudFormation stack update failed."

            echo ""
            echo "AWS CloudFormation Error:"

            cat /tmp/main-stack-update.txt

            exit "$UPDATE_EXIT_CODE"

          fi


      # ======================================================
      # Step 17 - Wait for Existing Stack Update
      # ======================================================

      - name: Wait for Stack Update

        if: steps.stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "======================================"
          echo "Checking Main Stack Update Status"
          echo "======================================"


          CURRENT_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text \
            --no-cli-pager)


          echo "Current Stack Status:"
          echo "$CURRENT_STATUS"


          # --------------------------------------------------
          # Wait when an update is actually in progress.
          # --------------------------------------------------

          if [ "$CURRENT_STATUS" = "UPDATE_IN_PROGRESS" ]; then

            echo ""
            echo "Stack update is in progress."

            echo ""
            echo "Waiting for Stack Update..."


            aws cloudformation wait stack-update-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"


            echo ""
            echo "Stack update completed successfully."


          elif [ "$CURRENT_STATUS" = "UPDATE_COMPLETE" ]; then

            echo ""
            echo "Stack is already in UPDATE_COMPLETE state."

            echo "No additional stack update wait is required."


          elif [ "$CURRENT_STATUS" = "CREATE_COMPLETE" ]; then

            echo ""
            echo "Stack is in CREATE_COMPLETE state."

            echo "No update was required."


          else

            echo ""
            echo "ERROR: Unexpected CloudFormation stack status:"
            echo "$CURRENT_STATUS"

            exit 1

          fi

      # ======================================================
      # Step 18 - Get Application S3 Bucket
      # ======================================================
      #
      # The existing S3 bucket is created by:
      #
      #   s3.yaml
      #
      # The main CloudFormation stack exposes the nested
      # stack's BucketName through:
      #
      #   S3BucketName
      #
      # The workflow retrieves that value so that the
      # application can be uploaded to the correct bucket.
      #
      # ======================================================

      - name: Get Application S3 Bucket

        shell: bash

        run: |

          echo "======================================"
          echo "Getting Application S3 Bucket"
          echo "======================================"


          # --------------------------------------------------
          # Retrieve the existing LabBucket name from the
          # main CloudFormation stack output.
          # --------------------------------------------------

          WEBSITE_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='$S3_BUCKET_OUTPUT_KEY'].OutputValue" \
            --output text \
            --no-cli-pager)


          # --------------------------------------------------
          # Verify that the bucket name was returned.
          # --------------------------------------------------

          if [ -z "$WEBSITE_BUCKET" ] || [ "$WEBSITE_BUCKET" = "None" ]; then

            echo "ERROR: Could not retrieve the application S3 bucket."

            echo ""
            echo "Expected CloudFormation output:"
            echo "$S3_BUCKET_OUTPUT_KEY"

            echo ""
            echo "Check the Outputs section of main.yaml."

            exit 1

          fi


          # --------------------------------------------------
          # Save bucket name for later workflow steps.
          # --------------------------------------------------

          echo "WEBSITE_BUCKET=$WEBSITE_BUCKET" >> "$GITHUB_ENV"


          echo ""

          echo "Application S3 Bucket:"
          echo "$WEBSITE_BUCKET"


      # ======================================================
      # Step 19 - Verify Application Files
      # ======================================================
      #
      # The static website is stored in:
      #
      #   application/
      #
      # Current application:
      #
      #   application/index.html
      #
      # This step makes sure the website files exist before
      # attempting to upload them to S3.
      #
      # ======================================================

      - name: Verify Application Files

        shell: bash

        run: |

          echo "======================================"
          echo "Checking Application Files"
          echo "======================================"


          # --------------------------------------------------
          # Check application directory.
          # --------------------------------------------------

          if [ ! -d "$APPLICATION_DIR" ]; then

            echo "ERROR: Application directory does not exist."

            echo ""
            echo "Expected directory:"
            echo "$APPLICATION_DIR"

            exit 1

          fi


          echo "Application directory found:"
          echo "$APPLICATION_DIR"


          echo ""


          # --------------------------------------------------
          # Check index.html.
          # --------------------------------------------------

          if [ ! -f "$APPLICATION_DIR/index.html" ]; then

            echo "ERROR: index.html was not found."

            echo ""
            echo "Expected file:"
            echo "$APPLICATION_DIR/index.html"

            exit 1

          fi


          echo "index.html found:"
          echo "$APPLICATION_DIR/index.html"


          echo ""

          echo "Application files are ready for deployment."


      # ======================================================
      # Step 20 - Upload Static Website to S3
      # ======================================================
      #
      # Uploads the contents of:
      #
      #   application/
      #
      # to:
      #
      #   s3://<LabBucket>/
      #
      # Example:
      #
      #   application/index.html
      #
      # becomes:
      #
      #   s3://LabBucket/index.html
      #
      # CloudFront can then retrieve the object through
      # Origin Access Control.
      #
      # IMPORTANT:
      #
      # We are NOT making the S3 bucket public.
      #
      # CloudFront OAC provides access.
      #
      # ======================================================

      - name: Upload Website to S3

        shell: bash

        run: |

          echo "======================================"
          echo "Deploying Static Website to S3"
          echo "======================================"


          echo "Source Directory:"
          echo "$APPLICATION_DIR"


          echo ""

          echo "Destination Bucket:"
          echo "$WEBSITE_BUCKET"


          echo ""


          # --------------------------------------------------
          # Upload website files.
          #
          # sync uploads all files from the application
          # directory while preserving the directory
          # structure.
          # --------------------------------------------------

          aws s3 sync \
            "$APPLICATION_DIR/" \
            "s3://$WEBSITE_BUCKET/" \
            --region "$AWS_REGION"


          echo ""

          echo "Website files uploaded successfully."


      # ======================================================
      # Step 21 - Verify Website Files in S3
      # ======================================================
      #
      # Lists the uploaded files to confirm that the website
      # was successfully deployed.
      #
      # ======================================================

      - name: Verify Website Files in S3

        shell: bash

        run: |

          echo "======================================"
          echo "Verifying Website Files"
          echo "======================================"


          echo "S3 Bucket:"
          echo "$WEBSITE_BUCKET"


          echo ""


          aws s3 ls \
            "s3://$WEBSITE_BUCKET/" \
            --recursive \
            --region "$AWS_REGION"


          echo ""

          echo "S3 website file verification completed."


      # ======================================================
      # Step 22 - Get CloudFront Distribution Information
      # ======================================================
      #
      # The CloudFront distribution is created by:
      #
      #   s3-website-cloudfront.yaml
      #
      # This nested stack should expose:
      #
      #   CloudFrontDistributionId
      #   CloudFrontDomainName
      #   CloudFrontWebsiteURL
      #
      # The main stack should pass these nested stack outputs
      # through its own Outputs section.
      #
      # ======================================================

      - name: Get CloudFront Website URL

        shell: bash

        run: |

          echo "======================================"
          echo "Getting CloudFront Website URL"
          echo "======================================"


          CLOUDFRONT_URL=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontWebsiteURL'].OutputValue" \
            --output text \
            --no-cli-pager)


          # --------------------------------------------------
          # Verify CloudFront URL.
          # --------------------------------------------------

          if [ -z "$CLOUDFRONT_URL" ] || [ "$CLOUDFRONT_URL" = "None" ]; then

            echo "ERROR: CloudFront website URL was not found."

            echo ""
            echo "Expected main stack output:"
            echo "CloudFrontWebsiteURL"

            echo ""
            echo "Check that main.yaml exposes the nested stack"
            echo "CloudFrontWebsiteURL output."

            exit 1

          fi


          # --------------------------------------------------
          # Save URL for later steps.
          # --------------------------------------------------

          echo "CLOUDFRONT_URL=$CLOUDFRONT_URL" >> "$GITHUB_ENV"


          echo ""

          echo "CloudFront Website URL:"
          echo "$CLOUDFRONT_URL"


      # ======================================================
      # Step 23 - Test CloudFront Website
      # ======================================================
      #
      # CloudFront distributions can take some time to deploy
      # or propagate changes.
      #
      # Therefore this test uses curl with retries.
      #
      # ======================================================

      - name: Test CloudFront Website

        shell: bash

        run: |

          echo "======================================"
          echo "Testing CloudFront Website"
          echo "======================================"


          echo "Website:"
          echo "$CLOUDFRONT_URL"


          echo ""


          # --------------------------------------------------
          # Test the HTTPS CloudFront endpoint.
          # --------------------------------------------------

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 10 \
            --retry-connrefused \
            "$CLOUDFRONT_URL/"


          echo ""

          echo "======================================"
          echo "CloudFront Website Test PASSED"
          echo "======================================"


      # ======================================================
      # Step 24 - Display Website Deployment Summary
      # ======================================================

      - name: Website Deployment Complete

        shell: bash

        run: |

          echo ""

          echo "======================================"
          echo "S3 + CloudFront Website Deployment"
          echo "======================================"

          echo ""

          echo "S3 Bucket:"
          echo "$WEBSITE_BUCKET"

          echo ""

          echo "Application Directory:"
          echo "$APPLICATION_DIR"

          echo ""

          echo "CloudFront Website:"
          echo "$CLOUDFRONT_URL"

          echo ""

          echo "Website Deployment:"
          echo "SUCCESS"

          echo ""

          echo "======================================"       


      # ======================================================
      # Step 25 - Display Final Stack Information
      # ======================================================

      - name: Display Stack Information

        shell: bash

        run: |

          echo "======================================"
          echo "CloudFormation Stack Details"
          echo "======================================"


          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-cli-pager


      # ======================================================
      # Step 26 - Display Stack Resources
      # ======================================================

      - name: List Stack Resources

        shell: bash

        run: |

          echo "======================================"
          echo "CloudFormation Stack Resources"
          echo "======================================"


          aws cloudformation list-stack-resources \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-cli-pager


      # ======================================================
      # Step 27 - Display Stack Outputs
      # ======================================================
      #
      # Expected outputs include:
      #
      # - VPC
      # - Public subnet
      # - Private subnets
      # - Web security group
      # - EC2 instance
      # - EC2 public IP
      # - S3 bucket
      # - RDS database
      # - RDS endpoint
      # - RDS port
      # - RDS security group
      # - RDS Secrets Manager ARN
      #
      # IMPORTANT:
      #
      # The secret ARN is safe to display.
      #
      # The secret VALUE/password is never displayed.
      #
      # ======================================================

      - name: Display Stack Outputs

        shell: bash

        run: |

          echo "======================================"
          echo "CloudFormation Stack Outputs"
          echo "======================================"


          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table \
            --no-cli-pager


      # ======================================================
      # Step 28 - Deployment Complete
      # ======================================================

      - name: Deployment Complete

        shell: bash

        run: |

          echo ""

          echo "======================================"
          echo "CloudFormation Deployment Completed"
          echo "======================================"

          echo ""

          echo "Stack Name      : $STACK_NAME"

          echo "Region          : $AWS_REGION"

          echo "Template        : $TEMPLATE_FILE"

          echo "Template Bucket : $TEMPLATE_BUCKET"

          echo ""

          echo "RDS Password Management:"
          echo "AWS Secrets Manager"

          echo ""

          echo "The RDS master password was NOT stored"
          echo "in GitHub Actions."

          echo ""

          echo "Deployment completed successfully."

          echo "======================================"

# ==========================================================
# DOCKER JOB
# ==========================================================
#
# This is a separate job from the CloudFormation deployment.
#
# Purpose:
#
# 1. Checkout the repository
# 2. Verify Docker
# 3. Verify Dockerfile
# 4. Verify docker-compose.yml
# 5. Build Docker image
# 6. Verify Docker image
# 7. Start Docker container
# 8. Verify container status
# 9. Wait for application startup
# 10. Test application using HTTP
# 11. Display container logs
# 12. Stop and remove Docker resources
#
# IMPORTANT:
#
# This stage currently does NOT deploy to:
#
# - Amazon ECR
# - Amazon ECS
# - ECS Fargate
# - Application Load Balancer
#
# This stage is only for learning and testing Docker.
#
# ==========================================================

  docker:

    # --------------------------------------------------------
    # Run Docker only after CloudFormation deployment succeeds.
    # --------------------------------------------------------
    needs: deploy

    # --------------------------------------------------------
    # GitHub-hosted Ubuntu runner
    # --------------------------------------------------------
    runs-on: ubuntu-latest

    name: Build and Test Docker

    # ========================================================
    # DOCKER STEPS
    # ========================================================

    steps:

      # ======================================================
      # Docker Step 1 - Checkout Repository
      # ======================================================
      #
      # Every GitHub Actions job gets its own fresh runner.
      #
      # Therefore the Docker job must checkout the repository
      # independently.
      #
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ======================================================
      # Docker Step 2 - Verify Docker
      # ======================================================
      #
      # GitHub's Ubuntu runner already contains Docker.
      #
      # We verify:
      #
      # - Docker
      # - Docker Compose
      #
      # ======================================================

      - name: Verify Docker
        shell: bash
        run: |

          echo "======================================"
          echo "Docker Version"
          echo "======================================"

          docker --version

          echo ""

          echo "======================================"
          echo "Docker Compose Version"
          echo "======================================"

          docker compose version


      # ======================================================
      # Docker Step 3 - Check Docker Files
      # ======================================================
      #
      # Verify that the files required by the Docker build
      # actually exist.
      #
      # Expected:
      #
      # docker/Dockerfile
      # docker-compose.yml
      #
      # ======================================================

      - name: Check Docker Files
        shell: bash
        run: |

          echo "======================================"
          echo "Checking Docker Files"
          echo "======================================"

          echo ""

          # --------------------------------------------------
          # Check Dockerfile
          # --------------------------------------------------

          if [ ! -f "docker/Dockerfile" ]; then

            echo "ERROR: Dockerfile was not found."

            echo ""
            echo "Expected:"
            echo "docker/Dockerfile"

            exit 1

          fi

          echo "Dockerfile found:"
          echo "docker/Dockerfile"

          echo ""

          # --------------------------------------------------
          # Check docker-compose.yml
          # --------------------------------------------------

          if [ ! -f "docker-compose.yml" ]; then

            echo "ERROR: docker-compose.yml was not found."

            echo ""
            echo "Expected:"
            echo "docker-compose.yml"

            exit 1

          fi

          echo "docker-compose.yml found."

          echo ""

          echo "Docker files are ready."


      # ======================================================
      # Docker Step 4 - Validate Docker Compose
      # ======================================================
      #
      # docker compose config checks the Compose YAML before
      # attempting to start the container.
      #
      # This is useful because it catches:
      #
      # - YAML errors
      # - invalid Compose syntax
      # - incorrect configuration
      #
      # ======================================================

      - name: Validate Docker Compose
        shell: bash
        run: |

          echo "======================================"
          echo "Validating Docker Compose"
          echo "======================================"

          docker compose config

          echo ""

          echo "Docker Compose configuration is valid."


      # ======================================================
      # Docker Step 5 - Build Docker Image
      # ======================================================
      #
      # docker compose build reads:
      #
      # docker-compose.yml
      #
      # and uses the Dockerfile configured there.
      #
      # ======================================================

      - name: Build Docker Image
        shell: bash
        run: |

          echo "======================================"
          echo "Building Docker Image"
          echo "======================================"

          docker compose build

          echo ""

          echo "Docker image build completed."


      # ======================================================
      # Docker Step 6 - Display Docker Images
      # ======================================================
      #
      # Display all images created by the build.
      #
      # ======================================================

      - name: Verify Docker Image
        shell: bash
        run: |

          echo "======================================"
          echo "Docker Images"
          echo "======================================"

          docker images

          echo ""

          echo "Docker image verification completed."


      # ======================================================
      # Docker Step 7 - Start Docker Container
      # ======================================================
      #
      # Start the application in detached mode.
      #
      # -d
      #
      # means detached mode.
      #
      # ======================================================

      - name: Start Docker Container
        shell: bash
        run: |

          echo "======================================"
          echo "Starting Docker Container"
          echo "======================================"

          docker compose up -d

          echo ""

          echo "======================================"
          echo "Docker Compose Status"
          echo "======================================"

          docker compose ps -a

          echo ""

          echo "======================================"
          echo "Docker Container Status"
          echo "======================================"

          docker ps -a

          echo ""

          echo "Docker container startup command completed."


      # ======================================================
      # Docker Step 8 - Check Container Status
      # ======================================================
      #
      # Instead of assuming a hard-coded container name,
      # obtain the actual container ID from Docker Compose.
      #
      # This makes the workflow more reliable.
      #
      # ======================================================

      - name: Check Docker Container
        shell: bash
        run: |

          echo "======================================"
          echo "Checking Docker Container"
          echo "======================================"

          echo ""

          docker compose ps -a

          echo ""

          # --------------------------------------------------
          # Get the container ID created by Compose.
          # --------------------------------------------------

          CONTAINER_ID=$(docker compose ps -q)

          if [ -z "$CONTAINER_ID" ]; then

            echo "ERROR: Docker Compose did not create a container."

            echo ""

            echo "Docker Compose status:"
            docker compose ps -a

            echo ""

            echo "Docker containers:"
            docker ps -a

            exit 1

          fi

          echo "Container ID:"
          echo "$CONTAINER_ID"

          echo ""

          # --------------------------------------------------
          # Get container status.
          # --------------------------------------------------

          CONTAINER_STATUS=$(docker inspect \
            --format='{{.State.Status}}' \
            "$CONTAINER_ID")

          echo "Container status:"
          echo "$CONTAINER_STATUS"

          echo ""

          # --------------------------------------------------
          # Container must be running.
          # --------------------------------------------------

          if [ "$CONTAINER_STATUS" = "running" ]; then

            echo "Docker container is running."

          else

            echo "ERROR: Docker container is not running."

            echo ""

            echo "======================================"
            echo "Container Logs"
            echo "======================================"

            docker logs "$CONTAINER_ID" || true

            echo ""

            echo "======================================"
            echo "Container Inspection"
            echo "======================================"

            docker inspect "$CONTAINER_ID"

            exit 1

          fi


      # ======================================================
      # Docker Step 9 - Wait for Application
      # ======================================================
      #
      # Give Nginx/PHP-FPM/application processes time to start.
      #
      # ======================================================

      - name: Wait for Application
        shell: bash
        run: |

          echo "======================================"
          echo "Waiting for Application"
          echo "======================================"

          sleep 5

          echo ""

          echo "Application startup wait completed."


      # ======================================================
      # Docker Step 10 - Test Application
      # ======================================================
      #
      # Your docker-compose.yml should expose:
      #
      # Host port:      8080
      # Container port: 80
      #
      # Therefore we test:
      #
      # http://localhost:8080
      #
      # ======================================================

      - name: Test Docker Container
        shell: bash
        run: |

          echo "======================================"
          echo "Testing Docker Application"
          echo "======================================"

          echo ""

          echo "Testing:"
          echo "http://localhost:8080"

          echo ""

          # --------------------------------------------------
          # HTTP test
          # --------------------------------------------------

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            http://localhost:8080

          echo ""

          echo "======================================"
          echo "Docker Container Test PASSED"
          echo "======================================"


      # ======================================================
      # Docker Step 11 - Display Container Logs
      # ======================================================
      #
      # Always display logs.
      #
      # This is extremely useful if the HTTP test fails.
      #
      # ======================================================

      - name: Display Container Logs
        if: always()
        shell: bash
        run: |

          echo "======================================"
          echo "Docker Container Logs"
          echo "======================================"

          docker compose logs --no-color || true


      # ======================================================
      # Docker Step 12 - Display Final Docker Status
      # ======================================================
      #
      # Always show the final state before cleanup.
      #
      # ======================================================

      - name: Display Final Docker Status
        if: always()
        shell: bash
        run: |

          echo "======================================"
          echo "Final Docker Status"
          echo "======================================"

          docker compose ps -a || true

          echo ""

          docker ps -a || true

          echo ""

          docker images || true


      # ======================================================
      # Docker Step 13 - Stop and Remove Docker Container
      # ======================================================
      #
      # Always clean up the Docker environment.
      #
      # --remove-orphans
      #
      # also removes containers that are no longer defined
      # in the Compose file.
      #
      # ======================================================

      - name: Stop Docker Container
        if: always()
        shell: bash
        run: |

          echo "======================================"
          echo "Stopping Docker Container"
          echo "======================================"

          docker compose down --remove-orphans || true

          echo ""

          echo "Docker container and Compose network cleaned up."


      # ======================================================
      # Docker Step 14 - Docker Job Complete
      # ======================================================

      - name: Docker Job Complete
        shell: bash
        run: |

          echo ""
          echo "======================================"
          echo "Docker Build and Test Completed"
          echo "======================================"

          echo ""

          echo "Docker build:"
          echo "SUCCESS"

          echo ""

          echo "Docker container:"
          echo "STARTED"

          echo ""

          echo "Docker HTTP test:"
          echo "PASSED"

          echo ""

          echo "Docker job completed successfully."

          echo "======================================"  

  # ============================================================
  # FINAL JOB - TRIGGER ECS + ECR DEPLOYMENT
  # ============================================================
  #
  # This is the FINAL stage of the Charlie Cafe CI/CD pipeline.
  #
  # The workflow now becomes:
  #
  # CloudFormation
  #       |
  #       v
  # AWS Infrastructure
  #       |
  #       v
  # Docker
  #       |
  #       v
  # Docker Image
  #       |
  #       v
  # ECR
  #       |
  #       v
  # ECS Deployment
  #
  # IMPORTANT:
  #
  # This job does NOT build the Docker image itself.
  #
  # The Docker job has already completed that work.
  #
  # This job simply calls:
  #
  # .github/workflows/ecs-deploy.yml
  #
  # ============================================================

  ecs-deploy:

    name: Trigger ECS Deployment


    # ==========================================================
    # IMPORTANT
    #
    # ECS deployment will NOT start until the Docker job
    # successfully completes.
    #
    # Replace "docker" below with the EXACT job ID of your
    # existing Docker job.
    #
    # Example:
    #
    # jobs:
    #
    #   cloudformation:
    #
    #   docker:
    #
    #   ecs-deploy:
    #
    # ==========================================================

    needs:
      - docker


    # ==========================================================
    # CALL THE SEPARATE ECS WORKFLOW
    # ==========================================================
    #
    # This calls:
    #
    # .github/workflows/aws-cloudformation-ecs-deploy.yml
    #
    # Because ecs-deploy.yml contains:
    #
    # on:
    #   workflow_call:
    #
    # GitHub allows this workflow to call it.
    #
    # ==========================================================

    uses: ./.github/workflows/aws-cloudformation-ecs-deploy.yml


    # ==========================================================
    # IMPORTANT SECURITY NOTE
    # ==========================================================
    #
    # The called workflow needs access to your GitHub Secrets:
    #
    # AWS_ACCESS_KEY_ID
    # AWS_SECRET_ACCESS_KEY
    # AWS_REGION
    #
    # secrets: inherit
    #
    # passes the caller workflow's secrets to the reusable
    # workflow.
    #
    # ==========================================================

    secrets: inherit


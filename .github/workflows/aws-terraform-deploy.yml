          echo ""
          echo "ECS Cluster:"
          echo "$ECS_CLUSTER"

          echo ""
          echo "ECS Service:"
          echo "$ECS_SERVICE"

          echo ""
          echo "ECS Container:"
          echo "$ECS_CONTAINER"

          echo ""
          echo "ECS Desired Count:"
          echo "$ECS_DESIRED_COUNT"

          echo ""
          echo "Application URL:"
          echo "http://$ALB_DNS"

          echo ""
          echo "Terraform:"
          echo "SUCCESS"

          echo ""
          echo "Docker:"
          echo "SUCCESS"

          echo ""
          echo "ECR:"
          echo "SUCCESS"

          echo ""

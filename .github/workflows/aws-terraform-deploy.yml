# ============================================================
# Charlie Cafe AWS DevOps Lab
# Terraform Deployment Workflow
# ============================================================
#
# File:
# .github/workflows/aws-terraform-deploy.yml
#
# Purpose:
# ------------------------------------------------------------
# This GitHub Actions workflow replaces the previous
# CloudFormation deployment workflow with Terraform.
#
# Terraform is responsible for provisioning and managing
# AWS infrastructure.
#
# The workflow performs:
#
# 1. Checkout repository
# 2. Configure AWS credentials
# 3. Verify AWS CLI
# 4. Verify Terraform
# 5. Check required Terraform files
# 6. Initialize Terraform
# 7. Validate Terraform configuration
# 8. Format-check Terraform configuration
# 9. Display Terraform configuration
# 10. Generate Terraform plan
# 11. Apply Terraform infrastructure
# 12. Display Terraform outputs
# 13. Verify AWS resources
#
# Then:
#
# 14. Build and test Docker application
# 15. Trigger ECS/ECR deployment workflow
#
# ============================================================
#
# IMPORTANT RDS SECURITY DESIGN
# ============================================================
#
# This workflow does NOT contain:
#
# DB_MASTER_PASSWORD
# DBMasterPassword
#
# The Terraform RDS configuration should use:
#
# manage_master_user_password = true
#
# Therefore:
#
# GitHub Actions
#       |
#       v
# Terraform
#       |
#       v
# Amazon RDS
#       |
#       v
# AWS Secrets Manager
#
# RDS automatically creates and manages the master password.
#
# GitHub Actions never receives the database password.
#
# ============================================================


# ============================================================
# WORKFLOW NAME
# ============================================================

name: AWS Terraform Deployment


# ============================================================
# WORKFLOW TRIGGERS
# ============================================================
#
# The workflow runs:
#
# 1. Automatically when code is pushed to main
# 2. Manually from GitHub Actions
#
# ============================================================

on:

  push:
    branches:
      - main

  workflow_dispatch:


# ============================================================
# GLOBAL ENVIRONMENT VARIABLES
# ============================================================

env:

  # ==========================================================
  # AWS REGION
  # ==========================================================

  AWS_REGION: us-east-1


  # ==========================================================
  # TERRAFORM WORKING DIRECTORY
  # ==========================================================
  #
  # Change this if your Terraform files are stored elsewhere.
  #
  # Recommended repository structure:
  #
  # infrastructure/
  # └── terraform/
  #     ├── main.tf
  #     ├── variables.tf
  #     ├── outputs.tf
  #     ├── providers.tf
  #     └── ...
  #
  # ==========================================================

  TERRAFORM_DIR: infrastructure/terraform


  # ==========================================================
  # TERRAFORM VERSION
  # ==========================================================

  TERRAFORM_VERSION: "1.9.8"


  # ==========================================================
  # EC2 KEY PAIR
  # ==========================================================
  #
  # This replaces the previous CloudFormation:
  #
  # KEY_PAIR_NAME
  #
  # Terraform should receive this as a variable.
  #
  # The value should preferably be stored in GitHub Secrets.
  #
  # ==========================================================

  KEY_PAIR_NAME: Lab-KeyPair


  # ==========================================================
  # TERRAFORM STATE FILE
  # ==========================================================
  #
  # Terraform state should preferably be stored remotely in:
  #
  # Amazon S3
  #
  # with state locking enabled using the backend mechanism
  # appropriate to your Terraform version.
  #
  # DO NOT commit terraform.tfstate to Git.
  #
  # ==========================================================

  TF_IN_AUTOMATION: true


# ============================================================
# JOBS
# ============================================================

jobs:


  # ==========================================================
  # JOB 1
  # TERRAFORM INFRASTRUCTURE DEPLOYMENT
  # ==========================================================

  terraform:

    name: Terraform Infrastructure Deployment

    runs-on: ubuntu-latest


    # ========================================================
    # JOB STEPS
    # ========================================================

    steps:


      # ======================================================
      # STEP 1
      # CHECKOUT REPOSITORY
      # ======================================================
      #
      # Downloads the repository to the GitHub Actions runner.
      #
      # ======================================================

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ======================================================
      # STEP 2
      # CONFIGURE AWS CREDENTIALS
      # ======================================================
      #
      # Required GitHub Secrets:
      #
      # AWS_ACCESS_KEY_ID
      # AWS_SECRET_ACCESS_KEY
      #
      # IMPORTANT:
      #
      # DB_MASTER_PASSWORD is NOT required.
      #
      # RDS should manage its password through Secrets Manager.
      #
      # ======================================================

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: ${{ env.AWS_REGION }}


      # ======================================================
      # STEP 3
      # VERIFY AWS CLI
      # ======================================================
      #
      # Confirms:
      #
      # 1. AWS CLI exists
      # 2. Credentials are valid
      # 3. Correct AWS account is being used
      #
      # ======================================================

      - name: Verify AWS CLI

        shell: bash

        run: |

          echo "=============================================="
          echo "AWS CLI INFORMATION"
          echo "=============================================="

          aws --version

          echo ""

          echo "=============================================="
          echo "AWS ACCOUNT INFORMATION"
          echo "=============================================="

          aws sts get-caller-identity \
            --no-cli-pager

          echo ""

          echo "AWS authentication successful."


      # ======================================================
      # STEP 4
      # SETUP TERRAFORM
      # ======================================================
      #
      # Installs the requested Terraform version.
      #
      # ======================================================

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

        with:

          terraform_version: ${{ env.TERRAFORM_VERSION }}


      # ======================================================
      # STEP 5
      # VERIFY TERRAFORM
      # ======================================================

      - name: Verify Terraform

        shell: bash

        run: |

          echo "=============================================="
          echo "TERRAFORM VERSION"
          echo "=============================================="

          terraform version

          echo ""

          echo "Terraform installation successful."


      # ======================================================
      # STEP 6
      # CHECK TERRAFORM FILES
      # ======================================================
      #
      # This verifies that the Terraform directory exists.
      #
      # Expected files may include:
      #
      # main.tf
      # variables.tf
      # outputs.tf
      # providers.tf
      # versions.tf
      #
      # ======================================================

      - name: Check Terraform Files

        shell: bash

        run: |

          echo "=============================================="
          echo "CHECKING TERRAFORM FILES"
          echo "=============================================="

          if [ ! -d "$TERRAFORM_DIR" ]; then

            echo "ERROR: Terraform directory does not exist."

            echo "Expected:"
            echo "$TERRAFORM_DIR"

            exit 1

          fi


          echo ""

          echo "Terraform directory found:"

          echo "$TERRAFORM_DIR"

          echo ""

          echo "Terraform files:"

          find "$TERRAFORM_DIR" \
            -maxdepth 2 \
            -type f \
            -name "*.tf" \
            -print


          echo ""

          # --------------------------------------------------
          # Verify at least one Terraform configuration file.
          # --------------------------------------------------

          TF_FILE_COUNT=$(find "$TERRAFORM_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.tf" \
            | wc -l)


          if [ "$TF_FILE_COUNT" -eq 0 ]; then

            echo "ERROR: No Terraform .tf files were found."

            exit 1

          fi


          echo ""

          echo "Terraform configuration files found:"
          echo "$TF_FILE_COUNT"


      # ======================================================
      # STEP 7
      # TERRAFORM INIT
      # ======================================================
      #
      # Initializes:
      #
      # - Terraform providers
      # - Terraform modules
      # - Terraform backend
      #
      # ======================================================

      - name: Terraform Init

        shell: bash

        working-directory: ${{ env.TERRAFORM_DIR }}

        run: |

          echo "=============================================="
          echo "TERRAFORM INIT"
          echo "=============================================="

          terraform init \
            -input=false

          echo ""

          echo "Terraform initialization completed successfully."


      # ======================================================
      # STEP 8
      # TERRAFORM FORMAT CHECK
      # ======================================================
      #
      # Checks whether Terraform files follow standard
      # Terraform formatting.
      #
      # This does NOT modify files.
      #
      # ======================================================

      - name: Terraform Format Check

        shell: bash

        working-directory: ${{ env.TERRAFORM_DIR }}

        run: |

          echo "=============================================="
          echo "TERRAFORM FORMAT CHECK"
          echo "=============================================="

          terraform fmt \
            -check \
            -recursive

          echo ""

          echo "Terraform formatting check passed."


      # ======================================================
      # STEP 9
      # TERRAFORM VALIDATE
      # ======================================================
      #
      # Validates Terraform configuration syntax and
      # configuration consistency.
      #
      # ======================================================

      - name: Terraform Validate

        shell: bash

        working-directory: ${{ env.TERRAFORM_DIR }}

        run: |

          echo "=============================================="
          echo "TERRAFORM VALIDATE"
          echo "=============================================="

          terraform validate

          echo ""

          echo "Terraform validation completed successfully."


      # ======================================================
      # STEP 10
      # DISPLAY TERRAFORM CONFIGURATION
      # ======================================================
      #
      # This is a debugging/learning step.
      #
      # Sensitive values should NEVER be printed here.
      #
      # ======================================================

      - name: Display Terraform Environment

        shell: bash

        run: |

          echo "=============================================="
          echo "TERRAFORM DEPLOYMENT ENVIRONMENT"
          echo "=============================================="

          echo ""

          echo "AWS Region:"
          echo "$AWS_REGION"

          echo ""

          echo "Terraform Directory:"
          echo "$TERRAFORM_DIR"

          echo ""

          echo "Terraform Version:"
          terraform version

          echo ""

          echo "EC2 Key Pair:"
          echo "$KEY_PAIR_NAME"

          echo ""

          echo "RDS Password Management:"
          echo "AWS Secrets Manager"

          echo ""

          echo "IMPORTANT:"
          echo "RDS password is NOT stored in GitHub Actions."

          echo ""

          echo "=============================================="
          echo "END TERRAFORM ENVIRONMENT"
          echo "=============================================="


      # ======================================================
      # STEP 11
      # TERRAFORM PLAN
      # ======================================================
      #
      # Creates an execution plan.
      #
      # IMPORTANT:
      #
      # The plan is NOT the deployment.
      #
      # It shows what Terraform intends to:
      #
      # - create
      # - update
      # - destroy
      #
      # Important Note : 
      #
      # GitHub Secret then : TF_VAR_key_pair_name: ${{ secrets.KEY_PAIR_NAME }} 
      #
      # Github global environment variable: TF_VAR_key_pair_name: ${{ env.KEY_PAIR_NAME }}
      #
      # ======================================================

      - name: Terraform Plan

        shell: bash

        working-directory: ${{ env.TERRAFORM_DIR }}

        env:

          TF_VAR_key_pair_name: ${{ env.KEY_PAIR_NAME }}

        run: |

          echo "=============================================="
          echo "TERRAFORM PLAN"
          echo "=============================================="

          if [ -z "$TF_VAR_key_pair_name" ]; then
            echo "ERROR: KEY_PAIR_NAME is empty."
            exit 1
          fi

          echo "EC2 Key Pair variable is configured."  

          terraform plan \
            -input=false \
            -out=tfplan

          echo ""

          echo "Terraform plan completed successfully."


      # ======================================================
      # STEP 12
      # TERRAFORM APPLY
      # ======================================================
      #
      # Applies the exact plan generated above.
      #
      # This is equivalent to the actual CloudFormation
      # create/update deployment operation.
      #
      # Terraform automatically determines whether resources
      # need to be:
      #
      # - created
      # - updated
      # - replaced
      # - destroyed
      #
      # ======================================================

      - name: Terraform Apply

        shell: bash

        working-directory: ${{ env.TERRAFORM_DIR }}

        run: |

          echo "=============================================="
          echo "TERRAFORM APPLY"
          echo "=============================================="

          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

          echo ""

          echo "=============================================="
          echo "TERRAFORM APPLY COMPLETED"
          echo "=============================================="


      # ======================================================
      # STEP 13
      # DISPLAY TERRAFORM OUTPUTS
      # ======================================================
      #
      # Displays Terraform outputs.
      #
      # IMPORTANT:
      #
      # Do NOT create outputs that contain:
      #
      # - DB passwords
      # - secret values
      # - access keys
      # - private credentials
      #
      # Safe outputs include:
      #
      # - VPC ID
      # - subnet IDs
      # - security group IDs
      # - EC2 instance ID
      # - EC2 public IP
      # - S3 bucket
      # - RDS endpoint
      # - RDS secret ARN
      #
      # ======================================================

      - name: Display Terraform Outputs

        shell: bash

        working-directory: ${{ env.TERRAFORM_DIR }}

        run: |

          echo "=============================================="
          echo "TERRAFORM OUTPUTS"
          echo "=============================================="

          terraform output

          echo ""

          echo "Terraform outputs displayed."


      # ======================================================
      # STEP 14
      # VERIFY AWS RESOURCES
      # ======================================================
      #
      # Terraform is the source of truth for infrastructure.
      #
      # This step performs additional read-only AWS checks.
      #
      # ======================================================

      - name: Verify AWS Infrastructure

        shell: bash

        working-directory: ${{ env.TERRAFORM_DIR }}

        run: |

          echo "=============================================="
          echo "AWS INFRASTRUCTURE VERIFICATION"
          echo "=============================================="

          echo ""

          echo "Terraform-managed AWS resources:"

          terraform state list || true

          echo ""

          echo "AWS identity:"

          aws sts get-caller-identity \
            --no-cli-pager

          echo ""

          echo "AWS infrastructure verification completed."


      # ======================================================
      # STEP 15
      # TERRAFORM STATE SUMMARY
      # ======================================================
      #
      # Displays the Terraform state resources.
      #
      # This is useful for debugging the deployment.
      #
      # ======================================================

      - name: Display Terraform State

        shell: bash

        working-directory: ${{ env.TERRAFORM_DIR }}

        run: |

          echo "=============================================="
          echo "TERRAFORM STATE RESOURCES"
          echo "=============================================="

          terraform state list || true

          echo ""

          echo "Terraform state inspection completed."


      # ======================================================
      # STEP 16
      # TERRAFORM DEPLOYMENT COMPLETE
      # ======================================================

      - name: Terraform Deployment Complete

        shell: bash

        run: |

          echo ""

          echo "=============================================="
          echo "TERRAFORM DEPLOYMENT COMPLETED"
          echo "=============================================="

          echo ""

          echo "AWS Region:"
          echo "$AWS_REGION"

          echo ""

          echo "Terraform Directory:"
          echo "$TERRAFORM_DIR"

          echo ""

          echo "Infrastructure deployment:"
          echo "SUCCESS"

          echo ""

          echo "RDS Password Management:"
          echo "AWS Secrets Manager"

          echo ""

          echo "The RDS master password was NOT stored"
          echo "in GitHub Actions."

          echo ""

          echo "=============================================="
          echo "TERRAFORM STAGE COMPLETE"
          echo "=============================================="


  # ==========================================================
  # JOB 2
  # DOCKER BUILD AND TEST
  # ==========================================================
  #
  # This job runs only after Terraform succeeds.
  #
  # Pipeline:
  #
  # Terraform
  #    |
  #    v
  # AWS Infrastructure
  #    |
  #    v
  # Docker Build
  #
  # ==========================================================

  docker:

    name: Build and Test Docker

    needs:
      - terraform

    runs-on: ubuntu-latest


    # ========================================================
    # DOCKER STEPS
    # ========================================================

    steps:


      # ======================================================
      # DOCKER STEP 1
      # CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ======================================================
      # DOCKER STEP 2
      # VERIFY DOCKER
      # ======================================================

      - name: Verify Docker

        shell: bash

        run: |

          echo "=============================================="
          echo "DOCKER VERSION"
          echo "=============================================="

          docker --version

          echo ""

          echo "=============================================="
          echo "DOCKER COMPOSE VERSION"
          echo "=============================================="

          docker compose version


      # ======================================================
      # DOCKER STEP 3
      # CHECK DOCKER FILES
      # ======================================================

      - name: Check Docker Files

        shell: bash

        run: |

          echo "=============================================="
          echo "CHECKING DOCKER FILES"
          echo "=============================================="

          echo ""

          if [ ! -f "docker/Dockerfile" ]; then

            echo "ERROR: Dockerfile was not found."

            echo "Expected:"
            echo "docker/Dockerfile"

            exit 1

          fi


          echo "Dockerfile found:"
          echo "docker/Dockerfile"

          echo ""


          if [ ! -f "docker-compose.yml" ]; then

            echo "ERROR: docker-compose.yml was not found."

            echo "Expected:"
            echo "docker-compose.yml"

            exit 1

          fi


          echo "docker-compose.yml found."

          echo ""

          echo "Docker files are ready."


      # ======================================================
      # DOCKER STEP 4
      # VALIDATE DOCKER COMPOSE
      # ======================================================

      - name: Validate Docker Compose

        shell: bash

        run: |

          echo "=============================================="
          echo "VALIDATING DOCKER COMPOSE"
          echo "=============================================="

          docker compose config

          echo ""

          echo "Docker Compose configuration is valid."


      # ======================================================
      # DOCKER STEP 5
      # BUILD DOCKER IMAGE
      # ======================================================

      - name: Build Docker Image

        shell: bash

        run: |

          echo "=============================================="
          echo "BUILDING DOCKER IMAGE"
          echo "=============================================="

          docker compose build

          echo ""

          echo "Docker image build completed."


      # ======================================================
      # DOCKER STEP 6
      # VERIFY DOCKER IMAGE
      # ======================================================

      - name: Verify Docker Image

        shell: bash

        run: |

          echo "=============================================="
          echo "DOCKER IMAGES"
          echo "=============================================="

          docker images

          echo ""

          echo "Docker image verification completed."


      # ======================================================
      # DOCKER STEP 7
      # START CONTAINER
      # ======================================================

      - name: Start Docker Container

        shell: bash

        run: |

          echo "=============================================="
          echo "STARTING DOCKER CONTAINER"
          echo "=============================================="

          docker compose up -d

          echo ""

          echo "=============================================="
          echo "DOCKER COMPOSE STATUS"
          echo "=============================================="

          docker compose ps -a

          echo ""

          echo "=============================================="
          echo "DOCKER CONTAINER STATUS"
          echo "=============================================="

          docker ps -a


      # ======================================================
      # DOCKER STEP 8
      # CHECK CONTAINER
      # ======================================================

      - name: Check Docker Container

        shell: bash

        run: |

          echo "=============================================="
          echo "CHECKING DOCKER CONTAINER"
          echo "=============================================="

          echo ""

          docker compose ps -a

          echo ""


          CONTAINER_ID=$(docker compose ps -q)


          if [ -z "$CONTAINER_ID" ]; then

            echo "ERROR: Docker Compose did not create a container."

            echo ""

            docker compose ps -a

            echo ""

            docker ps -a

            exit 1

          fi


          echo "Container ID:"
          echo "$CONTAINER_ID"

          echo ""


          CONTAINER_STATUS=$(docker inspect \
            --format='{{.State.Status}}' \
            "$CONTAINER_ID")


          echo "Container status:"
          echo "$CONTAINER_STATUS"

          echo ""


          if [ "$CONTAINER_STATUS" = "running" ]; then

            echo "Docker container is running."

          else

            echo "ERROR: Docker container is not running."

            echo ""

            echo "=============================================="
            echo "CONTAINER LOGS"
            echo "=============================================="

            docker logs "$CONTAINER_ID" || true

            echo ""

            echo "=============================================="
            echo "CONTAINER INSPECTION"
            echo "=============================================="

            docker inspect "$CONTAINER_ID"

            exit 1

          fi


      # ======================================================
      # DOCKER STEP 9
      # WAIT FOR APPLICATION
      # ======================================================

      - name: Wait for Application

        shell: bash

        run: |

          echo "=============================================="
          echo "WAITING FOR APPLICATION"
          echo "=============================================="

          sleep 5

          echo ""

          echo "Application startup wait completed."


      # ======================================================
      # DOCKER STEP 10
      # TEST APPLICATION
      # ======================================================
      #
      # Expected:
      #
      # Host port:      8080
      # Container port: 80
      #
      # ======================================================

      - name: Test Docker Container

        shell: bash

        run: |

          echo "=============================================="
          echo "TESTING DOCKER APPLICATION"
          echo "=============================================="

          echo ""

          echo "Testing:"
          echo "http://localhost:8080"

          echo ""

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            http://localhost:8080

          echo ""

          echo "=============================================="
          echo "DOCKER CONTAINER TEST PASSED"
          echo "=============================================="


      # ======================================================
      # DOCKER STEP 11
      # DISPLAY CONTAINER LOGS
      # ======================================================

      - name: Display Container Logs

        if: always()

        shell: bash

        run: |

          echo "=============================================="
          echo "DOCKER CONTAINER LOGS"
          echo "=============================================="

          docker compose logs \
            --no-color || true


      # ======================================================
      # DOCKER STEP 12
      # DISPLAY FINAL DOCKER STATUS
      # ======================================================

      - name: Display Final Docker Status

        if: always()

        shell: bash

        run: |

          echo "=============================================="
          echo "FINAL DOCKER STATUS"
          echo "=============================================="

          docker compose ps -a || true

          echo ""

          docker ps -a || true

          echo ""

          docker images || true


      # ======================================================
      # DOCKER STEP 13
      # CLEANUP
      # ======================================================

      - name: Stop Docker Container

        if: always()

        shell: bash

        run: |

          echo "=============================================="
          echo "STOPPING DOCKER CONTAINER"
          echo "=============================================="

          docker compose down \
            --remove-orphans || true

          echo ""

          echo "Docker resources cleaned up."


      # ======================================================
      # DOCKER STEP 14
      # DOCKER JOB COMPLETE
      # ======================================================

      - name: Docker Job Complete

        shell: bash

        run: |

          echo ""

          echo "=============================================="
          echo "DOCKER BUILD AND TEST COMPLETED"
          echo "=============================================="

          echo ""

          echo "Docker build:"
          echo "SUCCESS"

          echo ""

          echo "Docker container:"
          echo "STARTED"

          echo ""

          echo "Docker HTTP test:"
          echo "PASSED"

          echo ""

          echo "Docker job completed successfully."

          echo "=============================================="


  # ==========================================================
  # JOB 3
  # ECS DEPLOYMENT
  # ==========================================================
  #
  # This job runs after:
  #
  # Terraform
  #     |
  #     v
  # Docker
  #
  # Then:
  #
  # Docker
  #     |
  #     v
  # ECR
  #     |
  #     v
  # ECS
  #
  # ==========================================================

  ecs-deploy:

    name: Trigger ECS Deployment

    needs:
      - docker


    # ========================================================
    # CALL REUSABLE ECS WORKFLOW
    # ========================================================
    #
    # IMPORTANT:
    #
    # The referenced workflow must contain:
    #
    # on:
    #   workflow_call:
    #
    # Example:
    #
    # .github/workflows/aws-cloudformation-ecs-deploy.yml
    #
    # can be replaced with your Terraform ECS workflow, for
    # example:
    #
    # .github/workflows/aws-terraform-ecs-deploy.yml
    #
    # ========================================================

    uses: ./.github/workflows/aws-terraform-ecs-deploy.yml


    # ========================================================
    # PASS GITHUB SECRETS
    # ========================================================
    #
    # This allows the reusable ECS workflow to access:
    #
    # AWS_ACCESS_KEY_ID
    # AWS_SECRET_ACCESS_KEY
    # AWS_REGION
    #
    # ========================================================

    secrets: inherit
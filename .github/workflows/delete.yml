# ==========================================================
# AWS CloudFormation DevOps Lab
# GitHub Actions - COMPLETE DELETE WORKFLOW
# ==========================================================
#
# File:
#   .github/workflows/delete.yml
#
# Purpose:
# ----------------------------------------------------------
# This workflow completely removes the Lab01 CloudFormation
# environment and its resources.
#
# The workflow is designed for a LEARNING LAB.
#
# It performs:
#
# 1. Checkout repository
# 2. Configure AWS credentials
# 3. Verify AWS CLI
# 4. Check whether the CloudFormation stack exists
# 5. Check termination protection
# 6. Find the RDS nested stack
# 7. Find the RDS database instance
# 8. Disable RDS deletion protection
# 9. Delete RDS WITHOUT a final snapshot
# 10. Delete RDS automated backups
# 11. Wait for RDS deletion
# 12. Delete the root CloudFormation stack
# 13. Wait for CloudFormation deletion
# 14. If DELETE_FAILED occurs, retry with FORCE_DELETE_STACK
# 15. Verify the root stack no longer exists
# 16. Display final result
#
# ==========================================================


# ----------------------------------------------------------
# Workflow Name
# ----------------------------------------------------------

name: Delete AWS CloudFormation Stack


# ----------------------------------------------------------
# Trigger
# ----------------------------------------------------------
#
# The workflow is manually started from GitHub Actions.
#
# ----------------------------------------------------------

on:

  workflow_dispatch:


# ----------------------------------------------------------
# Global Environment Variables
# ----------------------------------------------------------

env:

  AWS_REGION: us-east-1

  STACK_NAME: Lab01-CloudFormation


# ==========================================================
# JOB
# ==========================================================

jobs:

  delete-stack:

    # ------------------------------------------------------
    # GitHub-hosted Linux runner
    # ------------------------------------------------------

    runs-on: ubuntu-latest

    name: Complete CloudFormation Cleanup


    # ======================================================
    # STEPS
    # ======================================================

    steps:


    # ======================================================
    # STEP 1
    # Checkout Repository
    # ======================================================

    - name: Checkout Repository

      uses: actions/checkout@v4


    # ======================================================
    # STEP 2
    # Configure AWS Credentials
    # ======================================================

    - name: Configure AWS Credentials

      uses: aws-actions/configure-aws-credentials@v4

      with:

        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

        aws-region: ${{ env.AWS_REGION }}


    # ======================================================
    # STEP 3
    # Verify AWS CLI
    # ======================================================

    - name: Verify AWS CLI

      shell: bash

      run: |

        echo "=============================================="
        echo "AWS CLI"
        echo "=============================================="

        aws --version

        echo ""

        echo "AWS Account:"

        aws sts get-caller-identity


    # ======================================================
    # STEP 4
    # Check Whether Root Stack Exists
    # ======================================================

    - name: Check CloudFormation Stack

      id: stack

      shell: bash

      run: |

        echo "=============================================="
        echo "Checking CloudFormation Stack"
        echo "=============================================="

        if aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          > /dev/null 2>&1

        then

          echo "exists=true" >> "$GITHUB_OUTPUT"

          echo ""
          echo "CloudFormation stack exists."

        else

          echo "exists=false" >> "$GITHUB_OUTPUT"

          echo ""
          echo "CloudFormation stack does not exist."

        fi


    # ======================================================
    # STEP 5
    # Display Current Stack Status
    # ======================================================

    - name: Display Stack Status

      if: steps.stack.outputs.exists == 'true'

      shell: bash

      run: |

        echo "=============================================="
        echo "Current CloudFormation Stack"
        echo "=============================================="

        aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "Stacks[0].[StackName,StackStatus,EnableTerminationProtection]" \
          --output table


    # ======================================================
    # STEP 6
    # Disable Termination Protection
    # ======================================================
    #
    # If termination protection is enabled, CloudFormation
    # will refuse to delete the stack.
    #
    # We therefore disable it before starting cleanup.
    #
    # AWS requires permission:
    #
    # cloudformation:UpdateTerminationProtection
    #
    # ======================================================

    - name: Disable Termination Protection

      if: steps.stack.outputs.exists == 'true'

      shell: bash

      run: |

        echo "=============================================="
        echo "Checking Termination Protection"
        echo "=============================================="

        TERMINATION_PROTECTION=$(aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "Stacks[0].EnableTerminationProtection" \
          --output text)

        echo "Termination Protection: $TERMINATION_PROTECTION"

        if [ "$TERMINATION_PROTECTION" = "True" ]

        then

          echo ""
          echo "Termination protection is ENABLED."
          echo "Disabling termination protection..."

          aws cloudformation update-termination-protection \
            --stack-name "$STACK_NAME" \
            --no-enable-termination-protection \
            --region "$AWS_REGION"

          echo ""
          echo "Termination protection disabled."

        else

          echo ""
          echo "Termination protection is already disabled."

        fi


    # ======================================================
    # STEP 7
    # Find RDS Nested Stack
    # ======================================================

    - name: Find RDS Nested Stack

      if: steps.stack.outputs.exists == 'true'

      id: rds_nested

      shell: bash

      run: |

        echo "=============================================="
        echo "Finding RDS Nested Stack"
        echo "=============================================="

        RDS_NESTED_STACK=$(aws cloudformation list-stack-resources \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "StackResourceSummaries[?LogicalResourceId=='RDSNestedStack'].PhysicalResourceId | [0]" \
          --output text)

        echo "RDS Nested Stack:"
        echo "$RDS_NESTED_STACK"

        if [ "$RDS_NESTED_STACK" = "None" ] || [ -z "$RDS_NESTED_STACK" ]

        then

          echo "rds_nested_exists=false" >> "$GITHUB_OUTPUT"

          echo ""
          echo "RDS nested stack was not found."

        else

          echo "rds_nested_exists=true" >> "$GITHUB_OUTPUT"

          echo "rds_nested_stack=$RDS_NESTED_STACK" >> "$GITHUB_OUTPUT"

          echo ""
          echo "RDS nested stack found."

        fi


    # ======================================================
    # STEP 8
    # Find RDS Database
    # ======================================================
    #
    # The RDS database is inside the nested stack.
    #
    # We retrieve the physical DB identifier so that we can
    # explicitly delete it before deleting the parent stack.
    #
    # ======================================================

    - name: Find RDS Database

      if: steps.rds_nested.outputs.rds_nested_exists == 'true'

      id: rds

      shell: bash

      run: |

        echo "=============================================="
        echo "Finding RDS Database"
        echo "=============================================="

        RDS_STACK="${{ steps.rds_nested.outputs.rds_nested_stack }}"

        RDS_DB_ID=$(aws cloudformation list-stack-resources \
          --stack-name "$RDS_STACK" \
          --region "$AWS_REGION" \
          --query "StackResourceSummaries[?LogicalResourceId=='RDSDatabase'].PhysicalResourceId | [0]" \
          --output text)

        echo "RDS Database ID:"
        echo "$RDS_DB_ID"

        if [ "$RDS_DB_ID" = "None" ] || [ -z "$RDS_DB_ID" ]

        then

          echo "rds_exists=false" >> "$GITHUB_OUTPUT"

          echo ""
          echo "RDS database was not found."

        else

          echo "rds_exists=true" >> "$GITHUB_OUTPUT"

          echo "rds_db_id=$RDS_DB_ID" >> "$GITHUB_OUTPUT"

          echo ""
          echo "RDS database found."

        fi


    # ======================================================
    # STEP 9
    # Display RDS Information
    # ======================================================

    - name: Display RDS Information

      if: steps.rds.outputs.rds_exists == 'true'

      shell: bash

      run: |

        echo "=============================================="
        echo "RDS Database Information"
        echo "=============================================="

        RDS_DB_ID="${{ steps.rds.outputs.rds_db_id }}"

        aws rds describe-db-instances \
          --db-instance-identifier "$RDS_DB_ID" \
          --region "$AWS_REGION" \
          --query "DBInstances[0].[DBInstanceIdentifier,DBInstanceStatus,DeletionProtection,Engine]" \
          --output table


    # ======================================================
    # STEP 10
    # Disable RDS Deletion Protection
    # ======================================================
    #
    # If deletion protection is enabled, RDS will refuse
    # deletion.
    #
    # ======================================================

    - name: Disable RDS Deletion Protection

      if: steps.rds.outputs.rds_exists == 'true'

      shell: bash

      run: |

        echo "=============================================="
        echo "Disabling RDS Deletion Protection"
        echo "=============================================="

        RDS_DB_ID="${{ steps.rds.outputs.rds_db_id }}"

        DELETION_PROTECTION=$(aws rds describe-db-instances \
          --db-instance-identifier "$RDS_DB_ID" \
          --region "$AWS_REGION" \
          --query "DBInstances[0].DeletionProtection" \
          --output text)

        echo "Deletion Protection: $DELETION_PROTECTION"

        if [ "$DELETION_PROTECTION" = "True" ]

        then

          echo ""
          echo "RDS deletion protection is ENABLED."

          aws rds modify-db-instance \
            --db-instance-identifier "$RDS_DB_ID" \
            --no-deletion-protection \
            --apply-immediately \
            --region "$AWS_REGION"

          echo ""
          echo "RDS deletion protection disable request sent."

          echo ""
          echo "Waiting for RDS modification..."

          aws rds wait db-instance-available \
            --db-instance-identifier "$RDS_DB_ID" \
            --region "$AWS_REGION"

          echo ""
          echo "RDS modification completed."

        else

          echo ""
          echo "RDS deletion protection is already disabled."

        fi


    # ======================================================
    # STEP 11
    # Delete RDS Database
    # ======================================================
    #
    # IMPORTANT:
    #
    # --skip-final-snapshot
    #
    # means AWS will NOT create a final snapshot.
    #
    # --delete-automated-backups
    #
    # tells RDS to remove automated backups.
    #
    # This is intended for this disposable learning lab.
    #
    # ======================================================

    - name: Delete RDS Database

      if: steps.rds.outputs.rds_exists == 'true'

      shell: bash

      run: |

        echo "=============================================="
        echo "Deleting RDS Database"
        echo "=============================================="

        RDS_DB_ID="${{ steps.rds.outputs.rds_db_id }}"

        echo ""
        echo "Database:"
        echo "$RDS_DB_ID"

        echo ""
        echo "Final Snapshot: SKIPPED"

        echo "Automated Backups: DELETED"

        echo ""

        aws rds delete-db-instance \
          --db-instance-identifier "$RDS_DB_ID" \
          --skip-final-snapshot \
          --delete-automated-backups \
          --region "$AWS_REGION"

        echo ""
        echo "RDS deletion request submitted."


    # ======================================================
    # STEP 12
    # Wait for RDS Deletion
    # ======================================================
    #
    # RDS deletion can still take several minutes.
    #
    # This is the correct place to wait for RDS.
    #
    # ======================================================

    - name: Wait for RDS Deletion

      if: steps.rds.outputs.rds_exists == 'true'

      shell: bash

      run: |

        echo "=============================================="
        echo "Waiting for RDS Deletion"
        echo "=============================================="

        RDS_DB_ID="${{ steps.rds.outputs.rds_db_id }}"

        aws rds wait db-instance-deleted \
          --db-instance-identifier "$RDS_DB_ID" \
          --region "$AWS_REGION"

        echo ""
        echo "RDS database has been deleted."


    # ======================================================
    # STEP 13
    # Delete Root CloudFormation Stack
    # ======================================================
    #
    # Now that RDS has already been removed, CloudFormation
    # should be able to remove the nested RDS stack and then
    # the root stack.
    #
    # ======================================================

    - name: Delete Root CloudFormation Stack

      if: steps.stack.outputs.exists == 'true'

      shell: bash

      run: |

        echo "=============================================="
        echo "Deleting Root CloudFormation Stack"
        echo "=============================================="

        echo "Stack Name : $STACK_NAME"
        echo "Region     : $AWS_REGION"

        echo ""

        aws cloudformation delete-stack \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION"

        echo ""
        echo "CloudFormation deletion request submitted."


    # ======================================================
    # STEP 14
    # Wait for CloudFormation Deletion
    # ======================================================

    - name: Wait for CloudFormation Deletion

      if: steps.stack.outputs.exists == 'true'

      id: cfn_wait

      continue-on-error: true

      shell: bash

      run: |

        echo "=============================================="
        echo "Waiting for CloudFormation Deletion"
        echo "=============================================="

        aws cloudformation wait stack-delete-complete \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION"

        echo ""
        echo "CloudFormation deletion completed."


    # ======================================================
    # STEP 15
    # Show CloudFormation Delete Failures
    # ======================================================
    #
    # If normal deletion failed, display the exact reason.
    #
    # ======================================================

    - name: Show Delete Failures

      if: steps.stack.outputs.exists == 'true' && steps.cfn_wait.outcome == 'failure'

      shell: bash

      run: |

        echo "=============================================="
        echo "CloudFormation Delete Failure Details"
        echo "=============================================="

        aws cloudformation describe-stack-events \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "StackEvents[?ResourceStatus=='DELETE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]" \
          --output table || true


    # ======================================================
    # STEP 16
    # Force Delete Stuck CloudFormation Stack
    # ======================================================
    #
    # If the stack reaches DELETE_FAILED, retry deletion
    # using CloudFormation's FORCE_DELETE_STACK mode.
    #
    # This is useful when a resource could not be removed
    # during the normal deletion process.
    #
    # ======================================================

    - name: Force Delete Failed CloudFormation Stack

      if: steps.stack.outputs.exists == 'true' && steps.cfn_wait.outcome == 'failure'

      shell: bash

      run: |

        echo "=============================================="
        echo "FORCE DELETING CloudFormation Stack"
        echo "=============================================="

        echo ""
        echo "Normal CloudFormation deletion did not complete."
        echo ""
        echo "Attempting FORCE_DELETE_STACK..."
        echo ""

        aws cloudformation delete-stack \
          --stack-name "$STACK_NAME" \
          --deletion-mode FORCE_DELETE_STACK \
          --region "$AWS_REGION"

        echo ""
        echo "Force deletion request submitted."


    # ======================================================
    # STEP 17
    # Wait for Force Deletion
    # ======================================================

    - name: Wait for Force Deletion

      if: steps.stack.outputs.exists == 'true' && steps.cfn_wait.outcome == 'failure'

      shell: bash

      run: |

        echo "=============================================="
        echo "Waiting for Force Deletion"
        echo "=============================================="

        aws cloudformation wait stack-delete-complete \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION"

        echo ""
        echo "Force deletion completed."


    # ======================================================
    # STEP 18
    # Verify Root Stack Is Deleted
    # ======================================================

    - name: Verify CloudFormation Stack Deletion

      if: steps.stack.outputs.exists == 'true'

      shell: bash

      run: |

        echo "=============================================="
        echo "Verifying CloudFormation Stack"
        echo "=============================================="

        if aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          > /dev/null 2>&1

        then

          echo ""
          echo "ERROR:"
          echo "CloudFormation stack still exists."

          echo ""
          echo "Current stack status:"

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].[StackName,StackStatus,StackStatusReason]" \
            --output table

          exit 1

        else

          echo ""
          echo "CloudFormation stack no longer exists."

        fi


    # ======================================================
    # STEP 19
    # Check Remaining RDS Instances
    # ======================================================

    - name: Check Remaining RDS Instances

      shell: bash

      run: |

        echo "=============================================="
        echo "Checking Remaining RDS Instances"
        echo "=============================================="

        REMAINING_RDS=$(aws rds describe-db-instances \
          --region "$AWS_REGION" \
          --query "DBInstances[*].[DBInstanceIdentifier,DBInstanceStatus]" \
          --output text)

        if [ -z "$REMAINING_RDS" ]

        then

          echo ""
          echo "No RDS DB instances remain."

        else

          echo ""
          echo "RDS instances currently present:"
          echo "$REMAINING_RDS"

        fi


    # ======================================================
    # STEP 20
    Final Success Message
    # ======================================================

    - name: Cleanup Complete

      shell: bash

      run: |

        echo ""
        echo "=================================================="
        echo "AWS CLOUDFORMATION LAB CLEANUP COMPLETE"
        echo "=================================================="
        echo ""
        echo "Root Stack:"
        echo "  $STACK_NAME"
        echo ""
        echo "Region:"
        echo "  $AWS_REGION"
        echo ""
        echo "RDS:"
        echo "  Deleted without final snapshot"
        echo ""
        echo "CloudFormation:"
        echo "  Root stack deleted"
        echo ""
        echo "=================================================="
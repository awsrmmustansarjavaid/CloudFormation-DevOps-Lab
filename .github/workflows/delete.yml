# ==========================================================
# AWS CloudFormation DevOps Lab
# GitHub Actions - Complete Stack Delete Workflow
# ==========================================================
#
# File:
#   .github/workflows/delete.yml
#
# Purpose:
# ----------------------------------------------------------
# Completely deletes the AWS CloudFormation DevOps Lab.
#
# This workflow handles:
#
#   1. Root CloudFormation stack discovery
#   2. Root stack resource inspection
#   3. RDS nested-stack discovery
#   4. RDS database discovery
#   5. RDS deletion protection
#   6. ECS service cleanup
#   7. ECS task shutdown
#   8. ECR image cleanup
#   9. Root CloudFormation deletion
#  10. DELETE_FAILED recovery
#  11. RDS recovery
#  12. FORCE_DELETE_STACK recovery
#  13. Template Bucket stack discovery
#  14. Versioned S3 bucket cleanup
#  15. S3 delete-marker cleanup
#  16. Template Bucket stack deletion
#  17. Final CloudFormation verification
#  18. Final AWS resource verification
#
# ==========================================================
#
# ROOT CLOUDFORMATION ARCHITECTURE
# ==========================================================
#
#   Lab01-CloudFormation
#          |
#          +---- EC2WebServerStack
#          |
#          +---- S3NestedStack
#          |
#          +---- RDSNestedStack
#          |          |
#          |          +---- RDSDatabase
#          |          +---- RDSSecurityGroup
#          |          +---- RDSSubnetGroup
#          |
#          +---- ECSStack
#                     |
#                     +---- ECR Repository
#                     +---- ECS Cluster
#                     +---- ECS Service
#                     +---- ECS Task Definition
#                     +---- ECS IAM Roles
#                     +---- ALB
#                     +---- Target Group
#                     +---- Listener
#
# ==========================================================
#
# SEPARATE CLOUDFORMATION STACK
# ==========================================================
#
#   Lab01-CloudFormation-TemplateBucket
#          |
#          +---- TemplateBucket
#
# IMPORTANT:
# ----------------------------------------------------------
#
# Lab01-CloudFormation-TemplateBucket is a SEPARATE stack.
#
# It is NOT a nested stack of:
#
#   Lab01-CloudFormation
#
# Therefore deleting:
#
#   Lab01-CloudFormation
#
# does NOT automatically delete:
#
#   Lab01-CloudFormation-TemplateBucket
#
# ==========================================================
#
# DELETION STRATEGY
# ==========================================================
#
# The workflow follows this order:
#
#   1. Configure AWS credentials
#   2. Check root stack
#   3. Inspect root stack
#   4. Discover RDS nested stack
#   5. Discover RDS database
#   6. Check RDS deletion protection
#   7. Discover ECS resources
#   8. Stop ECS service tasks
#   9. Wait for ECS tasks to stop
#  10. Discover ECR repository
#  11. Empty ECR repository
#  12. Verify ECR repository is empty
#  13. Start root stack deletion
#  14. Wait for normal deletion
#  15. Display DELETE_FAILED resources if required
#  16. Attempt direct RDS cleanup if required
#  17. Wait for RDS deletion if required
#  18. Force delete root stack if required
#  19. Wait for final root deletion
#  20. Verify root stack deletion
#  21. Check Template Bucket stack
#  22. Display Template Bucket resources
#  23. Discover Template S3 bucket
#  24. Empty versioned Template S3 bucket
#  25. Verify Template S3 bucket is empty
#  26. Get Template Bucket stack status
#  27. Delete Template Bucket stack
#  28. Wait for Template Bucket deletion
#  29. Verify Template Bucket stack deletion
#  30. Verify RDS cleanup
#  31. Perform final AWS resource check
#  32. Display final cleanup summary
#
# ==========================================================
#
# IMPORTANT S3 VERSIONING INFORMATION
# ==========================================================
#
# A command such as:
#
#   aws s3 rm s3://bucket --recursive
#
# is NOT sufficient for a versioned S3 bucket.
#
# A versioned bucket can still contain:
#
#   - Object versions
#   - Delete markers
#
# CloudFormation can therefore fail with:
#
#   The bucket you tried to delete is not empty.
#
# This workflow explicitly deletes:
#
#   - All object versions
#   - All delete markers
#
# before CloudFormation attempts to delete the bucket.
#
# ==========================================================
#
# IMPORTANT RDS INFORMATION
# ==========================================================
#
# The RDS database exists inside:
#
#   Lab01-CloudFormation
#       |
#       +---- RDSNestedStack
#                   |
#                   +---- RDSDatabase
#
# Therefore RDSDatabase is discovered through the nested stack.
#
# ==========================================================
#
# IMPORTANT ECS / ECR INFORMATION
# ==========================================================
#
# ECS and ECR belong to the root CloudFormation infrastructure.
#
# CloudFormation should remain responsible for deleting:
#
#   - ECS Service
#   - ECS Cluster
#   - ECS Task Definition
#   - ECS IAM Roles
#   - ALB
#   - Target Group
#   - Listener
#   - ECR Repository
#
# However:
#
#   ECR repositories can block CloudFormation deletion when
#   Docker images still exist.
#
# Therefore this workflow:
#
#   1. Stops ECS tasks
#   2. Empties ECR
#   3. Lets CloudFormation delete the actual resources
#
# ==========================================================
#
# REQUIRED GITHUB SECRETS
# ==========================================================
#
# GitHub Repository
#   ->
# Settings
#   ->
# Secrets and variables
#   ->
# Actions
#
# Required secrets:
#
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#
# ==========================================================


# ==========================================================
# WORKFLOW NAME
# ==========================================================

name: Delete AWS CloudFormation Stack


# ==========================================================
# WORKFLOW TRIGGER
# ==========================================================
#
# Manual execution only.
#
# GitHub:
#
#   Actions
#      ->
#   Delete AWS CloudFormation Stack
#      ->
#   Run workflow
#
# ==========================================================

on:
  workflow_dispatch:


# ==========================================================
# GLOBAL ENVIRONMENT VARIABLES
# ==========================================================

env:

  # AWS region containing the lab resources.
  AWS_REGION: us-east-1

  # Main/root CloudFormation stack.
  STACK_NAME: Lab01-CloudFormation

  # Separate CloudFormation stack containing the
  # S3 bucket used for nested CloudFormation templates.
  TEMPLATE_BUCKET_STACK: Lab01-CloudFormation-TemplateBucket


# ==========================================================
# JOB
# ==========================================================

jobs:

  delete-stack:

    # GitHub-hosted Ubuntu runner.
    runs-on: ubuntu-latest

    name: Delete CloudFormation Stack


    # ========================================================
    # STEPS
    # ========================================================

    steps:


      # ======================================================
      # STEP 1
      # CHECKOUT REPOSITORY
      # ======================================================

      - name: "Step 1 - Checkout Repository"
        uses: actions/checkout@v4


      # ======================================================
      # STEP 2
      # CONFIGURE AWS CREDENTIALS
      # ======================================================

      - name: "Step 2 - Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4

        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: ${{ env.AWS_REGION }}


      # ======================================================
      # STEP 3
      # VERIFY AWS CLI AND ACCOUNT
      # ======================================================

      - name: "Step 3 - Verify AWS CLI and Account"
        shell: bash

        run: |

          echo "======================================"
          echo "AWS CLI INFORMATION"
          echo "======================================"

          aws --version

          echo ""

          echo "======================================"
          echo "AWS ACCOUNT"
          echo "======================================"

          aws sts get-caller-identity

          echo ""

          echo "======================================"
          echo "LAB CONFIGURATION"
          echo "======================================"

          echo "AWS Region            : $AWS_REGION"
          echo "Root Stack            : $STACK_NAME"
          echo "Template Bucket Stack : $TEMPLATE_BUCKET_STACK"

          echo ""


      # ======================================================
      # STEP 4
      # CHECK ROOT STACK
      # ======================================================

      - name: "Step 4 - Check Root Stack"
        id: stack

        shell: bash

        run: |

          echo "======================================"
          echo "CHECKING ROOT CLOUDFORMATION STACK"
          echo "======================================"

          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo "exists=true" >> "$GITHUB_OUTPUT"

            echo ""
            echo "Root stack exists."

          else

            echo "exists=false" >> "$GITHUB_OUTPUT"

            echo ""
            echo "Root stack does not exist."

          fi


      # ======================================================
      # STEP 5
      # GET ROOT STACK STATUS
      # ======================================================

      - name: "Step 5 - Get Root Stack Status"
        if: steps.stack.outputs.exists == 'true'

        id: status

        shell: bash

        run: |

          echo "======================================"
          echo "ROOT STACK STATUS"
          echo "======================================"

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text \
            --no-cli-pager)

          echo ""

          echo "Stack Name   : $STACK_NAME"
          echo "Stack Status : $STACK_STATUS"

          echo ""

          echo "stack_status=$STACK_STATUS" >> "$GITHUB_OUTPUT"


      # ======================================================
      # STEP 6
      # DISPLAY ROOT STACK INFORMATION
      # ======================================================

      - name: "Step 6 - Display Root Stack Information"
        if: steps.stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "======================================"
          echo "ROOT STACK INFORMATION"
          echo "======================================"

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --output table \
            --no-cli-pager


      # ======================================================
      # STEP 7
      # DISPLAY ROOT STACK RESOURCES
      # ======================================================

      - name: "Step 7 - Display Root Stack Resources"
        if: steps.stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "======================================"
          echo "ROOT STACK RESOURCES"
          echo "======================================"

          aws cloudformation list-stack-resources \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackResourceSummaries[].[LogicalResourceId,ResourceType,ResourceStatus,PhysicalResourceId]" \
            --output table \
            --no-cli-pager \
            || true


      # ======================================================
      # STEP 8
      # DISPLAY ROOT STACK FAILURES
      # ======================================================

      - name: "Step 8 - Display Root Stack Failures"
        if: steps.stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "======================================"
          echo "ROOT STACK FAILURE INFORMATION"
          echo "======================================"

          aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackEvents[?contains(ResourceStatus, 'FAILED')].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table \
            --no-cli-pager \
            || true


      # ======================================================
      # STEP 9
      # DISCOVER RDS NESTED STACK
      # ======================================================

      - name: "Step 9 - Discover RDS Nested Stack"
        if: steps.stack.outputs.exists == 'true'

        id: rds_nested

        shell: bash

        run: |

          echo "======================================"
          echo "DISCOVERING RDS NESTED STACK"
          echo "======================================"

          RDS_NESTED_STACK_ID=$(aws cloudformation list-stack-resources \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackResourceSummaries[?LogicalResourceId=='RDSNestedStack'].PhysicalResourceId" \
            --output text \
            --no-cli-pager)

          echo ""

          echo "RDS Nested Stack:"
          echo "$RDS_NESTED_STACK_ID"

          echo ""

          if [ -n "$RDS_NESTED_STACK_ID" ] &&
             [ "$RDS_NESTED_STACK_ID" != "None" ]
          then

            echo "RDS nested stack found."

            echo "rds_nested_stack=$RDS_NESTED_STACK_ID" \
              >> "$GITHUB_OUTPUT"

          else

            echo "RDS nested stack was not found."

            echo "rds_nested_stack=" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # STEP 10
      # DISCOVER ACTUAL RDS DATABASE
      # ======================================================

      - name: "Step 10 - Discover RDS Database"
        if: |
          steps.stack.outputs.exists == 'true' &&
          steps.rds_nested.outputs.rds_nested_stack != ''

        id: rds

        shell: bash

        run: |

          echo "======================================"
          echo "DISCOVERING RDS DATABASE"
          echo "======================================"

          RDS_NESTED_STACK_ID="${{ steps.rds_nested.outputs.rds_nested_stack }}"

          RDS_INSTANCE=$(aws cloudformation describe-stack-resources \
            --stack-name "$RDS_NESTED_STACK_ID" \
            --region "$AWS_REGION" \
            --logical-resource-id RDSDatabase \
            --query "StackResources[0].PhysicalResourceId" \
            --output text \
            --no-cli-pager \
            2>/dev/null || true)

          echo ""

          echo "RDS Physical Resource ID:"
          echo "$RDS_INSTANCE"

          echo ""

          if [ -n "$RDS_INSTANCE" ] &&
             [ "$RDS_INSTANCE" != "None" ]
          then

            echo "RDS database found."

            echo "rds_instance=$RDS_INSTANCE" \
              >> "$GITHUB_OUTPUT"

          else

            echo "RDS database was not found."

            echo "rds_instance=" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # STEP 11
      # CHECK RDS DELETION PROTECTION
      # ======================================================

      - name: "Step 11 - Check RDS Deletion Protection"
        if: steps.rds.outputs.rds_instance != ''

        shell: bash

        run: |

          echo "======================================"
          echo "CHECKING RDS DELETION PROTECTION"
          echo "======================================"

          RDS_INSTANCE="${{ steps.rds.outputs.rds_instance }}"

          DELETE_PROTECTION=$(aws rds describe-db-instances \
            --db-instance-identifier "$RDS_INSTANCE" \
            --region "$AWS_REGION" \
            --query "DBInstances[0].DeletionProtection" \
            --output text \
            --no-cli-pager \
            2>/dev/null || true)

          echo ""

          echo "RDS Instance        : $RDS_INSTANCE"
          echo "Deletion Protection : $DELETE_PROTECTION"

          echo ""

          if [ "$DELETE_PROTECTION" = "True" ]
          then

            echo "Deletion protection is enabled."
            echo ""

            echo "Disabling deletion protection..."

            aws rds modify-db-instance \
              --db-instance-identifier "$RDS_INSTANCE" \
              --region "$AWS_REGION" \
              --no-deletion-protection \
              --apply-immediately \
              --no-cli-pager

            echo ""

            echo "Deletion protection disable request submitted."

          else

            echo "RDS deletion protection is already disabled."

          fi


      # ======================================================
      # STEP 12
      # DISCOVER ECS RESOURCES
      # ======================================================
      #
      # ECS cluster, service, and ECR repository are discovered
      # from the root CloudFormation stack.
      #
      # This avoids undefined variables such as:
      #
      #   $ECS_CLUSTER
      #   $ECS_SERVICE
      #   $ECR_REPOSITORY
      #
      # ======================================================

      - name: "Step 12 - Discover ECS and ECR Resources"
        if: steps.stack.outputs.exists == 'true'

        id: ecs_resources

        shell: bash

        run: |

          echo "======================================"
          echo "DISCOVERING ECS / ECR RESOURCES"
          echo "======================================"

          echo ""

          echo "Searching CloudFormation resources..."

          ECS_CLUSTER=$(aws cloudformation list-stack-resources \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackResourceSummaries[?contains(LogicalResourceId, 'ECSCluster')].PhysicalResourceId | [0]" \
            --output text \
            --no-cli-pager \
            2>/dev/null || true)

          ECS_SERVICE=$(aws cloudformation list-stack-resources \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackResourceSummaries[?contains(LogicalResourceId, 'ECSService')].PhysicalResourceId | [0]" \
            --output text \
            --no-cli-pager \
            2>/dev/null || true)

          ECR_REPOSITORY=$(aws cloudformation list-stack-resources \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackResourceSummaries[?ResourceType=='AWS::ECR::Repository'].PhysicalResourceId | [0]" \
            --output text \
            --no-cli-pager \
            2>/dev/null || true)

          echo ""

          echo "ECS Cluster:"
          echo "$ECS_CLUSTER"

          echo ""

          echo "ECS Service:"
          echo "$ECS_SERVICE"

          echo ""

          echo "ECR Repository:"
          echo "$ECR_REPOSITORY"

          echo ""

          if [ -n "$ECS_CLUSTER" ] &&
             [ "$ECS_CLUSTER" != "None" ]
          then
            echo "ecs_cluster=$ECS_CLUSTER" >> "$GITHUB_OUTPUT"
          else
            echo "ecs_cluster=" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$ECS_SERVICE" ] &&
             [ "$ECS_SERVICE" != "None" ]
          then
            echo "ecs_service=$ECS_SERVICE" >> "$GITHUB_OUTPUT"
          else
            echo "ecs_service=" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$ECR_REPOSITORY" ] &&
             [ "$ECR_REPOSITORY" != "None" ]
          then
            echo "ecr_repository=$ECR_REPOSITORY" >> "$GITHUB_OUTPUT"
          else
            echo "ecr_repository=" >> "$GITHUB_OUTPUT"
          fi


      # ======================================================
      # STEP 13
      # PREPARE ECS SERVICE FOR DELETION
      # ======================================================

      - name: "Step 13 - Prepare ECS Service for Deletion"
        if: |
          steps.ecs_resources.outputs.ecs_cluster != '' &&
          steps.ecs_resources.outputs.ecs_service != ''

        shell: bash

        run: |

          echo "======================================"
          echo "PREPARING ECS SERVICE FOR DELETION"
          echo "======================================"

          ECS_CLUSTER="${{ steps.ecs_resources.outputs.ecs_cluster }}"
          ECS_SERVICE="${{ steps.ecs_resources.outputs.ecs_service }}"

          echo ""

          echo "ECS Cluster:"
          echo "$ECS_CLUSTER"

          echo ""

          echo "ECS Service:"
          echo "$ECS_SERVICE"

          echo ""

          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query "services[0].status" \
            --output text \
            --no-cli-pager \
            2>/dev/null || echo "NOT_FOUND")

          echo "ECS Service Status:"
          echo "$SERVICE_STATUS"

          echo ""

          if [ "$SERVICE_STATUS" != "NOT_FOUND" ] &&
             [ "$SERVICE_STATUS" != "None" ]
          then

            echo "Setting ECS desired count to zero..."

            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_SERVICE" \
              --desired-count 0 \
              --region "$AWS_REGION" \
              --no-cli-pager

            echo ""

            echo "ECS service desired count set to zero."

          else

            echo "ECS service does not exist."

          fi


      # ======================================================
      # STEP 14
      # WAIT FOR ECS TASKS TO STOP
      # ======================================================

      - name: "Step 14 - Wait for ECS Tasks to Stop"
        if: |
          steps.ecs_resources.outputs.ecs_cluster != '' &&
          steps.ecs_resources.outputs.ecs_service != ''

        shell: bash

        run: |

          echo "======================================"
          echo "WAITING FOR ECS TASKS TO STOP"
          echo "======================================"

          ECS_CLUSTER="${{ steps.ecs_resources.outputs.ecs_cluster }}"
          ECS_SERVICE="${{ steps.ecs_resources.outputs.ecs_service }}"

          echo ""

          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query "services[0].status" \
            --output text \
            --no-cli-pager \
            2>/dev/null || echo "NOT_FOUND")

          if [ "$SERVICE_STATUS" != "NOT_FOUND" ] &&
             [ "$SERVICE_STATUS" != "None" ]
          then

            echo "Waiting for ECS service to become stable..."

            aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --region "$AWS_REGION" \
              || true

            echo ""

            echo "ECS service reached a stable state."

          else

            echo "ECS service no longer exists."

          fi


      # ======================================================
      # STEP 15
      # EMPTY ECR REPOSITORY
      # ======================================================
      #
      # CloudFormation may fail to delete an ECR repository
      # if Docker images remain inside the repository.
      #
      # This step deletes images only.
      #
      # CloudFormation remains responsible for deleting the
      # ECR repository itself.
      #
      # ======================================================

      - name: "Step 15 - Empty ECR Repository"
        if: steps.ecs_resources.outputs.ecr_repository != ''

        shell: bash

        run: |

          echo "======================================"
          echo "EMPTYING ECR REPOSITORY"
          echo "======================================"

          ECR_REPOSITORY="${{ steps.ecs_resources.outputs.ecr_repository }}"

          echo ""

          echo "ECR Repository:"
          echo "$ECR_REPOSITORY"

          echo ""

          if ! aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo "ECR repository does not exist."
            exit 0

          fi

          echo "ECR repository exists."

          echo ""

          echo "Listing current images..."

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --query "imageDetails[].[imageDigest,imageTags]" \
            --output table \
            --no-cli-pager \
            || true

          echo ""

          while true
          do

            IMAGE_IDS=$(aws ecr list-images \
              --repository-name "$ECR_REPOSITORY" \
              --region "$AWS_REGION" \
              --query "imageIds[*]" \
              --output json \
              --no-cli-pager)

            IMAGE_COUNT=$(echo "$IMAGE_IDS" | jq 'length')

            echo ""
            echo "Images remaining: $IMAGE_COUNT"

            if [ "$IMAGE_COUNT" -eq 0 ]
            then

              echo ""
              echo "ECR repository is completely empty."

              break

            fi

            echo ""
            echo "Deleting ECR images..."

            echo "$IMAGE_IDS" > /tmp/ecr-image-ids.json

            aws ecr batch-delete-image \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids file:///tmp/ecr-image-ids.json \
              --region "$AWS_REGION" \
              --no-cli-pager

            echo ""

            echo "ECR deletion request completed."

          done


      # ======================================================
      # STEP 16
      # VERIFY ECR REPOSITORY IS EMPTY
      # ======================================================

      - name: "Step 16 - Verify ECR Repository Is Empty"
        if: steps.ecs_resources.outputs.ecr_repository != ''

        shell: bash

        run: |

          echo "======================================"
          echo "VERIFYING ECR REPOSITORY"
          echo "======================================"

          ECR_REPOSITORY="${{ steps.ecs_resources.outputs.ecr_repository }}"

          if ! aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo ""
            echo "ECR repository does not exist."

            exit 0

          fi

          IMAGE_COUNT=$(aws ecr list-images \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --query "length(imageIds)" \
            --output text \
            --no-cli-pager)

          echo ""

          echo "ECR Repository  : $ECR_REPOSITORY"
          echo "Images Remaining: $IMAGE_COUNT"

          echo ""

          if [ "$IMAGE_COUNT" -eq 0 ]
          then

            echo "SUCCESS:"
            echo "ECR repository is empty."

          else

            echo "ERROR:"
            echo "ECR repository still contains images."

            exit 1

          fi


      # ======================================================
      # STEP 17
      # START ROOT STACK DELETION
      # ======================================================

      - name: "Step 17 - Start Root Stack Deletion"
        if: steps.stack.outputs.exists == 'true'

        id: delete

        shell: bash

        run: |

          echo "======================================"
          echo "STARTING ROOT STACK DELETION"
          echo "======================================"

          CURRENT_STATUS="${{ steps.status.outputs.stack_status }}"

          echo ""

          echo "Stack Name : $STACK_NAME"
          echo "Region     : $AWS_REGION"
          echo "Status     : $CURRENT_STATUS"

          echo ""

          if [ "$CURRENT_STATUS" = "DELETE_FAILED" ]
          then

            echo "Root stack is already DELETE_FAILED."

            echo ""

            echo "Starting FORCE_DELETE_STACK..."

            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --deletion-mode FORCE_DELETE_STACK \
              --no-cli-pager

            echo "mode=force" >> "$GITHUB_OUTPUT"

            echo ""

            echo "Force deletion started."

          else

            echo "Starting normal CloudFormation deletion..."

            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --no-cli-pager

            echo "mode=standard" >> "$GITHUB_OUTPUT"

            echo ""

            echo "Normal deletion started."

          fi


      # ======================================================
      # STEP 18
      # WAIT FOR NORMAL ROOT STACK DELETION
      # ======================================================

      - name: "Step 18 - Wait for Normal Root Deletion"
        if: |
          steps.stack.outputs.exists == 'true' &&
          steps.delete.outputs.mode == 'standard'

        id: normal_wait

        continue-on-error: true

        shell: bash

        run: |

          echo "======================================"
          echo "WAITING FOR NORMAL ROOT DELETION"
          echo "======================================"

          if aws cloudformation wait stack-delete-complete \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION"
          then

            echo "deleted=true" >> "$GITHUB_OUTPUT"

            echo ""
            echo "Root stack deleted successfully."

          else

            echo "deleted=false" >> "$GITHUB_OUTPUT"

            echo ""
            echo "Root stack deletion failed."

          fi


      # ======================================================
      # STEP 19
      # DISPLAY DELETE_FAILED ROOT RESOURCES
      # ======================================================

      - name: "Step 19 - Display DELETE_FAILED Root Resources"
        if: |
          steps.stack.outputs.exists == 'true' &&
          steps.delete.outputs.mode == 'standard' &&
          steps.normal_wait.outputs.deleted == 'false'

        shell: bash

        run: |

          echo "======================================"
          echo "ROOT STACK DELETE_FAILED RESOURCES"
          echo "======================================"

          aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='DELETE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]" \
            --output table \
            --no-cli-pager \
            || true


      # ======================================================
      # STEP 20
      # ATTEMPT DIRECT RDS CLEANUP
      # ======================================================

      - name: "Step 20 - Attempt Direct RDS Cleanup"
        if: |
          steps.stack.outputs.exists == 'true' &&
          (
            steps.delete.outputs.mode == 'force' ||
            steps.normal_wait.outputs.deleted == 'false'
          ) &&
          steps.rds.outputs.rds_instance != ''

        shell: bash

        run: |

          echo "======================================"
          echo "ATTEMPTING DIRECT RDS CLEANUP"
          echo "======================================"

          RDS_INSTANCE="${{ steps.rds.outputs.rds_instance }}"

          echo ""

          echo "RDS Instance:"
          echo "$RDS_INSTANCE"

          echo ""

          if aws rds describe-db-instances \
            --db-instance-identifier "$RDS_INSTANCE" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo "RDS instance still exists."

            echo ""

            echo "Requesting RDS deletion..."

            aws rds delete-db-instance \
              --db-instance-identifier "$RDS_INSTANCE" \
              --region "$AWS_REGION" \
              --skip-final-snapshot \
              --delete-automated-backups \
              --no-cli-pager \
              || true

            echo ""

            echo "RDS deletion request submitted."

          else

            echo "RDS instance no longer exists."

          fi


      # ======================================================
      # STEP 21
      # WAIT FOR RDS DELETION
      # ======================================================

      - name: "Step 21 - Wait for RDS Deletion"
        if: |
          steps.stack.outputs.exists == 'true' &&
          (
            steps.delete.outputs.mode == 'force' ||
            steps.normal_wait.outputs.deleted == 'false'
          ) &&
          steps.rds.outputs.rds_instance != ''

        shell: bash

        run: |

          echo "======================================"
          echo "WAITING FOR RDS DELETION"
          echo "======================================"

          RDS_INSTANCE="${{ steps.rds.outputs.rds_instance }}"

          for ATTEMPT in $(seq 1 60)
          do

            RDS_STATUS=$(aws rds describe-db-instances \
              --db-instance-identifier "$RDS_INSTANCE" \
              --region "$AWS_REGION" \
              --query "DBInstances[0].DBInstanceStatus" \
              --output text \
              --no-cli-pager \
              2>/dev/null || echo "NOT_FOUND")

            echo ""

            echo "Attempt: $ATTEMPT / 60"
            echo "RDS Status: $RDS_STATUS"

            if [ "$RDS_STATUS" = "NOT_FOUND" ]
            then

              echo ""
              echo "RDS instance has been deleted."

              break

            fi

            if [ "$ATTEMPT" -eq 60 ]
            then

              echo ""
              echo "RDS deletion is still in progress."

              break

            fi

            sleep 30

          done


      # ======================================================
      # STEP 22
      # FORCE DELETE ROOT STACK
      # ======================================================

      - name: "Step 22 - Force Delete Root Stack"
        if: |
          steps.stack.outputs.exists == 'true' &&
          (
            steps.delete.outputs.mode == 'force' ||
            steps.normal_wait.outputs.deleted == 'false'
          )

        shell: bash

        run: |

          echo "======================================"
          echo "FORCE DELETE ROOT CLOUDFORMATION STACK"
          echo "======================================"

          echo ""

          echo "Stack Name : $STACK_NAME"
          echo "Region     : $AWS_REGION"
          echo "Mode       : FORCE_DELETE_STACK"

          echo ""

          aws cloudformation delete-stack \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --deletion-mode FORCE_DELETE_STACK \
            --no-cli-pager

          echo ""

          echo "Force deletion request submitted."


      # ======================================================
      # STEP 23
      # WAIT FOR FINAL ROOT STACK DELETION
      # ======================================================

      - name: "Step 23 - Wait for Final Root Deletion"
        if: |
          steps.stack.outputs.exists == 'true' &&
          (
            steps.delete.outputs.mode == 'force' ||
            steps.normal_wait.outputs.deleted == 'false'
          )

        shell: bash

        run: |

          echo "======================================"
          echo "WAITING FOR FINAL ROOT DELETION"
          echo "======================================"

          if aws cloudformation wait stack-delete-complete \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION"
          then

            echo ""
            echo "Final root stack deletion completed."

          else

            echo ""
            echo "ERROR:"
            echo "Final root stack deletion did not complete."

            echo ""

            echo "Checking current CloudFormation events..."

            aws cloudformation describe-stack-events \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "StackEvents[?ResourceStatus=='DELETE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]" \
              --output table \
              --no-cli-pager \
              || true

            exit 1

          fi


      # ======================================================
      # STEP 24
      # VERIFY ROOT STACK IS GONE
      # ======================================================

      - name: "Step 24 - Verify Root Stack Deletion"
        if: steps.stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "======================================"
          echo "VERIFYING ROOT STACK DELETION"
          echo "======================================"

          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo ""
            echo "ERROR:"
            echo "Root CloudFormation stack still exists."

            exit 1

          else

            echo ""
            echo "Root CloudFormation stack no longer exists."

          fi


      # ======================================================
      # STEP 25
      # CHECK TEMPLATE BUCKET STACK
      # ======================================================

      - name: "Step 25 - Check Template Bucket Stack"
        id: template_bucket

        shell: bash

        run: |

          echo "======================================"
          echo "CHECKING TEMPLATE BUCKET STACK"
          echo "======================================"

          if aws cloudformation describe-stacks \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo "exists=true" >> "$GITHUB_OUTPUT"

            echo ""
            echo "Template bucket stack exists."

          else

            echo "exists=false" >> "$GITHUB_OUTPUT"

            echo ""
            echo "Template bucket stack does not exist."

          fi


      # ======================================================
      # STEP 26
      # DISPLAY TEMPLATE BUCKET RESOURCES
      # ======================================================

      - name: "Step 26 - Display Template Bucket Resources"
        if: steps.template_bucket.outputs.exists == 'true'

        shell: bash

        run: |

          echo "======================================"
          echo "TEMPLATE BUCKET STACK RESOURCES"
          echo "======================================"

          aws cloudformation list-stack-resources \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --query "StackResourceSummaries[].[LogicalResourceId,ResourceType,ResourceStatus,PhysicalResourceId]" \
            --output table \
            --no-cli-pager \
            || true


      # ======================================================
      # STEP 27
      # FIND TEMPLATE S3 BUCKET
      # ======================================================

      - name: "Step 27 - Find Template S3 Bucket"
        if: steps.template_bucket.outputs.exists == 'true'

        id: template_s3

        shell: bash

        run: |

          echo "======================================"
          echo "FINDING TEMPLATE S3 BUCKET"
          echo "======================================"

          TEMPLATE_BUCKET=$(aws cloudformation list-stack-resources \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --query "StackResourceSummaries[?LogicalResourceId=='TemplateBucket'].PhysicalResourceId" \
            --output text \
            --no-cli-pager)

          echo ""

          echo "Template Bucket:"
          echo "$TEMPLATE_BUCKET"

          echo ""

          if [ -n "$TEMPLATE_BUCKET" ] &&
             [ "$TEMPLATE_BUCKET" != "None" ]
          then

            echo "template_bucket=$TEMPLATE_BUCKET" \
              >> "$GITHUB_OUTPUT"

            echo "Template S3 bucket found."

          else

            echo "template_bucket=" >> "$GITHUB_OUTPUT"

            echo "Template S3 bucket was not found."

          fi


      # ======================================================
      # STEP 28
      # EMPTY VERSIONED TEMPLATE BUCKET
      # ======================================================
      #
      # This is the important fix for:
      #
      #   The bucket you tried to delete is not empty.
      #
      # The workflow removes:
      #
      #   - object versions
      #   - delete markers
      #
      # before CloudFormation deletes the bucket.
      #
      # ======================================================

      - name: "Step 28 - Empty Versioned Template Bucket"
        if: |
          steps.template_bucket.outputs.exists == 'true' &&
          steps.template_s3.outputs.template_bucket != ''

        shell: bash

        run: |

          echo "======================================"
          echo "EMPTYING VERSIONED TEMPLATE BUCKET"
          echo "======================================"

          TEMPLATE_BUCKET="${{ steps.template_s3.outputs.template_bucket }}"

          echo ""

          echo "Bucket:"
          echo "$TEMPLATE_BUCKET"

          echo ""

          echo "Checking bucket versioning..."

          aws s3api get-bucket-versioning \
            --bucket "$TEMPLATE_BUCKET" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            || true

          echo ""

          while true
          do

            echo "Reading S3 object versions..."

            VERSION_DATA=$(aws s3api list-object-versions \
              --bucket "$TEMPLATE_BUCKET" \
              --region "$AWS_REGION" \
              --output json \
              --no-cli-pager)

            VERSION_COUNT=$(echo "$VERSION_DATA" | \
              jq '(.Versions // []) | length')

            DELETE_MARKER_COUNT=$(echo "$VERSION_DATA" | \
              jq '(.DeleteMarkers // []) | length')

            TOTAL_COUNT=$((VERSION_COUNT + DELETE_MARKER_COUNT))

            echo ""

            echo "Object versions  : $VERSION_COUNT"
            echo "Delete markers   : $DELETE_MARKER_COUNT"
            echo "Total remaining  : $TOTAL_COUNT"

            echo ""

            if [ "$TOTAL_COUNT" -eq 0 ]
            then

              echo "Template bucket is completely empty."

              break

            fi

            echo "$VERSION_DATA" | \
              jq '{
                Objects:
                  (
                    ((.Versions // []) + (.DeleteMarkers // []))
                    | map({
                        Key: .Key,
                        VersionId: .VersionId
                      })
                    | .[0:1000]
                  ),
                Quiet: true
              }' > /tmp/s3-delete.json

            DELETE_COUNT=$(jq '.Objects | length' /tmp/s3-delete.json)

            echo "Deleting $DELETE_COUNT S3 versions/delete markers..."

            aws s3api delete-objects \
              --bucket "$TEMPLATE_BUCKET" \
              --delete file:///tmp/s3-delete.json \
              --region "$AWS_REGION" \
              --no-cli-pager

            echo ""
            echo "Delete request completed."

          done

          echo ""

          echo "======================================"
          echo "VERIFYING TEMPLATE BUCKET IS EMPTY"
          echo "======================================"

          FINAL_VERSION_DATA=$(aws s3api list-object-versions \
            --bucket "$TEMPLATE_BUCKET" \
            --region "$AWS_REGION" \
            --output json \
            --no-cli-pager)

          FINAL_VERSION_COUNT=$(echo "$FINAL_VERSION_DATA" | \
            jq '(.Versions // []) | length')

          FINAL_DELETE_MARKER_COUNT=$(echo "$FINAL_VERSION_DATA" | \
            jq '(.DeleteMarkers // []) | length')

          FINAL_TOTAL=$((FINAL_VERSION_COUNT + FINAL_DELETE_MARKER_COUNT))

          echo ""

          echo "Remaining object versions : $FINAL_VERSION_COUNT"
          echo "Remaining delete markers  : $FINAL_DELETE_MARKER_COUNT"
          echo "Remaining total           : $FINAL_TOTAL"

          echo ""

          if [ "$FINAL_TOTAL" -eq 0 ]
          then

            echo "SUCCESS:"
            echo "Template S3 bucket is completely empty."

          else

            echo "ERROR:"
            echo "S3 bucket still contains versions or delete markers."

            exit 1

          fi


      # ======================================================
      # STEP 29
      # GET TEMPLATE BUCKET STACK STATUS
      # ======================================================

      - name: "Step 29 - Get Template Bucket Stack Status"
        if: steps.template_bucket.outputs.exists == 'true'

        id: template_status

        shell: bash

        run: |

          echo "======================================"
          echo "TEMPLATE BUCKET STACK STATUS"
          echo "======================================"

          TEMPLATE_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text \
            --no-cli-pager)

          echo ""

          echo "Template Bucket Stack:"
          echo "$TEMPLATE_BUCKET_STACK"

          echo ""

          echo "Current Status:"
          echo "$TEMPLATE_STATUS"

          echo ""

          echo "template_status=$TEMPLATE_STATUS" \
            >> "$GITHUB_OUTPUT"


      # ======================================================
      # STEP 30
      # DELETE TEMPLATE BUCKET STACK
      # ======================================================
      #
      # IMPORTANT:
      #
      # The previous workflow had a Bash/YAML formatting
      # problem around this section.
      #
      # The case statement below is intentionally written
      # with clean Bash syntax.
      #
      # ======================================================

      - name: "Step 30 - Delete Template Bucket Stack"
        if: steps.template_bucket.outputs.exists == 'true'

        id: template_delete

        shell: bash

        run: |

          echo "======================================"
          echo "DELETING TEMPLATE BUCKET STACK"
          echo "======================================"

          TEMPLATE_STATUS="${{ steps.template_status.outputs.template_status }}"

          echo ""

          echo "Stack Name : $TEMPLATE_BUCKET_STACK"
          echo "Region     : $AWS_REGION"
          echo "Status     : $TEMPLATE_STATUS"

          echo ""

          case "$TEMPLATE_STATUS" in

            CREATE_IN_PROGRESS|UPDATE_IN_PROGRESS|UPDATE_COMPLETE_CLEANUP_IN_PROGRESS|DELETE_IN_PROGRESS)

              echo "ERROR:"
              echo "Template bucket stack is currently busy."

              echo ""

              echo "Current status:"
              echo "$TEMPLATE_STATUS"

              exit 1

              ;;

          esac

          echo "Starting Template Bucket stack deletion..."

          aws cloudformation delete-stack \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --no-cli-pager

          echo ""

          echo "Template Bucket stack deletion request submitted."


      # ======================================================
      # STEP 31
      # WAIT FOR TEMPLATE BUCKET STACK DELETION
      # ======================================================

      - name: "Step 31 - Wait for Template Bucket Deletion"
        if: steps.template_delete.outcome == 'success'

        shell: bash

        run: |

          echo "======================================"
          echo "WAITING FOR TEMPLATE BUCKET DELETION"
          echo "======================================"

          if aws cloudformation wait stack-delete-complete \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION"
          then

            echo ""
            echo "Template Bucket stack deletion completed."

          else

            echo ""
            echo "ERROR:"
            echo "Template Bucket stack deletion failed."

            echo ""

            echo "CloudFormation failure information:"

            aws cloudformation describe-stack-events \
              --stack-name "$TEMPLATE_BUCKET_STACK" \
              --region "$AWS_REGION" \
              --query "StackEvents[?ResourceStatus=='DELETE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]" \
              --output table \
              --no-cli-pager \
              || true

            exit 1

          fi


      # ======================================================
      # STEP 32
      # VERIFY TEMPLATE BUCKET STACK DELETION
      # ======================================================

      - name: "Step 32 - Verify Template Bucket Stack Deletion"
        if: steps.template_bucket.outputs.exists == 'true'

        shell: bash

        run: |

          echo "======================================"
          echo "VERIFYING TEMPLATE BUCKET STACK"
          echo "======================================"

          if aws cloudformation describe-stacks \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo ""
            echo "ERROR:"
            echo "Template Bucket stack still exists."

            exit 1

          else

            echo ""
            echo "Template Bucket stack no longer exists."

          fi


      # ======================================================
      # STEP 33
      # VERIFY RDS CLEANUP
      # ======================================================

      - name: "Step 33 - Verify RDS Cleanup"
        shell: bash

        run: |

          echo "======================================"
          echo "VERIFYING RDS CLEANUP"
          echo "======================================"

          if [ -z "${{ steps.rds.outputs.rds_instance }}" ]
          then

            echo ""
            echo "No RDS instance was discovered by this workflow."

            exit 0

          fi

          RDS_INSTANCE="${{ steps.rds.outputs.rds_instance }}"

          echo ""

          echo "Checking RDS instance:"
          echo "$RDS_INSTANCE"

          echo ""

          if aws rds describe-db-instances \
            --db-instance-identifier "$RDS_INSTANCE" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo "WARNING:"
            echo "RDS instance still exists."

            aws rds describe-db-instances \
              --db-instance-identifier "$RDS_INSTANCE" \
              --region "$AWS_REGION" \
              --query "DBInstances[0].[DBInstanceIdentifier,DBInstanceStatus,DeletionProtection]" \
              --output table \
              --no-cli-pager

          else

            echo "SUCCESS:"
            echo "RDS instance no longer exists."

          fi


      # ======================================================
      # STEP 34
      # FINAL CLOUDFORMATION CHECK
      # ======================================================

      - name: "Step 34 - Final CloudFormation Check"
        shell: bash

        run: |

          echo "======================================"
          echo "FINAL CLOUDFORMATION CHECK"
          echo "======================================"

          echo ""

          echo "Checking root stack..."

          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo "WARNING:"
            echo "$STACK_NAME still exists."

          else

            echo "OK:"
            echo "$STACK_NAME does not exist."

          fi

          echo ""

          echo "Checking Template Bucket stack..."

          if aws cloudformation describe-stacks \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo "WARNING:"
            echo "$TEMPLATE_BUCKET_STACK still exists."

          else

            echo "OK:"
            echo "$TEMPLATE_BUCKET_STACK does not exist."

          fi


      # ======================================================
      # STEP 35
      # FINAL AWS RESOURCE CHECK
      # ======================================================

      - name: "Step 35 - Final AWS Resource Check"
        shell: bash

        run: |

          echo "======================================"
          echo "FINAL AWS RESOURCE CHECK"
          echo "======================================"

          echo ""

          echo "RDS INSTANCES"
          echo "--------------------------------------"

          aws rds describe-db-instances \
            --region "$AWS_REGION" \
            --query "DBInstances[*].[DBInstanceIdentifier,DBInstanceStatus,DeletionProtection]" \
            --output table \
            --no-cli-pager \
            || true

          echo ""

          echo "CLOUDFORMATION LAB STACKS"
          echo "--------------------------------------"

          aws cloudformation list-stacks \
            --region "$AWS_REGION" \
            --stack-status-filter \
              CREATE_IN_PROGRESS \
              CREATE_FAILED \
              CREATE_COMPLETE \
              ROLLBACK_IN_PROGRESS \
              ROLLBACK_FAILED \
              ROLLBACK_COMPLETE \
              DELETE_IN_PROGRESS \
              DELETE_FAILED \
              UPDATE_IN_PROGRESS \
              UPDATE_COMPLETE \
              UPDATE_ROLLBACK_IN_PROGRESS \
              UPDATE_ROLLBACK_FAILED \
              UPDATE_ROLLBACK_COMPLETE \
            --query "StackSummaries[?contains(StackName, 'Lab01-CloudFormation')].[StackName,StackStatus]" \
            --output table \
            --no-cli-pager \
            || true


      # ======================================================
      # STEP 36
      # FINAL CLEANUP SUMMARY
      # ======================================================

      - name: "Step 36 - Final Cleanup Summary"
        shell: bash

        run: |

          echo ""

          echo "=========================================================="
          echo "AWS CLOUDFORMATION LAB CLEANUP COMPLETE"
          echo "=========================================================="

          echo ""

          echo "Root Stack:"
          echo "  $STACK_NAME"

          echo ""

          echo "Template Bucket Stack:"
          echo "  $TEMPLATE_BUCKET_STACK"

          echo ""

          echo "AWS Region:"
          echo "  $AWS_REGION"

          echo ""

          echo "Cleanup operations:"

          echo "  [1]  AWS credentials configured"
          echo "  [2]  Root stack checked"
          echo "  [3]  Root stack status inspected"
          echo "  [4]  Root stack resources inspected"
          echo "  [5]  Root stack failures inspected"
          echo "  [6]  RDS nested stack discovered"
          echo "  [7]  RDS database discovered"
          echo "  [8]  RDS deletion protection checked"
          echo "  [9]  ECS and ECR resources discovered"
          echo "  [10] ECS service prepared for deletion"
          echo "  [11] ECS tasks stopped"
          echo "  [12] ECR repository emptied"
          echo "  [13] ECR repository verified empty"
          echo "  [14] Normal root stack deletion attempted"
          echo "  [15] Normal root stack deletion monitored"
          echo "  [16] DELETE_FAILED resources displayed"
          echo "  [17] Direct RDS cleanup attempted"
          echo "  [18] RDS deletion monitored"
          echo "  [19] FORCE_DELETE_STACK used if required"
          echo "  [20] Final root stack deletion monitored"
          echo "  [21] Root stack deletion verified"
          echo "  [22] Template Bucket stack checked"
          echo "  [23] Template Bucket resources inspected"
          echo "  [24] Template S3 bucket discovered"
          echo "  [25] S3 object versions deleted"
          echo "  [26] S3 delete markers deleted"
          echo "  [27] Template S3 bucket verified empty"
          echo "  [28] Template Bucket stack status checked"
          echo "  [29] Template Bucket stack deletion started"
          echo "  [30] Template Bucket stack deletion monitored"
          echo "  [31] Template Bucket stack deletion verified"
          echo "  [32] RDS cleanup verified"
          echo "  [33] Final CloudFormation check completed"
          echo "  [34] Final AWS resource check completed"

          echo ""

          echo "=========================================================="
          echo "LAB CLEANUP FINISHED"
          echo "=========================================================="
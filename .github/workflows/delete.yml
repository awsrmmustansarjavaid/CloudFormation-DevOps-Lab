# ============================================================
# AWS CloudFormation DevOps Lab
# GitHub Actions - COMPLETE DELETE / CLEANUP WORKFLOW
# ============================================================
#
# File:
#   .github/workflows/delete.yml
#
# ============================================================
# PURPOSE
# ============================================================
#
# Completely delete the AWS CloudFormation DevOps Lab.
#
# IMPORTANT:
#
# The project contains TWO different types of CloudFormation
# stacks:
#
# ------------------------------------------------------------
# MAIN STACK
# ------------------------------------------------------------
#
#   Lab01-CloudFormation
#
# Creates:
#
#   - VPC
#   - Internet Gateway
#   - Public Subnets
#   - Private Subnets
#   - Route Tables
#   - Web Security Group
#   - EC2 nested stack
#   - S3 nested stack
#   - RDS nested stack
#
# ------------------------------------------------------------
# STANDALONE ECS STACK
# ------------------------------------------------------------
#
#   CharlieCafe-ECS-Stack
#
# This is NOT a nested stack.
#
# It consumes networking created by:
#
#   Lab01-CloudFormation
#
# It creates:
#
#   - ECR Repository
#   - ECS Cluster
#   - ECS Service
#   - Task Definition
#   - ALB
#   - Target Group
#   - ALB Listener
#   - ECS Security Groups
#   - VPC Endpoints
#   - IAM Roles
#   - CloudWatch Log Group
#
# Therefore:
#
#   ECS STACK MUST BE DELETED BEFORE MAIN STACK.
#
#
# ------------------------------------------------------------
# TEMPLATE BUCKET STACK
# ------------------------------------------------------------
#
#   Lab01-CloudFormation-TemplateBucket
#
# This is another standalone stack.
#
# It creates the S3 bucket containing:
#
#   - ec2-webserver.yaml
#   - s3.yaml
#   - aws-rds.yaml
#
# We delete this stack LAST.
#
#
# ============================================================
# FINAL DELETION ORDER
# ============================================================
#
#   01. Discover Main Stack
#   02. Discover ECS Stack
#   03. Discover Template Bucket Stack
#   04. Discover application S3 bucket
#   05. Disable RDS deletion protection
#
#   06. Stop ECS Service
#   07. Wait for ECS tasks
#   08. Delete ECS Service
#   09. Wait for ECS Service deletion
#
#   10. Delete standalone ECS/ECR stack
#   11. Wait for ECS/ECR stack deletion
#
#   12. Empty application S3 bucket
#
#   13. Delete MAIN CloudFormation stack
#   14. Wait for MAIN stack deletion
#
#   15. Empty Template Bucket
#   16. Delete Template Bucket stack
#
#   17. Final verification
#
#
# ============================================================
# IMPORTANT
# ============================================================
#
# We DO NOT directly delete:
#
#   S3NestedStack
#   RDSNestedStack
#   EC2WebServerStack
#
# because these are true nested stacks.
#
# They are deleted automatically when:
#
#   Lab01-CloudFormation
#
# is deleted.
#
#
# ============================================================


name: Delete AWS CloudFormation Lab


# ============================================================
# MANUAL TRIGGER
# ============================================================

on:
  workflow_dispatch:


# ============================================================
# GLOBAL VARIABLES
# ============================================================

env:

  # AWS Region
  AWS_REGION: us-east-1

  # MAIN network CloudFormation stack
  MAIN_STACK_NAME: Lab01-CloudFormation

  # Standalone ECS + ECR CloudFormation stack
  ECS_STACK_NAME: CharlieCafe-ECS-Stack

  # Separate stack containing the CloudFormation template bucket
  TEMPLATE_BUCKET_STACK: Lab01-CloudFormation-TemplateBucket

  # ECS resources
  ECS_CLUSTER: CharlieCafe-Cluster
  ECS_SERVICE: CharlieCafe-Service

  # ECR repository
  ECR_REPOSITORY: charlie-cafe


# ============================================================
# JOB
# ============================================================

jobs:

  delete-lab:

    name: Complete AWS Lab Cleanup

    runs-on: ubuntu-latest

    # Give CloudFormation / RDS / ECS enough time to finish.
    timeout-minutes: 60


    steps:


      # ======================================================
      # STEP 1
      # CHECKOUT
      # ======================================================

      - name: "Step 1 - Checkout Repository"
        uses: actions/checkout@v4


      # ======================================================
      # STEP 2
      # AWS CREDENTIALS
      # ======================================================

      - name: "Step 2 - Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ======================================================
      # STEP 3
      # VERIFY AWS
      # ======================================================

      - name: "Step 3 - Verify AWS Account"
        shell: bash

        run: |

          set -e

          echo "=================================================="
          echo "AWS ACCOUNT VERIFICATION"
          echo "=================================================="

          aws --version

          echo ""

          aws sts get-caller-identity

          echo ""

          echo "AWS Region:"
          echo "$AWS_REGION"

          echo ""

          echo "Main Stack:"
          echo "$MAIN_STACK_NAME"

          echo ""

          echo "ECS Stack:"
          echo "$ECS_STACK_NAME"

          echo ""

          echo "Template Bucket Stack:"
          echo "$TEMPLATE_BUCKET_STACK"


      # ======================================================
      # STEP 4
      # DISCOVER MAIN STACK
      # ======================================================

      - name: "Step 4 - Discover Main CloudFormation Stack"
        id: main_stack

        shell: bash

        run: |

          echo "=================================================="
          echo "DISCOVER MAIN STACK"
          echo "=================================================="

          if aws cloudformation describe-stacks \
            --stack-name "$MAIN_STACK_NAME" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            STATUS=$(aws cloudformation describe-stacks \
              --stack-name "$MAIN_STACK_NAME" \
              --region "$AWS_REGION" \
              --query 'Stacks[0].StackStatus' \
              --output text \
              --no-cli-pager)

            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"

            echo ""
            echo "Main stack exists."
            echo "Status: $STATUS"

          else

            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "status=NOT_FOUND" >> "$GITHUB_OUTPUT"

            echo ""
            echo "Main stack does not exist."

          fi


      # ======================================================
      # STEP 5
      # DISCOVER ECS STACK
      #
      # IMPORTANT:
      #
      # ECS IS A STANDALONE STACK.
      #
      # It is NOT a nested stack.
      # ======================================================

      - name: "Step 5 - Discover Standalone ECS Stack"
        id: ecs_stack

        shell: bash

        run: |

          echo "=================================================="
          echo "DISCOVER ECS STACK"
          echo "=================================================="

          if aws cloudformation describe-stacks \
            --stack-name "$ECS_STACK_NAME" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            STATUS=$(aws cloudformation describe-stacks \
              --stack-name "$ECS_STACK_NAME" \
              --region "$AWS_REGION" \
              --query 'Stacks[0].StackStatus' \
              --output text \
              --no-cli-pager)

            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"

            echo ""
            echo "ECS stack exists."
            echo "Status: $STATUS"

          else

            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "status=NOT_FOUND" >> "$GITHUB_OUTPUT"

            echo ""
            echo "ECS stack does not exist."

          fi


      # ======================================================
      # STEP 6
      # DISCOVER TEMPLATE BUCKET STACK
      # ======================================================

      - name: "Step 6 - Discover Template Bucket Stack"
        id: template_stack

        shell: bash

        run: |

          echo "=================================================="
          echo "DISCOVER TEMPLATE BUCKET STACK"
          echo "=================================================="

          if aws cloudformation describe-stacks \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo "exists=true" >> "$GITHUB_OUTPUT"

            echo ""
            echo "Template Bucket stack exists."

          else

            echo "exists=false" >> "$GITHUB_OUTPUT"

            echo ""
            echo "Template Bucket stack does not exist."

          fi


      # ======================================================
      # STEP 7
      # DISPLAY MAIN STACK RESOURCES
      # ======================================================

      - name: "Step 7 - Display Main Stack Resources"
        if: steps.main_stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "=================================================="
          echo "MAIN STACK RESOURCES"
          echo "=================================================="

          aws cloudformation list-stack-resources \
            --stack-name "$MAIN_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'StackResourceSummaries[].[LogicalResourceId,ResourceType,ResourceStatus,PhysicalResourceId]' \
            --output table \
            --no-cli-pager \
            || true


      # ======================================================
      # STEP 8
      # DISCOVER APPLICATION S3 BUCKET
      #
      # This bucket belongs to S3NestedStack.
      #
      # We do NOT delete the nested stack directly.
      #
      # We only EMPTY the bucket before the main stack
      # deletion.
      # ======================================================

      - name: "Step 8 - Discover Application S3 Bucket"
        id: app_s3

        if: steps.main_stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "=================================================="
          echo "DISCOVER APPLICATION S3 BUCKET"
          echo "=================================================="

          BUCKET=$(aws cloudformation list-stack-resources \
            --stack-name "$MAIN_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackResourceSummaries[?LogicalResourceId=='S3NestedStack'].PhysicalResourceId" \
            --output text \
            --no-cli-pager \
            2>/dev/null || true)

          echo ""
          echo "S3 Nested Stack:"
          echo "$BUCKET"

          if [ -n "$BUCKET" ] && [ "$BUCKET" != "None" ]
          then

            APP_BUCKET=$(aws cloudformation describe-stack-resources \
              --stack-name "$BUCKET" \
              --region "$AWS_REGION" \
              --logical-resource-id S3Bucket \
              --query 'StackResources[0].PhysicalResourceId' \
              --output text \
              --no-cli-pager \
              2>/dev/null || true)

          else

            APP_BUCKET=""

          fi

          echo "bucket=$APP_BUCKET" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Application S3 Bucket:"
          echo "$APP_BUCKET"


      # ======================================================
      # STEP 9
      # DISCOVER RDS
      # ======================================================

      - name: "Step 9 - Discover RDS Instance"
        id: rds

        if: steps.main_stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "=================================================="
          echo "DISCOVER RDS DATABASE"
          echo "=================================================="

          RDS_STACK=$(aws cloudformation list-stack-resources \
            --stack-name "$MAIN_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackResourceSummaries[?LogicalResourceId=='RDSNestedStack'].PhysicalResourceId" \
            --output text \
            --no-cli-pager \
            2>/dev/null || true)

          echo ""
          echo "RDS Nested Stack:"
          echo "$RDS_STACK"

          if [ -n "$RDS_STACK" ] && [ "$RDS_STACK" != "None" ]
          then

            RDS_INSTANCE=$(aws cloudformation describe-stack-resources \
              --stack-name "$RDS_STACK" \
              --region "$AWS_REGION" \
              --logical-resource-id RDSDatabase \
              --query 'StackResources[0].PhysicalResourceId' \
              --output text \
              --no-cli-pager \
              2>/dev/null || true)

          else

            RDS_INSTANCE=""

          fi

          echo "instance=$RDS_INSTANCE" >> "$GITHUB_OUTPUT"

          echo ""
          echo "RDS Instance:"
          echo "$RDS_INSTANCE"


      # ======================================================
      # STEP 10
      # DISABLE RDS DELETION PROTECTION
      # ======================================================

      - name: "Step 10 - Disable RDS Deletion Protection"

        if: steps.rds.outputs.instance != ''

        shell: bash

        run: |

          set -e

          RDS_INSTANCE="${{ steps.rds.outputs.instance }}"

          echo "=================================================="
          echo "RDS DELETION PROTECTION"
          echo "=================================================="

          PROTECTION=$(aws rds describe-db-instances \
            --db-instance-identifier "$RDS_INSTANCE" \
            --region "$AWS_REGION" \
            --query 'DBInstances[0].DeletionProtection' \
            --output text \
            --no-cli-pager \
            2>/dev/null || echo "NOT_FOUND")

          echo ""
          echo "RDS Instance:"
          echo "$RDS_INSTANCE"

          echo ""
          echo "Deletion Protection:"
          echo "$PROTECTION"

          if [ "$PROTECTION" = "True" ]
          then

            echo ""
            echo "Disabling RDS deletion protection..."

            aws rds modify-db-instance \
              --db-instance-identifier "$RDS_INSTANCE" \
              --no-deletion-protection \
              --apply-immediately \
              --region "$AWS_REGION" \
              --no-cli-pager

            echo ""
            echo "RDS deletion protection disabled."

          else

            echo ""
            echo "RDS deletion protection already disabled."

          fi


      # ======================================================
      # ======================================================
      # PHASE 1
      # ECS CLEANUP
      # ======================================================
      # ======================================================


      # ======================================================
      # STEP 11
      # STOP ECS SERVICE
      #
      # ECS must be stopped before deleting:
      #
      #   - ECS stack
      #   - ALB
      #   - Security Groups
      #   - VPC Endpoints
      #   - Subnets
      #
      # ======================================================

      - name: "Step 11 - Stop ECS Service"

        if: steps.ecs_stack.outputs.exists == 'true'

        shell: bash

        run: |

          set -e

          echo "=================================================="
          echo "STOP ECS SERVICE"
          echo "=================================================="

          if aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo ""
            echo "Scaling ECS service to zero..."

            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_SERVICE" \
              --desired-count 0 \
              --region "$AWS_REGION" \
              --no-cli-pager

          else

            echo ""
            echo "ECS service does not exist."

          fi


      # ======================================================
      # STEP 12
      # WAIT FOR ECS TASKS
      # ======================================================

      - name: "Step 12 - Wait For ECS Tasks To Stop"

        if: steps.ecs_stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "=================================================="
          echo "WAITING FOR ECS TASKS"
          echo "=================================================="

          for ATTEMPT in $(seq 1 60)
          do

            RUNNING=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --region "$AWS_REGION" \
              --query 'services[0].runningCount' \
              --output text \
              --no-cli-pager \
              2>/dev/null || echo "0")

            echo ""
            echo "Attempt: $ATTEMPT / 60"
            echo "Running Tasks: $RUNNING"

            if [ "$RUNNING" = "0" ] || [ "$RUNNING" = "None" ]
            then

              echo ""
              echo "All ECS tasks have stopped."

              break

            fi

            sleep 10

          done


      # ======================================================
      # STEP 13
      # DELETE ECS SERVICE
      #
      # The ECS stack is standalone, therefore it is safe
      # to remove the service before deleting the stack.
      # ======================================================

      - name: "Step 13 - Delete ECS Service"

        if: steps.ecs_stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "=================================================="
          echo "DELETE ECS SERVICE"
          echo "=================================================="

          if aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            aws ecs delete-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_SERVICE" \
              --force \
              --region "$AWS_REGION" \
              --no-cli-pager \
              || true

            echo ""
            echo "ECS service deletion requested."

          else

            echo ""
            echo "ECS service already deleted."

          fi


      # ======================================================
      # STEP 14
      # WAIT FOR ECS SERVICE DELETION
      # ======================================================

      - name: "Step 14 - Wait For ECS Service Deletion"

        if: steps.ecs_stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "=================================================="
          echo "WAITING FOR ECS SERVICE DELETION"
          echo "=================================================="

          for ATTEMPT in $(seq 1 30)
          do

            if aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --region "$AWS_REGION" \
              --no-cli-pager \
              > /dev/null 2>&1
            then

              STATUS=$(aws ecs describe-services \
                --cluster "$ECS_CLUSTER" \
                --services "$ECS_SERVICE" \
                --region "$AWS_REGION" \
                --query 'services[0].status' \
                --output text \
                --no-cli-pager \
                2>/dev/null || echo "INACTIVE")

              echo ""
              echo "Attempt: $ATTEMPT / 30"
              echo "Service Status: $STATUS"

              if [ "$STATUS" = "INACTIVE" ]
              then

                echo "ECS service is inactive."

                break

              fi

            else

              echo ""
              echo "ECS service no longer exists."

              break

            fi

            sleep 10

          done


      # ======================================================
      # ======================================================
      # PHASE 2
      # DELETE STANDALONE ECS + ECR STACK
      # ======================================================
      # ======================================================
      #
      # IMPORTANT:
      #
      # This happens BEFORE the MAIN stack.
      #
      # Why?
      #
      # ECS stack consumes:
      #
      #   VPC
      #   Public Subnets
      #   Private Subnets
      #   Private Route Table
      #
      # Therefore the ECS stack must disappear before
      # those network resources are deleted.
      #
      # ======================================================


      # ======================================================
      # STEP 15
      # DELETE ECS STACK
      # ======================================================

      - name: "Step 15 - Delete Standalone ECS ECR Stack"

        if: steps.ecs_stack.outputs.exists == 'true'

        shell: bash

        run: |

          set -e

          echo "=================================================="
          echo "DELETE STANDALONE ECS / ECR STACK"
          echo "=================================================="

          echo ""
          echo "Stack:"
          echo "$ECS_STACK_NAME"

          aws cloudformation delete-stack \
            --stack-name "$ECS_STACK_NAME" \
            --region "$AWS_REGION" \
            --no-cli-pager

          echo ""
          echo "ECS stack deletion started."


      # ======================================================
      # STEP 16
      # WAIT FOR ECS STACK DELETION
      # ======================================================

      - name: "Step 16 - Wait For ECS ECR Stack Deletion"

        if: steps.ecs_stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "=================================================="
          echo "WAITING FOR ECS STACK DELETION"
          echo "=================================================="

          if aws cloudformation wait stack-delete-complete \
            --stack-name "$ECS_STACK_NAME" \
            --region "$AWS_REGION"
          then

            echo ""
            echo "SUCCESS:"
            echo "Standalone ECS/ECR stack deleted."

          else

            echo ""
            echo "ERROR:"
            echo "Standalone ECS/ECR stack deletion failed."

            echo ""
            echo "CloudFormation DELETE_FAILED resources:"

            aws cloudformation describe-stack-events \
              --stack-name "$ECS_STACK_NAME" \
              --region "$AWS_REGION" \
              --query "StackEvents[?ResourceStatus=='DELETE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]" \
              --output table \
              --no-cli-pager \
              || true

            exit 1

          fi


      # ======================================================
      # STEP 17
      # VERIFY ECR REPOSITORY IS GONE
      # ======================================================

      - name: "Step 17 - Verify ECR Repository Deletion"

        shell: bash

        run: |

          echo "=================================================="
          echo "VERIFY ECR REPOSITORY"
          echo "=================================================="

          if aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo ""
            echo "WARNING:"
            echo "ECR repository still exists."

            echo ""
            echo "Deleting remaining ECR repository manually..."

            aws ecr delete-repository \
              --repository-name "$ECR_REPOSITORY" \
              --force \
              --region "$AWS_REGION" \
              --no-cli-pager \
              || true

          else

            echo ""
            echo "ECR repository is deleted."

          fi


      # ======================================================
      # ======================================================
      # PHASE 3
      # EMPTY APPLICATION S3 BUCKET
      # ======================================================
      # ======================================================
      #
      # This bucket belongs to S3NestedStack.
      #
      # We do NOT delete S3NestedStack directly.
      #
      # CloudFormation will delete S3NestedStack when the
      # MAIN stack is deleted.
      #
      # We only empty its bucket first.
      #
      # ======================================================


      # ======================================================
      # STEP 18
      # EMPTY APPLICATION S3 BUCKET
      # ======================================================

      - name: "Step 18 - Empty Application S3 Bucket"

        if: steps.app_s3.outputs.bucket != ''

        shell: bash

        run: |

          set -e

          BUCKET="${{ steps.app_s3.outputs.bucket }}"

          echo "=================================================="
          echo "EMPTY APPLICATION S3 BUCKET"
          echo "=================================================="

          echo ""
          echo "Bucket:"
          echo "$BUCKET"

          echo ""
          echo "Deleting all current objects..."

          aws s3 rm \
            "s3://$BUCKET" \
            --recursive \
            --region "$AWS_REGION" \
            || true

          echo ""
          echo "Checking versioned objects..."

          while true
          do

            VERSION_DATA=$(aws s3api list-object-versions \
              --bucket "$BUCKET" \
              --region "$AWS_REGION" \
              --output json \
              --no-cli-pager)

            VERSION_COUNT=$(echo "$VERSION_DATA" | jq '(.Versions // []) | length')

            DELETE_MARKER_COUNT=$(echo "$VERSION_DATA" | jq '(.DeleteMarkers // []) | length')

            TOTAL=$((VERSION_COUNT + DELETE_MARKER_COUNT))

            echo ""
            echo "Versions:"
            echo "$VERSION_COUNT"

            echo "Delete markers:"
            echo "$DELETE_MARKER_COUNT"

            echo "Total:"
            echo "$TOTAL"

            if [ "$TOTAL" -eq 0 ]
            then

              echo ""
              echo "Application bucket is completely empty."

              break

            fi

            echo "$VERSION_DATA" |
              jq '{
                Objects:
                (
                  ((.Versions // []) + (.DeleteMarkers // []))
                  | map({
                      Key: .Key,
                      VersionId: .VersionId
                    })
                  | .[0:1000]
                ),
                Quiet: true
              }' > /tmp/app-s3-delete.json

            aws s3api delete-objects \
              --bucket "$BUCKET" \
              --delete file:///tmp/app-s3-delete.json \
              --region "$AWS_REGION" \
              --no-cli-pager

          done


      # ======================================================
      # ======================================================
      # PHASE 4
      # DELETE MAIN STACK
      # ======================================================
      # ======================================================
      #
      # At this point:
      #
      #   ECS stack = deleted
      #   ECR       = deleted
      #   ECS tasks = stopped
      #   ECS ENIs  = released
      #   ALB       = deleted by ECS stack
      #   VPC endpoints = deleted by ECS stack
      #   App S3 bucket = empty
      #
      # NOW the MAIN stack can safely delete:
      #
      #   S3NestedStack
      #   RDSNestedStack
      #   EC2WebServerStack
      #   VPC
      #   Subnets
      #   Route tables
      #   Security groups
      #   Internet Gateway
      #
      # ======================================================


      # ======================================================
      # STEP 19
      # DELETE MAIN STACK
      # ======================================================

      - name: "Step 19 - Delete Main CloudFormation Stack"

        if: steps.main_stack.outputs.exists == 'true'

        shell: bash

        run: |

          set -e

          echo "=================================================="
          echo "DELETE MAIN CLOUDFORMATION STACK"
          echo "=================================================="

          echo ""
          echo "Stack:"
          echo "$MAIN_STACK_NAME"

          aws cloudformation delete-stack \
            --stack-name "$MAIN_STACK_NAME" \
            --region "$AWS_REGION" \
            --no-cli-pager

          echo ""
          echo "Main stack deletion started."


      # ======================================================
      # STEP 20
      # WAIT FOR MAIN STACK
      # ======================================================

      - name: "Step 20 - Wait For Main Stack Deletion"

        if: steps.main_stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "=================================================="
          echo "WAITING FOR MAIN STACK DELETION"
          echo "=================================================="

          if aws cloudformation wait stack-delete-complete \
            --stack-name "$MAIN_STACK_NAME" \
            --region "$AWS_REGION"
          then

            echo ""
            echo "=================================================="
            echo "SUCCESS"
            echo "=================================================="

            echo ""
            echo "Main CloudFormation stack deleted."

          else

            echo ""
            echo "=================================================="
            echo "MAIN STACK DELETE FAILED"
            echo "=================================================="

            echo ""
            echo "DELETE_FAILED resources:"

            aws cloudformation describe-stack-events \
              --stack-name "$MAIN_STACK_NAME" \
              --region "$AWS_REGION" \
              --query "StackEvents[?ResourceStatus=='DELETE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]" \
              --output table \
              --no-cli-pager \
              || true

            exit 1

          fi


      # ======================================================
      # ======================================================
      # PHASE 5
      # TEMPLATE BUCKET CLEANUP
      # ======================================================
      # ======================================================
      #
      # This is intentionally performed AFTER the MAIN stack.
      #
      # The main stack contains nested stacks whose templates
      # originally came from this bucket.
      #
      # Keeping the template bucket until the main stack has
      # finished deleting gives us the safest dependency order.
      #
      # ======================================================


      # ======================================================
      # STEP 21
      # DISCOVER TEMPLATE BUCKET
      # ======================================================

      - name: "Step 21 - Discover Template Bucket"

        id: template_bucket

        if: steps.template_stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "=================================================="
          echo "DISCOVER TEMPLATE BUCKET"
          echo "=================================================="

          BUCKET=$(aws cloudformation list-stack-resources \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --query "StackResourceSummaries[?LogicalResourceId=='TemplateBucket'].PhysicalResourceId" \
            --output text \
            --no-cli-pager \
            2>/dev/null || true)

          echo ""
          echo "Template Bucket:"
          echo "$BUCKET"

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"


      # ======================================================
      # STEP 22
      # EMPTY TEMPLATE BUCKET
      #
      # This bucket is versioned.
      # Therefore we delete:
      #
      #   - current objects
      #   - old versions
      #   - delete markers
      # ======================================================

      - name: "Step 22 - Empty Versioned Template Bucket"

        if: steps.template_bucket.outputs.bucket != ''

        shell: bash

        run: |

          set -e

          BUCKET="${{ steps.template_bucket.outputs.bucket }}"

          echo "=================================================="
          echo "EMPTY TEMPLATE BUCKET"
          echo "=================================================="

          echo ""
          echo "Bucket:"
          echo "$BUCKET"

          while true
          do

            VERSION_DATA=$(aws s3api list-object-versions \
              --bucket "$BUCKET" \
              --region "$AWS_REGION" \
              --output json \
              --no-cli-pager)

            VERSION_COUNT=$(echo "$VERSION_DATA" | jq '(.Versions // []) | length')

            DELETE_MARKER_COUNT=$(echo "$VERSION_DATA" | jq '(.DeleteMarkers // []) | length')

            TOTAL=$((VERSION_COUNT + DELETE_MARKER_COUNT))

            echo ""
            echo "Versions:"
            echo "$VERSION_COUNT"

            echo "Delete markers:"
            echo "$DELETE_MARKER_COUNT"

            echo "Total:"
            echo "$TOTAL"

            if [ "$TOTAL" -eq 0 ]
            then

              echo ""
              echo "Template bucket is empty."

              break

            fi

            echo "$VERSION_DATA" |
              jq '{
                Objects:
                (
                  ((.Versions // []) + (.DeleteMarkers // []))
                  | map({
                      Key: .Key,
                      VersionId: .VersionId
                    })
                  | .[0:1000]
                ),
                Quiet: true
              }' > /tmp/template-bucket-delete.json

            aws s3api delete-objects \
              --bucket "$BUCKET" \
              --delete file:///tmp/template-bucket-delete.json \
              --region "$AWS_REGION" \
              --no-cli-pager

          done


      # ======================================================
      # STEP 23
      # DELETE TEMPLATE BUCKET STACK
      # ======================================================

      - name: "Step 23 - Delete Template Bucket Stack"

        if: steps.template_stack.outputs.exists == 'true'

        shell: bash

        run: |

          set -e

          echo "=================================================="
          echo "DELETE TEMPLATE BUCKET STACK"
          echo "=================================================="

          aws cloudformation delete-stack \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --no-cli-pager

          echo ""
          echo "Waiting for Template Bucket stack..."

          aws cloudformation wait stack-delete-complete \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION"

          echo ""
          echo "Template Bucket stack deleted."


      # ======================================================
      # ======================================================
      # PHASE 6
      # FINAL VERIFICATION
      # ======================================================
      # ======================================================


      # ======================================================
      # STEP 24
      # VERIFY MAIN STACK
      # ======================================================

      - name: "Step 24 - Verify Main Stack"

        shell: bash

        run: |

          echo "=================================================="
          echo "VERIFY MAIN STACK"
          echo "=================================================="

          if aws cloudformation describe-stacks \
            --stack-name "$MAIN_STACK_NAME" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo ""
            echo "WARNING:"
            echo "Main stack still exists."

          else

            echo ""
            echo "SUCCESS:"
            echo "Main stack has been deleted."

          fi


      # ======================================================
      # STEP 25
      # VERIFY ECS STACK
      # ======================================================

      - name: "Step 25 - Verify ECS Stack"

        shell: bash

        run: |

          echo "=================================================="
          echo "VERIFY ECS STACK"
          echo "=================================================="

          if aws cloudformation describe-stacks \
            --stack-name "$ECS_STACK_NAME" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo ""
            echo "WARNING:"
            echo "ECS stack still exists."

          else

            echo ""
            echo "SUCCESS:"
            echo "ECS stack has been deleted."

          fi


      # ======================================================
      # STEP 26
      # VERIFY ECR
      # ======================================================

      - name: "Step 26 - Verify ECR"

        shell: bash

        run: |

          echo "=================================================="
          echo "VERIFY ECR"
          echo "=================================================="

          if aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo ""
            echo "WARNING:"
            echo "ECR repository still exists."

          else

            echo ""
            echo "SUCCESS:"
            echo "ECR repository has been deleted."

          fi


      # ======================================================
      # STEP 27
      # VERIFY ECS CLUSTERS
      # ======================================================

      - name: "Step 27 - Verify ECS"

        shell: bash

        run: |

          echo "=================================================="
          echo "VERIFY ECS"
          echo "=================================================="

          CLUSTERS=$(aws ecs list-clusters \
            --region "$AWS_REGION" \
            --query 'clusterArns[]' \
            --output text \
            --no-cli-pager)

          echo ""
          echo "Remaining ECS clusters:"
          echo "$CLUSTERS"

          if echo "$CLUSTERS" | grep -q "CharlieCafe"
          then

            echo ""
            echo "WARNING:"
            echo "CharlieCafe ECS cluster may still exist."

          else

            echo ""
            echo "SUCCESS:"
            echo "CharlieCafe ECS cluster is gone."

          fi


      # ======================================================
      # STEP 28
      # VERIFY TEMPLATE BUCKET STACK
      # ======================================================

      - name: "Step 28 - Verify Template Bucket Stack"

        shell: bash

        run: |

          echo "=================================================="
          echo "VERIFY TEMPLATE BUCKET STACK"
          echo "=================================================="

          if aws cloudformation describe-stacks \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo ""
            echo "WARNING:"
            echo "Template Bucket stack still exists."

          else

            echo ""
            echo "SUCCESS:"
            echo "Template Bucket stack has been deleted."

          fi


      # ======================================================
      # STEP 29
      # FINAL CLOUDFORMATION VERIFICATION
      # ======================================================

      - name: "Step 29 - Final CloudFormation Verification"

        shell: bash

        run: |

          echo "=================================================="
          echo "FINAL CLOUDFORMATION VERIFICATION"
          echo "=================================================="

          echo ""
          echo "Lab01 CloudFormation stacks still present:"

          aws cloudformation list-stacks \
            --region "$AWS_REGION" \
            --stack-status-filter \
              CREATE_IN_PROGRESS \
              CREATE_FAILED \
              CREATE_COMPLETE \
              ROLLBACK_IN_PROGRESS \
              ROLLBACK_FAILED \
              ROLLBACK_COMPLETE \
              UPDATE_IN_PROGRESS \
              UPDATE_COMPLETE \
              UPDATE_ROLLBACK_IN_PROGRESS \
              UPDATE_ROLLBACK_FAILED \
              UPDATE_ROLLBACK_COMPLETE \
              DELETE_IN_PROGRESS \
              DELETE_FAILED \
            --query "StackSummaries[?contains(StackName, 'Lab01-CloudFormation')].[StackName,StackStatus]" \
            --output table \
            --no-cli-pager \
            || true


      # ======================================================
      # STEP 30
      # FINAL SUMMARY
      # ======================================================

      - name: "Step 30 - Final Cleanup Summary"

        shell: bash

        run: |

          echo ""
          echo "=========================================================="
          echo "        AWS CLOUDFORMATION LAB CLEANUP COMPLETE"
          echo "=========================================================="

          echo ""
          echo "AWS Region:"
          echo "  $AWS_REGION"

          echo ""
          echo "Deletion Order:"
          echo ""
          echo "  01. Discover MAIN stack"
          echo "  02. Discover standalone ECS stack"
          echo "  03. Discover Template Bucket stack"
          echo "  04. Discover application S3 bucket"
          echo "  05. Disable RDS deletion protection"
          echo ""
          echo "  06. Stop ECS service"
          echo "  07. Wait for ECS tasks"
          echo "  08. Delete ECS service"
          echo "  09. Wait for ECS service"
          echo ""
          echo "  10. Delete standalone ECS/ECR stack"
          echo "  11. Wait for ECS/ECR stack"
          echo ""
          echo "  12. Empty application S3 bucket"
          echo ""
          echo "  13. Delete MAIN stack"
          echo "  14. Wait for MAIN stack"
          echo ""
          echo "  15. Empty Template Bucket"
          echo "  16. Delete Template Bucket stack"
          echo ""
          echo "  17. Verify MAIN stack"
          echo "  18. Verify ECS stack"
          echo "  19. Verify ECR"
          echo "  20. Verify ECS cluster"
          echo "  21. Verify Template Bucket"
          echo "  22. Final CloudFormation verification"

          echo ""
          echo "=========================================================="
          echo "                    CLEANUP FINISHED"
          echo "=========================================================="

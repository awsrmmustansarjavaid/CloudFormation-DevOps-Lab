# ==========================================================
# AWS CloudFormation DevOps Lab
# GitHub Actions - Complete Stack Delete Workflow
# ==========================================================
#
# File:
#   .github/workflows/delete.yml
#
# Purpose:
# ----------------------------------------------------------
# Completely clean up the AWS CloudFormation DevOps Lab.
#
# ROOT STACK:
#
#   Lab01-CloudFormation
#          |
#          +---- EC2WebServerStack
#          |
#          +---- S3NestedStack
#          |
#          +---- RDSNestedStack
#                    |
#                    +---- RDSDatabase
#                    +---- RDSSecurityGroup
#                    +---- RDSSubnetGroup
#
#
# SEPARATE STACK:
#
#   Lab01-CloudFormation-TemplateBucket
#
# The TemplateBucket stack is NOT a nested stack of
# Lab01-CloudFormation.
#
# Therefore it must be deleted separately.
#
#
# DELETION STRATEGY:
# ----------------------------------------------------------
#
# 1. Configure AWS credentials.
#
# 2. Check whether the root stack exists.
#
# 3. Display root stack status.
#
# 4. Display root stack resources.
#
# 5. Discover nested stacks.
#
# 6. Discover the RDS nested stack.
#
# 7. Discover the actual RDS DB instance.
#
# 8. If RDS deletion protection is enabled:
#       disable it.
#
# 9. Start normal CloudFormation deletion.
#
# 10. Wait for normal deletion.
#
# 11. If normal deletion succeeds:
#       continue to verification.
#
# 12. If normal deletion fails:
#       inspect DELETE_FAILED resources.
#
# 13. Attempt direct RDS deletion if RDS still exists.
#
# 14. Wait for RDS deletion.
#
# 15. Retry CloudFormation using:
#
#       FORCE_DELETE_STACK
#
# 16. Wait for final CloudFormation deletion.
#
# 17. Verify the root stack no longer exists.
#
# 18. Delete the separate Template Bucket stack.
#
# 19. Empty the template bucket first if necessary.
#
# 20. Verify RDS cleanup.
#
# 21. Print final cleanup summary.
#
#
# IMPORTANT:
# ----------------------------------------------------------
#
# FORCE_DELETE_STACK does NOT mean:
#
#   "AWS will magically delete every resource."
#
# It allows CloudFormation to force deletion of a stack that
# is stuck in DELETE_FAILED.
#
# Individual AWS resources can still remain if AWS cannot
# delete them.
#
# This workflow therefore performs additional verification.
#
# ==========================================================


# ==========================================================
# WORKFLOW NAME
# ==========================================================

name: Delete AWS CloudFormation Stack


# ==========================================================
# WORKFLOW TRIGGER
# ==========================================================
#
# This workflow is intentionally manual.
#
# GitHub:
#
#   Actions
#      ->
#   Delete AWS CloudFormation Stack
#      ->
#   Run workflow
#
# ==========================================================

on:

  workflow_dispatch:


# ==========================================================
# GLOBAL ENVIRONMENT VARIABLES
# ==========================================================

env:

  # AWS region containing the lab resources.
  AWS_REGION: us-east-1

  # Main/root CloudFormation stack.
  STACK_NAME: Lab01-CloudFormation

  # Separate CloudFormation stack containing the S3
  # template bucket.
  TEMPLATE_BUCKET_STACK: Lab01-CloudFormation-TemplateBucket


# ==========================================================
# JOB
# ==========================================================

jobs:

  delete-stack:

    # ------------------------------------------------------
    # GitHub-hosted Ubuntu runner.
    # ------------------------------------------------------

    runs-on: ubuntu-latest

    name: Delete CloudFormation Stack


    # ======================================================
    # STEPS
    # ======================================================

    steps:


    # ======================================================
    # STEP 1
    # Checkout Repository
    # ======================================================

    - name: Checkout Repository

      uses: actions/checkout@v4


    # ======================================================
    # STEP 2
    # Configure AWS Credentials
    # ======================================================
    #
    # Required GitHub repository secrets:
    #
    #   AWS_ACCESS_KEY_ID
    #   AWS_SECRET_ACCESS_KEY
    #
    # ======================================================

    - name: Configure AWS Credentials

      uses: aws-actions/configure-aws-credentials@v4

      with:

        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

        aws-region: ${{ env.AWS_REGION }}


    # ======================================================
    # STEP 3
    # Verify AWS CLI and AWS Account
    # ======================================================

    - name: Verify AWS CLI

      shell: bash

      run: |

        echo "======================================"
        echo "AWS CLI INFORMATION"
        echo "======================================"

        aws --version

        echo ""

        echo "======================================"
        echo "AWS ACCOUNT"
        echo "======================================"

        aws sts get-caller-identity

        echo ""

        echo "======================================"
        echo "DEPLOYMENT VALUES"
        echo "======================================"

        echo "AWS Region              : $AWS_REGION"
        echo "Root Stack              : $STACK_NAME"
        echo "Template Bucket Stack   : $TEMPLATE_BUCKET_STACK"

        echo ""


    # ======================================================
    # STEP 4
    # Check Whether Root Stack Exists
    # ======================================================

    - name: Check Root Stack

      id: stack

      shell: bash

      run: |

        echo "======================================"
        echo "CHECKING ROOT CLOUDFORMATION STACK"
        echo "======================================"

        if aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --no-cli-pager \
          > /dev/null 2>&1
        then

          echo "exists=true" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Root CloudFormation stack exists."

        else

          echo "exists=false" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Root CloudFormation stack does not exist."

        fi


    # ======================================================
    # STEP 5
    # Get Current Stack Status
    # ======================================================

    - name: Get Stack Status

      if: steps.stack.outputs.exists == 'true'

      id: status

      shell: bash

      run: |

        echo "======================================"
        echo "CURRENT STACK STATUS"
        echo "======================================"

        STACK_STATUS=$(aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "Stacks[0].StackStatus" \
          --output text \
          --no-cli-pager)

        echo ""
        echo "Stack Name   : $STACK_NAME"
        echo "Stack Status : $STACK_STATUS"
        echo ""

        echo "stack_status=$STACK_STATUS" >> "$GITHUB_OUTPUT"


    # ======================================================
    # STEP 6
    # Display Stack Information
    # ======================================================

    - name: Display Stack Information

      if: steps.stack.outputs.exists == 'true'

      shell: bash

      run: |

        echo "======================================"
        echo "STACK INFORMATION"
        echo "======================================"

        aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --output table \
          --no-cli-pager


    # ======================================================
    # STEP 7
    # Display Current Resources
    # ======================================================

    - name: Display Current Resources

      if: steps.stack.outputs.exists == 'true'

      shell: bash

      run: |

        echo "======================================"
        echo "CURRENT ROOT STACK RESOURCES"
        echo "======================================"

        aws cloudformation list-stack-resources \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "StackResourceSummaries[].[LogicalResourceId,ResourceType,ResourceStatus,PhysicalResourceId]" \
          --output table \
          --no-cli-pager \
          || true


    # ======================================================
    # STEP 8
    # Display CloudFormation Failure Information
    # ======================================================
    #
    # This is especially useful when the stack is already
    # DELETE_FAILED.
    #
    # ======================================================

    - name: Display Failed Resources

      if: steps.stack.outputs.exists == 'true'

      shell: bash

      run: |

        echo "======================================"
        echo "FAILED RESOURCE INFORMATION"
        echo "======================================"

        aws cloudformation describe-stack-events \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "StackEvents[?contains(ResourceStatus, 'FAILED')].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
          --output table \
          --no-cli-pager \
          || true


    # ======================================================
    # STEP 9
    # Discover RDS Nested Stack
    # ======================================================
    #
    # RDSDatabase is NOT directly inside the root stack.
    #
    # It is inside:
    #
    #   Lab01-CloudFormation
    #       |
    #       +-- RDSNestedStack
    #               |
    #               +-- RDSDatabase
    #
    # Therefore we first find RDSNestedStack.
    #
    # ======================================================

    - name: Discover RDS Nested Stack

      if: steps.stack.outputs.exists == 'true'

      id: rds_nested

      shell: bash

      run: |

        echo "======================================"
        echo "DISCOVERING RDS NESTED STACK"
        echo "======================================"

        RDS_NESTED_STACK_ID=$(aws cloudformation list-stack-resources \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "StackResourceSummaries[?LogicalResourceId=='RDSNestedStack'].PhysicalResourceId" \
          --output text \
          --no-cli-pager)

        echo ""
        echo "RDS Nested Stack:"
        echo "$RDS_NESTED_STACK_ID"
        echo ""

        if [ -n "$RDS_NESTED_STACK_ID" ] &&
           [ "$RDS_NESTED_STACK_ID" != "None" ]
        then

          echo "RDS nested stack found."

          echo "rds_nested_stack=$RDS_NESTED_STACK_ID" >> "$GITHUB_OUTPUT"

        else

          echo "RDS nested stack was not found."

          echo "rds_nested_stack=" >> "$GITHUB_OUTPUT"

        fi


    # ======================================================
    # STEP 10
    # Discover Actual RDS Database
    # ======================================================
    #
    # IMPORTANT:
    #
    # RDSDatabase belongs to the nested RDS stack.
    #
    # We therefore query the nested stack rather than the
    # root stack.
    #
    # ======================================================

    - name: Discover RDS Database

      if: |
        steps.stack.outputs.exists == 'true' &&
        steps.rds_nested.outputs.rds_nested_stack != ''

      id: rds

      shell: bash

      run: |

        echo "======================================"
        echo "DISCOVERING RDS DATABASE"
        echo "======================================"

        RDS_NESTED_STACK_ID="${{ steps.rds_nested.outputs.rds_nested_stack }}"

        RDS_INSTANCE=$(aws cloudformation describe-stack-resources \
          --stack-name "$RDS_NESTED_STACK_ID" \
          --region "$AWS_REGION" \
          --logical-resource-id RDSDatabase \
          --query "StackResources[0].PhysicalResourceId" \
          --output text \
          --no-cli-pager \
          2>/dev/null || true)

        echo ""
        echo "RDS Database Physical ID:"
        echo "$RDS_INSTANCE"
        echo ""

        if [ -n "$RDS_INSTANCE" ] &&
           [ "$RDS_INSTANCE" != "None" ]
        then

          echo "RDS database found."

          echo "rds_instance=$RDS_INSTANCE" >> "$GITHUB_OUTPUT"

        else

          echo "RDS database was not found."

          echo "rds_instance=" >> "$GITHUB_OUTPUT"

        fi


    # ======================================================
    # STEP 11
    # Check RDS Deletion Protection
    # ======================================================
    #
    # RDS deletion can fail when:
    #
    #   DeletionProtection = true
    #
    # This step disables deletion protection before attempting
    # direct RDS cleanup.
    #
    # ======================================================

    - name: Disable RDS Deletion Protection

      if: |
        steps.rds.outputs.rds_instance != ''

      shell: bash

      run: |

        echo "======================================"
        echo "CHECKING RDS DELETION PROTECTION"
        echo "======================================"

        RDS_INSTANCE="${{ steps.rds.outputs.rds_instance }}"

        DELETE_PROTECTION=$(aws rds describe-db-instances \
          --db-instance-identifier "$RDS_INSTANCE" \
          --region "$AWS_REGION" \
          --query "DBInstances[0].DeletionProtection" \
          --output text \
          --no-cli-pager \
          2>/dev/null || true)

        echo ""
        echo "RDS Instance          : $RDS_INSTANCE"
        echo "Deletion Protection   : $DELETE_PROTECTION"
        echo ""

        if [ "$DELETE_PROTECTION" = "True" ]
        then

          echo "Deletion protection is enabled."

          echo "Disabling deletion protection..."

          aws rds modify-db-instance \
            --db-instance-identifier "$RDS_INSTANCE" \
            --region "$AWS_REGION" \
            --no-deletion-protection \
            --apply-immediately \
            --no-cli-pager

          echo ""
          echo "Deletion protection disable request submitted."

        else

          echo "RDS deletion protection is already disabled."

        fi


    # ======================================================
    # STEP 12
    # Start Normal CloudFormation Deletion
    # ======================================================
    #
    # If the stack is already DELETE_FAILED, normal deletion
    # cannot be started normally.
    #
    # In that case we immediately use FORCE_DELETE_STACK.
    #
    # ======================================================

    - name: Start CloudFormation Deletion

      if: steps.stack.outputs.exists == 'true'

      id: delete

      shell: bash

      run: |

        echo "======================================"
        echo "STARTING CLOUDFORMATION DELETION"
        echo "======================================"

        CURRENT_STATUS="${{ steps.status.outputs.stack_status }}"

        echo ""
        echo "Stack Name : $STACK_NAME"
        echo "Region     : $AWS_REGION"
        echo "Status     : $CURRENT_STATUS"
        echo ""

        if [ "$CURRENT_STATUS" = "DELETE_FAILED" ]
        then

          echo "Stack is already DELETE_FAILED."

          echo ""
          echo "Using FORCE_DELETE_STACK."

          aws cloudformation delete-stack \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --deletion-mode FORCE_DELETE_STACK \
            --no-cli-pager

          echo "mode=force" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Force deletion started."

        else

          echo "Starting normal CloudFormation deletion."

          aws cloudformation delete-stack \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-cli-pager

          echo "mode=standard" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Normal deletion started."

        fi


    # ======================================================
    # STEP 13
    # Wait for Normal CloudFormation Deletion
    # ======================================================
    #
    # continue-on-error is intentional.
    #
    # If normal deletion fails, the workflow continues into
    # the recovery section.
    #
    # ======================================================

    - name: Wait for Normal Deletion

      if: |
        steps.stack.outputs.exists == 'true' &&
        steps.delete.outputs.mode == 'standard'

      id: normal_wait

      continue-on-error: true

      shell: bash

      run: |

        echo "======================================"
        echo "WAITING FOR NORMAL DELETION"
        echo "======================================"

        if aws cloudformation wait stack-delete-complete \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION"
        then

          echo "deleted=true" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Normal CloudFormation deletion completed."

        else

          echo "deleted=false" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Normal CloudFormation deletion failed."

        fi


    # ======================================================
    # STEP 14
    # Show DELETE_FAILED Resources
    # ======================================================

    - name: Show Deletion Failure

      if: |
        steps.stack.outputs.exists == 'true' &&
        steps.delete.outputs.mode == 'standard' &&
        steps.normal_wait.outputs.deleted == 'false'

      shell: bash

      run: |

        echo "======================================"
        echo "CLOUDFORMATION DELETION FAILURE"
        echo "======================================"

        echo ""

        aws cloudformation describe-stack-events \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "StackEvents[?ResourceStatus=='DELETE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]" \
          --output table \
          --no-cli-pager \
          || true


    # ======================================================
    # STEP 15
    # Check RDS Status
    # ======================================================
    #
    # This step is executed when:
    #
    #   - normal deletion failed
    #
    # OR
    #
    #   - the stack was already DELETE_FAILED.
    #
    # ======================================================

    - name: Check RDS Status

      if: |
        steps.stack.outputs.exists == 'true' &&
        (
          steps.delete.outputs.mode == 'force' ||
          steps.normal_wait.outputs.deleted == 'false'
        )

      shell: bash

      run: |

        echo "======================================"
        echo "RDS DATABASE STATUS"
        echo "======================================"

        aws rds describe-db-instances \
          --region "$AWS_REGION" \
          --query "DBInstances[*].[DBInstanceIdentifier,DBInstanceStatus,DeletionProtection,PubliclyAccessible]" \
          --output table \
          --no-cli-pager \
          || true


    # ======================================================
    # STEP 16
    # Attempt Direct RDS Deletion
    # ======================================================
    #
    # This is the recovery operation.
    #
    # The RDS instance belongs to the nested stack, but we
    # directly request deletion from the RDS service.
    #
    # This is useful when CloudFormation cannot remove the
    # RDS resource itself.
    #
    # skip-final-snapshot is intentional for this lab.
    #
    # ======================================================

    - name: Attempt RDS Cleanup

      if: |
        steps.stack.outputs.exists == 'true' &&
        (
          steps.delete.outputs.mode == 'force' ||
          steps.normal_wait.outputs.deleted == 'false'
        ) &&
        steps.rds.outputs.rds_instance != ''

      shell: bash

      run: |

        echo "======================================"
        echo "ATTEMPTING DIRECT RDS CLEANUP"
        echo "======================================"

        RDS_INSTANCE="${{ steps.rds.outputs.rds_instance }}"

        echo ""
        echo "RDS Instance:"
        echo "$RDS_INSTANCE"
        echo ""

        # --------------------------------------------------
        # Check that the instance still exists.
        # --------------------------------------------------

        if aws rds describe-db-instances \
          --db-instance-identifier "$RDS_INSTANCE" \
          --region "$AWS_REGION" \
          --no-cli-pager \
          > /dev/null 2>&1
        then

          echo "RDS instance still exists."

          echo ""
          echo "Requesting RDS deletion..."

          aws rds delete-db-instance \
            --db-instance-identifier "$RDS_INSTANCE" \
            --region "$AWS_REGION" \
            --skip-final-snapshot \
            --delete-automated-backups \
            --no-cli-pager \
            || true

          echo ""
          echo "RDS deletion request submitted."

        else

          echo "RDS instance no longer exists."

        fi


    # ======================================================
    # STEP 17
    # Wait for RDS Deletion
    # ======================================================
    #
    # We poll RDS manually instead of depending only on the
    # AWS CLI waiter.
    #
    # Maximum wait:
    #
    #   60 attempts x 30 seconds
    #
    # Approximately 30 minutes.
    #
    # ======================================================

    - name: Wait for RDS Deletion

      if: |
        steps.stack.outputs.exists == 'true' &&
        (
          steps.delete.outputs.mode == 'force' ||
          steps.normal_wait.outputs.deleted == 'false'
        ) &&
        steps.rds.outputs.rds_instance != ''

      shell: bash

      run: |

        echo "======================================"
        echo "WAITING FOR RDS DELETION"
        echo "======================================"

        RDS_INSTANCE="${{ steps.rds.outputs.rds_instance }}"

        for ATTEMPT in $(seq 1 60)
        do

          RDS_STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier "$RDS_INSTANCE" \
            --region "$AWS_REGION" \
            --query "DBInstances[0].DBInstanceStatus" \
            --output text \
            --no-cli-pager \
            2>/dev/null || echo "NOT_FOUND")

          echo ""
          echo "Attempt $ATTEMPT/60"
          echo "RDS Status: $RDS_STATUS"

          if [ "$RDS_STATUS" = "NOT_FOUND" ]
          then

            echo ""
            echo "RDS instance has been deleted."

            break

          fi

          if [ "$ATTEMPT" -eq 60 ]
          then

            echo ""
            echo "RDS deletion is still in progress."

            echo "Continuing with CloudFormation force cleanup."

            break

          fi

          sleep 30

        done


    # ======================================================
    # STEP 18
    # Force Delete Root CloudFormation Stack
    # ======================================================
    #
    # This is the recovery operation after normal deletion
    # has failed.
    #
    # ======================================================

    - name: Force Delete Root Stack

      if: |
        steps.stack.outputs.exists == 'true' &&
        (
          steps.delete.outputs.mode == 'force' ||
          steps.normal_wait.outputs.deleted == 'false'
        )

      id: force

      shell: bash

      run: |

        echo "======================================"
        echo "FORCE DELETE ROOT STACK"
        echo "======================================"

        echo ""
        echo "Stack Name : $STACK_NAME"
        echo "Region     : $AWS_REGION"
        echo "Mode       : FORCE_DELETE_STACK"
        echo ""

        aws cloudformation delete-stack \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --deletion-mode FORCE_DELETE_STACK \
          --no-cli-pager

        echo ""
        echo "Force deletion request submitted."


    # ======================================================
    # STEP 19
    # Wait for Final CloudFormation Deletion
    # ======================================================

    - name: Wait for Final Stack Deletion

      if: |
        steps.stack.outputs.exists == 'true' &&
        (
          steps.delete.outputs.mode == 'force' ||
          steps.normal_wait.outputs.deleted == 'false'
        )

      shell: bash

      run: |

        echo "======================================"
        echo "WAITING FOR FINAL STACK DELETION"
        echo "======================================"

        echo ""
        echo "Waiting for CloudFormation..."

        if aws cloudformation wait stack-delete-complete \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION"
        then

          echo ""
          echo "CloudFormation final deletion completed."

        else

          echo ""
          echo "CloudFormation final deletion waiter returned"
          echo "an error."

          echo ""
          echo "Checking current stack state..."

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].[StackStatus,StackStatusReason]" \
            --output table \
            --no-cli-pager \
            || true

          exit 1

        fi


    # ======================================================
    # STEP 20
    # Verify Root Stack Is Gone
    # ======================================================

    - name: Verify Root Stack Deletion

      if: steps.stack.outputs.exists == 'true'

      shell: bash

      run: |

        echo "======================================"
        echo "VERIFYING ROOT STACK DELETION"
        echo "======================================"

        if aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --no-cli-pager \
          > /dev/null 2>&1
        then

          echo ""
          echo "ERROR:"
          echo "Root CloudFormation stack still exists."

          echo ""
          echo "Current resources:"

          aws cloudformation list-stack-resources \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --output table \
            --no-cli-pager \
            || true

          exit 1

        else

          echo ""
          echo "Root CloudFormation stack no longer exists."

        fi


    # ======================================================
    # STEP 21
    # Check RDS Cleanup Independently
    # ======================================================
    #
    # CloudFormation deletion and RDS deletion are verified
    # separately.
    #
    # ======================================================

    - name: Verify RDS Cleanup

      shell: bash

      run: |

        echo "======================================"
        echo "VERIFYING RDS CLEANUP"
        echo "======================================"

        RDS_COUNT=$(aws rds describe-db-instances \
          --region "$AWS_REGION" \
          --query "length(DBInstances)" \
          --output text \
          --no-cli-pager)

        echo ""
        echo "RDS instances currently visible: $RDS_COUNT"
        echo ""

        if [ "$RDS_COUNT" = "0" ]
        then

          echo "No RDS DB instances remain."

        else

          echo "RDS DB instances still exist."

          aws rds describe-db-instances \
            --region "$AWS_REGION" \
            --query "DBInstances[*].[DBInstanceIdentifier,DBInstanceStatus,DeletionProtection]" \
            --output table \
            --no-cli-pager

        fi


    # ======================================================
    # STEP 22
    # Delete Separate Template Bucket Stack
    # ======================================================
    #
    # IMPORTANT:
    #
    # This stack is separate from:
    #
    #   Lab01-CloudFormation
    #
    # Therefore deleting the root stack does NOT delete it.
    #
    # ======================================================

    - name: Check Template Bucket Stack

      id: template_bucket

      shell: bash

      run: |

        echo "======================================"
        echo "CHECKING TEMPLATE BUCKET STACK"
        echo "======================================"

        if aws cloudformation describe-stacks \
          --stack-name "$TEMPLATE_BUCKET_STACK" \
          --region "$AWS_REGION" \
          --no-cli-pager \
          > /dev/null 2>&1
        then

          echo "exists=true" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Template bucket stack exists."

        else

          echo "exists=false" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Template bucket stack does not exist."

        fi


    # ======================================================
    # STEP 23
    # Get Template Bucket Stack Resources
    # ======================================================
    #
    # The template bucket may contain:
    #
    #   AWS::S3::Bucket
    #
    # CloudFormation cannot normally delete a non-empty S3
    # bucket.
    #
    # Therefore we discover the bucket and empty it before
    # deleting the template bucket stack.
    #
    # ======================================================

    - name: Empty Template Bucket

      if: steps.template_bucket.outputs.exists == 'true'

      shell: bash

      run: |

        echo "======================================"
        echo "EMPTYING TEMPLATE BUCKET"
        echo "======================================"

        TEMPLATE_BUCKET=$(aws cloudformation list-stack-resources \
          --stack-name "$TEMPLATE_BUCKET_STACK" \
          --region "$AWS_REGION" \
          --query "StackResourceSummaries[?ResourceType=='AWS::S3::Bucket'].PhysicalResourceId | [0]" \
          --output text \
          --no-cli-pager)

        echo ""
        echo "Template Bucket:"
        echo "$TEMPLATE_BUCKET"
        echo ""

        if [ -n "$TEMPLATE_BUCKET" ] &&
           [ "$TEMPLATE_BUCKET" != "None" ]
        then

          echo "Checking bucket contents..."

          aws s3 rm \
            "s3://$TEMPLATE_BUCKET" \
            --recursive \
            --region "$AWS_REGION" \
            --no-cli-pager \
            || true

          echo ""
          echo "Template bucket cleanup completed."

        else

          echo "No S3 bucket was found in the template bucket stack."

        fi


    # ======================================================
    # STEP 24
    # Get Template Bucket Stack Status
    # ======================================================

    - name: Get Template Bucket Stack Status

      if: steps.template_bucket.outputs.exists == 'true'

      id: template_status

      shell: bash

      run: |

        echo "======================================"
        echo "TEMPLATE BUCKET STACK STATUS"
        echo "======================================"

        TEMPLATE_STATUS=$(aws cloudformation describe-stacks \
          --stack-name "$TEMPLATE_BUCKET_STACK" \
          --region "$AWS_REGION" \
          --query "Stacks[0].StackStatus" \
          --output text \
          --no-cli-pager)

        echo ""
        echo "Template Bucket Stack Status:"
        echo "$TEMPLATE_STATUS"
        echo ""

        echo "template_status=$TEMPLATE_STATUS" >> "$GITHUB_OUTPUT"


    # ======================================================
    # STEP 25
    # Delete Template Bucket Stack
    # ======================================================

    - name: Delete Template Bucket Stack

      if: steps.template_bucket.outputs.exists == 'true'

      shell: bash

      run: |

        echo "======================================"
        echo "DELETING TEMPLATE BUCKET STACK"
        echo "======================================"

        TEMPLATE_STATUS="${{ steps.template_status.outputs.template_status }}"

        echo ""
        echo "Stack Name : $TEMPLATE_BUCKET_STACK"
        echo "Region     : $AWS_REGION"
        echo "Status     : $TEMPLATE_STATUS"
        echo ""

        case "$TEMPLATE_STATUS" in

          CREATE_IN_PROGRESS|UPDATE_IN_PROGRESS|UPDATE_COMPLETE_CLEANUP_IN_PROGRESS|DELETE_IN_PROGRESS)

            echo "ERROR:"
            echo "Template bucket stack is currently busy."

            echo ""
            echo "Wait for the current CloudFormation operation to"
            echo "finish before running this cleanup workflow again."

            exit 1

            ;;

        esac

        echo "Starting template bucket stack deletion."

        aws cloudformation delete-stack \
          --stack-name "$TEMPLATE_BUCKET_STACK" \
          --region "$AWS_REGION" \
          --no-cli-pager

        echo ""
        echo "Template bucket stack deletion started."


    # ======================================================
    # STEP 26
    # Wait for Template Bucket Stack Deletion
    # ======================================================

    - name: Wait for Template Bucket Stack Deletion

      if: steps.template_bucket.outputs.exists == 'true'

      shell: bash

      run: |

        echo "======================================"
        echo "WAITING FOR TEMPLATE BUCKET DELETION"
        echo "======================================"

        aws cloudformation wait stack-delete-complete \
          --stack-name "$TEMPLATE_BUCKET_STACK" \
          --region "$AWS_REGION"

        echo ""
        echo "Template bucket stack deletion completed."


    # ======================================================
    # STEP 27
    # Verify Template Bucket Stack Is Gone
    # ======================================================

    - name: Verify Template Bucket Stack Deletion

      if: steps.template_bucket.outputs.exists == 'true'

      shell: bash

      run: |

        echo "======================================"
        echo "VERIFYING TEMPLATE BUCKET STACK"
        echo "======================================"

        if aws cloudformation describe-stacks \
          --stack-name "$TEMPLATE_BUCKET_STACK" \
          --region "$AWS_REGION" \
          --no-cli-pager \
          > /dev/null 2>&1
        then

          echo ""
          echo "ERROR:"
          echo "Template bucket stack still exists."

          exit 1

        else

          echo ""
          echo "Template bucket stack no longer exists."

        fi


    # ======================================================
    # STEP 28
    # Final AWS Resource Check
    # ======================================================
    #
    # This does not blindly assume that CloudFormation
    # deletion removed every AWS resource.
    #
    # ======================================================

    - name: Final AWS Resource Check

      shell: bash

      run: |

        echo "======================================"
        echo "FINAL AWS RESOURCE CHECK"
        echo "======================================"

        echo ""
        echo "RDS Instances:"
        aws rds describe-db-instances \
          --region "$AWS_REGION" \
          --query "DBInstances[*].[DBInstanceIdentifier,DBInstanceStatus]" \
          --output table \
          --no-cli-pager \
          || true

        echo ""

        echo "CloudFormation stacks matching the lab:"

        aws cloudformation list-stacks \
          --region "$AWS_REGION" \
          --stack-status-filter \
            CREATE_IN_PROGRESS \
            CREATE_FAILED \
            CREATE_COMPLETE \
            ROLLBACK_IN_PROGRESS \
            ROLLBACK_FAILED \
            ROLLBACK_COMPLETE \
            DELETE_IN_PROGRESS \
            DELETE_FAILED \
            UPDATE_IN_PROGRESS \
            UPDATE_COMPLETE \
            UPDATE_ROLLBACK_IN_PROGRESS \
            UPDATE_ROLLBACK_FAILED \
            UPDATE_ROLLBACK_COMPLETE \
          --query "StackSummaries[?contains(StackName, 'Lab01-CloudFormation')].[StackName,StackStatus]" \
          --output table \
          --no-cli-pager \
          || true


    # ======================================================
    # STEP 29
    # Final Cleanup Summary
    # ======================================================

    - name: Final Cleanup Summary

      shell: bash

      run: |

        echo ""
        echo "=========================================================="
        echo "CLOUDFORMATION DELETE WORKFLOW COMPLETE"
        echo "=========================================================="

        echo ""

        echo "Root Stack:"
        echo "  $STACK_NAME"

        echo ""

        echo "Template Bucket Stack:"
        echo "  $TEMPLATE_BUCKET_STACK"

        echo ""

        echo "AWS Region:"
        echo "  $AWS_REGION"

        echo ""

        echo "Cleanup operations performed:"
        echo "  1. Root stack checked"
        echo "  2. Root stack resources inspected"
        echo "  3. RDS nested stack discovered"
        echo "  4. RDS database discovered"
        echo "  5. RDS deletion protection checked"
        echo "  6. Normal CloudFormation deletion attempted"
        echo "  7. RDS recovery attempted when necessary"
        echo "  8. FORCE_DELETE_STACK used when necessary"
        echo "  9. Root stack deletion verified"
        echo " 10. RDS cleanup verified"
        echo " 11. Template bucket emptied"
        echo " 12. Template bucket stack deleted"
        echo " 13. Template bucket stack deletion verified"
        echo " 14. Final AWS resource check completed"

        echo ""

        echo "=========================================================="
        echo "LAB CLEANUP FINISHED"
        echo "=========================================================="
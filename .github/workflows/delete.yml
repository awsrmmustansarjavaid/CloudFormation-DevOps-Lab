# ==========================================================
# AWS CloudFormation DevOps Lab
# GitHub Actions Workflow
# ==========================================================
#
# File:
#   .github/workflows/delete.yml
#
# Purpose
# ----------------------------------------------------------
# This workflow deletes the Lab01 CloudFormation stack.
#
# The workflow:
#
# 1. Downloads the repository.
# 2. Configures AWS credentials.
# 3. Verifies AWS CLI.
# 4. Checks whether the stack exists.
# 5. Displays the current stack status.
# 6. Displays stack resources.
# 7. Deletes the CloudFormation stack.
# 8. Waits for deletion.
# 9. Verifies that the stack no longer exists.
#
# This workflow is useful after:
#
#   - CREATE_FAILED
#   - ROLLBACK_COMPLETE
#   - UPDATE_FAILED
#   - UPDATE_ROLLBACK_COMPLETE
#
# ==========================================================


# ----------------------------------------------------------
# Workflow Name
# ----------------------------------------------------------

name: Delete AWS CloudFormation Stack


# ----------------------------------------------------------
# Trigger
# ----------------------------------------------------------
#
# Manual execution from GitHub Actions.
#
# ----------------------------------------------------------

on:

  workflow_dispatch:


# ----------------------------------------------------------
# Global Variables
# ----------------------------------------------------------

env:

  AWS_REGION: us-east-1

  STACK_NAME: Lab01-CloudFormation


# ----------------------------------------------------------
# Jobs
# ----------------------------------------------------------

jobs:

  delete-stack:

    # ------------------------------------------------------
    # GitHub Hosted Runner
    # ------------------------------------------------------

    runs-on: ubuntu-latest

    name: Delete CloudFormation Stack


    steps:


    # ======================================================
    # Step 1
    # Checkout Repository
    # ======================================================

    - name: Checkout Repository

      uses: actions/checkout@v4


    # ======================================================
    # Step 2
    # Configure AWS Credentials
    # ======================================================

    - name: Configure AWS Credentials

      uses: aws-actions/configure-aws-credentials@v4

      with:

        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

        aws-region: ${{ env.AWS_REGION }}


    # ======================================================
    # Step 3
    # Verify AWS CLI
    # ======================================================

    - name: Verify AWS CLI

      run: |

        echo "======================================"
        echo "AWS CLI Version"
        echo "======================================"

        aws --version

        echo ""

        echo "======================================"
        echo "AWS Account"
        echo "======================================"

        aws sts get-caller-identity


    # ======================================================
    # Step 4
    # Check Whether Stack Exists
    # ======================================================

    - name: Check Stack

      id: stack

      shell: bash

      run: |

        echo "======================================"
        echo "Checking CloudFormation Stack"
        echo "======================================"

        if aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          > /dev/null 2>&1

        then

          echo "exists=true" >> "$GITHUB_OUTPUT"

          echo ""
          echo "CloudFormation stack exists."

        else

          echo "exists=false" >> "$GITHUB_OUTPUT"

          echo ""
          echo "CloudFormation stack does not exist."

        fi


    # ======================================================
    # Step 5
    # Get Stack Status
    # ======================================================

    - name: Get Stack Status

      if: steps.stack.outputs.exists == 'true'

      id: status

      shell: bash

      run: |

        echo "======================================"
        echo "CloudFormation Stack Status"
        echo "======================================"

        STACK_STATUS=$(aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "Stacks[0].StackStatus" \
          --output text)

        echo "Stack Status: $STACK_STATUS"

        echo "stack_status=$STACK_STATUS" >> "$GITHUB_OUTPUT"


    # ======================================================
    # Step 6
    # Display Stack Information
    # ======================================================

    - name: Display Stack Information

      if: steps.stack.outputs.exists == 'true'

      run: |

        echo "======================================"
        echo "Stack Information"
        echo "======================================"

        aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --output table


    # ======================================================
    # Step 7
    # Display Stack Resources
    # ======================================================

    - name: Display Stack Resources

      if: steps.stack.outputs.exists == 'true'

      run: |

        echo "======================================"
        echo "Stack Resources"
        echo "======================================"

        aws cloudformation list-stack-resources \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "StackResourceSummaries[].[LogicalResourceId,ResourceType,ResourceStatus]" \
          --output table


    # ======================================================
    # Step 8
    # Display Stack Events
    # ======================================================
    #
    # This is particularly useful when deleting a stack
    # that previously failed.
    #
    # ======================================================

    - name: Display Recent Stack Events

      if: steps.stack.outputs.exists == 'true'

      run: |

        echo "======================================"
        echo "Recent CloudFormation Events"
        echo "======================================"

        aws cloudformation describe-stack-events \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "StackEvents[0:15].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
          --output table


    # ======================================================
    # Step 9
    # Delete CloudFormation Stack
    # ======================================================

    - name: Delete CloudFormation Stack

      if: steps.stack.outputs.exists == 'true'

      run: |

        echo "======================================"
        echo "Deleting CloudFormation Stack"
        echo "======================================"

        echo "Stack Name : $STACK_NAME"
        echo "Region     : $AWS_REGION"
        echo "Status     : ${{ steps.status.outputs.stack_status }}"

        echo ""

        echo "Starting stack deletion..."

        aws cloudformation delete-stack \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION"

        echo ""

        echo "CloudFormation stack deletion started."


    # ======================================================
    # Step 10
    # Wait Until Stack Is Deleted
    # ======================================================

    - name: Wait for Stack Deletion

      if: steps.stack.outputs.exists == 'true'

      run: |

        echo "======================================"
        echo "Waiting for Stack Deletion"
        echo "======================================"

        aws cloudformation wait stack-delete-complete \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION"

        echo ""

        echo "Stack deletion completed successfully."


    # ======================================================
    # Step 11
    # Verify Deletion
    # ======================================================

    - name: Verify Stack Deletion

      if: steps.stack.outputs.exists == 'true'

      shell: bash

      run: |

        echo "======================================"
        echo "Verifying Stack Deletion"
        echo "======================================"

        if aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          > /dev/null 2>&1

        then

          echo ""
          echo "ERROR: CloudFormation stack still exists."

          exit 1

        else

          echo ""
          echo "CloudFormation stack no longer exists."

        fi


    # ======================================================
    # Step 12
    # Stack Not Found
    # ======================================================

    - name: Stack Not Found

      if: steps.stack.outputs.exists == 'false'

      run: |

        echo "======================================"
        echo "CloudFormation Stack Not Found"
        echo "======================================"

        echo "Stack Name : $STACK_NAME"
        echo "Region     : $AWS_REGION"

        echo ""

        echo "Nothing to delete."


    # ======================================================
    # Step 13
    # Workflow Complete
    # ======================================================

    - name: Workflow Complete

      run: |

        echo ""

        echo "======================================"
        echo "Delete Workflow Completed"
        echo "======================================"

        echo ""

        echo "Stack Name : $STACK_NAME"
        echo "Region     : $AWS_REGION"

        echo ""

        echo "Cleanup operation finished."

        echo "======================================"
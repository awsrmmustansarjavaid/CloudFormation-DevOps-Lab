# ==========================================================
# AWS CloudFormation DevOps Lab
# GitHub Actions Workflow
# ==========================================================
#
# File:
#   .github/workflows/delete.yml
#
# Purpose:
# ----------------------------------------------------------
# Deletes the Lab01-CloudFormation stack safely.
#
# The workflow handles:
#
#   1. Normal CloudFormation stack deletion
#   2. ROLLBACK_COMPLETE stacks
#   3. DELETE_FAILED stacks
#   4. Resources that fail deletion
#   5. Nested CloudFormation stacks
#   6. FORCE_DELETE_STACK when normal deletion fails
#
# Important:
# ----------------------------------------------------------
# FORCE_DELETE_STACK does NOT magically delete a resource
# that AWS cannot delete.
#
# Instead, CloudFormation removes the stack while retaining
# resources that failed deletion.
#
# Those resources will appear as:
#
#   DELETE_SKIPPED
#
# This workflow reports those resources at the end.
#
# ==========================================================


# ----------------------------------------------------------
# Workflow Name
# ----------------------------------------------------------

name: Delete AWS CloudFormation Stack


# ----------------------------------------------------------
# Trigger
# ----------------------------------------------------------
#
# Manual execution from:
#
# GitHub
#   -> Actions
#   -> Delete AWS CloudFormation Stack
#   -> Run workflow
#
# ----------------------------------------------------------

on:

  workflow_dispatch:


# ----------------------------------------------------------
# Global Variables
# ----------------------------------------------------------

env:

  AWS_REGION: us-east-1

  STACK_NAME: Lab01-CloudFormation


# ==========================================================
# JOB
# ==========================================================

jobs:

  delete-stack:

    # ------------------------------------------------------
    # GitHub Hosted Runner
    # ------------------------------------------------------

    runs-on: ubuntu-latest

    name: Delete CloudFormation Stack


    # ======================================================
    # STEPS
    # ======================================================

    steps:


    # ======================================================
    # Step 1
    # Checkout Repository
    # ======================================================

    - name: Checkout Repository

      uses: actions/checkout@v4


    # ======================================================
    # Step 2
    # Configure AWS Credentials
    # ======================================================

    - name: Configure AWS Credentials

      uses: aws-actions/configure-aws-credentials@v4

      with:

        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

        aws-region: ${{ env.AWS_REGION }}


    # ======================================================
    # Step 3
    # Verify AWS CLI
    # ======================================================

    - name: Verify AWS CLI

      shell: bash

      run: |

        echo "======================================"
        echo "AWS CLI INFORMATION"
        echo "======================================"

        aws --version

        echo ""

        echo "======================================"
        echo "AWS ACCOUNT"
        echo "======================================"

        aws sts get-caller-identity

        echo ""

        echo "Region     : $AWS_REGION"
        echo "Stack Name : $STACK_NAME"


    # ======================================================
    # Step 4
    # Check Whether Stack Exists
    # ======================================================

    - name: Check Stack

      id: stack

      shell: bash

      run: |

        echo "======================================"
        echo "CHECKING CLOUDFORMATION STACK"
        echo "======================================"

        if aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          > /dev/null 2>&1

        then

          echo "exists=true" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Stack exists."

        else

          echo "exists=false" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Stack does not exist."

        fi


    # ======================================================
    # Step 5
    # Get Current Stack Status
    # ======================================================

    - name: Get Stack Status

      if: steps.stack.outputs.exists == 'true'

      id: status

      shell: bash

      run: |

        echo "======================================"
        echo "CLOUDFORMATION STACK STATUS"
        echo "======================================"

        STACK_STATUS=$(aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "Stacks[0].StackStatus" \
          --output text)

        echo "Stack Status: $STACK_STATUS"

        echo "stack_status=$STACK_STATUS" >> "$GITHUB_OUTPUT"


    # ======================================================
    # Step 6
    # Display Stack Information
    # ======================================================

    - name: Display Stack Information

      if: steps.stack.outputs.exists == 'true'

      shell: bash

      run: |

        echo "======================================"
        echo "STACK INFORMATION"
        echo "======================================"

        aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --output table


    # ======================================================
    # Step 7
    # Display Current Resources
    # ======================================================

    - name: Display Stack Resources

      if: steps.stack.outputs.exists == 'true'

      shell: bash

      run: |

        echo "======================================"
        echo "CURRENT STACK RESOURCES"
        echo "======================================"

        aws cloudformation list-stack-resources \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "StackResourceSummaries[].[LogicalResourceId,ResourceType,ResourceStatus,PhysicalResourceId]" \
          --output table


    # ======================================================
    # Step 8
    # Display Previous Failed Deletion Events
    # ======================================================
    #
    # This is especially useful when the stack is already
    # DELETE_FAILED.
    #
    # ======================================================

    - name: Display Failed Resources

      if: steps.stack.outputs.exists == 'true'

      shell: bash

      run: |

        echo "======================================"
        echo "FAILED RESOURCE INFORMATION"
        echo "======================================"

        aws cloudformation describe-stack-events \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "StackEvents[?contains(ResourceStatus, 'FAILED')].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
          --output table || true


    # ======================================================
    # Step 9
    # Delete Stack
    # ======================================================
    #
    # Behavior:
    #
    # If the stack is already DELETE_FAILED:
    #
    #     Use FORCE_DELETE_STACK immediately.
    #
    # Otherwise:
    #
    #     Try normal deletion first.
    #
    # ======================================================

    - name: Start CloudFormation Deletion

      if: steps.stack.outputs.exists == 'true'

      id: delete

      shell: bash

      run: |

        echo "======================================"
        echo "STARTING CLOUDFORMATION DELETION"
        echo "======================================"

        echo ""
        echo "Stack Name : $STACK_NAME"
        echo "Region     : $AWS_REGION"
        echo "Status     : ${{ steps.status.outputs.stack_status }}"
        echo ""

        CURRENT_STATUS="${{ steps.status.outputs.stack_status }}"


        # --------------------------------------------------
        # Case 1
        # Stack is already DELETE_FAILED
        #
        # Use FORCE_DELETE_STACK.
        # --------------------------------------------------

        if [ "$CURRENT_STATUS" = "DELETE_FAILED" ]

        then

          echo "Stack is already DELETE_FAILED."

          echo ""
          echo "Using FORCE_DELETE_STACK..."

          aws cloudformation delete-stack \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --deletion-mode FORCE_DELETE_STACK

          echo ""

          echo "Force deletion started."

          echo "mode=force" >> "$GITHUB_OUTPUT"

        else

          # ------------------------------------------------
          # Case 2
          # Stack is in a normal state.
          #
          # Try standard deletion first.
          # ------------------------------------------------

          echo "Starting standard stack deletion..."

          aws cloudformation delete-stack \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION"

          echo ""

          echo "Standard deletion started."

          echo "mode=standard" >> "$GITHUB_OUTPUT"

        fi


    # ======================================================
    # Step 10
    # Wait for Standard Deletion
    # ======================================================
    #
    # If standard deletion fails, this step captures the
    # failure instead of immediately terminating the job.
    #
    # ======================================================

    - name: Wait for Standard Deletion

      if: |
        steps.stack.outputs.exists == 'true' &&
        steps.delete.outputs.mode == 'standard'

      id: standard_wait

      continue-on-error: true

      shell: bash

      run: |

        echo "======================================"
        echo "WAITING FOR STANDARD DELETION"
        echo "======================================"

        if aws cloudformation wait stack-delete-complete \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION"

        then

          echo "Standard deletion completed."

          echo "deleted=true" >> "$GITHUB_OUTPUT"

        else

          echo "Standard deletion failed."

          echo "deleted=false" >> "$GITHUB_OUTPUT"

        fi


    # ======================================================
    # Step 11
    # Show Standard Deletion Failure
    # ======================================================

    - name: Show Deletion Failure

      if: |
        steps.stack.outputs.exists == 'true' &&
        steps.delete.outputs.mode == 'standard' &&
        steps.standard_wait.outputs.deleted == 'false'

      shell: bash

      run: |

        echo "======================================"
        echo "STANDARD DELETION FAILED"
        echo "======================================"

        echo ""
        echo "The stack could not be deleted normally."
        echo ""

        echo "Failed resources:"
        echo ""

        aws cloudformation describe-stack-events \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "StackEvents[?ResourceStatus=='DELETE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]" \
          --output table || true


    # ======================================================
    # Step 12
    # Force Delete After Standard Failure
    # ======================================================
    #
    # If normal deletion failed:
    #
    #     Retry using FORCE_DELETE_STACK.
    #
    # AWS will skip resources that failed deletion.
    #
    # ======================================================

    - name: Force Delete Failed Stack

      if: |
        steps.stack.outputs.exists == 'true' &&
        steps.delete.outputs.mode == 'standard' &&
        steps.standard_wait.outputs.deleted == 'false'

      id: force

      shell: bash

      run: |

        echo "======================================"
        echo "FORCE DELETING CLOUDFORMATION STACK"
        echo "======================================"

        echo ""
        echo "Retrying with:"
        echo ""
        echo "DeletionMode = FORCE_DELETE_STACK"
        echo ""

        aws cloudformation delete-stack \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --deletion-mode FORCE_DELETE_STACK

        echo ""

        echo "Force deletion started."


    # ======================================================
    # Step 13
    # Wait for Force Deletion
    # ======================================================

    - name: Wait for Force Deletion

      if: |
        steps.stack.outputs.exists == 'true' &&
        (
          steps.delete.outputs.mode == 'force' ||
          steps.standard_wait.outputs.deleted == 'false'
        )

      id: force_wait

      shell: bash

      run: |

        echo "======================================"
        echo "WAITING FOR FORCE DELETION"
        echo "======================================"

        aws cloudformation wait stack-delete-complete \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION"

        echo ""

        echo "Force deletion completed."


    # ======================================================
    # Step 14
    # Verify Stack Is Gone
    # ======================================================

    - name: Verify Stack Deletion

      if: steps.stack.outputs.exists == 'true'

      id: verify

      shell: bash

      run: |

        echo "======================================"
        echo "VERIFYING STACK DELETION"
        echo "======================================"

        if aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          > /dev/null 2>&1

        then

          echo ""
          echo "ERROR:"
          echo "CloudFormation stack still exists."

          exit 1

        else

          echo ""
          echo "CloudFormation stack no longer exists."

        fi


    # ======================================================
    # Step 15
    # Display Retained / Skipped Resources
    # ======================================================
    #
    # FORCE_DELETE_STACK can leave resources behind.
    #
    # These resources appear as:
    #
    #     DELETE_SKIPPED
    #
    # We display them so you know exactly what remains.
    #
    # ======================================================

    - name: Check Retained Resources

      if: steps.stack.outputs.exists == 'true'

      shell: bash

      run: |

        echo "======================================"
        echo "CHECKING RETAINED RESOURCES"
        echo "======================================"

        echo ""

        aws cloudformation list-stack-resources \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "StackResourceSummaries[?ResourceStatus=='DELETE_SKIPPED'].[LogicalResourceId,ResourceType,PhysicalResourceId,ResourceStatus]" \
          --output table || true

        echo ""

        echo "If DELETE_SKIPPED resources are shown,"
        echo "those resources still exist in AWS."


    # ======================================================
    # Step 16
    # Stack Not Found
    # ======================================================

    - name: Stack Not Found

      if: steps.stack.outputs.exists == 'false'

      shell: bash

      run: |

        echo "======================================"
        echo "STACK NOT FOUND"
        echo "======================================"

        echo ""
        echo "Stack Name : $STACK_NAME"
        echo "Region     : $AWS_REGION"
        echo ""

        echo "There is nothing to delete."


    # ======================================================
    # Step 17
    # Workflow Complete
    # ======================================================

    - name: Workflow Complete

      shell: bash

      run: |

        echo ""
        echo "======================================"
        echo "DELETE WORKFLOW COMPLETED"
        echo "======================================"

        echo ""
        echo "Stack Name : $STACK_NAME"
        echo "Region     : $AWS_REGION"
        echo ""

        echo "CloudFormation cleanup operation finished."

        echo ""
        echo "======================================"
# ==========================================================
# AWS CloudFormation DevOps Lab
# GitHub Actions - Complete Stack Delete Workflow
# ==========================================================
#
# File:
#   .github/workflows/delete.yml
#
# Purpose:
# ----------------------------------------------------------
# Completely deletes the AWS CloudFormation DevOps Lab.
#
#
# ROOT CLOUDFORMATION ARCHITECTURE:
#
#   Lab01-CloudFormation
#          |
#          +---- EC2WebServerStack
#          |
#          +---- S3NestedStack
#          |
#          +---- RDSNestedStack
#                    |
#                    +---- RDSDatabase
#                    +---- RDSSecurityGroup
#                    +---- RDSSubnetGroup
#
#
# SEPARATE CLOUDFORMATION STACK:
#
#   Lab01-CloudFormation-TemplateBucket
#          |
#          +---- TemplateBucket
#
#
# IMPORTANT:
# ----------------------------------------------------------
#
# Lab01-CloudFormation-TemplateBucket is a SEPARATE stack.
#
# It is NOT a nested stack of:
#
#   Lab01-CloudFormation
#
# Therefore deleting the root stack does not automatically
# delete the template bucket stack.
#
#
# THIS WORKFLOW:
# ----------------------------------------------------------
#
# 1. Checks whether the root stack exists.
#
# 2. Displays the root stack status.
#
# 3. Displays root stack resources.
#
# 4. Discovers RDSNestedStack.
#
# 5. Discovers the actual RDS database.
#
# 6. Checks RDS deletion protection.
#
# 7. Starts normal root stack deletion.
#
# 8. Waits for normal deletion.
#
# 9. If normal deletion fails:
#       - displays DELETE_FAILED resources
#       - attempts RDS cleanup
#       - waits for RDS deletion
#       - retries CloudFormation using FORCE_DELETE_STACK
#
# 10. Verifies the root stack is gone.
#
# 11. Finds the separate Template Bucket stack.
#
# 12. Finds its S3 bucket.
#
# 13. Deletes ALL S3 object versions.
#
# 14. Deletes ALL S3 delete markers.
#
# 15. Deletes the Template Bucket CloudFormation stack.
#
# 16. Waits for Template Bucket stack deletion.
#
# 17. Verifies Template Bucket stack deletion.
#
# 18. Verifies RDS cleanup.
#
# 19. Performs a final AWS resource check.
#
#
# ==========================================================
# IMPORTANT S3 VERSIONING INFORMATION
# ==========================================================
#
# A normal command such as:
#
#   aws s3 rm s3://bucket --recursive
#
# is NOT enough for a versioned bucket.
#
# It can leave:
#
#   - old object versions
#   - delete markers
#
# CloudFormation then fails with:
#
#   The bucket you tried to delete is not empty.
#   You must delete all versions in the bucket.
#
# Therefore this workflow explicitly removes:
#
#   - object versions
#   - delete markers
#
#
# ==========================================================
# IMPORTANT RDS INFORMATION
# ==========================================================
#
# The RDS database is inside the nested stack:
#
#   Lab01-CloudFormation
#       |
#       +---- RDSNestedStack
#                 |
#                 +---- RDSDatabase
#
# Therefore RDSDatabase cannot be searched directly in the
# root stack.
#
# This workflow first finds:
#
#   RDSNestedStack
#
# and then finds:
#
#   RDSDatabase
#
# inside that nested stack.
#
#
# ==========================================================
# REQUIRED GITHUB SECRETS
# ==========================================================
#
# Add these secrets to:
#
#   GitHub Repository
#       ->
#   Settings
#       ->
#   Secrets and variables
#       ->
#   Actions
#
# Required:
#
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#
#
# ==========================================================


# ==========================================================
# WORKFLOW NAME
# ==========================================================

name: Delete AWS CloudFormation Stack


# ==========================================================
# WORKFLOW TRIGGER
# ==========================================================
#
# Manual execution only.
#
# GitHub:
#
#   Actions
#      ->
#   Delete AWS CloudFormation Stack
#      ->
#   Run workflow
#
# ==========================================================

on:

  workflow_dispatch:


# ==========================================================
# GLOBAL ENVIRONMENT VARIABLES
# ==========================================================

env:

  # AWS region containing the lab resources.
  AWS_REGION: us-east-1

  # Main/root CloudFormation stack.
  STACK_NAME: Lab01-CloudFormation

  # Separate CloudFormation stack containing the S3
  # bucket used to store nested CloudFormation templates.
  TEMPLATE_BUCKET_STACK: Lab01-CloudFormation-TemplateBucket


# ==========================================================
# JOB
# ==========================================================

jobs:

  delete-stack:

    # ------------------------------------------------------
    # GitHub hosted Ubuntu runner.
    # ------------------------------------------------------

    runs-on: ubuntu-latest

    name: Delete CloudFormation Stack


    # ======================================================
    # STEPS
    # ======================================================

    steps:


    # ======================================================
    # STEP 1
    # Checkout Repository
    # ======================================================

    - name: Checkout Repository

      uses: actions/checkout@v4


    # ======================================================
    # STEP 2
    # Configure AWS Credentials
    # ======================================================

    - name: Configure AWS Credentials

      uses: aws-actions/configure-aws-credentials@v4

      with:

        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

        aws-region: ${{ env.AWS_REGION }}


    # ======================================================
    # STEP 3
    # Verify AWS CLI and Account
    # ======================================================

    - name: Verify AWS CLI

      shell: bash

      run: |

        echo "======================================"
        echo "AWS CLI INFORMATION"
        echo "======================================"

        aws --version

        echo ""

        echo "======================================"
        echo "AWS ACCOUNT"
        echo "======================================"

        aws sts get-caller-identity

        echo ""

        echo "======================================"
        echo "LAB CONFIGURATION"
        echo "======================================"

        echo "AWS Region            : $AWS_REGION"
        echo "Root Stack            : $STACK_NAME"
        echo "Template Bucket Stack : $TEMPLATE_BUCKET_STACK"

        echo ""


    # ======================================================
    # STEP 4
    # Check Root Stack
    # ======================================================

    - name: Check Root Stack

      id: stack

      shell: bash

      run: |

        echo "======================================"
        echo "CHECKING ROOT CLOUDFORMATION STACK"
        echo "======================================"

        if aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --no-cli-pager \
          > /dev/null 2>&1
        then

          echo "exists=true" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Root stack exists."

        else

          echo "exists=false" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Root stack does not exist."

        fi


    # ======================================================
    # STEP 5
    # Get Root Stack Status
    # ======================================================

    - name: Get Root Stack Status

      if: steps.stack.outputs.exists == 'true'

      id: status

      shell: bash

      run: |

        echo "======================================"
        echo "ROOT STACK STATUS"
        echo "======================================"

        STACK_STATUS=$(aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "Stacks[0].StackStatus" \
          --output text \
          --no-cli-pager)

        echo ""
        echo "Stack Name   : $STACK_NAME"
        echo "Stack Status : $STACK_STATUS"
        echo ""

        echo "stack_status=$STACK_STATUS" >> "$GITHUB_OUTPUT"


    # ======================================================
    # STEP 6
    # Display Root Stack Information
    # ======================================================

    - name: Display Root Stack Information

      if: steps.stack.outputs.exists == 'true'

      shell: bash

      run: |

        echo "======================================"
        echo "ROOT STACK INFORMATION"
        echo "======================================"

        aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --output table \
          --no-cli-pager


    # ======================================================
    # STEP 7
    # Display Root Stack Resources
    # ======================================================

    - name: Display Root Stack Resources

      if: steps.stack.outputs.exists == 'true'

      shell: bash

      run: |

        echo "======================================"
        echo "ROOT STACK RESOURCES"
        echo "======================================"

        aws cloudformation list-stack-resources \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "StackResourceSummaries[].[LogicalResourceId,ResourceType,ResourceStatus,PhysicalResourceId]" \
          --output table \
          --no-cli-pager \
          || true


    # ======================================================
    # STEP 8
    # Display Previous CloudFormation Failures
    # ======================================================

    - name: Display Root Stack Failures

      if: steps.stack.outputs.exists == 'true'

      shell: bash

      run: |

        echo "======================================"
        echo "ROOT STACK FAILURE INFORMATION"
        echo "======================================"

        aws cloudformation describe-stack-events \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "StackEvents[?contains(ResourceStatus, 'FAILED')].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
          --output table \
          --no-cli-pager \
          || true


    # ======================================================
    # STEP 9
    # Discover RDS Nested Stack
    # ======================================================
    #
    # Root stack:
    #
    #   Lab01-CloudFormation
    #
    # contains:
    #
    #   RDSNestedStack
    #
    # ======================================================

    - name: Discover RDS Nested Stack

      if: steps.stack.outputs.exists == 'true'

      id: rds_nested

      shell: bash

      run: |

        echo "======================================"
        echo "DISCOVERING RDS NESTED STACK"
        echo "======================================"

        RDS_NESTED_STACK_ID=$(aws cloudformation list-stack-resources \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "StackResourceSummaries[?LogicalResourceId=='RDSNestedStack'].PhysicalResourceId" \
          --output text \
          --no-cli-pager)

        echo ""
        echo "RDS Nested Stack:"
        echo "$RDS_NESTED_STACK_ID"
        echo ""

        if [ -n "$RDS_NESTED_STACK_ID" ] &&
           [ "$RDS_NESTED_STACK_ID" != "None" ]
        then

          echo "RDS nested stack found."

          echo "rds_nested_stack=$RDS_NESTED_STACK_ID" >> "$GITHUB_OUTPUT"

        else

          echo "RDS nested stack was not found."

          echo "rds_nested_stack=" >> "$GITHUB_OUTPUT"

        fi


    # ======================================================
    # STEP 10
    # Discover Actual RDS Database
    # ======================================================
    #
    # IMPORTANT:
    #
    # RDSDatabase is inside RDSNestedStack.
    #
    # We therefore query the nested stack.
    #
    # ======================================================

    - name: Discover RDS Database

      if: |
        steps.stack.outputs.exists == 'true' &&
        steps.rds_nested.outputs.rds_nested_stack != ''

      id: rds

      shell: bash

      run: |

        echo "======================================"
        echo "DISCOVERING RDS DATABASE"
        echo "======================================"

        RDS_NESTED_STACK_ID="${{ steps.rds_nested.outputs.rds_nested_stack }}"

        RDS_INSTANCE=$(aws cloudformation describe-stack-resources \
          --stack-name "$RDS_NESTED_STACK_ID" \
          --region "$AWS_REGION" \
          --logical-resource-id RDSDatabase \
          --query "StackResources[0].PhysicalResourceId" \
          --output text \
          --no-cli-pager \
          2>/dev/null || true)

        echo ""
        echo "RDS Physical Resource ID:"
        echo "$RDS_INSTANCE"
        echo ""

        if [ -n "$RDS_INSTANCE" ] &&
           [ "$RDS_INSTANCE" != "None" ]
        then

          echo "RDS database found."

          echo "rds_instance=$RDS_INSTANCE" >> "$GITHUB_OUTPUT"

        else

          echo "RDS database was not found."

          echo "rds_instance=" >> "$GITHUB_OUTPUT"

        fi


    # ======================================================
    # STEP 11
    # Check RDS Deletion Protection
    # ======================================================

    - name: Check RDS Deletion Protection

      if: steps.rds.outputs.rds_instance != ''

      shell: bash

      run: |

        echo "======================================"
        echo "CHECKING RDS DELETION PROTECTION"
        echo "======================================"

        RDS_INSTANCE="${{ steps.rds.outputs.rds_instance }}"

        DELETE_PROTECTION=$(aws rds describe-db-instances \
          --db-instance-identifier "$RDS_INSTANCE" \
          --region "$AWS_REGION" \
          --query "DBInstances[0].DeletionProtection" \
          --output text \
          --no-cli-pager \
          2>/dev/null || true)

        echo ""
        echo "RDS Instance        : $RDS_INSTANCE"
        echo "Deletion Protection : $DELETE_PROTECTION"
        echo ""

        if [ "$DELETE_PROTECTION" = "True" ]
        then

          echo "Deletion protection is enabled."

          echo ""
          echo "Disabling deletion protection..."

          aws rds modify-db-instance \
            --db-instance-identifier "$RDS_INSTANCE" \
            --region "$AWS_REGION" \
            --no-deletion-protection \
            --apply-immediately \
            --no-cli-pager

          echo ""
          echo "Deletion protection disable request submitted."

        else

          echo "RDS deletion protection is already disabled."

        fi


    # ======================================================
    # STEP 12
    # Start Root Stack Deletion
    # ======================================================
    #
    # DELETE_FAILED:
    #
    #   Use FORCE_DELETE_STACK immediately.
    #
    # Other states:
    #
    #   Attempt normal deletion first.
    #
    # ======================================================

    - name: Start Root Stack Deletion

      if: steps.stack.outputs.exists == 'true'

      id: delete

      shell: bash

      run: |

        echo "======================================"
        echo "STARTING ROOT STACK DELETION"
        echo "======================================"

        CURRENT_STATUS="${{ steps.status.outputs.stack_status }}"

        echo ""
        echo "Stack Name : $STACK_NAME"
        echo "Region     : $AWS_REGION"
        echo "Status     : $CURRENT_STATUS"
        echo ""

        if [ "$CURRENT_STATUS" = "DELETE_FAILED" ]
        then

          echo "Root stack is already DELETE_FAILED."

          echo ""
          echo "Starting FORCE_DELETE_STACK..."

          aws cloudformation delete-stack \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --deletion-mode FORCE_DELETE_STACK \
            --no-cli-pager

          echo "mode=force" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Force deletion started."

        else

          echo "Starting normal CloudFormation deletion..."

          aws cloudformation delete-stack \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-cli-pager

          echo "mode=standard" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Normal deletion started."

        fi


    # ======================================================
    # STEP 13
    # Wait for Normal Root Stack Deletion
    # ======================================================

    - name: Wait for Normal Root Deletion

      if: |
        steps.stack.outputs.exists == 'true' &&
        steps.delete.outputs.mode == 'standard'

      id: normal_wait

      continue-on-error: true

      shell: bash

      run: |

        echo "======================================"
        echo "WAITING FOR NORMAL ROOT DELETION"
        echo "======================================"

        if aws cloudformation wait stack-delete-complete \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION"
        then

          echo "deleted=true" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Root stack deleted successfully."

        else

          echo "deleted=false" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Root stack deletion failed."

        fi


    # ======================================================
    # STEP 14
    # Display DELETE_FAILED Root Resources
    # ======================================================

    - name: Display Root DELETE_FAILED Resources

      if: |
        steps.stack.outputs.exists == 'true' &&
        steps.delete.outputs.mode == 'standard' &&
        steps.normal_wait.outputs.deleted == 'false'

      shell: bash

      run: |

        echo "======================================"
        echo "ROOT STACK DELETE_FAILED RESOURCES"
        echo "======================================"

        aws cloudformation describe-stack-events \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "StackEvents[?ResourceStatus=='DELETE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]" \
          --output table \
          --no-cli-pager \
          || true


    # ======================================================
    # STEP 15
    # Attempt Direct RDS Deletion
    # ======================================================
    #
    # This recovery step is executed only if root stack
    # deletion requires recovery.
    #
    # The RDS instance is deleted directly through RDS.
    #
    # IMPORTANT:
    #
    # This lab intentionally skips the final snapshot.
    #
    # Therefore the database data is permanently deleted.
    #
    # ======================================================

    - name: Attempt Direct RDS Cleanup

      if: |
        steps.stack.outputs.exists == 'true' &&
        (
          steps.delete.outputs.mode == 'force' ||
          steps.normal_wait.outputs.deleted == 'false'
        ) &&
        steps.rds.outputs.rds_instance != ''

      shell: bash

      run: |

        echo "======================================"
        echo "ATTEMPTING DIRECT RDS CLEANUP"
        echo "======================================"

        RDS_INSTANCE="${{ steps.rds.outputs.rds_instance }}"

        echo ""
        echo "RDS Instance:"
        echo "$RDS_INSTANCE"
        echo ""

        if aws rds describe-db-instances \
          --db-instance-identifier "$RDS_INSTANCE" \
          --region "$AWS_REGION" \
          --no-cli-pager \
          > /dev/null 2>&1
        then

          echo "RDS instance still exists."

          echo ""
          echo "Requesting RDS deletion..."

          aws rds delete-db-instance \
            --db-instance-identifier "$RDS_INSTANCE" \
            --region "$AWS_REGION" \
            --skip-final-snapshot \
            --delete-automated-backups \
            --no-cli-pager \
            || true

          echo ""
          echo "RDS deletion request submitted."

        else

          echo "RDS instance no longer exists."

        fi


    # ======================================================
    # STEP 16
    # Wait for RDS Deletion
    # ======================================================
    #
    # Maximum:
    #
    #   60 attempts
    #   30 seconds between attempts
    #
    # Approximately:
    #
    #   30 minutes
    #
    # ======================================================

    - name: Wait for RDS Deletion

      if: |
        steps.stack.outputs.exists == 'true' &&
        (
          steps.delete.outputs.mode == 'force' ||
          steps.normal_wait.outputs.deleted == 'false'
        ) &&
        steps.rds.outputs.rds_instance != ''

      shell: bash

      run: |

        echo "======================================"
        echo "WAITING FOR RDS DELETION"
        echo "======================================"

        RDS_INSTANCE="${{ steps.rds.outputs.rds_instance }}"

        for ATTEMPT in $(seq 1 60)
        do

          RDS_STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier "$RDS_INSTANCE" \
            --region "$AWS_REGION" \
            --query "DBInstances[0].DBInstanceStatus" \
            --output text \
            --no-cli-pager \
            2>/dev/null || echo "NOT_FOUND")

          echo ""
          echo "Attempt: $ATTEMPT / 60"
          echo "RDS Status: $RDS_STATUS"

          if [ "$RDS_STATUS" = "NOT_FOUND" ]
          then

            echo ""
            echo "RDS instance has been deleted."

            break

          fi

          if [ "$ATTEMPT" -eq 60 ]
          then

            echo ""
            echo "RDS deletion is still in progress."

            break

          fi

          sleep 30

        done


    # ======================================================
    # STEP 17
    # Force Delete Root Stack
    # ======================================================
    #
    # This is executed after normal deletion has failed or
    # when the stack was already DELETE_FAILED.
    #
    # ======================================================

    - name: Force Delete Root Stack

      if: |
        steps.stack.outputs.exists == 'true' &&
        (
          steps.delete.outputs.mode == 'force' ||
          steps.normal_wait.outputs.deleted == 'false'
        )

      shell: bash

      run: |

        echo "======================================"
        echo "FORCE DELETE ROOT CLOUDFORMATION STACK"
        echo "======================================"

        echo ""
        echo "Stack Name : $STACK_NAME"
        echo "Region     : $AWS_REGION"
        echo "Mode       : FORCE_DELETE_STACK"
        echo ""

        aws cloudformation delete-stack \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --deletion-mode FORCE_DELETE_STACK \
          --no-cli-pager

        echo ""
        echo "Force deletion request submitted."


    # ======================================================
    # STEP 18
    # Wait for Final Root Stack Deletion
    # ======================================================

    - name: Wait for Final Root Deletion

      if: |
        steps.stack.outputs.exists == 'true' &&
        (
          steps.delete.outputs.mode == 'force' ||
          steps.normal_wait.outputs.deleted == 'false'
        )

      shell: bash

      run: |

        echo "======================================"
        echo "WAITING FOR FINAL ROOT DELETION"
        echo "======================================"

        if aws cloudformation wait stack-delete-complete \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION"
        then

          echo ""
          echo "Final root stack deletion completed."

        else

          echo ""
          echo "ERROR:"
          echo "Final root stack deletion did not complete."

          echo ""
          echo "Checking current CloudFormation events..."

          aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='DELETE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]" \
            --output table \
            --no-cli-pager \
            || true

          exit 1

        fi


    # ======================================================
    # STEP 19
    # Verify Root Stack Is Gone
    # ======================================================

    - name: Verify Root Stack Deletion

      if: steps.stack.outputs.exists == 'true'

      shell: bash

      run: |

        echo "======================================"
        echo "VERIFYING ROOT STACK DELETION"
        echo "======================================"

        if aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --no-cli-pager \
          > /dev/null 2>&1
        then

          echo ""
          echo "ERROR:"
          echo "Root CloudFormation stack still exists."

          exit 1

        else

          echo ""
          echo "Root CloudFormation stack no longer exists."

        fi


    # ======================================================
    # STEP 20
    # Check Template Bucket Stack
    # ======================================================
    #
    # This is a separate stack and must be deleted
    # independently.
    #
    # ======================================================

    - name: Check Template Bucket Stack

      id: template_bucket

      shell: bash

      run: |

        echo "======================================"
        echo "CHECKING TEMPLATE BUCKET STACK"
        echo "======================================"

        if aws cloudformation describe-stacks \
          --stack-name "$TEMPLATE_BUCKET_STACK" \
          --region "$AWS_REGION" \
          --no-cli-pager \
          > /dev/null 2>&1
        then

          echo "exists=true" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Template bucket stack exists."

        else

          echo "exists=false" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Template bucket stack does not exist."

        fi


    # ======================================================
    # STEP 21
    # Display Template Bucket Stack Resources
    # ======================================================

    - name: Display Template Bucket Resources

      if: steps.template_bucket.outputs.exists == 'true'

      shell: bash

      run: |

        echo "======================================"
        echo "TEMPLATE BUCKET STACK RESOURCES"
        echo "======================================"

        aws cloudformation list-stack-resources \
          --stack-name "$TEMPLATE_BUCKET_STACK" \
          --region "$AWS_REGION" \
          --query "StackResourceSummaries[].[LogicalResourceId,ResourceType,ResourceStatus,PhysicalResourceId]" \
          --output table \
          --no-cli-pager \
          || true


    # ======================================================
    # STEP 22
    # Find Template S3 Bucket
    # ======================================================

    - name: Find Template S3 Bucket

      if: steps.template_bucket.outputs.exists == 'true'

      id: template_s3

      shell: bash

      run: |

        echo "======================================"
        echo "FINDING TEMPLATE S3 BUCKET"
        echo "======================================"

        TEMPLATE_BUCKET=$(aws cloudformation list-stack-resources \
          --stack-name "$TEMPLATE_BUCKET_STACK" \
          --region "$AWS_REGION" \
          --query "StackResourceSummaries[?LogicalResourceId=='TemplateBucket'].PhysicalResourceId" \
          --output text \
          --no-cli-pager)

        echo ""
        echo "Template Bucket:"
        echo "$TEMPLATE_BUCKET"
        echo ""

        if [ -n "$TEMPLATE_BUCKET" ] &&
           [ "$TEMPLATE_BUCKET" != "None" ]
        then

          echo "template_bucket=$TEMPLATE_BUCKET" >> "$GITHUB_OUTPUT"

          echo "Template S3 bucket found."

        else

          echo "template_bucket=" >> "$GITHUB_OUTPUT"

          echo "Template S3 bucket was not found."

        fi


    # ======================================================
    # STEP 23
    # Empty Versioned Template Bucket
    # ======================================================
    #
    # THIS IS THE IMPORTANT FIX FOR YOUR CURRENT ERROR.
    #
    # Your AWS error was:
    #
    #   The bucket you tried to delete is not empty.
    #   You must delete all versions in the bucket.
    #
    #
    # aws s3 rm --recursive is NOT enough for a versioned
    # bucket.
    #
    # We therefore delete:
    #
    #   - object versions
    #   - delete markers
    #
    # ======================================================

    - name: Empty Versioned Template Bucket

      if: |
        steps.template_bucket.outputs.exists == 'true' &&
        steps.template_s3.outputs.template_bucket != ''

      shell: bash

      run: |

        echo "======================================"
        echo "EMPTYING VERSIONED TEMPLATE BUCKET"
        echo "======================================"

        TEMPLATE_BUCKET="${{ steps.template_s3.outputs.template_bucket }}"

        echo ""
        echo "Bucket:"
        echo "$TEMPLATE_BUCKET"
        echo ""

        echo "Checking bucket versioning..."

        aws s3api get-bucket-versioning \
          --bucket "$TEMPLATE_BUCKET" \
          --region "$AWS_REGION" \
          --no-cli-pager \
          || true

        echo ""

        # --------------------------------------------------
        # Continue until no object versions or delete
        # markers remain.
        #
        # The AWS CLI automatically handles service-side
        # pagination for list-object-versions.
        # --------------------------------------------------

        while true
        do

          echo "Reading S3 object versions..."

          VERSION_DATA=$(aws s3api list-object-versions \
            --bucket "$TEMPLATE_BUCKET" \
            --region "$AWS_REGION" \
            --output json \
            --no-cli-pager)

          # ------------------------------------------------
          # Count object versions.
          # ------------------------------------------------

          VERSION_COUNT=$(echo "$VERSION_DATA" | \
            jq '(.Versions // []) | length')

          # ------------------------------------------------
          # Count delete markers.
          # ------------------------------------------------

          DELETE_MARKER_COUNT=$(echo "$VERSION_DATA" | \
            jq '(.DeleteMarkers // []) | length')

          TOTAL_COUNT=$((VERSION_COUNT + DELETE_MARKER_COUNT))

          echo ""
          echo "Object versions      : $VERSION_COUNT"
          echo "Delete markers       : $DELETE_MARKER_COUNT"
          echo "Total remaining      : $TOTAL_COUNT"
          echo ""

          # ------------------------------------------------
          # If nothing remains, bucket is empty.
          # ------------------------------------------------

          if [ "$TOTAL_COUNT" -eq 0 ]
          then

            echo "Template bucket is completely empty."

            break

          fi


          # ------------------------------------------------
          # Build a delete request.
          #
          # S3 DeleteObjects supports up to 1000 objects in
          # one request.
          #
          # The AWS CLI pagination output is converted into
          # the required JSON structure.
          # ------------------------------------------------

          echo "$VERSION_DATA" | \
            jq '{
              Objects:
                (
                  ((.Versions // []) + (.DeleteMarkers // []))
                  | map({
                      Key: .Key,
                      VersionId: .VersionId
                    })
                  | .[0:1000]
                ),
              Quiet: true
            }' > /tmp/s3-delete.json


          # ------------------------------------------------
          # Count objects in the delete request.
          # ------------------------------------------------

          DELETE_COUNT=$(jq '.Objects | length' /tmp/s3-delete.json)

          echo "Deleting $DELETE_COUNT S3 versions/delete markers..."

          # ------------------------------------------------
          # Delete the versions/delete markers.
          # ------------------------------------------------

          aws s3api delete-objects \
            --bucket "$TEMPLATE_BUCKET" \
            --delete file:///tmp/s3-delete.json \
            --region "$AWS_REGION" \
            --no-cli-pager

          echo ""
          echo "Delete request completed."

        done


        # --------------------------------------------------
        # Final verification.
        # --------------------------------------------------

        echo "======================================"
        echo "VERIFYING TEMPLATE BUCKET IS EMPTY"
        echo "======================================"

        FINAL_VERSION_DATA=$(aws s3api list-object-versions \
          --bucket "$TEMPLATE_BUCKET" \
          --region "$AWS_REGION" \
          --output json \
          --no-cli-pager)

        FINAL_VERSION_COUNT=$(echo "$FINAL_VERSION_DATA" | \
          jq '(.Versions // []) | length')

        FINAL_DELETE_MARKER_COUNT=$(echo "$FINAL_VERSION_DATA" | \
          jq '(.DeleteMarkers // []) | length')

        FINAL_TOTAL=$((FINAL_VERSION_COUNT + FINAL_DELETE_MARKER_COUNT))

        echo ""
        echo "Remaining object versions : $FINAL_VERSION_COUNT"
        echo "Remaining delete markers  : $FINAL_DELETE_MARKER_COUNT"
        echo "Remaining total          : $FINAL_TOTAL"
        echo ""

        if [ "$FINAL_TOTAL" -eq 0 ]
        then

          echo "SUCCESS:"
          echo "Template S3 bucket is completely empty."

        else

          echo "ERROR:"
          echo "S3 bucket still contains versions or delete markers."

          exit 1

        fi


    # ======================================================
    # STEP 24
    # Get Template Bucket Stack Status
    # ======================================================

    - name: Get Template Bucket Stack Status

      if: steps.template_bucket.outputs.exists == 'true'

      id: template_status

      shell: bash

      run: |

        echo "======================================"
        echo "TEMPLATE BUCKET STACK STATUS"
        echo "======================================"

        TEMPLATE_STATUS=$(aws cloudformation describe-stacks \
          --stack-name "$TEMPLATE_BUCKET_STACK" \
          --region "$AWS_REGION" \
          --query "Stacks[0].StackStatus" \
          --output text \
          --no-cli-pager)

        echo ""
        echo "Template Bucket Stack:"
        echo "$TEMPLATE_BUCKET_STACK"

        echo ""
        echo "Current Status:"
        echo "$TEMPLATE_STATUS"

        echo ""

        echo "template_status=$TEMPLATE_STATUS" >> "$GITHUB_OUTPUT"


    # ======================================================
    # STEP 25
    # Delete Template Bucket Stack
    # ======================================================
    #
    # At this point:
    #
    #   TemplateBucket
    #       |
    #       +---- completely empty
    #
    # CloudFormation can now delete the S3 bucket.
    #
    # ======================================================

    - name: Delete Template Bucket Stack

      if: steps.template_bucket.outputs.exists == 'true'

      id: template_delete

      shell: bash

      run: |

        echo "======================================"
        echo "DELETING TEMPLATE BUCKET STACK"
        echo "======================================"

        TEMPLATE_STATUS="${{ steps.template_status.outputs.template_status }}"

        echo ""
        echo "Stack Name : $TEMPLATE_BUCKET_STACK"
        echo "Region     : $AWS_REGION"
        echo "Status     : $TEMPLATE_STATUS"
        echo ""

        # --------------------------------------------------
        # CloudFormation cannot start another operation while
        # the stack is already performing an operation.
        # --------------------------------------------------

        case "$TEMPLATE_STATUS" in

          CREATE_IN_PROGRESS|UPDATE_IN_PROGRESS|UPDATE_COMPLETE_CLEANUP_IN_PROGRESS|DELETE_IN_PROGRESS)

            echo "ERROR:"
            echo "Template bucket stack is currently busy."

            echo ""
            echo "Current status:"
            echo "$TEMPLATE_STATUS"

            exit 1

            ;;

        esac


        # --------------------------------------------------
        # If it is already DELETE_FAILED, retrying
        # delete-stack is valid after fixing the resource.
        # --------------------------------------------------

        echo "Starting Template Bucket stack deletion..."

        aws cloudformation delete-stack \
          --stack-name "$TEMPLATE_BUCKET_STACK" \
          --region "$AWS_REGION" \
          --no-cli-pager

        echo ""
        echo "Template Bucket stack deletion request submitted."


    # ======================================================
    # STEP 26
    # Wait for Template Bucket Stack Deletion
    # ======================================================
    #
    # IMPORTANT:
    #
    # This is the area where your previous workflow failed.
    #
    # The previous error was:
    #
    #   Waiter StackDeleteComplete failed:
    #   DELETE_FAILED
    #
    # The reason was that the S3 bucket contained versions.
    #
    # This workflow emptied the versioned bucket first.
    #
    # ======================================================

    - name: Wait for Template Bucket Deletion

      if: steps.template_delete.outcome == 'success'

      shell: bash

      run: |

        echo "======================================"
        echo "WAITING FOR TEMPLATE BUCKET DELETION"
        echo "======================================"

        if aws cloudformation wait stack-delete-complete \
          --stack-name "$TEMPLATE_BUCKET_STACK" \
          --region "$AWS_REGION"
        then

          echo ""
          echo "Template Bucket stack deletion completed."

        else

          echo ""
          echo "ERROR:"
          echo "Template Bucket stack deletion failed."

          echo ""
          echo "CloudFormation failure information:"

          aws cloudformation describe-stack-events \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='DELETE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]" \
            --output table \
            --no-cli-pager \
            || true

          exit 1

        fi


    # ======================================================
    # STEP 27
    # Verify Template Bucket Stack Deletion
    # ======================================================

    - name: Verify Template Bucket Stack Deletion

      if: steps.template_bucket.outputs.exists == 'true'

      shell: bash

      run: |

        echo "======================================"
        echo "VERIFYING TEMPLATE BUCKET STACK"
        echo "======================================"

        if aws cloudformation describe-stacks \
          --stack-name "$TEMPLATE_BUCKET_STACK" \
          --region "$AWS_REGION" \
          --no-cli-pager \
          > /dev/null 2>&1
        then

          echo ""
          echo "ERROR:"
          echo "Template Bucket stack still exists."

          exit 1

        else

          echo ""
          echo "Template Bucket stack no longer exists."

        fi


    # ======================================================
    # STEP 28
    # Verify RDS Cleanup
    # ======================================================

    - name: Verify RDS Cleanup

      shell: bash

      run: |

        echo "======================================"
        echo "VERIFYING RDS CLEANUP"
        echo "======================================"

        RDS_COUNT=$(aws rds describe-db-instances \
          --region "$AWS_REGION" \
          --query "length(DBInstances)" \
          --output text \
          --no-cli-pager)

        echo ""
        echo "RDS instances currently visible:"
        echo "$RDS_COUNT"
        echo ""

        if [ "$RDS_COUNT" = "0" ]
        then

          echo "SUCCESS:"
          echo "No RDS DB instances remain."

        else

          echo "WARNING:"
          echo "RDS DB instances still exist."

          aws rds describe-db-instances \
            --region "$AWS_REGION" \
            --query "DBInstances[*].[DBInstanceIdentifier,DBInstanceStatus,DeletionProtection]" \
            --output table \
            --no-cli-pager

        fi


    # ======================================================
    # STEP 29
    # Final CloudFormation Check
    # ======================================================

    - name: Final CloudFormation Check

      shell: bash

      run: |

        echo "======================================"
        echo "FINAL CLOUDFORMATION CHECK"
        echo "======================================"

        echo ""
        echo "Checking root stack..."

        if aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --no-cli-pager \
          > /dev/null 2>&1
        then

          echo "WARNING:"
          echo "$STACK_NAME still exists."

        else

          echo "OK:"
          echo "$STACK_NAME does not exist."

        fi


        echo ""
        echo "Checking Template Bucket stack..."

        if aws cloudformation describe-stacks \
          --stack-name "$TEMPLATE_BUCKET_STACK" \
          --region "$AWS_REGION" \
          --no-cli-pager \
          > /dev/null 2>&1
        then

          echo "WARNING:"
          echo "$TEMPLATE_BUCKET_STACK still exists."

        else

          echo "OK:"
          echo "$TEMPLATE_BUCKET_STACK does not exist."

        fi


    # ======================================================
    # STEP 30
    # Final AWS Resource Check
    # ======================================================

    - name: Final AWS Resource Check

      shell: bash

      run: |

        echo "======================================"
        echo "FINAL AWS RESOURCE CHECK"
        echo "======================================"

        echo ""
        echo "RDS INSTANCES"
        echo "--------------------------------------"

        aws rds describe-db-instances \
          --region "$AWS_REGION" \
          --query "DBInstances[*].[DBInstanceIdentifier,DBInstanceStatus,DeletionProtection]" \
          --output table \
          --no-cli-pager \
          || true

        echo ""

        echo "CLOUDFORMATION LAB STACKS"
        echo "--------------------------------------"

        aws cloudformation list-stacks \
          --region "$AWS_REGION" \
          --stack-status-filter \
            CREATE_IN_PROGRESS \
            CREATE_FAILED \
            CREATE_COMPLETE \
            ROLLBACK_IN_PROGRESS \
            ROLLBACK_FAILED \
            ROLLBACK_COMPLETE \
            DELETE_IN_PROGRESS \
            DELETE_FAILED \
            UPDATE_IN_PROGRESS \
            UPDATE_COMPLETE \
            UPDATE_ROLLBACK_IN_PROGRESS \
            UPDATE_ROLLBACK_FAILED \
            UPDATE_ROLLBACK_COMPLETE \
          --query "StackSummaries[?contains(StackName, 'Lab01-CloudFormation')].[StackName,StackStatus]" \
          --output table \
          --no-cli-pager \
          || true


    # ======================================================
    # STEP 31
    # Final Cleanup Summary
    # ======================================================

    - name: Final Cleanup Summary

      shell: bash

      run: |

        echo ""
        echo "=========================================================="
        echo "AWS CLOUDFORMATION LAB CLEANUP COMPLETE"
        echo "=========================================================="

        echo ""

        echo "Root Stack:"
        echo "  $STACK_NAME"

        echo ""

        echo "Template Bucket Stack:"
        echo "  $TEMPLATE_BUCKET_STACK"

        echo ""

        echo "AWS Region:"
        echo "  $AWS_REGION"

        echo ""

        echo "Cleanup operations:"
        echo "  [1]  AWS credentials configured"
        echo "  [2]  Root stack checked"
        echo "  [3]  Root stack resources inspected"
        echo "  [4]  RDS nested stack discovered"
        echo "  [5]  RDS database discovered"
        echo "  [6]  RDS deletion protection checked"
        echo "  [7]  Normal root stack deletion attempted"
        echo "  [8]  RDS recovery attempted if required"
        echo "  [9]  FORCE_DELETE_STACK used if required"
        echo "  [10] Root stack deletion verified"
        echo "  [11] Template Bucket stack discovered"
        echo "  [12] Template S3 bucket discovered"
        echo "  [13] S3 object versions deleted"
        echo "  [14] S3 delete markers deleted"
        echo "  [15] Template Bucket stack deleted"
        echo "  [16] Template Bucket stack deletion verified"
        echo "  [17] RDS cleanup verified"
        echo "  [18] Final CloudFormation check completed"
        echo "  [19] Final AWS resource check completed"

        echo ""

        echo "=========================================================="
        echo "LAB CLEANUP FINISHED"
        echo "=========================================================="
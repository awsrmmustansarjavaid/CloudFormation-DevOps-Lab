# ==========================================================
# AWS CloudFormation DevOps Lab
# GitHub Actions - COMPLETE DELETE / CLEANUP WORKFLOW
# ==========================================================
#
# File:
#   .github/workflows/delete.yml
#
# Purpose:
# ----------------------------------------------------------
# Completely clean the AWS CloudFormation DevOps Lab.
#
#
# ARCHITECTURE
# ----------------------------------------------------------
#
# Root stack:
#
#   Lab01-CloudFormation
#          |
#          +---- EC2WebServerStack
#          |
#          +---- S3NestedStack
#          |
#          +---- RDSNestedStack
#          |          |
#          |          +---- RDSDatabase
#          |          +---- RDSSecurityGroup
#          |          +---- RDSSubnetGroup
#          |
#          +---- ECSStack
#                     |
#                     +---- ECRRepository
#                     +---- ECSCluster
#                     +---- ECSService
#                     +---- ECSTaskDefinition
#                     +---- IAM Roles
#                     +---- ApplicationLoadBalancer
#                     +---- ALBTargetGroup
#                     +---- ALBListener
#
#
# SEPARATE STACK:
#
#   Lab01-CloudFormation-TemplateBucket
#          |
#          +---- TemplateBucket
#
#
# IMPORTANT CLOUDFORMATION RULE
# ----------------------------------------------------------
#
# ECSStack and RDSNestedStack are nested stacks.
#
# They are NOT independent application stacks.
#
# CloudFormation recommends deleting nested stacks through
# their root stack.
#
# Therefore this workflow DOES NOT attempt to directly
# delete the ECS nested CloudFormation stack.
#
# Instead:
#
#   1. Discover ECS resources while the root stack exists.
#   2. Pre-clean ECS/ECR resources that can block deletion.
#   3. Delete the root CloudFormation stack.
#   4. CloudFormation deletes ECSStack as part of root deletion.
#   5. If root deletion fails, clean remaining resources.
#   6. Retry root deletion.
#
#
# ==========================================================
# IMPORTANT DELETION ORDER
# ==========================================================
#
# Phase 1
# ----------------------------------------------------------
# Discover all resources BEFORE deleting the root stack.
#
# Phase 2
# ----------------------------------------------------------
# Pre-clean resources that commonly block deletion:
#
#   ECS Service
#   Fargate Tasks
#   ECR Images
#   ECR Repository
#   RDS Deletion Protection
#   Versioned S3 Template Bucket
#
# Phase 3
# ----------------------------------------------------------
# Delete root CloudFormation stack:
#
#   Lab01-CloudFormation
#
# CloudFormation then removes:
#
#   ECS nested stack
#   RDS nested stack
#   S3 nested stack
#   EC2
#   ALB
#   Target Group
#   IAM roles
#   networking dependencies
#
# Phase 4
# ----------------------------------------------------------
# If root deletion fails:
#
#   Inspect DELETE_FAILED resources.
#
# Then explicitly clean:
#
#   ECS Service
#   ECS Cluster
#   ECR Repository
#   ALB
#   Target Group
#   Listener
#
# and retry root deletion.
#
# Phase 5
# ----------------------------------------------------------
# Delete separate Template Bucket stack.
#
# Phase 6
# ----------------------------------------------------------
# Final AWS verification.
#
#
# ==========================================================
# REQUIRED GITHUB SECRETS
# ==========================================================
#
# Settings
#   ->
# Secrets and variables
#   ->
# Actions
#
# Required:
#
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#
#
# ==========================================================


# ==========================================================
# WORKFLOW NAME
# ==========================================================

name: Delete AWS CloudFormation Lab


# ==========================================================
# MANUAL TRIGGER ONLY
# ==========================================================

on:
  workflow_dispatch:


# ==========================================================
# GLOBAL ENVIRONMENT VARIABLES
# ==========================================================

env:

  # AWS Region containing the lab.
  AWS_REGION: us-east-1

  # Root CloudFormation stack.
  STACK_NAME: Lab01-CloudFormation

  # Separate Template Bucket CloudFormation stack.
  TEMPLATE_BUCKET_STACK: Lab01-CloudFormation-TemplateBucket


# ==========================================================
# JOB
# ==========================================================

jobs:

  delete-stack:

    name: Complete AWS CloudFormation Lab Cleanup

    runs-on: ubuntu-latest


    steps:


      # ======================================================
      # STEP 1
      # Checkout Repository
      # ======================================================

      - name: "Step 1 - Checkout Repository"
        uses: actions/checkout@v4


      # ======================================================
      # STEP 2
      # Configure AWS Credentials
      # ======================================================

      - name: "Step 2 - Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ======================================================
      # STEP 3
      # Verify AWS
      # ======================================================

      - name: "Step 3 - Verify AWS CLI and Account"
        shell: bash

        run: |

          set -e

          echo "=================================================="
          echo "AWS CLI / ACCOUNT VERIFICATION"
          echo "=================================================="

          aws --version

          echo ""

          aws sts get-caller-identity

          echo ""

          echo "AWS Region            : $AWS_REGION"
          echo "Root Stack            : $STACK_NAME"
          echo "Template Bucket Stack : $TEMPLATE_BUCKET_STACK"

          echo ""


      # ======================================================
      # STEP 4
      # Discover Root Stack
      # ======================================================

      - name: "Step 4 - Discover Root Stack"
        id: root
        shell: bash

        run: |

          echo "=================================================="
          echo "DISCOVER ROOT CLOUDFORMATION STACK"
          echo "=================================================="

          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo "exists=true" >> "$GITHUB_OUTPUT"

            STATUS=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "Stacks[0].StackStatus" \
              --output text \
              --no-cli-pager)

            echo "status=$STATUS" >> "$GITHUB_OUTPUT"

            echo ""
            echo "Root stack exists."
            echo "Status: $STATUS"

          else

            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "status=NOT_FOUND" >> "$GITHUB_OUTPUT"

            echo ""
            echo "Root stack does not exist."

          fi


      # ======================================================
      # STEP 5
      # Display Root Resources
      #
      # IMPORTANT:
      # ------------------------------------------------------
      # We discover everything BEFORE root deletion.
      #
      # This is one of the biggest corrections from the
      # original workflow.
      # ======================================================

      - name: "Step 5 - Display Root Stack Resources"
        if: steps.root.outputs.exists == 'true'
        shell: bash

        run: |

          echo "=================================================="
          echo "ROOT STACK RESOURCES"
          echo "=================================================="

          aws cloudformation list-stack-resources \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackResourceSummaries[].[LogicalResourceId,ResourceType,ResourceStatus,PhysicalResourceId]" \
            --output table \
            --no-cli-pager \
            || true


      # ======================================================
      # STEP 6
      # Discover RDS Nested Stack
      # ======================================================

      - name: "Step 6 - Discover RDS Nested Stack"
        if: steps.root.outputs.exists == 'true'
        id: rds_nested
        shell: bash

        run: |

          RDS_NESTED_STACK_ID=$(aws cloudformation list-stack-resources \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackResourceSummaries[?LogicalResourceId=='RDSNestedStack'].PhysicalResourceId" \
            --output text \
            --no-cli-pager \
            2>/dev/null || true)

          echo ""
          echo "RDS Nested Stack:"
          echo "$RDS_NESTED_STACK_ID"

          if [ -n "$RDS_NESTED_STACK_ID" ] &&
             [ "$RDS_NESTED_STACK_ID" != "None" ]
          then

            echo "nested=$RDS_NESTED_STACK_ID" >> "$GITHUB_OUTPUT"

          else

            echo "nested=" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # STEP 7
      # Discover RDS Instance
      # ======================================================

      - name: "Step 7 - Discover RDS Instance"
        if: steps.rds_nested.outputs.nested != ''
        id: rds
        shell: bash

        run: |

          RDS_INSTANCE=$(aws cloudformation describe-stack-resources \
            --stack-name "${{ steps.rds_nested.outputs.nested }}" \
            --region "$AWS_REGION" \
            --logical-resource-id RDSDatabase \
            --query "StackResources[0].PhysicalResourceId" \
            --output text \
            --no-cli-pager \
            2>/dev/null || true)

          echo ""
          echo "RDS Instance:"
          echo "$RDS_INSTANCE"

          if [ -n "$RDS_INSTANCE" ] &&
             [ "$RDS_INSTANCE" != "None" ]
          then

            echo "instance=$RDS_INSTANCE" >> "$GITHUB_OUTPUT"

          else

            echo "instance=" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # STEP 8
      # Disable RDS Deletion Protection
      # ======================================================

      - name: "Step 8 - Disable RDS Deletion Protection"
        if: steps.rds.outputs.instance != ''
        shell: bash

        run: |

          RDS_INSTANCE="${{ steps.rds.outputs.instance }}"

          echo "=================================================="
          echo "RDS DELETION PROTECTION"
          echo "=================================================="

          PROTECTION=$(aws rds describe-db-instances \
            --db-instance-identifier "$RDS_INSTANCE" \
            --region "$AWS_REGION" \
            --query "DBInstances[0].DeletionProtection" \
            --output text \
            --no-cli-pager \
            2>/dev/null || echo "NOT_FOUND")

          echo "RDS Instance        : $RDS_INSTANCE"
          echo "Deletion Protection : $PROTECTION"

          if [ "$PROTECTION" = "True" ]
          then

            echo ""
            echo "Disabling deletion protection..."

            aws rds modify-db-instance \
              --db-instance-identifier "$RDS_INSTANCE" \
              --region "$AWS_REGION" \
              --no-deletion-protection \
              --apply-immediately \
              --no-cli-pager

          else

            echo ""
            echo "Deletion protection is already disabled."

          fi


      # ======================================================
      # STEP 9
      # Discover ECS Nested Stack
      # ======================================================

      - name: "Step 9 - Discover ECS Nested Stack"
        if: steps.root.outputs.exists == 'true'
        id: ecs_nested
        shell: bash

        run: |

          ECS_NESTED_STACK_ID=$(aws cloudformation list-stack-resources \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackResourceSummaries[?LogicalResourceId=='ECSStack'].PhysicalResourceId" \
            --output text \
            --no-cli-pager \
            2>/dev/null || true)

          echo ""
          echo "ECS Nested Stack:"
          echo "$ECS_NESTED_STACK_ID"

          if [ -n "$ECS_NESTED_STACK_ID" ] &&
             [ "$ECS_NESTED_STACK_ID" != "None" ]
          then

            echo "nested=$ECS_NESTED_STACK_ID" >> "$GITHUB_OUTPUT"

          else

            echo "nested=" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # STEP 10
      # Discover ECS Cluster
      # ======================================================

      - name: "Step 10 - Discover ECS Cluster"
        if: steps.ecs_nested.outputs.nested != ''
        id: ecs_cluster
        shell: bash

        run: |

          ECS_CLUSTER=$(aws cloudformation list-stack-resources \
            --stack-name "${{ steps.ecs_nested.outputs.nested }}" \
            --region "$AWS_REGION" \
            --query "StackResourceSummaries[?ResourceType=='AWS::ECS::Cluster'].PhysicalResourceId" \
            --output text \
            --no-cli-pager \
            2>/dev/null || true)

          echo ""
          echo "ECS Cluster:"
          echo "$ECS_CLUSTER"

          if [ -n "$ECS_CLUSTER" ] &&
             [ "$ECS_CLUSTER" != "None" ]
          then

            echo "cluster=$ECS_CLUSTER" >> "$GITHUB_OUTPUT"

          else

            echo "cluster=" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # STEP 11
      # Discover ECS Service
      # ======================================================

      - name: "Step 11 - Discover ECS Service"
        if: steps.ecs_nested.outputs.nested != ''
        id: ecs_service
        shell: bash

        run: |

          ECS_SERVICE=$(aws cloudformation list-stack-resources \
            --stack-name "${{ steps.ecs_nested.outputs.nested }}" \
            --region "$AWS_REGION" \
            --query "StackResourceSummaries[?ResourceType=='AWS::ECS::Service'].PhysicalResourceId" \
            --output text \
            --no-cli-pager \
            2>/dev/null || true)

          echo ""
          echo "ECS Service:"
          echo "$ECS_SERVICE"

          if [ -n "$ECS_SERVICE" ] &&
             [ "$ECS_SERVICE" != "None" ]
          then

            echo "service=$ECS_SERVICE" >> "$GITHUB_OUTPUT"

          else

            echo "service=" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # STEP 12
      # Discover ECR Repository
      # ======================================================

      - name: "Step 12 - Discover ECR Repository"
        if: steps.ecs_nested.outputs.nested != ''
        id: ecr
        shell: bash

        run: |

          ECR_REPOSITORY=$(aws cloudformation list-stack-resources \
            --stack-name "${{ steps.ecs_nested.outputs.nested }}" \
            --region "$AWS_REGION" \
            --query "StackResourceSummaries[?ResourceType=='AWS::ECR::Repository'].PhysicalResourceId" \
            --output text \
            --no-cli-pager \
            2>/dev/null || true)

          echo ""
          echo "ECR Repository:"
          echo "$ECR_REPOSITORY"

          if [ -n "$ECR_REPOSITORY" ] &&
             [ "$ECR_REPOSITORY" != "None" ]
          then

            echo "repository=$ECR_REPOSITORY" >> "$GITHUB_OUTPUT"

          else

            echo "repository=" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # STEP 13
      # Discover ALB
      # ======================================================

      - name: "Step 13 - Discover Application Load Balancer"
        if: steps.ecs_nested.outputs.nested != ''
        id: alb
        shell: bash

        run: |

          ALB_ARN=$(aws cloudformation list-stack-resources \
            --stack-name "${{ steps.ecs_nested.outputs.nested }}" \
            --region "$AWS_REGION" \
            --query "StackResourceSummaries[?ResourceType=='AWS::ElasticLoadBalancingV2::LoadBalancer'].PhysicalResourceId" \
            --output text \
            --no-cli-pager \
            2>/dev/null || true)

          echo ""
          echo "ALB:"
          echo "$ALB_ARN"

          if [ -n "$ALB_ARN" ] &&
             [ "$ALB_ARN" != "None" ]
          then

            echo "arn=$ALB_ARN" >> "$GITHUB_OUTPUT"

          else

            echo "arn=" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # STEP 14
      # Discover Target Group
      # ======================================================

      - name: "Step 14 - Discover Target Group"
        if: steps.ecs_nested.outputs.nested != ''
        id: target_group
        shell: bash

        run: |

          TARGET_GROUP_ARN=$(aws cloudformation list-stack-resources \
            --stack-name "${{ steps.ecs_nested.outputs.nested }}" \
            --region "$AWS_REGION" \
            --query "StackResourceSummaries[?ResourceType=='AWS::ElasticLoadBalancingV2::TargetGroup'].PhysicalResourceId" \
            --output text \
            --no-cli-pager \
            2>/dev/null || true)

          echo ""
          echo "Target Group:"
          echo "$TARGET_GROUP_ARN"

          if [ -n "$TARGET_GROUP_ARN" ] &&
             [ "$TARGET_GROUP_ARN" != "None" ]
          then

            echo "arn=$TARGET_GROUP_ARN" >> "$GITHUB_OUTPUT"

          else

            echo "arn=" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # STEP 15
      # Discover ALB Listener
      # ======================================================

      - name: "Step 15 - Discover ALB Listener"
        if: steps.ecs_nested.outputs.nested != ''
        id: listener
        shell: bash

        run: |

          LISTENER_ARN=$(aws cloudformation list-stack-resources \
            --stack-name "${{ steps.ecs_nested.outputs.nested }}" \
            --region "$AWS_REGION" \
            --query "StackResourceSummaries[?ResourceType=='AWS::ElasticLoadBalancingV2::Listener'].PhysicalResourceId" \
            --output text \
            --no-cli-pager \
            2>/dev/null || true)

          echo ""
          echo "ALB Listener:"
          echo "$LISTENER_ARN"

          if [ -n "$LISTENER_ARN" ] &&
             [ "$LISTENER_ARN" != "None" ]
          then

            echo "arn=$LISTENER_ARN" >> "$GITHUB_OUTPUT"

          else

            echo "arn=" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # PHASE 1 COMPLETE
      #
      # At this point we have discovered the important
      # resources BEFORE root deletion.
      # ======================================================


      # ======================================================
      # STEP 16
      # Pre-Cleanup ECS Service
      #
      # This is extremely important.
      #
      # Running Fargate tasks can keep ENIs/subnets/security
      # groups busy and cause the CloudFormation networking
      # resources to fail during deletion.
      # ======================================================

      - name: "Step 16 - Pre-Cleanup ECS Service"
        if: |
          steps.ecs_cluster.outputs.cluster != '' &&
          steps.ecs_service.outputs.service != ''
        shell: bash

        run: |

          ECS_CLUSTER="${{ steps.ecs_cluster.outputs.cluster }}"
          ECS_SERVICE="${{ steps.ecs_service.outputs.service }}"

          echo "=================================================="
          echo "PRE-CLEAN ECS SERVICE"
          echo "=================================================="

          if aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo "Scaling ECS service to zero..."

            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_SERVICE" \
              --desired-count 0 \
              --region "$AWS_REGION" \
              --no-cli-pager

          else

            echo "ECS service does not exist."

          fi


      # ======================================================
      # STEP 17
      # Wait For ECS Tasks
      # ======================================================

      - name: "Step 17 - Wait For ECS Tasks To Stop"
        if: |
          steps.ecs_cluster.outputs.cluster != '' &&
          steps.ecs_service.outputs.service != ''
        shell: bash

        run: |

          ECS_CLUSTER="${{ steps.ecs_cluster.outputs.cluster }}"
          ECS_SERVICE="${{ steps.ecs_service.outputs.service }}"

          echo "=================================================="
          echo "WAITING FOR ECS TASKS"
          echo "=================================================="

          for ATTEMPT in $(seq 1 60)
          do

            RUNNING=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --region "$AWS_REGION" \
              --query "services[0].runningCount" \
              --output text \
              --no-cli-pager \
              2>/dev/null || echo "0")

            echo ""
            echo "Attempt: $ATTEMPT / 60"
            echo "Running Tasks: $RUNNING"

            if [ "$RUNNING" = "0" ]
            then

              echo ""
              echo "All ECS tasks have stopped."

              break

            fi

            sleep 10

          done


      # ======================================================
      # STEP 18
      # Delete ECS Service Directly
      #
      # IMPORTANT:
      #
      # We are not deleting the nested CloudFormation stack.
      #
      # We are only removing the ECS service if it is still
      # present and is preventing the nested ECS stack from
      # completing deletion.
      # ======================================================

      - name: "Step 18 - Delete ECS Service If Required"
        if: |
          steps.ecs_cluster.outputs.cluster != '' &&
          steps.ecs_service.outputs.service != ''
        shell: bash

        run: |

          ECS_CLUSTER="${{ steps.ecs_cluster.outputs.cluster }}"
          ECS_SERVICE="${{ steps.ecs_service.outputs.service }}"

          echo "=================================================="
          echo "DELETE ECS SERVICE IF STILL PRESENT"
          echo "=================================================="

          if aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            aws ecs delete-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_SERVICE" \
              --force \
              --region "$AWS_REGION" \
              --no-cli-pager \
              || true

            echo "ECS service deletion requested."

          else

            echo "ECS service already gone."

          fi


      # ======================================================
      # STEP 19
      # Empty ECR
      #
      # ECR repository deletion fails when images remain.
      # ======================================================

      - name: "Step 19 - Empty ECR Repository"
        if: steps.ecr.outputs.repository != ''
        shell: bash

        run: |

          ECR_REPOSITORY="${{ steps.ecr.outputs.repository }}"

          echo "=================================================="
          echo "EMPTY ECR REPOSITORY"
          echo "=================================================="

          if ! aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo "ECR repository already deleted."

            exit 0

          fi

          while true
          do

            IMAGE_IDS=$(aws ecr list-images \
              --repository-name "$ECR_REPOSITORY" \
              --region "$AWS_REGION" \
              --query "imageIds[*]" \
              --output json \
              --no-cli-pager)

            COUNT=$(echo "$IMAGE_IDS" | jq 'length')

            echo "Images remaining: $COUNT"

            if [ "$COUNT" -eq 0 ]
            then

              echo "ECR repository is empty."

              break

            fi

            echo "$IMAGE_IDS" > /tmp/ecr-images.json

            aws ecr batch-delete-image \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids file:///tmp/ecr-images.json \
              --region "$AWS_REGION" \
              --no-cli-pager

          done


      # ======================================================
      # STEP 20
      # Delete ECR Repository
      #
      # This is done BEFORE root deletion because ECR is
      # completely independent of ECS runtime networking.
      # ======================================================

      - name: "Step 20 - Delete ECR Repository If Required"
        if: steps.ecr.outputs.repository != ''
        shell: bash

        run: |

          ECR_REPOSITORY="${{ steps.ecr.outputs.repository }}"

          echo "=================================================="
          echo "DELETE ECR REPOSITORY"
          echo "=================================================="

          if aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            aws ecr delete-repository \
              --repository-name "$ECR_REPOSITORY" \
              --region "$AWS_REGION" \
              --no-cli-pager \
              || true

            echo "ECR repository deletion requested."

          else

            echo "ECR repository already deleted."

          fi


      # ======================================================
      # STEP 21
      # Empty Versioned Template S3 Bucket
      # ======================================================

      - name: "Step 21 - Discover Template S3 Bucket"
        id: template_s3
        shell: bash

        run: |

          if ! aws cloudformation describe-stacks \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "bucket=" >> "$GITHUB_OUTPUT"

            echo "Template Bucket stack does not exist."

            exit 0

          fi

          echo "exists=true" >> "$GITHUB_OUTPUT"

          TEMPLATE_BUCKET=$(aws cloudformation list-stack-resources \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --query "StackResourceSummaries[?LogicalResourceId=='TemplateBucket'].PhysicalResourceId" \
            --output text \
            --no-cli-pager \
            2>/dev/null || true)

          echo "bucket=$TEMPLATE_BUCKET" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Template Bucket:"
          echo "$TEMPLATE_BUCKET"


      # ======================================================
      # STEP 22
      # Empty All S3 Versions And Delete Markers
      # ======================================================

      - name: "Step 22 - Empty Versioned Template Bucket"
        if: steps.template_s3.outputs.bucket != ''
        shell: bash

        run: |

          TEMPLATE_BUCKET="${{ steps.template_s3.outputs.bucket }}"

          echo "=================================================="
          echo "EMPTY VERSIONED S3 BUCKET"
          echo "=================================================="

          while true
          do

            VERSION_DATA=$(aws s3api list-object-versions \
              --bucket "$TEMPLATE_BUCKET" \
              --region "$AWS_REGION" \
              --output json \
              --no-cli-pager)

            VERSION_COUNT=$(echo "$VERSION_DATA" |
              jq '(.Versions // []) | length')

            MARKER_COUNT=$(echo "$VERSION_DATA" |
              jq '(.DeleteMarkers // []) | length')

            TOTAL=$((VERSION_COUNT + MARKER_COUNT))

            echo ""
            echo "Versions       : $VERSION_COUNT"
            echo "Delete markers : $MARKER_COUNT"
            echo "Total          : $TOTAL"

            if [ "$TOTAL" -eq 0 ]
            then

              echo ""
              echo "Bucket is completely empty."

              break

            fi

            echo "$VERSION_DATA" |
              jq '{
                Objects:
                (
                  ((.Versions // []) + (.DeleteMarkers // []))
                  | map({
                      Key: .Key,
                      VersionId: .VersionId
                    })
                  | .[0:1000]
                ),
                Quiet: true
              }' > /tmp/s3-delete.json

            aws s3api delete-objects \
              --bucket "$TEMPLATE_BUCKET" \
              --delete file:///tmp/s3-delete.json \
              --region "$AWS_REGION" \
              --no-cli-pager

          done


      # ======================================================
      # STEP 23
      # Delete Template Bucket Stack
      # ======================================================

      - name: "Step 23 - Delete Template Bucket Stack"
        if: steps.template_s3.outputs.exists == 'true'
        shell: bash

        run: |

          echo "=================================================="
          echo "DELETE TEMPLATE BUCKET STACK"
          echo "=================================================="

          aws cloudformation delete-stack \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --no-cli-pager

          aws cloudformation wait stack-delete-complete \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION"

          echo ""
          echo "Template Bucket stack deleted."


      # ======================================================
      # PHASE 2 COMPLETE
      #
      # ECS runtime
      # ECR
      # RDS protection
      # Template S3
      #
      # have now been pre-cleaned.
      # ======================================================


      # ======================================================
      # STEP 24
      # START ROOT STACK DELETION
      #
      # IMPORTANT:
      #
      # DO NOT delete ECSStack directly.
      #
      # CloudFormation will now delete:
      #
      #   ECSStack
      #   RDSNestedStack
      #   S3NestedStack
      #   EC2
      #   ALB
      #   IAM
      #   networking resources
      #
      # as part of root stack deletion.
      # ======================================================

      - name: "Step 24 - Delete Root CloudFormation Stack"
        if: steps.root.outputs.exists == 'true'
        shell: bash

        run: |

          echo "=================================================="
          echo "DELETE ROOT CLOUDFORMATION STACK"
          echo "=================================================="

          CURRENT_STATUS="${{ steps.root.outputs.status }}"

          echo ""
          echo "Stack  : $STACK_NAME"
          echo "Status : $CURRENT_STATUS"
          echo ""

          if [ "$CURRENT_STATUS" = "DELETE_FAILED" ]
          then

            echo "Root stack is already DELETE_FAILED."
            echo "Using FORCE_DELETE_STACK."

            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --deletion-mode FORCE_DELETE_STACK \
              --no-cli-pager

          else

            echo "Starting normal CloudFormation deletion."

            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --no-cli-pager

          fi


      # ======================================================
      # STEP 25
      # Wait For Root Deletion
      # ======================================================

      - name: "Step 25 - Wait For Root Stack Deletion"
        if: steps.root.outputs.exists == 'true'
        id: root_wait
        continue-on-error: true
        shell: bash

        run: |

          echo "=================================================="
          echo "WAITING FOR ROOT STACK DELETION"
          echo "=================================================="

          if aws cloudformation wait stack-delete-complete \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION"
          then

            echo "deleted=true" >> "$GITHUB_OUTPUT"

            echo ""
            echo "ROOT STACK DELETED SUCCESSFULLY."

          else

            echo "deleted=false" >> "$GITHUB_OUTPUT"

            echo ""
            echo "ROOT STACK DELETION FAILED."

          fi


      # ======================================================
      # STEP 26
      # Show DELETE_FAILED Resources
      # ======================================================

      - name: "Step 26 - Inspect Root DELETE_FAILED Resources"
        if: |
          steps.root.outputs.exists == 'true' &&
          steps.root_wait.outputs.deleted == 'false'
        shell: bash

        run: |

          echo "=================================================="
          echo "ROOT DELETE_FAILED RESOURCES"
          echo "=================================================="

          aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='DELETE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]" \
            --output table \
            --no-cli-pager \
            || true


      # ======================================================
      # STEP 27
      # Retry ECS Service Cleanup
      #
      # If CloudFormation could not remove the ECS service,
      # retry here using the IDs discovered BEFORE deletion.
      # ======================================================

      - name: "Step 27 - Retry ECS Service Cleanup"
        if: |
          steps.root_wait.outputs.deleted == 'false' &&
          steps.ecs_cluster.outputs.cluster != '' &&
          steps.ecs_service.outputs.service != ''
        shell: bash

        run: |

          ECS_CLUSTER="${{ steps.ecs_cluster.outputs.cluster }}"
          ECS_SERVICE="${{ steps.ecs_service.outputs.service }}"

          echo "=================================================="
          echo "RETRY ECS SERVICE CLEANUP"
          echo "=================================================="

          if aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_SERVICE" \
              --desired-count 0 \
              --region "$AWS_REGION" \
              --no-cli-pager \
              || true

            sleep 20

            aws ecs delete-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_SERVICE" \
              --force \
              --region "$AWS_REGION" \
              --no-cli-pager \
              || true

          else

            echo "ECS service no longer exists."

          fi


      # ======================================================
      # STEP 28
      # Retry ECS Cluster Cleanup
      # ======================================================

      - name: "Step 28 - Retry ECS Cluster Cleanup"
        if: |
          steps.root_wait.outputs.deleted == 'false' &&
          steps.ecs_cluster.outputs.cluster != ''
        shell: bash

        run: |

          ECS_CLUSTER="${{ steps.ecs_cluster.outputs.cluster }}"

          echo "=================================================="
          echo "RETRY ECS CLUSTER CLEANUP"
          echo "=================================================="

          CLUSTER_STATUS=$(aws ecs describe-clusters \
            --clusters "$ECS_CLUSTER" \
            --region "$AWS_REGION" \
            --query "clusters[0].status" \
            --output text \
            --no-cli-pager \
            2>/dev/null || echo "NOT_FOUND")

          echo "Cluster status: $CLUSTER_STATUS"

          if [ "$CLUSTER_STATUS" = "ACTIVE" ]
          then

            aws ecs delete-cluster \
              --cluster "$ECS_CLUSTER" \
              --region "$AWS_REGION" \
              --no-cli-pager \
              || true

          else

            echo "ECS cluster is already gone or inactive."

          fi


      # ======================================================
      # STEP 29
      # Retry ECR Cleanup
      # ======================================================

      - name: "Step 29 - Retry ECR Cleanup"
        if: |
          steps.root_wait.outputs.deleted == 'false' &&
          steps.ecr.outputs.repository != ''
        shell: bash

        run: |

          ECR_REPOSITORY="${{ steps.ecr.outputs.repository }}"

          echo "=================================================="
          echo "RETRY ECR CLEANUP"
          echo "=================================================="

          if aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo "Deleting any remaining ECR images."

            IMAGE_IDS=$(aws ecr list-images \
              --repository-name "$ECR_REPOSITORY" \
              --region "$AWS_REGION" \
              --query "imageIds[*]" \
              --output json \
              --no-cli-pager)

            if [ "$(echo "$IMAGE_IDS" | jq 'length')" -gt 0 ]
            then

              aws ecr batch-delete-image \
                --repository-name "$ECR_REPOSITORY" \
                --image-ids file:///dev/stdin \
                --region "$AWS_REGION" \
                --no-cli-pager <<< "$IMAGE_IDS" \
                || true

            fi

            aws ecr delete-repository \
              --repository-name "$ECR_REPOSITORY" \
              --region "$AWS_REGION" \
              --no-cli-pager \
              || true

          else

            echo "ECR repository already deleted."

          fi


      # ======================================================
      # STEP 30
      # Retry ALB Cleanup
      #
      # ALB ENIs can keep VPC/subnet deletion blocked.
      #
      # We only do this during recovery if the root deletion
      # failed.
      # ======================================================

      - name: "Step 30 - Retry ALB Cleanup"
        if: |
          steps.root_wait.outputs.deleted == 'false' &&
          steps.alb.outputs.arn != ''
        shell: bash

        run: |

          ALB_ARN="${{ steps.alb.outputs.arn }}"

          echo "=================================================="
          echo "RETRY ALB CLEANUP"
          echo "=================================================="

          if aws elbv2 describe-load-balancers \
            --load-balancer-arns "$ALB_ARN" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo "Deleting ALB..."

            aws elbv2 delete-load-balancer \
              --load-balancer-arn "$ALB_ARN" \
              --region "$AWS_REGION" \
              --no-cli-pager \
              || true

          else

            echo "ALB already deleted."

          fi


      # ======================================================
      # STEP 31
      # Retry Target Group Cleanup
      # ======================================================

      - name: "Step 31 - Retry Target Group Cleanup"
        if: |
          steps.root_wait.outputs.deleted == 'false' &&
          steps.target_group.outputs.arn != ''
        shell: bash

        run: |

          TARGET_GROUP_ARN="${{ steps.target_group.outputs.arn }}"

          echo "=================================================="
          echo "RETRY TARGET GROUP CLEANUP"
          echo "=================================================="

          aws elbv2 delete-target-group \
            --target-group-arn "$TARGET_GROUP_ARN" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            || true


      # ======================================================
      # STEP 32
      # Retry Root Stack Deletion
      #
      # At this point the common ECS/ECR/ALB blockers have
      # been removed.
      #
      # FORCE_DELETE_STACK is used only if the first root
      # deletion failed.
      # ======================================================

      - name: "Step 32 - Retry Root Stack Deletion"
        if: |
          steps.root.outputs.exists == 'true' &&
          steps.root_wait.outputs.deleted == 'false'
        shell: bash

        run: |

          echo "=================================================="
          echo "RETRY ROOT STACK DELETION"
          echo "=================================================="

          aws cloudformation delete-stack \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --deletion-mode FORCE_DELETE_STACK \
            --no-cli-pager

          echo ""
          echo "FORCE_DELETE_STACK request submitted."


      # ======================================================
      # STEP 33
      # Wait For Final Root Deletion
      # ======================================================

      - name: "Step 33 - Wait For Final Root Deletion"
        if: |
          steps.root.outputs.exists == 'true' &&
          steps.root_wait.outputs.deleted == 'false'
        continue-on-error: true
        shell: bash

        run: |

          echo "=================================================="
          echo "WAITING FOR FINAL ROOT DELETION"
          echo "=================================================="

          if aws cloudformation wait stack-delete-complete \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION"
          then

            echo ""
            echo "ROOT STACK FINALLY DELETED."

          else

            echo ""
            echo "WARNING:"
            echo "Root stack may still contain retained resources."

            aws cloudformation list-stack-resources \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "StackResourceSummaries[].[LogicalResourceId,ResourceType,ResourceStatus,PhysicalResourceId]" \
              --output table \
              --no-cli-pager \
              || true

          fi


      # ======================================================
      # STEP 34
      # Final Root Stack Verification
      # ======================================================

      - name: "Step 34 - Verify Root Stack"
        id: final_root
        shell: bash

        run: |

          echo "=================================================="
          echo "FINAL ROOT STACK VERIFICATION"
          echo "=================================================="

          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo "exists=true" >> "$GITHUB_OUTPUT"

            echo ""
            echo "WARNING:"
            echo "Root stack still exists."

          else

            echo "exists=false" >> "$GITHUB_OUTPUT"

            echo ""
            echo "SUCCESS:"
            echo "Root stack no longer exists."

          fi


      # ======================================================
      # STEP 35
      # Final RDS Cleanup
      # ======================================================

      - name: "Step 35 - Verify RDS Cleanup"
        shell: bash

        run: |

          echo "=================================================="
          echo "FINAL RDS VERIFICATION"
          echo "=================================================="

          aws rds describe-db-instances \
            --region "$AWS_REGION" \
            --query "DBInstances[].[DBInstanceIdentifier,DBInstanceStatus,DeletionProtection]" \
            --output table \
            --no-cli-pager \
            || true


      # ======================================================
      # STEP 36
      # Final ECS Verification
      # ======================================================

      - name: "Step 36 - Verify ECS Cleanup"
        shell: bash

        run: |

          echo "=================================================="
          echo "FINAL ECS VERIFICATION"
          echo "=================================================="

          echo ""
          echo "ECS Clusters:"

          aws ecs list-clusters \
            --region "$AWS_REGION" \
            --output table \
            --no-cli-pager \
            || true


      # ======================================================
      # STEP 37
      # Final ECR Verification
      # ======================================================

      - name: "Step 37 - Verify ECR Cleanup"
      shell: bash

        run: |

          echo "=================================================="
          echo "FINAL ECR VERIFICATION"
          echo "=================================================="

          aws ecr describe-repositories \
            --region "$AWS_REGION" \
            --query "repositories[].[repositoryName,repositoryUri]" \
            --output table \
            --no-cli-pager \
            || true


      # ======================================================
      # STEP 38
      # Final CloudFormation Verification
      # ======================================================

      - name: "Step 38 - Final CloudFormation Verification"
        shell: bash

        run: |

          echo "=================================================="
          echo "FINAL CLOUDFORMATION VERIFICATION"
          echo "=================================================="

          echo ""
          echo "Lab stacks still present:"

          aws cloudformation list-stacks \
            --region "$AWS_REGION" \
            --stack-status-filter \
              CREATE_IN_PROGRESS \
              CREATE_FAILED \
              CREATE_COMPLETE \
              ROLLBACK_IN_PROGRESS \
              ROLLBACK_FAILED \
              ROLLBACK_COMPLETE \
              DELETE_IN_PROGRESS \
              DELETE_FAILED \
              UPDATE_IN_PROGRESS \
              UPDATE_COMPLETE \
              UPDATE_ROLLBACK_IN_PROGRESS \
              UPDATE_ROLLBACK_FAILED \
              UPDATE_ROLLBACK_COMPLETE \
            --query "StackSummaries[?contains(StackName, 'Lab01-CloudFormation')].[StackName,StackStatus]" \
            --output table \
            --no-cli-pager \
            || true


      # ======================================================
      # STEP 39
      # FINAL SUMMARY
      # ======================================================

      - name: "Step 39 - Final Cleanup Summary"
        shell: bash

        run: |

          echo ""
          echo "=========================================================="
          echo "       AWS CLOUDFORMATION LAB CLEANUP SUMMARY"
          echo "=========================================================="

          echo ""
          echo "Region:"
          echo "  $AWS_REGION"

          echo ""
          echo "Root Stack:"
          echo "  $STACK_NAME"

          echo ""
          echo "Template Bucket Stack:"
          echo "  $TEMPLATE_BUCKET_STACK"

          echo ""
          echo "----------------------------------------------------------"
          echo "CLEANUP ORDER USED"
          echo "----------------------------------------------------------"

          echo ""
          echo "  [01] Discover root stack"
          echo "  [02] Discover RDS nested stack"
          echo "  [03] Discover RDS database"
          echo "  [04] Disable RDS deletion protection"
          echo "  [05] Discover ECS nested stack"
          echo "  [06] Discover ECS cluster"
          echo "  [07] Discover ECS service"
          echo "  [08] Discover ECR repository"
          echo "  [09] Discover ALB"
          echo "  [10] Discover Target Group"
          echo "  [11] Discover ALB Listener"
          echo "  [12] Scale ECS service to zero"
          echo "  [13] Wait for Fargate tasks"
          echo "  [14] Remove ECS service if required"
          echo "  [15] Empty ECR repository"
          echo "  [16] Delete ECR repository"
          echo "  [17] Empty versioned S3 bucket"
          echo "  [18] Delete Template Bucket stack"
          echo "  [19] Delete ROOT CloudFormation stack"
          echo "  [20] Wait for root deletion"
          echo "  [21] Inspect DELETE_FAILED resources"
          echo "  [22] Retry ECS cleanup if required"
          echo "  [23] Retry ECS cluster cleanup"
          echo "  [24] Retry ECR cleanup"
          echo "  [25] Retry ALB cleanup"
          echo "  [26] Retry Target Group cleanup"
          echo "  [27] FORCE_DELETE_STACK if required"
          echo "  [28] Verify root stack"
          echo "  [29] Verify RDS"
          echo "  [30] Verify ECS"
          echo "  [31] Verify ECR"
          echo "  [32] Final CloudFormation verification"

          echo ""
          echo "=========================================================="
          echo "                 CLEANUP FINISHED"
          echo "=========================================================="

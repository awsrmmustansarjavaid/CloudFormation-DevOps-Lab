```yaml
# ==========================================================
# AWS CloudFormation DevOps Lab
# GitHub Actions Delete Workflow
# ==========================================================
#
# File:
# .github/workflows/delete.yml
#
# Purpose:
# ----------------------------------------------------------
# Completely deletes the CloudFormation lab infrastructure.
#
# Delete order:
#
#   1. Delete the MAIN CloudFormation stack
#      Lab01-CloudFormation
#
#   2. Wait until the MAIN stack is completely deleted.
#
#   3. The MAIN stack deletion removes its nested stacks:
#
#      - EC2 nested stack
#      - S3 nested stack
#      - RDS nested stack
#
#   4. Retrieve the S3 template bucket created by:
#
#      Lab01-CloudFormation-TemplateBucket
#
#   5. Empty the template bucket.
#
#   6. Delete:
#
#      Lab01-CloudFormation-TemplateBucket
#
#   7. Wait until the template bucket stack is completely
#      deleted.
#
#   8. Verify that BOTH CloudFormation stacks no longer exist.
#
# ==========================================================
#
# IMPORTANT:
# ==========================================================
#
# The template bucket stack is NOT a nested stack of:
#
#   Lab01-CloudFormation
#
# It is a completely separate CloudFormation stack.
#
# Therefore:
#
# Deleting:
#
#   Lab01-CloudFormation
#
# DOES NOT automatically delete:
#
#   Lab01-CloudFormation-TemplateBucket
#
# We explicitly delete the template bucket stack at the
# end of this workflow.
#
# ==========================================================
#
# S3 IMPORTANT:
# ==========================================================
#
# The template bucket contains files uploaded by the deploy
# workflow, for example:
#
#   templates/lab01.yaml
#   templates/aws-rds.yaml
#   templates/ec2-webserver.yaml
#   templates/aws-s3.yaml
#
# CloudFormation cannot delete a non-empty S3 bucket.
#
# Therefore this workflow:
#
#   1. Finds the template bucket
#   2. Deletes all objects
#   3. Deletes all object versions/delete markers
#   4. Deletes the template bucket stack
#
# ==========================================================
#
# RDS IMPORTANT:
# ==========================================================
#
# The RDS password is managed by:
#
#   Amazon RDS
#        |
#        v
#   AWS Secrets Manager
#
# This workflow does NOT retrieve or display the password.
#
# If the RDS nested stack is configured with:
#
#   DeletionProtection: false
#
# the RDS database can be deleted normally as part of the
# main stack deletion.
#
# ==========================================================
#
# SAFETY:
# ==========================================================
#
# This workflow is MANUAL ONLY.
#
# It does NOT automatically run on every push.
#
# To delete the infrastructure:
#
# GitHub
#   -> Actions
#   -> Delete CloudFormation Stack
#   -> Run workflow
#
# ==========================================================


# ----------------------------------------------------------
# Workflow Name
# ----------------------------------------------------------

name: Delete AWS CloudFormation Lab


# ----------------------------------------------------------
# Workflow Trigger
# ----------------------------------------------------------
#
# Manual execution only.
#
# This prevents an accidental repository push from deleting
# the complete AWS infrastructure.
#
# ----------------------------------------------------------

on:

  workflow_dispatch:


# ==========================================================
# GLOBAL ENVIRONMENT VARIABLES
# ==========================================================

env:

  # --------------------------------------------------------
  # AWS Region
  # --------------------------------------------------------

  AWS_REGION: us-east-1


  # --------------------------------------------------------
  # MAIN CloudFormation Stack
  # --------------------------------------------------------

  STACK_NAME: Lab01-CloudFormation


  # --------------------------------------------------------
  # TEMPLATE BUCKET CloudFormation Stack
  # --------------------------------------------------------
  #
  # This is a separate CloudFormation stack.
  #
  # It is NOT a nested stack of STACK_NAME.
  #
  # --------------------------------------------------------

  TEMPLATE_BUCKET_STACK: Lab01-CloudFormation-TemplateBucket


# ==========================================================
# JOBS
# ==========================================================

jobs:

  delete:

    # --------------------------------------------------------
    # GitHub-hosted runner
    # --------------------------------------------------------

    runs-on: ubuntu-latest

    name: Delete CloudFormation Lab


    # ========================================================
    # STEPS
    # ========================================================

    steps:


      # ======================================================
      # Step 1 - Checkout Repository
      # ======================================================
      #
      # The repository is not strictly required for deleting
      # the stack, but checking it out keeps this workflow
      # consistent with the deployment workflow.
      #
      # ======================================================

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ======================================================
      # Step 2 - Configure AWS Credentials
      # ======================================================
      #
      # Required GitHub Secrets:
      #
      # AWS_ACCESS_KEY_ID
      # AWS_SECRET_ACCESS_KEY
      #
      # ======================================================

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: ${{ env.AWS_REGION }}


      # ======================================================
      # Step 3 - Verify AWS CLI and AWS Account
      # ======================================================
      #
      # Confirms that GitHub Actions is authenticated with
      # the expected AWS account.
      #
      # ======================================================

      - name: Verify AWS CLI and AWS Identity

        shell: bash

        run: |

          echo "======================================"
          echo "AWS CLI INFORMATION"
          echo "======================================"

          aws --version

          echo ""

          echo "======================================"
          echo "AWS ACCOUNT INFORMATION"
          echo "======================================"

          aws sts get-caller-identity \
            --region "$AWS_REGION" \
            --no-cli-pager


      # ======================================================
      # Step 4 - Display Delete Configuration
      # ======================================================
      #
      # This is a final visual confirmation in the GitHub
      # Actions log showing exactly which stacks are targeted.
      #
      # ======================================================

      - name: Display Delete Configuration

        shell: bash

        run: |

          echo "======================================"
          echo "CLOUDFORMATION DELETE CONFIGURATION"
          echo "======================================"

          echo ""

          echo "AWS Region:"
          echo "$AWS_REGION"

          echo ""

          echo "Main Stack:"
          echo "$STACK_NAME"

          echo ""

          echo "Template Bucket Stack:"
          echo "$TEMPLATE_BUCKET_STACK"

          echo ""

          echo "======================================"
          echo "DELETE ORDER"
          echo "======================================"

          echo "1. Delete Main Stack"
          echo "2. Wait for Main Stack deletion"
          echo "3. Empty Template S3 Bucket"
          echo "4. Delete Template Bucket Stack"
          echo "5. Wait for Template Bucket Stack deletion"
          echo "6. Verify both stacks are deleted"

          echo ""

          echo "RDS password is NOT accessed."

          echo ""

          echo "======================================"


      # ======================================================
      # Step 5 - Check Main Stack
      # ======================================================
      #
      # Determines whether:
      #
      #   Lab01-CloudFormation
      #
      # currently exists.
      #
      # ======================================================

      - name: Check Main Stack

        id: main_stack

        shell: bash

        run: |

          echo "======================================"
          echo "CHECKING MAIN STACK"
          echo "======================================"

          echo "Stack:"
          echo "$STACK_NAME"

          echo ""


          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo "Main CloudFormation stack exists."

            echo "exists=true" >> "$GITHUB_OUTPUT"

          else

            echo "Main CloudFormation stack does not exist."

            echo "exists=false" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # Step 6 - Display Main Stack Status
      # ======================================================

      - name: Display Main Stack Status

        if: steps.main_stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "======================================"
          echo "MAIN STACK STATUS"
          echo "======================================"

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text \
            --no-cli-pager)


          echo "Stack:"
          echo "$STACK_NAME"

          echo ""

          echo "Current Status:"
          echo "$STACK_STATUS"


      # ======================================================
      # Step 7 - Check Main Stack Deletion State
      # ======================================================
      #
      # Prevents trying to delete a stack that is already
      # being deleted.
      #
      # ======================================================

      - name: Check Main Stack Before Delete

        if: steps.main_stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "======================================"
          echo "CHECKING MAIN STACK BEFORE DELETE"
          echo "======================================"


          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text \
            --no-cli-pager)


          echo "Current Status:"
          echo "$STACK_STATUS"

          echo ""


          case "$STACK_STATUS" in

            DELETE_IN_PROGRESS)

              echo "Main stack deletion is already in progress."

              ;;


            CREATE_IN_PROGRESS|UPDATE_IN_PROGRESS|UPDATE_COMPLETE_CLEANUP_IN_PROGRESS|ROLLBACK_IN_PROGRESS|IMPORT_IN_PROGRESS|IMPORT_ROLLBACK_IN_PROGRESS)

              echo ""
              echo "ERROR: Main stack is currently busy."
              echo "Current status: $STACK_STATUS"
              echo ""
              echo "Wait for the current CloudFormation operation"
              echo "to finish before running the delete workflow."

              exit 1

              ;;


            ROLLBACK_COMPLETE)

              echo ""
              echo "Main stack is in ROLLBACK_COMPLETE."
              echo "It can be deleted."

              ;;


            *)

              echo ""
              echo "Main stack is ready for deletion."

              ;;

          esac


      # ======================================================
      # Step 8 - Delete Main CloudFormation Stack
      # ======================================================
      #
      # Deletes:
      #
      #   Lab01-CloudFormation
      #
      # This also deletes resources belonging to its nested
      # stacks.
      #
      # Expected nested resources include:
      #
      #   EC2 nested stack
      #   S3 nested stack
      #   RDS nested stack
      #
      # IMPORTANT:
      #
      # The separate template bucket stack is NOT deleted here.
      #
      # ======================================================

      - name: Delete Main CloudFormation Stack

        if: steps.main_stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "======================================"
          echo "DELETING MAIN CLOUDFORMATION STACK"
          echo "======================================"

          echo ""

          echo "Stack:"
          echo "$STACK_NAME"

          echo ""

          echo "This will delete the main infrastructure."

          echo ""

          echo "Nested resources may include:"
          echo " - VPC"
          echo " - Internet Gateway"
          echo " - Subnets"
          echo " - Route Tables"
          echo " - Security Groups"
          echo " - EC2 nested stack"
          echo " - S3 nested stack"
          echo " - RDS nested stack"
          echo " - RDS database"
          echo " - RDS security group"

          echo ""

          echo "Starting main stack deletion..."


          aws cloudformation delete-stack \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-cli-pager


          echo ""

          echo "Main stack deletion request submitted."


      # ======================================================
      # Step 9 - Wait for Main Stack Deletion
      # ======================================================
      #
      # IMPORTANT:
      #
      # We MUST wait for the main stack to completely disappear
      # before moving to the template bucket stack.
      #
      # This ensures that all nested stacks/resources have had
      # time to finish deletion.
      #
      # ======================================================

      - name: Wait for Main Stack Deletion

        if: steps.main_stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "======================================"
          echo "WAITING FOR MAIN STACK DELETION"
          echo "======================================"

          echo ""

          echo "Waiting for:"
          echo "$STACK_NAME"

          echo ""

          aws cloudformation wait stack-delete-complete \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-cli-pager


          echo ""

          echo "======================================"
          echo "MAIN STACK DELETED SUCCESSFULLY"
          echo "======================================"

          echo ""

          echo "The main CloudFormation stack and its"
          echo "nested resources have completed deletion."


      # ======================================================
      # Step 10 - Verify Main Stack Is Gone
      # ======================================================
      #
      # CloudFormation removes a deleted stack from the normal
      # describe-stacks response.
      #
      # ======================================================

      - name: Verify Main Stack Deleted

        shell: bash

        run: |

          echo "======================================"
          echo "VERIFYING MAIN STACK DELETION"
          echo "======================================"


          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo ""
            echo "ERROR: Main stack still exists."

            exit 1

          else

            echo ""
            echo "Main stack no longer exists."

          fi


      # ======================================================
      # Step 11 - Check Template Bucket Stack
      # ======================================================
      #
      # Now we handle:
      #
      #   Lab01-CloudFormation-TemplateBucket
      #
      # This stack is separate from the main stack.
      #
      # ======================================================

      - name: Check Template Bucket Stack

        id: template_bucket_stack

        shell: bash

        run: |

          echo "======================================"
          echo "CHECKING TEMPLATE BUCKET STACK"
          echo "======================================"

          echo "Stack:"
          echo "$TEMPLATE_BUCKET_STACK"

          echo ""


          if aws cloudformation describe-stacks \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo "Template bucket stack exists."

            echo "exists=true" >> "$GITHUB_OUTPUT"

          else

            echo "Template bucket stack does not exist."

            echo "exists=false" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # Step 12 - Get Template Bucket Name
      # ======================================================
      #
      # Retrieves the physical S3 bucket created by:
      #
      #   Lab01-CloudFormation-TemplateBucket
      #
      # We need this bucket name because the bucket must be
      # emptied before CloudFormation can delete it.
      #
      # ======================================================

      - name: Get Template Bucket Name

        if: steps.template_bucket_stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "======================================"
          echo "GETTING TEMPLATE S3 BUCKET"
          echo "======================================"


          TEMPLATE_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text \
            --no-cli-pager)


          echo "Template Bucket:"
          echo "$TEMPLATE_BUCKET"

          echo ""


          if [ -z "$TEMPLATE_BUCKET" ] || [ "$TEMPLATE_BUCKET" = "None" ]; then

            echo "ERROR: Could not retrieve the template bucket name."

            echo ""
            echo "The stack exists but does not have the expected"
            echo "BucketName CloudFormation output."

            exit 1

          fi


          # --------------------------------------------------
          # Save bucket name for later steps.
          # --------------------------------------------------

          echo "TEMPLATE_BUCKET=$TEMPLATE_BUCKET" >> "$GITHUB_ENV"


          echo "Template bucket name saved successfully."


      # ======================================================
      # Step 13 - Check Template Bucket Stack Status
      # ======================================================
      #
      # Prevents trying to delete a stack while another
      # CloudFormation operation is still running.
      #
      # ======================================================

      - name: Check Template Bucket Stack Status

        if: steps.template_bucket_stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "======================================"
          echo "TEMPLATE BUCKET STACK STATUS"
          echo "======================================"


          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text \
            --no-cli-pager)


          echo "Current Status:"
          echo "$STACK_STATUS"

          echo ""


          case "$STACK_STATUS" in

            DELETE_IN_PROGRESS)

              echo "Template bucket stack deletion is already"
              echo "in progress."

              ;;


            CREATE_IN_PROGRESS|UPDATE_IN_PROGRESS|UPDATE_COMPLETE_CLEANUP_IN_PROGRESS|ROLLBACK_IN_PROGRESS|IMPORT_IN_PROGRESS|IMPORT_ROLLBACK_IN_PROGRESS)

              echo ""
              echo "ERROR: Template bucket stack is currently busy."
              echo "Current status: $STACK_STATUS"

              echo ""
              echo "Wait for the current CloudFormation operation"
              echo "to finish before running this workflow again."

              exit 1

              ;;


            ROLLBACK_COMPLETE)

              echo ""
              echo "Template bucket stack is in ROLLBACK_COMPLETE."
              echo "It can be deleted."

              ;;


            *)

              echo ""
              echo "Template bucket stack is ready for deletion."

              ;;

          esac


      # ======================================================
      # Step 14 - Empty Template S3 Bucket
      # ======================================================
      #
      # CloudFormation cannot delete an S3 bucket that contains
      # objects.
      #
      # The deployment workflow uploads nested templates into:
      #
      #   s3://TEMPLATE_BUCKET/templates/
      #
      # Therefore we completely empty the bucket before asking
      # CloudFormation to delete the template bucket stack.
      #
      # ------------------------------------------------------
      #
      # The command below uses:
      #
      #   aws s3 rm --recursive
      #
      # This removes normal/current objects.
      #
      # If bucket versioning is enabled, object versions and
      # delete markers may still remain.
      #
      # Therefore the next step additionally removes all
      # versions and delete markers.
      #
      # ======================================================

      - name: Empty Template S3 Bucket

        if: steps.template_bucket_stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "======================================"
          echo "EMPTYING TEMPLATE S3 BUCKET"
          echo "======================================"

          echo "Bucket:"
          echo "$TEMPLATE_BUCKET"

          echo ""


          # --------------------------------------------------
          # Check whether the bucket exists.
          # --------------------------------------------------

          if aws s3api head-bucket \
            --bucket "$TEMPLATE_BUCKET" \
            --region "$AWS_REGION" \
            2>/dev/null
          then

            echo "Template bucket exists."

          else

            echo "Template bucket does not exist."

            echo "Nothing to empty."

            exit 0

          fi


          # --------------------------------------------------
          # Delete all current objects.
          # --------------------------------------------------

          echo ""
          echo "Deleting current S3 objects..."


          aws s3 rm \
            "s3://$TEMPLATE_BUCKET" \
            --recursive \
            --region "$AWS_REGION"


          echo ""
          echo "Current S3 objects deleted."


      # ======================================================
      # Step 15 - Remove S3 Object Versions and Delete Markers
      # ======================================================
      #
      # This step is important if the template bucket has
      # versioning enabled.
      #
      # A versioned bucket can still contain:
      #
      #   - Object versions
      #   - Delete markers
      #
      # Even after:
      #
      #   aws s3 rm --recursive
      #
      # CloudFormation may then fail with:
      #
      #   Bucket is not empty
      #
      # So we explicitly remove all versions and delete
      # markers.
      #
      # ======================================================

      - name: Remove S3 Object Versions

        if: steps.template_bucket_stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "======================================"
          echo "REMOVING S3 OBJECT VERSIONS"
          echo "======================================"

          echo "Bucket:"
          echo "$TEMPLATE_BUCKET"

          echo ""


          # --------------------------------------------------
          # Confirm bucket still exists.
          # --------------------------------------------------

          if ! aws s3api head-bucket \
            --bucket "$TEMPLATE_BUCKET" \
            --region "$AWS_REGION" \
            2>/dev/null
          then

            echo "Bucket no longer exists."

            echo "No object versions need to be removed."

            exit 0

          fi


          # --------------------------------------------------
          # Delete every object version and delete marker.
          #
          # Pagination is handled by AWS CLI.
          # --------------------------------------------------

          echo "Searching for object versions and delete markers..."


          while true
          do

            VERSION_OUTPUT=$(aws s3api list-object-versions \
              --bucket "$TEMPLATE_BUCKET" \
              --region "$AWS_REGION" \
              --output json)


            DELETE_OBJECTS=$(echo "$VERSION_OUTPUT" | jq -c '
              [
                (.Versions[]? | {
                  Key: .Key,
                  VersionId: .VersionId
                }),
                (.DeleteMarkers[]? | {
                  Key: .Key,
                  VersionId: .VersionId
                })
              ]
            ')


            OBJECT_COUNT=$(echo "$DELETE_OBJECTS" | jq 'length')


            if [ "$OBJECT_COUNT" -eq 0 ]; then

              echo ""
              echo "No object versions or delete markers remain."

              break

            fi


            echo ""
            echo "Deleting $OBJECT_COUNT object versions/delete markers..."


            echo "$DELETE_OBJECTS" | jq -c \
              '{Objects: ., Quiet: true}' \
              > /tmp/s3-delete-objects.json


            aws s3api delete-objects \
              --bucket "$TEMPLATE_BUCKET" \
              --delete "file:///tmp/s3-delete-objects.json" \
              --region "$AWS_REGION"


          done


          echo ""
          echo "S3 object version cleanup completed."


      # ======================================================
      # Step 16 - Verify Template Bucket Is Empty
      # ======================================================
      #
      # Performs one final check before deleting the
      # CloudFormation stack.
      #
      # ======================================================

      - name: Verify Template Bucket Is Empty

        if: steps.template_bucket_stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "======================================"
          echo "VERIFYING TEMPLATE BUCKET IS EMPTY"
          echo "======================================"


          if ! aws s3api head-bucket \
            --bucket "$TEMPLATE_BUCKET" \
            --region "$AWS_REGION" \
            2>/dev/null
          then

            echo "Template bucket does not exist."

            echo "Nothing more to verify."

            exit 0

          fi


          VERSION_COUNT=$(aws s3api list-object-versions \
            --bucket "$TEMPLATE_BUCKET" \
            --region "$AWS_REGION" \
            --query "[length(Versions || \`[]\`), length(DeleteMarkers || \`[]\`)]" \
            --output text \
            --no-cli-pager)


          echo "Remaining object versions/delete markers:"
          echo "$VERSION_COUNT"

          echo ""


          REMAINING_VERSIONS=$(echo "$VERSION_COUNT" | awk '{print $1}')
          REMAINING_MARKERS=$(echo "$VERSION_COUNT" | awk '{print $2}')


          if [ "$REMAINING_VERSIONS" != "0" ] || \
             [ "$REMAINING_MARKERS" != "0" ]; then

            echo "ERROR: Template bucket is not completely empty."

            echo ""
            echo "Remaining versions:"
            echo "$REMAINING_VERSIONS"

            echo ""

            echo "Remaining delete markers:"
            echo "$REMAINING_MARKERS"

            exit 1

          fi


          echo "Template bucket is completely empty."


      # ======================================================
      # Step 17 - Delete Template Bucket CloudFormation Stack
      # ======================================================
      #
      # Now that the S3 bucket is empty, we can delete:
      #
      #   Lab01-CloudFormation-TemplateBucket
      #
      # This is the step that was missing from the previous
      # delete workflow.
      #
      # ======================================================

      - name: Delete Template Bucket CloudFormation Stack

        if: steps.template_bucket_stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "======================================"
          echo "DELETING TEMPLATE BUCKET STACK"
          echo "======================================"

          echo ""

          echo "Stack:"
          echo "$TEMPLATE_BUCKET_STACK"

          echo ""

          echo "Template bucket:"
          echo "$TEMPLATE_BUCKET"

          echo ""

          echo "The S3 bucket has been emptied."

          echo ""

          echo "Starting CloudFormation deletion..."


          aws cloudformation delete-stack \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --no-cli-pager


          echo ""

          echo "Template bucket stack deletion request submitted."


      # ======================================================
      # Step 18 - Wait for Template Bucket Stack Deletion
      # ======================================================
      #
      # Waits until:
      #
      #   Lab01-CloudFormation-TemplateBucket
      #
      # is completely deleted.
      #
      # ======================================================

      - name: Wait for Template Bucket Stack Deletion

        if: steps.template_bucket_stack.outputs.exists == 'true'

        shell: bash

        run: |

          echo "======================================"
          echo "WAITING FOR TEMPLATE BUCKET STACK"
          echo "DELETION"
          echo "======================================"


          aws cloudformation wait stack-delete-complete \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --no-cli-pager


          echo ""

          echo "======================================"
          echo "TEMPLATE BUCKET STACK DELETED"
          echo "======================================"

          echo ""

          echo "$TEMPLATE_BUCKET_STACK has been deleted."


      # ======================================================
      # Step 19 - Verify Template Bucket Stack Is Deleted
      # ======================================================

      - name: Verify Template Bucket Stack Deleted

        shell: bash

        run: |

          echo "======================================"
          echo "VERIFYING TEMPLATE BUCKET STACK"
          echo "======================================"


          if aws cloudformation describe-stacks \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo ""
            echo "ERROR: Template bucket stack still exists."

            exit 1

          else

            echo ""
            echo "Template bucket stack no longer exists."

          fi


      # ======================================================
      # Step 20 - Verify Template S3 Bucket Is Deleted
      # ======================================================
      #
      # This confirms that the physical S3 bucket created by
      # the template bucket stack is also gone.
      #
      # ======================================================

      - name: Verify Template S3 Bucket Deleted

        if: env.TEMPLATE_BUCKET != ''

        shell: bash

        run: |

          echo "======================================"
          echo "VERIFYING TEMPLATE S3 BUCKET DELETION"
          echo "======================================"


          if aws s3api head-bucket \
            --bucket "$TEMPLATE_BUCKET" \
            --region "$AWS_REGION" \
            2>/dev/null
          then

            echo ""
            echo "ERROR: Template S3 bucket still exists."

            echo ""
            echo "Bucket:"
            echo "$TEMPLATE_BUCKET"

            exit 1

          else

            echo ""
            echo "Template S3 bucket no longer exists."

          fi


      # ======================================================
      # Step 21 - Final Verification
      # ======================================================
      #
      # Final safety check:
      #
      # Main stack:
      #
      #   Lab01-CloudFormation
      #
      # must NOT exist.
      #
      # Template bucket stack:
      #
      #   Lab01-CloudFormation-TemplateBucket
      #
      # must NOT exist.
      #
      # ======================================================

      - name: Final CloudFormation Verification

        shell: bash

        run: |

          echo "======================================"
          echo "FINAL CLOUDFORMATION VERIFICATION"
          echo "======================================"

          echo ""

          MAIN_EXISTS=false
          TEMPLATE_BUCKET_EXISTS=false


          # --------------------------------------------------
          # Check main stack
          # --------------------------------------------------

          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            MAIN_EXISTS=true

          fi


          # --------------------------------------------------
          # Check template bucket stack
          # --------------------------------------------------

          if aws cloudformation describe-stacks \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            TEMPLATE_BUCKET_EXISTS=true

          fi


          echo "Main Stack:"
          echo "$STACK_NAME"

          echo "Exists:"
          echo "$MAIN_EXISTS"

          echo ""

          echo "Template Bucket Stack:"
          echo "$TEMPLATE_BUCKET_STACK"

          echo "Exists:"
          echo "$TEMPLATE_BUCKET_EXISTS"

          echo ""


          # --------------------------------------------------
          # Final decision
          # --------------------------------------------------

          if [ "$MAIN_EXISTS" = "false" ] && \
             [ "$TEMPLATE_BUCKET_EXISTS" = "false" ]; then

            echo "======================================"
            echo "ALL CLOUDFORMATION STACKS DELETED"
            echo "======================================"

          else

            echo "======================================"
            echo "ERROR: SOME STACKS STILL EXIST"
            echo "======================================"

            exit 1

          fi


      # ======================================================
      # Step 22 - Delete Complete
      # ======================================================

      - name: Delete Complete

        shell: bash

        run: |

          echo ""

          echo "=================================================="
          echo "AWS CLOUDFORMATION LAB DELETE COMPLETED"
          echo "=================================================="

          echo ""

          echo "Main Stack:"
          echo "$STACK_NAME"

          echo "Status:"
          echo "DELETED"

          echo ""

          echo "Template Bucket Stack:"
          echo "$TEMPLATE_BUCKET_STACK"

          echo "Status:"
          echo "DELETED"

          echo ""

          echo "Template S3 Bucket:"
          echo "${TEMPLATE_BUCKET:-Not Found}"

          echo ""

          echo "Nested infrastructure:"
          echo "DELETED"

          echo ""

          echo "RDS infrastructure:"
          echo "DELETED"

          echo ""

          echo "RDS password:"
          echo "Never accessed or displayed"

          echo ""

          echo "=================================================="
          echo "DELETE OPERATION SUCCESSFUL"
          echo "=================================================="

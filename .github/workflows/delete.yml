# ==========================================================
# AWS CLOUDFORMATION DEVOPS LAB
# COMPLETE DELETE / CLEANUP WORKFLOW
# ==========================================================
#
# File:
#   .github/workflows/delete.yml
#
# Purpose:
# ----------------------------------------------------------
# Completely clean the AWS CloudFormation DevOps Lab.
#
# IMPORTANT:
# ----------------------------------------------------------
# This workflow is designed to avoid the common dependency
# cycle where ECS / ALB / ENIs / VPC resources prevent the
# root CloudFormation stack from deleting.
#
#
# HIGH-LEVEL ORDER
# ----------------------------------------------------------
#
#   1. Discover root stack
#   2. Discover nested stacks/resources
#   3. Disable RDS deletion protection
#   4. Stop ECS service
#   5. Wait for ECS tasks
#   6. Delete ECS service if necessary
#   7. Clean Docker containers/images on EC2 through SSM
#   8. Empty S3 template bucket
#   9. Delete separate Template Bucket stack
#  10. Delete root CloudFormation stack
#  11. Wait for root deletion
#  12. If DELETE_FAILED:
#        - inspect failed resources
#        - retry service cleanup
#        - retry ALB cleanup
#        - retry target group cleanup
#        - retry root deletion
#  13. If still DELETE_FAILED:
#        - FORCE_DELETE_STACK
#  14. Verify remaining AWS resources
#
#
# IMPORTANT CLOUDFORMATION RULE
# ----------------------------------------------------------
#
# ECSStack / RDSNestedStack / S3NestedStack are assumed to
# be NESTED stacks when they appear as:
#
#   AWS::CloudFormation::Stack
#
# Nested stacks should NOT normally be deleted directly.
#
# The ROOT stack should delete them.
#
# AWS documentation recommends operating on nested stacks
# through their root stack.
#
#
# ECR NOTE
# ----------------------------------------------------------
#
# If ECR is owned by the nested CloudFormation stack, this
# workflow does NOT blindly delete the ECR repository before
# root deletion.
#
# Instead:
#
#   - remove ECR images
#   - allow CloudFormation to delete the repository
#
# This prevents the parent/nested CloudFormation hierarchy
# from becoming inconsistent.
#
#
# DOCKER NOTE
# ----------------------------------------------------------
#
# If Docker containers/images exist on an EC2 instance,
# they are cleaned through AWS Systems Manager (SSM).
#
# The GitHub runner itself is NOT your EC2 Docker host.
#
#
# ==========================================================

name: Complete AWS Lab Cleanup


# ==========================================================
# MANUAL TRIGGER ONLY
# ==========================================================

on:
  workflow_dispatch:


# ==========================================================
# GLOBAL ENVIRONMENT
# ==========================================================

env:

  # AWS Region
  AWS_REGION: us-east-1

  # Root CloudFormation stack
  STACK_NAME: Lab01-CloudFormation

  # Separate Template Bucket stack
  TEMPLATE_BUCKET_STACK: Lab01-CloudFormation-TemplateBucket

  # Maximum time to wait for CloudFormation deletion
  ROOT_DELETE_WAIT_SECONDS: 1200


# ==========================================================
# JOB
# ==========================================================

jobs:

  delete-lab:

    name: Complete AWS Lab Cleanup

    runs-on: ubuntu-latest


    steps:


      # ======================================================
      # STEP 1
      # Checkout repository
      # ======================================================

      - name: "Step 1 - Checkout Repository"
        uses: actions/checkout@v4


      # ======================================================
      # STEP 2
      # Configure AWS credentials
      # ======================================================

      - name: "Step 2 - Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4

        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: ${{ env.AWS_REGION }}


      # ======================================================
      # STEP 3
      # Verify AWS
      # ======================================================

      - name: "Step 3 - Verify AWS Account"
        shell: bash

        run: |

          set -euo pipefail

          echo "=================================================="
          echo "AWS VERIFICATION"
          echo "=================================================="

          aws --version

          echo ""

          aws sts get-caller-identity

          echo ""

          echo "Region              : $AWS_REGION"
          echo "Root Stack          : $STACK_NAME"
          echo "Template Bucket     : $TEMPLATE_BUCKET_STACK"

          echo ""


      # ======================================================
      # STEP 4
      # Discover root stack
      # ======================================================

      - name: "Step 4 - Discover Root Stack"
        id: root

        shell: bash

        run: |

          set -euo pipefail

          echo "=================================================="
          echo "DISCOVER ROOT STACK"
          echo "=================================================="

          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            >/dev/null 2>&1
          then

            STATUS=$(
              aws cloudformation describe-stacks \
                --stack-name "$STACK_NAME" \
                --region "$AWS_REGION" \
                --query "Stacks[0].StackStatus" \
                --output text \
                --no-cli-pager
            )

            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"

            echo ""
            echo "Root stack exists."
            echo "Status: $STATUS"

          else

            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "status=NOT_FOUND" >> "$GITHUB_OUTPUT"

            echo ""
            echo "Root stack does not exist."

          fi


      # ======================================================
      # STEP 5
      # Display root resources
      # ======================================================

      - name: "Step 5 - Display Root Resources"
        if: steps.root.outputs.exists == 'true'

        shell: bash

        run: |

          set -euo pipefail

          echo "=================================================="
          echo "ROOT STACK RESOURCES"
          echo "=================================================="

          aws cloudformation list-stack-resources \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackResourceSummaries[].[LogicalResourceId,ResourceType,ResourceStatus,PhysicalResourceId]" \
            --output table \
            --no-cli-pager \
            || true


      # ======================================================
      # STEP 6
      # Discover RDS nested stack
      # ======================================================

      - name: "Step 6 - Discover RDS Nested Stack"
        if: steps.root.outputs.exists == 'true'

        id: rds_nested

        shell: bash

        run: |

          set -euo pipefail

          RDS_NESTED_STACK_ID=$(
            aws cloudformation list-stack-resources \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "StackResourceSummaries[?LogicalResourceId=='RDSNestedStack'].PhysicalResourceId" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )

          echo "RDS nested stack: $RDS_NESTED_STACK_ID"

          if [[ -n "$RDS_NESTED_STACK_ID" &&
                "$RDS_NESTED_STACK_ID" != "None" ]]
          then

            echo "nested=$RDS_NESTED_STACK_ID" >> "$GITHUB_OUTPUT"

          else

            echo "nested=" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # STEP 7
      # Discover RDS instance
      # ======================================================

      - name: "Step 7 - Discover RDS Instance"
        if: steps.rds_nested.outputs.nested != ''

        id: rds

        shell: bash

        run: |

          set -euo pipefail

          RDS_INSTANCE=$(
            aws cloudformation describe-stack-resources \
              --stack-name "${{ steps.rds_nested.outputs.nested }}" \
              --region "$AWS_REGION" \
              --logical-resource-id RDSDatabase \
              --query "StackResources[0].PhysicalResourceId" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )

          echo "RDS instance: $RDS_INSTANCE"

          if [[ -n "$RDS_INSTANCE" &&
                "$RDS_INSTANCE" != "None" ]]
          then

            echo "instance=$RDS_INSTANCE" >> "$GITHUB_OUTPUT"

          else

            echo "instance=" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # STEP 8
      # Disable RDS deletion protection
      # ======================================================

      - name: "Step 8 - Disable RDS Deletion Protection"
        if: steps.rds.outputs.instance != ''

        shell: bash

        run: |

          set -euo pipefail

          RDS_INSTANCE="${{ steps.rds.outputs.instance }}"

          echo "=================================================="
          echo "RDS DELETION PROTECTION"
          echo "=================================================="

          PROTECTION=$(
            aws rds describe-db-instances \
              --db-instance-identifier "$RDS_INSTANCE" \
              --region "$AWS_REGION" \
              --query "DBInstances[0].DeletionProtection" \
              --output text \
              --no-cli-pager \
              2>/dev/null || echo "NOT_FOUND"
          )

          echo "Instance: $RDS_INSTANCE"
          echo "Protection: $PROTECTION"

          if [[ "$PROTECTION" == "True" ]]
          then

            echo "Disabling RDS deletion protection..."

            aws rds modify-db-instance \
              --db-instance-identifier "$RDS_INSTANCE" \
              --no-deletion-protection \
              --apply-immediately \
              --region "$AWS_REGION" \
              --no-cli-pager

          else

            echo "RDS deletion protection already disabled."

          fi


      # ======================================================
      # STEP 9
      # Discover ECS nested stack
      # ======================================================

      - name: "Step 9 - Discover ECS Nested Stack"
        if: steps.root.outputs.exists == 'true'

        id: ecs_nested

        shell: bash

        run: |

          set -euo pipefail

          ECS_NESTED_STACK_ID=$(
            aws cloudformation list-stack-resources \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "StackResourceSummaries[?LogicalResourceId=='ECSStack'].PhysicalResourceId" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )

          echo "ECS nested stack: $ECS_NESTED_STACK_ID"

          if [[ -n "$ECS_NESTED_STACK_ID" &&
                "$ECS_NESTED_STACK_ID" != "None" ]]
          then

            echo "nested=$ECS_NESTED_STACK_ID" >> "$GITHUB_OUTPUT"

          else

            echo "nested=" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # STEP 10
      # Discover ECS cluster
      # ======================================================

      - name: "Step 10 - Discover ECS Cluster"
        if: steps.ecs_nested.outputs.nested != ''

        id: ecs_cluster

        shell: bash

        run: |

          set -euo pipefail

          ECS_CLUSTER=$(
            aws cloudformation list-stack-resources \
              --stack-name "${{ steps.ecs_nested.outputs.nested }}" \
              --region "$AWS_REGION" \
              --query "StackResourceSummaries[?ResourceType=='AWS::ECS::Cluster'].PhysicalResourceId" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )

          echo "ECS cluster: $ECS_CLUSTER"

          if [[ -n "$ECS_CLUSTER" &&
                "$ECS_CLUSTER" != "None" ]]
          then

            echo "cluster=$ECS_CLUSTER" >> "$GITHUB_OUTPUT"

          else

            echo "cluster=" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # STEP 11
      # Discover ECS service
      # ======================================================

      - name: "Step 11 - Discover ECS Service"
        if: steps.ecs_nested.outputs.nested != ''

        id: ecs_service

        shell: bash

        run: |

          set -euo pipefail

          ECS_SERVICE=$(
            aws cloudformation list-stack-resources \
              --stack-name "${{ steps.ecs_nested.outputs.nested }}" \
              --region "$AWS_REGION" \
              --query "StackResourceSummaries[?ResourceType=='AWS::ECS::Service'].PhysicalResourceId" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )

          echo "ECS service: $ECS_SERVICE"

          if [[ -n "$ECS_SERVICE" &&
                "$ECS_SERVICE" != "None" ]]
          then

            echo "service=$ECS_SERVICE" >> "$GITHUB_OUTPUT"

          else

            echo "service=" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # STEP 12
      # Discover ECR repository
      # ======================================================

      - name: "Step 12 - Discover ECR Repository"
        if: steps.ecs_nested.outputs.nested != ''

        id: ecr

        shell: bash

        run: |

          set -euo pipefail

          ECR_REPOSITORY=$(
            aws cloudformation list-stack-resources \
              --stack-name "${{ steps.ecs_nested.outputs.nested }}" \
              --region "$AWS_REGION" \
              --query "StackResourceSummaries[?ResourceType=='AWS::ECR::Repository'].PhysicalResourceId" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )

          echo "ECR repository: $ECR_REPOSITORY"

          if [[ -n "$ECR_REPOSITORY" &&
                "$ECR_REPOSITORY" != "None" ]]
          then

            echo "repository=$ECR_REPOSITORY" >> "$GITHUB_OUTPUT"

          else

            echo "repository=" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # STEP 13
      # Discover ALB
      # ======================================================

      - name: "Step 13 - Discover ALB"
        if: steps.ecs_nested.outputs.nested != ''

        id: alb

        shell: bash

        run: |

          set -euo pipefail

          ALB_ARN=$(
            aws cloudformation list-stack-resources \
              --stack-name "${{ steps.ecs_nested.outputs.nested }}" \
              --region "$AWS_REGION" \
              --query "StackResourceSummaries[?ResourceType=='AWS::ElasticLoadBalancingV2::LoadBalancer'].PhysicalResourceId" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )

          echo "ALB: $ALB_ARN"

          if [[ -n "$ALB_ARN" &&
                "$ALB_ARN" != "None" ]]
          then

            echo "arn=$ALB_ARN" >> "$GITHUB_OUTPUT"

          else

            echo "arn=" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # STEP 14
      # Discover target group
      # ======================================================

      - name: "Step 14 - Discover Target Group"
        if: steps.ecs_nested.outputs.nested != ''

        id: target_group

        shell: bash

        run: |

          set -euo pipefail

          TARGET_GROUP_ARN=$(
            aws cloudformation list-stack-resources \
              --stack-name "${{ steps.ecs_nested.outputs.nested }}" \
              --region "$AWS_REGION" \
              --query "StackResourceSummaries[?ResourceType=='AWS::ElasticLoadBalancingV2::TargetGroup'].PhysicalResourceId" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )

          echo "Target group: $TARGET_GROUP_ARN"

          if [[ -n "$TARGET_GROUP_ARN" &&
                "$TARGET_GROUP_ARN" != "None" ]]
          then

            echo "arn=$TARGET_GROUP_ARN" >> "$GITHUB_OUTPUT"

          else

            echo "arn=" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # STEP 15
      # Discover EC2 instances
      #
      # Used for Docker cleanup through SSM.
      # ======================================================

      - name: "Step 15 - Discover EC2 Instances"
        if: steps.root.outputs.exists == 'true'

        id: ec2

        shell: bash

        run: |

          set -euo pipefail

          echo "=================================================="
          echo "DISCOVER EC2 INSTANCES"
          echo "=================================================="

          INSTANCE_IDS=$(
            aws cloudformation list-stack-resources \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "StackResourceSummaries[?ResourceType=='AWS::EC2::Instance'].PhysicalResourceId" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )

          echo "Instances:"
          echo "$INSTANCE_IDS"

          {
            echo "instances<<EOF"
            echo "$INSTANCE_IDS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"


      # ======================================================
      # STEP 16
      # Stop ECS service
      # ======================================================

      - name: "Step 16 - Stop ECS Service"
        if: |
          steps.ecs_cluster.outputs.cluster != '' &&
          steps.ecs_service.outputs.service != ''

        shell: bash

        run: |

          set -euo pipefail

          ECS_CLUSTER="${{ steps.ecs_cluster.outputs.cluster }}"
          ECS_SERVICE="${{ steps.ecs_service.outputs.service }}"

          echo "=================================================="
          echo "STOP ECS SERVICE"
          echo "=================================================="

          if aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            >/dev/null 2>&1
          then

            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_SERVICE" \
              --desired-count 0 \
              --region "$AWS_REGION" \
              --no-cli-pager \
              || true

            echo "ECS service scaled to zero."

          else

            echo "ECS service already absent."

          fi


      # ======================================================
      # STEP 17
      # Wait for ECS tasks
      #
      # IMPORTANT:
      # This step does NOT fail the entire workflow merely
      # because ECS takes a long time.
      # ======================================================

      - name: "Step 17 - Wait For ECS Tasks"
        if: |
          steps.ecs_cluster.outputs.cluster != '' &&
          steps.ecs_service.outputs.service != ''

        shell: bash

        run: |

          set -u

          ECS_CLUSTER="${{ steps.ecs_cluster.outputs.cluster }}"
          ECS_SERVICE="${{ steps.ecs_service.outputs.service }}"

          echo "=================================================="
          echo "WAIT FOR ECS TASKS"
          echo "=================================================="

          for ATTEMPT in $(seq 1 36)
          do

            RUNNING=$(
              aws ecs describe-services \
                --cluster "$ECS_CLUSTER" \
                --services "$ECS_SERVICE" \
                --region "$AWS_REGION" \
                --query "services[0].runningCount" \
                --output text \
                --no-cli-pager \
                2>/dev/null || echo "0"
            )

            echo "Attempt $ATTEMPT / 36"
            echo "Running tasks: $RUNNING"

            if [[ "$RUNNING" == "0" ]]
            then

              echo "All ECS tasks stopped."
              exit 0

            fi

            sleep 10

          done

          echo ""
          echo "WARNING:"
          echo "ECS tasks did not reach zero within the wait period."
          echo "Continuing cleanup."


      # ======================================================
      # STEP 18
      # Delete ECS service
      # ======================================================

      - name: "Step 18 - Delete ECS Service"
        if: |
          steps.ecs_cluster.outputs.cluster != '' &&
          steps.ecs_service.outputs.service != ''

        shell: bash

        run: |

          set -euo pipefail

          ECS_CLUSTER="${{ steps.ecs_cluster.outputs.cluster }}"
          ECS_SERVICE="${{ steps.ecs_service.outputs.service }}"

          echo "=================================================="
          echo "DELETE ECS SERVICE"
          echo "=================================================="

          if aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            >/dev/null 2>&1
          then

            aws ecs delete-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_SERVICE" \
              --force \
              --region "$AWS_REGION" \
              --no-cli-pager \
              || true

            echo "ECS service deletion requested."

          else

            echo "ECS service already absent."

          fi


      # ======================================================
      # STEP 19
      # Clean Docker containers/images on EC2
      #
      # IMPORTANT:
      # This uses SSM.
      #
      # It does NOT affect the GitHub runner Docker daemon.
      # ======================================================

      - name: "Step 19 - Clean Docker Containers And Images On EC2"
        if: steps.ec2.outputs.instances != ''

        shell: bash

        run: |

          set -euo pipefail

          echo "=================================================="
          echo "DOCKER CLEANUP ON EC2"
          echo "=================================================="

          INSTANCE_IDS="${{ steps.ec2.outputs.instances }}"

          for INSTANCE_ID in $INSTANCE_IDS
          do

            [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]] && continue

            echo ""
            echo "EC2 Instance: $INSTANCE_ID"

            PING_STATUS=$(
              aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "InstanceInformationList[0].PingStatus" \
                --output text \
                --no-cli-pager \
                2>/dev/null || echo "NOT_FOUND"
            )

            echo "SSM status: $PING_STATUS"

            if [[ "$PING_STATUS" != "Online" ]]
            then

              echo "Instance is not SSM Online."
              echo "Skipping Docker cleanup for this instance."

              continue

            fi

            COMMAND_ID=$(
              aws ssm send-command \
                --instance-ids "$INSTANCE_ID" \
                --document-name "AWS-RunShellScript" \
                --comment "Charlie Cafe CloudFormation lab Docker cleanup" \
                --parameters 'commands=[
                  "echo === DOCKER CLEANUP START ===",
                  "if command -v docker >/dev/null 2>&1; then",
                  "  echo Docker detected.",
                  "  docker ps -aq || true",
                  "  docker stop $(docker ps -q) 2>/dev/null || true",
                  "  docker rm -f $(docker ps -aq) 2>/dev/null || true",
                  "  docker image prune -af || true",
                  "  docker container prune -f || true",
                  "  docker volume prune -f || true",
                  "  docker network prune -f || true",
                  "  echo === DOCKER CLEANUP COMPLETE ===",
                  "else",
                  "  echo Docker is not installed.",
                  "fi"
                ]' \
                --region "$AWS_REGION" \
                --query "Command.CommandId" \
                --output text \
                --no-cli-pager
            )

            echo "SSM command: $COMMAND_ID"

            for ATTEMPT in $(seq 1 30)
            do

              COMMAND_STATUS=$(
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query "Status" \
                  --output text \
                  --no-cli-pager \
                  2>/dev/null || echo "Pending"
              )

              echo "Attempt $ATTEMPT / 30"
              echo "SSM status: $COMMAND_STATUS"

              case "$COMMAND_STATUS" in

                Success)
                  echo "Docker cleanup succeeded."
                  break
                  ;;

                Failed|Cancelled|TimedOut|Cancelling)
                  echo "WARNING: Docker cleanup did not succeed."
                  break
                  ;;

                *)
                  sleep 5
                  ;;

              esac

            done

          done


      # ======================================================
      # STEP 20
      # Empty ECR images
      #
      # We DO NOT delete the repository here if CloudFormation
      # owns the repository.
      #
      # CloudFormation should delete the repository itself.
      # ======================================================

      - name: "Step 20 - Empty ECR Repository"
        if: steps.ecr.outputs.repository != ''

        shell: bash

        run: |

          set -euo pipefail

          ECR_REPOSITORY="${{ steps.ecr.outputs.repository }}"

          echo "=================================================="
          echo "EMPTY ECR REPOSITORY"
          echo "=================================================="

          if ! aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            >/dev/null 2>&1
          then

            echo "ECR repository already absent."
            exit 0

          fi

          while true
          do

            IMAGE_IDS=$(
              aws ecr list-images \
                --repository-name "$ECR_REPOSITORY" \
                --region "$AWS_REGION" \
                --query "imageIds[*]" \
                --output json \
                --no-cli-pager
            )

            COUNT=$(echo "$IMAGE_IDS" | jq 'length')

            echo "Images remaining: $COUNT"

            if [[ "$COUNT" -eq 0 ]]
            then

              echo "ECR repository is empty."
              break

            fi

            echo "$IMAGE_IDS" > /tmp/ecr-images.json

            aws ecr batch-delete-image \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids file:///tmp/ecr-images.json \
              --region "$AWS_REGION" \
              --no-cli-pager \
              || true

          done


      # ======================================================
      # STEP 21
      # Discover Template Bucket
      # ======================================================

      - name: "Step 21 - Discover Template Bucket"
        id: template_s3

        shell: bash

        run: |

          set -euo pipefail

          if ! aws cloudformation describe-stacks \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            >/dev/null 2>&1
          then

            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "bucket=" >> "$GITHUB_OUTPUT"

            echo "Template bucket stack does not exist."

            exit 0

          fi

          BUCKET=$(
            aws cloudformation list-stack-resources \
              --stack-name "$TEMPLATE_BUCKET_STACK" \
              --region "$AWS_REGION" \
              --query "StackResourceSummaries[?ResourceType=='AWS::S3::Bucket'].PhysicalResourceId" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )

          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"

          echo "Template bucket: $BUCKET"


      # ======================================================
      # STEP 22
      # Empty versioned S3 bucket
      # ======================================================

      - name: "Step 22 - Empty Versioned S3 Bucket"
        if: steps.template_s3.outputs.bucket != ''

        shell: bash

        run: |

          set -euo pipefail

          BUCKET="${{ steps.template_s3.outputs.bucket }}"

          echo "=================================================="
          echo "EMPTY VERSIONED S3 BUCKET"
          echo "=================================================="

          while true
          do

            DATA=$(
              aws s3api list-object-versions \
                --bucket "$BUCKET" \
                --region "$AWS_REGION" \
                --output json \
                --no-cli-pager
            )

            VERSION_COUNT=$(echo "$DATA" | jq '(.Versions // []) | length')
            MARKER_COUNT=$(echo "$DATA" | jq '(.DeleteMarkers // []) | length')

            TOTAL=$((VERSION_COUNT + MARKER_COUNT))

            echo "Versions       : $VERSION_COUNT"
            echo "Delete markers : $MARKER_COUNT"
            echo "Total          : $TOTAL"

            if [[ "$TOTAL" -eq 0 ]]
            then

              echo "S3 bucket is empty."
              break

            fi

            echo "$DATA" |
              jq '{
                Objects:
                  (
                    ((.Versions // []) + (.DeleteMarkers // []))
                    | map({
                        Key: .Key,
                        VersionId: .VersionId
                      })
                    | .[0:1000]
                  ),
                Quiet: true
              }' > /tmp/s3-delete.json

            aws s3api delete-objects \
              --bucket "$BUCKET" \
              --delete file:///tmp/s3-delete.json \
              --region "$AWS_REGION" \
              --no-cli-pager

          done


      # ======================================================
      # STEP 23
      # Delete separate Template Bucket stack
      #
      # This stack is independent from the root stack.
      # ======================================================

      - name: "Step 23 - Delete Template Bucket Stack"
        if: steps.template_s3.outputs.exists == 'true'

        shell: bash

        run: |

          set -euo pipefail

          echo "=================================================="
          echo "DELETE TEMPLATE BUCKET STACK"
          echo "=================================================="

          aws cloudformation delete-stack \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --no-cli-pager

          echo "Waiting for Template Bucket stack..."

          aws cloudformation wait stack-delete-complete \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION"

          echo "Template Bucket stack deleted."


      # ======================================================
      # STEP 24
      # Disable root termination protection
      #
      # A protected root stack cannot be deleted.
      # ======================================================

      - name: "Step 24 - Disable Root Termination Protection"
        if: steps.root.outputs.exists == 'true'

        shell: bash

        run: |

          set -euo pipefail

          echo "=================================================="
          echo "DISABLE TERMINATION PROTECTION"
          echo "=================================================="

          aws cloudformation update-termination-protection \
            --stack-name "$STACK_NAME" \
            --no-enable-termination-protection \
            --region "$AWS_REGION" \
            --no-cli-pager \
            2>/dev/null \
            || true

          echo "Termination protection disabled or already disabled."


      # ======================================================
      # STEP 25
      # Delete ROOT stack
      #
      # This is the correct point where CloudFormation removes
      # nested ECS/RDS/S3 stacks and their CloudFormation-owned
      # resources.
      # ======================================================

      - name: "Step 25 - Delete Root CloudFormation Stack"
        if: steps.root.outputs.exists == 'true'

        id: root_delete

        shell: bash

        run: |

          set -euo pipefail

          echo "=================================================="
          echo "DELETE ROOT STACK"
          echo "=================================================="

          STATUS="${{ steps.root.outputs.status }}"

          echo "Root stack status: $STATUS"

          if [[ "$STATUS" == "DELETE_FAILED" ]]
          then

            echo "Root stack already DELETE_FAILED."
            echo "Starting FORCE_DELETE_STACK."

            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" \
              --deletion-mode FORCE_DELETE_STACK \
              --region "$AWS_REGION" \
              --no-cli-pager

          elif [[ "$STATUS" == "DELETE_IN_PROGRESS" ]]
          then

            echo "Root stack deletion is already in progress."

          else

            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --no-cli-pager

            echo "Root stack deletion started."

          fi


      # ======================================================
      # STEP 26
      # Wait for root deletion
      #
      # Custom polling is used instead of AWS wait so that
      # we can diagnose DELETE_FAILED properly.
      # ======================================================

      - name: "Step 26 - Monitor Root Stack Deletion"
        if: steps.root.outputs.exists == 'true'

        id: root_wait

        shell: bash

        run: |

          set -u

          echo "=================================================="
          echo "MONITOR ROOT STACK"
          echo "=================================================="

          MAX_SECONDS="$ROOT_DELETE_WAIT_SECONDS"
          ELAPSED=0

          while [[ "$ELAPSED" -lt "$MAX_SECONDS" ]]
          do

            STATUS=$(
              aws cloudformation describe-stacks \
                --stack-name "$STACK_NAME" \
                --region "$AWS_REGION" \
                --query "Stacks[0].StackStatus" \
                --output text \
                --no-cli-pager \
                2>/dev/null || echo "NOT_FOUND"
            )

            echo ""
            echo "Elapsed : ${ELAPSED}s"
            echo "Status  : $STATUS"

            if [[ "$STATUS" == "NOT_FOUND" ]]
            then

              echo "deleted=true" >> "$GITHUB_OUTPUT"
              echo "status=NOT_FOUND" >> "$GITHUB_OUTPUT"

              echo "ROOT STACK DELETED."
              exit 0

            fi

            case "$STATUS" in

              DELETE_COMPLETE)

                echo "deleted=true" >> "$GITHUB_OUTPUT"
                echo "status=$STATUS" >> "$GITHUB_OUTPUT"

                echo "ROOT STACK DELETED."
                exit 0
                ;;

              DELETE_FAILED)

                echo "deleted=false" >> "$GITHUB_OUTPUT"
                echo "status=$STATUS" >> "$GITHUB_OUTPUT"

                echo "ROOT STACK DELETE_FAILED."
                exit 0
                ;;

            esac

            sleep 15
            ELAPSED=$((ELAPSED + 15))

          done

          echo "deleted=false" >> "$GITHUB_OUTPUT"
          echo "status=TIMEOUT" >> "$GITHUB_OUTPUT"

          echo ""
          echo "WARNING:"
          echo "Root deletion is still in progress after timeout."


      # ======================================================
      # STEP 27
      # Inspect DELETE_FAILED resources
      # ======================================================

      - name: "Step 27 - Inspect Root DELETE_FAILED Resources"
        if: |
          steps.root.outputs.exists == 'true' &&
          steps.root_wait.outputs.deleted == 'false'

        shell: bash

        run: |

          set +e

          echo "=================================================="
          echo "DELETE FAILED RESOURCES"
          echo "=================================================="

          aws cloudformation describe-stack-events \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='DELETE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]" \
            --output table \
            --no-cli-pager

          echo ""
          echo "CURRENT ROOT RESOURCES"

          aws cloudformation list-stack-resources \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "StackResourceSummaries[].[LogicalResourceId,ResourceType,ResourceStatus,PhysicalResourceId]" \
            --output table \
            --no-cli-pager


      # ======================================================
      # STEP 28
      # Retry ECS service cleanup
      # ======================================================

      - name: "Step 28 - Retry ECS Service Cleanup"
        if: |
          steps.root.outputs.exists == 'true' &&
          steps.root_wait.outputs.deleted == 'false' &&
          steps.ecs_cluster.outputs.cluster != '' &&
          steps.ecs_service.outputs.service != ''

        shell: bash

        run: |

          set -u

          ECS_CLUSTER="${{ steps.ecs_cluster.outputs.cluster }}"
          ECS_SERVICE="${{ steps.ecs_service.outputs.service }}"

          echo "=================================================="
          echo "RETRY ECS CLEANUP"
          echo "=================================================="

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --desired-count 0 \
            --region "$AWS_REGION" \
            --no-cli-pager \
            || true

          sleep 20

          aws ecs delete-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force \
            --region "$AWS_REGION" \
            --no-cli-pager \
            || true


      # ======================================================
      # STEP 29
      # Retry ALB cleanup
      # ======================================================

      - name: "Step 29 - Retry ALB Cleanup"
        if: |
          steps.root.outputs.exists == 'true' &&
          steps.root_wait.outputs.deleted == 'false' &&
          steps.alb.outputs.arn != ''

        shell: bash

        run: |

          set -u

          ALB_ARN="${{ steps.alb.outputs.arn }}"

          echo "=================================================="
          echo "RETRY ALB CLEANUP"
          echo "=================================================="

          aws elbv2 delete-load-balancer \
            --load-balancer-arn "$ALB_ARN" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            || true


      # ======================================================
      # STEP 30
      # Retry Target Group cleanup
      # ======================================================

      - name: "Step 30 - Retry Target Group Cleanup"
        if: |
          steps.root.outputs.exists == 'true' &&
          steps.root_wait.outputs.deleted == 'false' &&
          steps.target_group.outputs.arn != ''

        shell: bash

        run: |

          set -u

          TARGET_GROUP_ARN="${{ steps.target_group.outputs.arn }}"

          echo "=================================================="
          echo "RETRY TARGET GROUP"
          echo "=================================================="

          aws elbv2 delete-target-group \
            --target-group-arn "$TARGET_GROUP_ARN" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            || true


      # ======================================================
      # STEP 31
      # Retry root deletion
      # ======================================================

      - name: "Step 31 - Retry Root Stack Deletion"
        if: |
          steps.root.outputs.exists == 'true' &&
          steps.root_wait.outputs.deleted == 'false'

        shell: bash

        run: |

          set -u

          echo "=================================================="
          echo "RETRY ROOT STACK DELETION"
          echo "=================================================="

          STATUS=$(
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "Stacks[0].StackStatus" \
              --output text \
              --no-cli-pager \
              2>/dev/null || echo "NOT_FOUND"
          )

          if [[ "$STATUS" == "DELETE_FAILED" ]]
          then

            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" \
              --deletion-mode FORCE_DELETE_STACK \
              --region "$AWS_REGION" \
              --no-cli-pager \
              || true

          elif [[ "$STATUS" == "DELETE_IN_PROGRESS" ]]
          then

            echo "Deletion already in progress."

          else

            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --no-cli-pager \
              || true

          fi


      # ======================================================
      # STEP 32
      # Final root wait
      # ======================================================

      - name: "Step 32 - Final Root Deletion Wait"
        if: |
          steps.root.outputs.exists == 'true' &&
          steps.root_wait.outputs.deleted == 'false'

        shell: bash

        run: |

          set +e

          echo "=================================================="
          echo "FINAL ROOT DELETION WAIT"
          echo "=================================================="

          aws cloudformation wait stack-delete-complete \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-cli-pager

          RESULT=$?

          if [[ "$RESULT" -eq 0 ]]
          then

            echo "Root stack finally deleted."

          else

            echo "WARNING:"
            echo "Root stack still has deletion problems."

          fi


      # ======================================================
      # STEP 33
      # Final CloudFormation verification
      # ======================================================

      - name: "Step 33 - Verify Root Stack"
        id: final_root

        shell: bash

        run: |

          set -euo pipefail

          echo "=================================================="
          echo "FINAL ROOT STACK VERIFICATION"
          echo "=================================================="

          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            >/dev/null 2>&1
          then

            STATUS=$(
              aws cloudformation describe-stacks \
                --stack-name "$STACK_NAME" \
                --region "$AWS_REGION" \
                --query "Stacks[0].StackStatus" \
                --output text \
                --no-cli-pager
            )

            echo "Root stack still exists."
            echo "Status: $STATUS"

            echo "exists=true" >> "$GITHUB_OUTPUT"

          else

            echo "Root stack no longer exists."

            echo "exists=false" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # STEP 34
      # Final ECS verification
      # ======================================================

      - name: "Step 34 - Verify ECS"
        shell: bash

        run: |

          set +e

          echo "=================================================="
          echo "FINAL ECS VERIFICATION"
          echo "=================================================="

          aws ecs list-clusters \
            --region "$AWS_REGION" \
            --output table \
            --no-cli-pager

          echo ""
          echo "ECS services associated with discovered cluster:"

          if [[ -n "${{ steps.ecs_cluster.outputs.cluster }}" ]]
          then

            aws ecs list-services \
              --cluster "${{ steps.ecs_cluster.outputs.cluster }}" \
              --region "$AWS_REGION" \
              --output table \
              --no-cli-pager

          fi


      # ======================================================
      # STEP 35
      # Final ECR verification
      # ======================================================

      - name: "Step 35 - Verify ECR"
        shell: bash

        run: |

          set +e

          echo "=================================================="
          echo "FINAL ECR VERIFICATION"
          echo "=================================================="

          aws ecr describe-repositories \
            --region "$AWS_REGION" \
            --query "repositories[].[repositoryName,repositoryUri]" \
            --output table \
            --no-cli-pager


      # ======================================================
      # STEP 36
      # Final S3 verification
      # ======================================================

      - name: "Step 36 - Verify Template Bucket Stack"
        shell: bash

        run: |

          set +e

          echo "=================================================="
          echo "FINAL TEMPLATE BUCKET VERIFICATION"
          echo "=================================================="

          if aws cloudformation describe-stacks \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            >/dev/null 2>&1
          then

            echo "WARNING: Template Bucket stack still exists."

            aws cloudformation describe-stacks \
              --stack-name "$TEMPLATE_BUCKET_STACK" \
              --region "$AWS_REGION" \
              --query "Stacks[0].[StackName,StackStatus]" \
              --output table \
              --no-cli-pager

          else

            echo "Template Bucket stack deleted."

          fi


      # ======================================================
      # STEP 37
      # Final CloudFormation verification
      # ======================================================

      - name: "Step 37 - Final CloudFormation Verification"
        shell: bash

        run: |

          set +e

          echo "=================================================="
          echo "FINAL CLOUDFORMATION VERIFICATION"
          echo "=================================================="

          aws cloudformation list-stacks \
            --region "$AWS_REGION" \
            --stack-status-filter \
              CREATE_IN_PROGRESS \
              CREATE_FAILED \
              CREATE_COMPLETE \
              ROLLBACK_IN_PROGRESS \
              ROLLBACK_FAILED \
              ROLLBACK_COMPLETE \
              UPDATE_IN_PROGRESS \
              UPDATE_COMPLETE \
              UPDATE_ROLLBACK_IN_PROGRESS \
              UPDATE_ROLLBACK_FAILED \
              UPDATE_ROLLBACK_COMPLETE \
              DELETE_IN_PROGRESS \
              DELETE_FAILED \
            --query "StackSummaries[?contains(StackName, 'Lab01-CloudFormation')].[StackName,StackStatus]" \
            --output table \
            --no-cli-pager


      # ======================================================
      # STEP 38
      # Final summary
      # ======================================================

      - name: "Step 38 - Final Cleanup Summary"
        shell: bash

        run: |

          echo ""
          echo "=========================================================="
          echo "              AWS LAB CLEANUP SUMMARY"
          echo "=========================================================="

          echo ""
          echo "AWS Region:"
          echo "  $AWS_REGION"

          echo ""
          echo "Root Stack:"
          echo "  $STACK_NAME"

          echo ""
          echo "Template Bucket Stack:"
          echo "  $TEMPLATE_BUCKET_STACK"

          echo ""
          echo "=========================================================="
          echo "DELETION STRATEGY"
          echo "=========================================================="

          echo ""
          echo "  1. Discover root stack"
          echo "  2. Discover nested resources"
          echo "  3. Disable RDS deletion protection"
          echo "  4. Stop ECS service"
          echo "  5. Wait for ECS tasks"
          echo "  6. Delete ECS service"
          echo "  7. Clean Docker on EC2 through SSM"
          echo "  8. Empty ECR images"
          echo "  9. Empty Template S3 bucket"
          echo " 10. Delete separate Template Bucket stack"
          echo " 11. Delete ROOT CloudFormation stack"
          echo " 12. CloudFormation deletes nested stacks"
          echo " 13. Inspect DELETE_FAILED resources"
          echo " 14. Retry ECS cleanup"
          echo " 15. Retry ALB cleanup"
          echo " 16. Retry Target Group cleanup"
          echo " 17. FORCE_DELETE_STACK if required"
          echo " 18. Verify CloudFormation"
          echo " 19. Verify ECS"
          echo " 20. Verify ECR"
          echo " 21. Verify S3"
          echo " 22. Verify Docker cleanup"
          echo ""
          echo "=========================================================="
          echo "                 CLEANUP WORKFLOW FINISHED"
          echo "=========================================================="

# ==========================================================
# AWS CloudFormation DevOps Lab
# GitHub Actions - Complete Stack Delete Workflow
# ==========================================================
#
# File:
#   .github/workflows/delete.yml
#
# Purpose:
# ----------------------------------------------------------
# Deletes the complete Lab01-CloudFormation environment.
#
# This workflow is designed for this lab architecture:
#
#   Lab01-CloudFormation
#          |
#          +---- EC2WebServerStack
#          |
#          +---- S3NestedStack
#          |
#          +---- RDSNestedStack
#                    |
#                    +---- RDSDatabase
#                    +---- RDSSecurityGroup
#                    +---- RDSSubnetGroup
#
#
# Deletion strategy:
#
#   1. Check whether the root stack exists.
#
#   2. Display current stack status.
#
#   3. Display current resources.
#
#   4. If the stack is already DELETE_FAILED:
#          use FORCE_DELETE_STACK.
#
#   5. Otherwise:
#          start normal deletion.
#
#   6. Wait for normal deletion.
#
#   7. If normal deletion fails:
#          inspect failed resources.
#
#   8. If RDS is the failed resource:
#          attempt direct RDS deletion.
#
#   9. Retry CloudFormation deletion using:
#
#          FORCE_DELETE_STACK
#
#  10. Wait for final CloudFormation deletion.
#
#  11. Verify that the root stack no longer exists.
#
#  12. Check for DELETE_SKIPPED resources.
#
#
# IMPORTANT:
# ----------------------------------------------------------
# FORCE_DELETE_STACK is NOT a magic "delete everything"
# command.
#
# AWS can leave a resource behind if AWS cannot delete it.
#
# Therefore this workflow:
#
#   - tries normal deletion first
#   - handles RDS explicitly
#   - uses FORCE_DELETE_STACK when necessary
#   - reports anything still remaining
#
# ==========================================================


# ----------------------------------------------------------
# Workflow Name
# ----------------------------------------------------------

name: Delete AWS CloudFormation Stack


# ----------------------------------------------------------
# Trigger
# ----------------------------------------------------------
#
# Manual execution:
#
# GitHub
#   -> Actions
#   -> Delete AWS CloudFormation Stack
#   -> Run workflow
#
# ----------------------------------------------------------

on:

  workflow_dispatch:


# ----------------------------------------------------------
# Global Environment Variables
# ----------------------------------------------------------

env:

  AWS_REGION: us-east-1

  STACK_NAME: Lab01-CloudFormation


# ==========================================================
# JOB
# ==========================================================

jobs:

  delete-stack:

    # ------------------------------------------------------
    # GitHub Hosted Runner
    # ------------------------------------------------------

    runs-on: ubuntu-latest

    name: Delete CloudFormation Stack


    # ======================================================
    # STEPS
    # ======================================================

    steps:


    # ======================================================
    # Step 1
    # Checkout Repository
    # ======================================================

    - name: Checkout Repository

      uses: actions/checkout@v4


    # ======================================================
    # Step 2
    # Configure AWS Credentials
    # ======================================================

    - name: Configure AWS Credentials

      uses: aws-actions/configure-aws-credentials@v4

      with:

        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

        aws-region: ${{ env.AWS_REGION }}


    # ======================================================
    # Step 3
    # Verify AWS CLI
    # ======================================================

    - name: Verify AWS CLI

      shell: bash

      run: |

        echo "======================================"
        echo "AWS CLI INFORMATION"
        echo "======================================"

        aws --version

        echo ""

        echo "======================================"
        echo "AWS ACCOUNT"
        echo "======================================"

        aws sts get-caller-identity

        echo ""

        echo "AWS Region : $AWS_REGION"
        echo "Stack Name : $STACK_NAME"


    # ======================================================
    # Step 4
    # Check Whether Root Stack Exists
    # ======================================================

    - name: Check Stack

      id: stack

      shell: bash

      run: |

        echo "======================================"
        echo "CHECKING CLOUDFORMATION STACK"
        echo "======================================"

        if aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          > /dev/null 2>&1

        then

          echo "exists=true" >> "$GITHUB_OUTPUT"

          echo ""
          echo "CloudFormation stack exists."

        else

          echo "exists=false" >> "$GITHUB_OUTPUT"

          echo ""
          echo "CloudFormation stack does not exist."

        fi


    # ======================================================
    # Step 5
    # Get Current Stack Status
    # ======================================================

    - name: Get Stack Status

      if: steps.stack.outputs.exists == 'true'

      id: status

      shell: bash

      run: |

        echo "======================================"
        echo "CURRENT STACK STATUS"
        echo "======================================"

        STACK_STATUS=$(aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "Stacks[0].StackStatus" \
          --output text)

        echo ""
        echo "Stack Status: $STACK_STATUS"
        echo ""

        echo "stack_status=$STACK_STATUS" >> "$GITHUB_OUTPUT"


    # ======================================================
    # Step 6
    # Display Stack Information
    # ======================================================

    - name: Display Stack Information

      if: steps.stack.outputs.exists == 'true'

      shell: bash

      run: |

        echo "======================================"
        echo "STACK INFORMATION"
        echo "======================================"

        aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --output table


    # ======================================================
    # Step 7
    # Display Current Resources
    # ======================================================

    - name: Display Current Resources

      if: steps.stack.outputs.exists == 'true'

      shell: bash

      run: |

        echo "======================================"
        echo "CURRENT STACK RESOURCES"
        echo "======================================"

        aws cloudformation list-stack-resources \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "StackResourceSummaries[].[LogicalResourceId,ResourceType,ResourceStatus,PhysicalResourceId]" \
          --output table || true


    # ======================================================
    # Step 8
    # Display Previous Failure Information
    # ======================================================
    #
    # Useful when the stack is already DELETE_FAILED.
    #
    # ======================================================

    - name: Display Failed Resources

      if: steps.stack.outputs.exists == 'true'

      shell: bash

      run: |

        echo "======================================"
        echo "FAILED RESOURCE INFORMATION"
        echo "======================================"

        aws cloudformation describe-stack-events \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "StackEvents[?contains(ResourceStatus, 'FAILED')].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
          --output table || true


    # ======================================================
    # Step 9
    # Detect RDS Database Instance
    # ======================================================
    #
    # We specifically look for the RDS instance created by
    # the nested RDS CloudFormation stack.
    #
    # This is important for your lab because RDSDatabase
    # previously caused DELETE_FAILED.
    #
    # ======================================================

    - name: Detect RDS Database

      if: steps.stack.outputs.exists == 'true'

      id: rds

      shell: bash

      run: |

        echo "======================================"
        echo "CHECKING FOR RDS DATABASE"
        echo "======================================"

        RDS_ID=$(aws cloudformation list-stack-resources \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "StackResourceSummaries[?LogicalResourceId=='RDSNestedStack'].PhysicalResourceId" \
          --output text)

        echo ""
        echo "RDS Nested Stack:"
        echo "$RDS_ID"
        echo ""

        if [ -n "$RDS_ID" ] && [ "$RDS_ID" != "None" ]

        then

          echo "RDS nested stack exists."

          echo "rds_nested_stack=$RDS_ID" >> "$GITHUB_OUTPUT"

        else

          echo "RDS nested stack was not found."

          echo "rds_nested_stack=" >> "$GITHUB_OUTPUT"

        fi


    # ======================================================
    # Step 10
    # Start Normal CloudFormation Deletion
    # ======================================================
    #
    # If the stack is already DELETE_FAILED, skip normal
    # deletion and use FORCE_DELETE_STACK.
    #
    # ======================================================

    - name: Start Stack Deletion

      if: steps.stack.outputs.exists == 'true'

      id: delete

      shell: bash

      run: |

        echo "======================================"
        echo "STARTING STACK DELETION"
        echo "======================================"

        CURRENT_STATUS="${{ steps.status.outputs.stack_status }}"

        echo ""
        echo "Stack Name : $STACK_NAME"
        echo "Region     : $AWS_REGION"
        echo "Status     : $CURRENT_STATUS"
        echo ""


        # --------------------------------------------------
        # DELETE_FAILED
        # --------------------------------------------------
        #
        # If the stack is already stuck in DELETE_FAILED,
        # normal delete cannot be started again.
        #
        # Use FORCE_DELETE_STACK.
        #
        # --------------------------------------------------

        if [ "$CURRENT_STATUS" = "DELETE_FAILED" ]

        then

          echo "Stack is already DELETE_FAILED."

          echo ""
          echo "Using FORCE_DELETE_STACK..."

          aws cloudformation delete-stack \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --deletion-mode FORCE_DELETE_STACK

          echo "mode=force" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Force deletion started."

        else

          # ------------------------------------------------
          # Normal deletion
          # ------------------------------------------------

          echo "Starting normal CloudFormation deletion..."

          aws cloudformation delete-stack \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION"

          echo "mode=standard" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Normal deletion started."

        fi


    # ======================================================
    # Step 11
    # Wait for Normal Deletion
    # ======================================================
    #
    # continue-on-error is intentional.
    #
    # If deletion fails, we continue to the recovery
    # section instead of terminating the workflow.
    #
    # ======================================================

    - name: Wait for Normal Deletion

      if: |
        steps.stack.outputs.exists == 'true' &&
        steps.delete.outputs.mode == 'standard'

      id: normal_wait

      continue-on-error: true

      shell: bash

      run: |

        echo "======================================"
        echo "WAITING FOR NORMAL DELETION"
        echo "======================================"

        if aws cloudformation wait stack-delete-complete \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION"

        then

          echo "deleted=true" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Normal deletion completed successfully."

        else

          echo "deleted=false" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Normal deletion did not complete."

        fi


    # ======================================================
    # Step 12
    # Show Deletion Failure
    # ======================================================

    - name: Show Deletion Failure

      if: |
        steps.stack.outputs.exists == 'true' &&
        steps.delete.outputs.mode == 'standard' &&
        steps.normal_wait.outputs.deleted == 'false'

      shell: bash

      run: |

        echo "======================================"
        echo "CLOUDFORMATION DELETION FAILURE"
        echo "======================================"

        echo ""

        aws cloudformation describe-stack-events \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --query "StackEvents[?ResourceStatus=='DELETE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]" \
          --output table || true


    # ======================================================
    # Step 13
    # Show RDS Status Before Force Delete
    # ======================================================
    #
    # This step is especially important for your lab.
    #
    # We display all RDS instances before attempting the
    # force cleanup.
    #
    # ======================================================

    - name: Check RDS Status

      if: |
        steps.stack.outputs.exists == 'true' &&
        (
          steps.delete.outputs.mode == 'force' ||
          steps.normal_wait.outputs.deleted == 'false'
        )

      shell: bash

      run: |

        echo "======================================"
        echo "RDS DATABASE STATUS"
        echo "======================================"

        aws rds describe-db-instances \
          --region "$AWS_REGION" \
          --query "DBInstances[*].[DBInstanceIdentifier,DBInstanceStatus,DeletionProtection,PubliclyAccessible]" \
          --output table || true


    # ======================================================
    # Step 14
    # Attempt Direct RDS Cleanup
    # ======================================================
    #
    # If the RDS instance still exists, request deletion.
    #
    # IMPORTANT:
    #
    # CloudFormation normally owns this resource.
    #
    # We only perform this recovery step after the normal
    # CloudFormation deletion has failed OR the root stack
    # was already DELETE_FAILED.
    #
    # ======================================================

    - name: Attempt RDS Cleanup

      if: |
        steps.stack.outputs.exists == 'true' &&
        (
          steps.delete.outputs.mode == 'force' ||
          steps.normal_wait.outputs.deleted == 'false'
        )

      shell: bash

      run: |

        echo "======================================"
        echo "ATTEMPTING RDS CLEANUP"
        echo "======================================"

        RDS_INSTANCE=$(aws cloudformation describe-stack-resources \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --logical-resource-id RDSDatabase \
          --query "StackResources[0].PhysicalResourceId" \
          --output text 2>/dev/null || true)

        echo ""
        echo "RDS Instance ID:"
        echo "$RDS_INSTANCE"
        echo ""

        if [ -n "$RDS_INSTANCE" ] &&
           [ "$RDS_INSTANCE" != "None" ]

        then

          echo "RDS instance was found."

          echo ""
          echo "Checking deletion protection..."

          DELETE_PROTECTION=$(aws rds describe-db-instances \
            --db-instance-identifier "$RDS_INSTANCE" \
            --region "$AWS_REGION" \
            --query "DBInstances[0].DeletionProtection" \
            --output text 2>/dev/null || true)

          echo "Deletion Protection: $DELETE_PROTECTION"

          # ------------------------------------------------
          # Disable deletion protection if necessary.
          # ------------------------------------------------

          if [ "$DELETE_PROTECTION" = "True" ]

          then

            echo ""
            echo "Deletion protection is enabled."

            echo "Disabling deletion protection..."

            aws rds modify-db-instance \
              --db-instance-identifier "$RDS_INSTANCE" \
              --region "$AWS_REGION" \
              --no-deletion-protection \
              --apply-immediately

            echo ""
            echo "Waiting for deletion protection change..."

            aws rds wait db-instance-available \
              --db-instance-identifier "$RDS_INSTANCE" \
              --region "$AWS_REGION" || true

          fi


          # ------------------------------------------------
          # Request RDS deletion.
          #
          # Skip final snapshot because this is a learning
          # lab and the objective is complete cleanup.
          # ------------------------------------------------

          echo ""
          echo "Requesting RDS instance deletion..."

          aws rds delete-db-instance \
            --db-instance-identifier "$RDS_INSTANCE" \
            --region "$AWS_REGION" \
            --skip-final-snapshot \
            --delete-automated-backups \
            || true

          echo ""
          echo "RDS deletion request submitted."

        else

          echo "RDS instance could not be identified."

          echo "CloudFormation may already have removed it."

        fi


    # ======================================================
    # Step 15
    # Wait for RDS Deletion
    # ======================================================
    #
    # Wait until the RDS instance is completely gone.
    #
    # ======================================================

    - name: Wait for RDS Deletion

      if: |
        steps.stack.outputs.exists == 'true' &&
        (
          steps.delete.outputs.mode == 'force' ||
          steps.normal_wait.outputs.deleted == 'false'
        )

      shell: bash

      run: |

        echo "======================================"
        echo "WAITING FOR RDS DELETION"
        echo "======================================"

        RDS_INSTANCE=$(aws cloudformation describe-stack-resources \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --logical-resource-id RDSDatabase \
          --query "StackResources[0].PhysicalResourceId" \
          --output text 2>/dev/null || true)

        if [ -n "$RDS_INSTANCE" ] &&
           [ "$RDS_INSTANCE" != "None" ]

        then

          echo ""
          echo "Waiting for:"
          echo "$RDS_INSTANCE"
          echo ""

          aws rds wait db-instance-deleted \
            --db-instance-identifier "$RDS_INSTANCE" \
            --region "$AWS_REGION" \
            || true

          echo ""
          echo "RDS deletion wait completed."

        else

          echo ""
          echo "RDS instance is already unavailable."

        fi


    # ======================================================
    # Step 16
    # Force Delete CloudFormation Stack
    # ======================================================
    #
    # Now that we have attempted RDS cleanup, retry
    # CloudFormation using FORCE_DELETE_STACK.
    #
    # ======================================================

    - name: Force Delete Stack

      if: |
        steps.stack.outputs.exists == 'true' &&
        (
          steps.delete.outputs.mode == 'force' ||
          steps.normal_wait.outputs.deleted == 'false'
        )

      id: force

      shell: bash

      run: |

        echo "======================================"
        echo "FORCE DELETE CLOUDFORMATION STACK"
        echo "======================================"

        echo ""
        echo "Deletion Mode:"
        echo "FORCE_DELETE_STACK"
        echo ""

        aws cloudformation delete-stack \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          --deletion-mode FORCE_DELETE_STACK

        echo ""
        echo "Force deletion request submitted."


    # ======================================================
    # Step 17
    # Wait for Final CloudFormation Deletion
    # ======================================================
    #
    # This waits for the root stack to disappear.
    #
    # ======================================================

    - name: Wait for Final Deletion

      if: |
        steps.stack.outputs.exists == 'true' &&
        (
          steps.delete.outputs.mode == 'force' ||
          steps.normal_wait.outputs.deleted == 'false'
        )

      shell: bash

      run: |

        echo "======================================"
        echo "WAITING FOR FINAL DELETION"
        echo "======================================"

        aws cloudformation wait stack-delete-complete \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION"

        echo ""
        echo "CloudFormation root stack deletion completed."


    # ======================================================
    # Step 18
    # Verify Root Stack Is Gone
    # ======================================================

    - name: Verify Stack Deletion

      if: steps.stack.outputs.exists == 'true'

      shell: bash

      run: |

        echo "======================================"
        echo "VERIFYING STACK DELETION"
        echo "======================================"

        if aws cloudformation describe-stacks \
          --stack-name "$STACK_NAME" \
          --region "$AWS_REGION" \
          > /dev/null 2>&1

        then

          echo ""
          echo "ERROR:"
          echo "CloudFormation stack still exists."

          exit 1

        else

          echo ""
          echo "CloudFormation stack no longer exists."

        fi


    # ======================================================
    # Step 19
    # Check RDS Instances
    # ======================================================
    #
    # This is an independent verification.
    #
    # We don't only trust CloudFormation.
    #
    # ======================================================

    - name: Verify RDS Cleanup

      shell: bash

      run: |

        echo "======================================"
        echo "VERIFYING RDS CLEANUP"
        echo "======================================"

        RDS_COUNT=$(aws rds describe-db-instances \
          --region "$AWS_REGION" \
          --query "length(DBInstances)" \
          --output text)

        echo ""
        echo "RDS instances currently visible: $RDS_COUNT"
        echo ""

        if [ "$RDS_COUNT" = "0" ]

        then

          echo "No RDS DB instances remain."

        else

          echo "RDS DB instances still exist."

          aws rds describe-db-instances \
            --region "$AWS_REGION" \
            --query "DBInstances[*].[DBInstanceIdentifier,DBInstanceStatus]" \
            --output table

        fi


    # ======================================================
    # Step 20
    # Check CloudFormation Stack Resources
    # ======================================================
    #
    # FORCE_DELETE_STACK can result in DELETE_SKIPPED.
    #
    # We report those resources if they exist.
    #
    # ======================================================

    - name: Check Retained Resources

      shell: bash

      run: |

        echo "======================================"
        echo "CHECKING FOR RETAINED RESOURCES"
        echo "======================================"

        echo ""
        echo "CloudFormation DELETE_SKIPPED resources:"
        echo ""

        echo "The root stack has been removed."
        echo ""
        echo "Any resources that could not be deleted must"
        echo "be checked independently in AWS."


    # ======================================================
    # Step 21
    # Stack Was Not Found
    # ======================================================

    - name: Stack Not Found

      if: steps.stack.outputs.exists == 'false'

      shell: bash

      run: |

        echo "======================================"
        echo "STACK NOT FOUND"
        echo "======================================"

        echo ""
        echo "Stack Name : $STACK_NAME"
        echo "Region     : $AWS_REGION"
        echo ""

        echo "The CloudFormation stack does not exist."


    # ======================================================
    # Step 22
    # Final Result
    # ======================================================

    - name: Final Cleanup Summary

      shell: bash

      run: |

        echo ""
        echo "======================================"
        echo "CLOUDFORMATION DELETE WORKFLOW COMPLETE"
        echo "======================================"

        echo ""
        echo "Stack Name : $STACK_NAME"
        echo "Region     : $AWS_REGION"
        echo ""

        echo "Root CloudFormation stack cleanup completed."

        echo ""
        echo "RDS cleanup was checked separately."

        echo ""
        echo "======================================"

      # ======================================================
      # Delete Template Bucket CloudFormation Stack
      # ======================================================
      #
      # IMPORTANT:
      #
      # Lab01-CloudFormation-TemplateBucket is NOT a nested
      # stack of Lab01-CloudFormation.
      #
      # It is a separate CloudFormation stack.
      #
      # Therefore deleting:
      #
      #     Lab01-CloudFormation
      #
      # does NOT automatically delete:
      #
      #     Lab01-CloudFormation-TemplateBucket
      #
      # This step explicitly deletes the template bucket stack
      # after the main CloudFormation stack has been deleted.
      #
      # The template bucket contains the nested CloudFormation
      # templates used during deployment.
      #
      # ======================================================

      - name: Delete Template Bucket Stack

        shell: bash

        run: |

          echo "======================================"
          echo "Deleting Template Bucket Stack"
          echo "======================================"

          echo "Stack Name:"
          echo "$TEMPLATE_BUCKET_STACK"

          echo "Region:"
          echo "$AWS_REGION"

          echo ""


          # --------------------------------------------------
          # Check whether the template bucket stack exists
          # --------------------------------------------------

          if ! aws cloudformation describe-stacks \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo "Template bucket stack does not exist."

            echo ""
            echo "Nothing to delete."

            exit 0

          fi


          # --------------------------------------------------
          # Get current CloudFormation stack status
          # --------------------------------------------------

          TEMPLATE_BUCKET_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text \
            --no-cli-pager)


          echo "Current Template Bucket Stack Status:"
          echo "$TEMPLATE_BUCKET_STATUS"

          echo ""


          # --------------------------------------------------
          # Prevent deletion while the stack is busy
          # --------------------------------------------------

          case "$TEMPLATE_BUCKET_STATUS" in

            CREATE_IN_PROGRESS|UPDATE_IN_PROGRESS|UPDATE_COMPLETE_CLEANUP_IN_PROGRESS|DELETE_IN_PROGRESS)

              echo "ERROR: Template bucket stack is currently busy."

              echo "Current status:"
              echo "$TEMPLATE_BUCKET_STATUS"

              echo ""

              echo "Wait for the current CloudFormation operation"
              echo "to finish before running the delete workflow again."

              exit 1

              ;;

          esac


          # --------------------------------------------------
          # If the stack is already in DELETE_COMPLETE,
          # CloudFormation normally no longer returns it from
          # describe-stacks.
          # --------------------------------------------------

          if [ "$TEMPLATE_BUCKET_STATUS" = "DELETE_COMPLETE" ]; then

            echo "Template bucket stack is already deleted."

            exit 0

          fi


          # --------------------------------------------------
          # Delete the template bucket CloudFormation stack
          # --------------------------------------------------

          echo "Deleting template bucket CloudFormation stack..."

          aws cloudformation delete-stack \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --no-cli-pager


          echo ""

          echo "Template bucket stack deletion started."


          # --------------------------------------------------
          # Wait until CloudFormation confirms deletion
          # --------------------------------------------------

          echo ""
          echo "Waiting for template bucket stack deletion..."

          aws cloudformation wait stack-delete-complete \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION"


          echo ""
          echo "Template bucket stack deletion completed successfully."


          # --------------------------------------------------
          # Final verification
          # --------------------------------------------------

          echo ""
          echo "Verifying template bucket stack deletion..."

          if aws cloudformation describe-stacks \
            --stack-name "$TEMPLATE_BUCKET_STACK" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            > /dev/null 2>&1
          then

            echo ""
            echo "ERROR: Template bucket stack still exists."

            exit 1

          else

            echo ""
            echo "Template bucket stack no longer exists."

          fi


          echo ""
          echo "======================================"
          echo "Template Bucket Stack Deleted"
          echo "======================================"

    
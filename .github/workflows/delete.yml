          echo ""

          echo "CLOUDFORMATION LAB STACKS"
          echo "--------------------------------------"

          aws cloudformation list-stacks \
            --region "$AWS_REGION" \
            --stack-status-filter \
              CREATE_IN_PROGRESS \
              CREATE_FAILED \
              CREATE_COMPLETE \
              ROLLBACK_IN_PROGRESS \
              ROLLBACK_FAILED \
              ROLLBACK_COMPLETE \
              DELETE_IN_PROGRESS \
              DELETE_FAILED \
              UPDATE_IN_PROGRESS \
              UPDATE_COMPLETE \
              UPDATE_ROLLBACK_IN_PROGRESS \
              UPDATE_ROLLBACK_FAILED \
              UPDATE_ROLLBACK_COMPLETE \
            --query "StackSummaries[?contains(StackName, 'Lab01-CloudFormation')].[StackName,StackStatus]" \
            --output table \
            --no-cli-pager \
            || true

          echo ""

          echo "ECS CLUSTERS"
          echo "--------------------------------------"

          aws ecs list-clusters \
            --region "$AWS_REGION" \
            --output table \
            --no-cli-pager \
            || true

          echo ""

          echo "ECR REPOSITORIES"
          echo "--------------------------------------"

          aws ecr describe-repositories \
            --region "$AWS_REGION" \
            --output table \
            --no-cli-pager \
            || true



# =====================================================================
# CHARLIE CAFE - AWS TERRAFORM DEVOPS LAB
# COMPLETE TERRAFORM DELETE / CLEANUP WORKFLOW
# =====================================================================
#
# File:
#   .github/workflows/aws-terraform-delete.yml
#
# PURPOSE
# ---------------------------------------------------------------------
# Completely destroy the Charlie Cafe AWS DevOps Lab infrastructure
# managed by Terraform.
#
# IMPORTANT:
# ---------------------------------------------------------------------
# This workflow is the TERRAFORM replacement for:
#
#   aws-cloudformation-delete.yml
#
# CloudFormation stack concepts are intentionally NOT used here.
#
# Terraform is now the infrastructure source of truth.
#
#
# MAIN DELETION FLOW
# ---------------------------------------------------------------------
#
#  1. Checkout repository
#  2. Configure AWS credentials
#  3. Verify AWS account
#  4. Install Terraform
#  5. Initialize Terraform
#  6. Validate Terraform configuration
#  7. Display Terraform workspace/state
#  8. Discover Terraform-managed ECS resources
#  9. Stop ECS service
# 10. Wait for ECS tasks
# 11. Discover ECR repository
# 12. Delete ECR images
# 13. Discover EC2 instances from Terraform state
# 14. Clean Docker containers/images/volumes/networks on EC2
# 15. Discover RDS instances
# 16. Disable RDS deletion protection
# 17. Discover Terraform-managed S3 buckets
# 18. Empty versioned S3 buckets
# 19. Run Terraform destroy plan
# 20. Execute Terraform destroy
# 21. If destroy has dependency problems:
#       - retry ECS cleanup
#       - retry ALB cleanup
#       - retry target group cleanup
#       - retry Terraform destroy
# 22. Verify ECS
# 23. Verify ECR
# 24. Verify S3
# 25. Verify EC2
# 26. Verify Terraform state
# 27. Final cleanup summary
#
#
# IMPORTANT TERRAFORM PRINCIPLE
# ---------------------------------------------------------------------
#
# Terraform manages resources through STATE.
#
# CloudFormation:
#
#   Stack
#      |
#      +-- Resources
#
# Terraform:
#
#   Terraform configuration
#      |
#      +-- Terraform state
#              |
#              +-- AWS resources
#
# Therefore we do NOT:
#
#   aws cloudformation delete-stack
#
# Instead we use:
#
#   terraform plan -destroy
#   terraform destroy
#
#
# IMPORTANT:
# ---------------------------------------------------------------------
# terraform destroy only destroys resources managed by the Terraform
# configuration/state being used by this workflow.
#
# It does NOT automatically delete unrelated AWS resources that are
# outside Terraform state.
#
#
# =====================================================================


# =====================================================================
# CHARLIE CAFE - AWS TERRAFORM DEVOPS LAB
# COMPLETE TERRAFORM DELETE / CLEANUP WORKFLOW
# =====================================================================
#
# File:
#   .github/workflows/aws-terraform-delete.yml
#
# PURPOSE
# ---------------------------------------------------------------------
# Completely remove the Charlie Cafe AWS infrastructure created for
# this Terraform lab.
#
# PRIMARY OWNER:
#   Terraform
#
# ADDITIONAL EXPLICIT CLEANUP:
#   - Charlie Cafe ECS Service
#   - Charlie Cafe ECS Cluster
#   - Charlie Cafe ECR Repository
#   - Terraform-managed S3 bucket contents
#   - RDS deletion protection
#
# IMPORTANT:
# ---------------------------------------------------------------------
# This workflow does NOT delete arbitrary resources from the AWS
# account.
#
# Terraform can only destroy resources represented by the Terraform
# configuration/state being used by this workflow.
#
# The explicitly named ECS/ECR cleanup is included because your lab
# may have ECS/ECR resources that were created outside the current
# Terraform state.
#
# =====================================================================


# =====================================================================
# CHARLIE CAFE - AWS TERRAFORM DEVOPS LAB
# COMPLETE TERRAFORM DELETE / CLEANUP WORKFLOW
# =====================================================================
#
# File:
#   .github/workflows/aws-terraform-delete.yml
#
# PURPOSE
# ---------------------------------------------------------------------
# Completely destroy the Charlie Cafe AWS infrastructure managed by
# Terraform, while also handling AWS resources that may have been left
# behind by previous ECS/ECR deployments.
#
# PRIMARY INFRASTRUCTURE OWNER:
#   Terraform
#
# IMPORTANT:
# ---------------------------------------------------------------------
# This workflow is intentionally idempotent.
#
# That means:
#
#   - ACTIVE ECS service      -> stop/delete it
#   - DRAINING ECS service    -> wait for it
#   - INACTIVE ECS service    -> already deleted, continue
#   - Missing ECS service     -> already deleted, continue
#   - Missing ECR repository  -> already deleted, continue
#   - Missing S3 bucket       -> already deleted, continue
#
# The cleanup workflow should not fail simply because a previous
# cleanup attempt already removed a resource.
#
# =====================================================================


name: Complete AWS Terraform Lab Cleanup


# =====================================================================
# MANUAL TRIGGER
# =====================================================================

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DELETE to confirm that Charlie Cafe AWS resources should be destroyed"
        required: true
        default: ""


# =====================================================================
# GLOBAL VARIABLES
# =====================================================================

env:

  # -------------------------------------------------------------------
  # AWS REGION
  # -------------------------------------------------------------------
  AWS_REGION: us-east-1

  # -------------------------------------------------------------------
  # TERRAFORM ROOT MODULE
  #
  # Repository structure expected:
  #
  # CharlieCafe-TF-Lab/
  # └── infrastructure/
  #     └── terraform/
  #
  # If your Terraform files are somewhere else, change this value.
  # -------------------------------------------------------------------
  TERRAFORM_WORKING_DIRECTORY: infrastructure/terraform

  # -------------------------------------------------------------------
  # TERRAFORM VERSION
  # -------------------------------------------------------------------
  TERRAFORM_VERSION: "1.9.8"

  # -------------------------------------------------------------------
  # CHARLIE CAFE TERRAFORM ECS
  # -------------------------------------------------------------------
  ECS_CLUSTER_NAME: CharlieCafe-TF-Cluster
  ECS_SERVICE_NAME: CharlieCafe-TF-Service

  # -------------------------------------------------------------------
  # CHARLIE CAFE TERRAFORM ECR
  # -------------------------------------------------------------------
  ECR_REPOSITORY_NAME: charlie-cafe-tf

  # -------------------------------------------------------------------
  # ECS WAIT SETTINGS
  #
  # 36 x 10 seconds = approximately 6 minutes
  # -------------------------------------------------------------------
  ECS_WAIT_ATTEMPTS: "36"

  # -------------------------------------------------------------------
  # RDS WAIT SETTINGS
  #
  # Used while waiting for deletion protection changes to complete.
  # -------------------------------------------------------------------
  RDS_WAIT_ATTEMPTS: "36"


# =====================================================================
# JOB
# =====================================================================

jobs:

  delete-lab:

    name: Complete AWS Terraform Lab Cleanup

    runs-on: ubuntu-latest

    steps:


      # ===============================================================
      # STEP 1
      # CHECKOUT REPOSITORY
      # ===============================================================

      - name: "Step 1 - Checkout Repository"
        uses: actions/checkout@v4


      # ===============================================================
      # STEP 2
      # CONFIRM DESTRUCTIVE OPERATION
      # ===============================================================

      - name: "Step 2 - Confirm Destructive Cleanup"
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "DESTRUCTIVE CLEANUP CONFIRMATION"
          echo "=========================================================="

          CONFIRMATION="${{ github.event.inputs.confirmation }}"

          if [[ "$CONFIRMATION" != "DELETE" ]]; then
            echo ""
            echo "ERROR: Cleanup was not confirmed."
            echo ""
            echo "When starting this workflow, type:"
            echo ""
            echo "DELETE"
            echo ""
            exit 1
          fi

          echo ""
          echo "Cleanup confirmation accepted."
          echo ""
          echo "Charlie Cafe Terraform infrastructure will be deleted."
          echo ""

          echo "=========================================================="
          echo "DESTRUCTIVE CLEANUP CONFIRMED"
          echo "=========================================================="


      # ===============================================================
      # STEP 3
      # CONFIGURE AWS CREDENTIALS
      # ===============================================================

      - name: "Step 3 - Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ===============================================================
      # STEP 4
      # VERIFY AWS ACCOUNT
      # ===============================================================

      - name: "Step 4 - Verify AWS Account"
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "AWS ACCOUNT VERIFICATION"
          echo "=========================================================="

          echo ""
          echo "AWS CLI:"
          aws --version

          echo ""
          echo "AWS Identity:"
          aws sts get-caller-identity

          echo ""
          echo "AWS Region:"
          echo "  $AWS_REGION"

          echo ""
          echo "Terraform Directory:"
          echo "  $TERRAFORM_WORKING_DIRECTORY"

          echo ""
          echo "=========================================================="
          echo "AWS ACCOUNT VERIFIED"
          echo "=========================================================="


      # ===============================================================
      # STEP 5
      # INSTALL TERRAFORM
      # ===============================================================

      - name: "Step 5 - Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}


      # ===============================================================
      # STEP 6
      # VERIFY TERRAFORM DIRECTORY
      # ===============================================================

      - name: "Step 6 - Verify Terraform Directory"
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "VERIFY TERRAFORM DIRECTORY"
          echo "=========================================================="

          if [[ ! -d "$TERRAFORM_WORKING_DIRECTORY" ]]; then

            echo ""
            echo "ERROR: Terraform directory does not exist."
            echo ""
            echo "Expected:"
            echo "  $TERRAFORM_WORKING_DIRECTORY"
            echo ""

            echo "Terraform files found in repository:"
            find . -maxdepth 6 -type f \
              \( -name "*.tf" -o -name "*.tfvars" \) \
              -print | sort

            exit 1
          fi

          TF_COUNT=$(
            find "$TERRAFORM_WORKING_DIRECTORY" \
              -type f \
              -name "*.tf" |
              wc -l
          )

          if [[ "$TF_COUNT" -eq 0 ]]; then
            echo ""
            echo "ERROR: No Terraform files were found."
            exit 1
          fi

          echo ""
          echo "Terraform directory:"
          echo "  $TERRAFORM_WORKING_DIRECTORY"

          echo ""
          echo "Terraform files:"
          find "$TERRAFORM_WORKING_DIRECTORY" \
            -type f \
            \( \
              -name "*.tf" \
              -o -name "*.tfvars" \
              -o -name ".terraform.lock.hcl" \
            \) \
            -print |
            sort

          echo ""
          echo "=========================================================="
          echo "TERRAFORM DIRECTORY VERIFIED"
          echo "=========================================================="


      # ===============================================================
      # STEP 7
      # TERRAFORM INIT
      # ===============================================================

      - name: "Step 7 - Terraform Init"
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "TERRAFORM INIT"
          echo "=========================================================="

          terraform init \
            -input=false

          echo ""
          echo "Terraform initialization completed."

          echo ""
          echo "=========================================================="
          echo "TERRAFORM INIT COMPLETE"
          echo "=========================================================="


      # ===============================================================
      # STEP 8
      # TERRAFORM VALIDATE
      # ===============================================================

      - name: "Step 8 - Terraform Validate"
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "TERRAFORM VALIDATION"
          echo "=========================================================="

          terraform validate

          echo ""
          echo "Terraform configuration is valid."

          echo ""
          echo "=========================================================="
          echo "TERRAFORM VALIDATION COMPLETE"
          echo "=========================================================="


      # ===============================================================
      # STEP 9
      # DISPLAY TERRAFORM STATE
      # ===============================================================

      - name: "Step 9 - Display Current Terraform State"
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "CURRENT TERRAFORM STATE"
          echo "=========================================================="

          STATE_LIST="$(terraform state list 2>/dev/null || true)"

          if [[ -n "$STATE_LIST" ]]; then
            echo ""
            echo "Terraform-managed resources:"
            echo "$STATE_LIST"
          else
            echo ""
            echo "Terraform state is currently empty."
          fi

          echo ""
          echo "=========================================================="
          echo "CURRENT TERRAFORM STATE DISPLAY COMPLETE"
          echo "=========================================================="


      # ===============================================================
      # STEP 10
      # DISCOVER TERRAFORM BACKEND INFORMATION
      # ===============================================================

      - name: "Step 10 - Inspect Terraform Backend"
        id: backend
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "TERRAFORM BACKEND INSPECTION"
          echo "=========================================================="

          BACKEND_FILE=".terraform/terraform.tfstate"

          BACKEND_BUCKET=""

          if [[ -f "$BACKEND_FILE" ]]; then

            BACKEND_BUCKET=$(
              jq -r '
                .backend.config.bucket
                // .backend.config.bucket_name
                // empty
              ' "$BACKEND_FILE" 2>/dev/null || true
            )

          fi

          if [[ -n "$BACKEND_BUCKET" && "$BACKEND_BUCKET" != "null" ]]; then
            echo ""
            echo "Terraform S3 backend bucket detected:"
            echo "  $BACKEND_BUCKET"
          else
            echo ""
            echo "No S3 Terraform backend bucket detected."
          fi

          echo "backend_bucket=$BACKEND_BUCKET" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=========================================================="
          echo "TERRAFORM BACKEND INSPECTION COMPLETE"
          echo "=========================================================="


      # ===============================================================
      # STEP 11
      # DISCOVER CHARLIE CAFE TERRAFORM ECS
      # ===============================================================

      - name: "Step 11 - Discover Charlie Cafe Terraform ECS"
        id: ecs
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "DISCOVER CHARLIE CAFE TERRAFORM ECS"
          echo "=========================================================="

          CLUSTER_ARN=""
          SERVICE_STATUS=""
          SERVICE_NAME=""

          # -----------------------------------------------------------
          # Discover ECS cluster.
          # -----------------------------------------------------------

          CLUSTER_ARN=$(
            aws ecs describe-clusters \
              --clusters "$ECS_CLUSTER_NAME" \
              --region "$AWS_REGION" \
              --query "clusters[0].clusterArn" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )

          if [[ "$CLUSTER_ARN" == "None" || "$CLUSTER_ARN" == "null" ]]; then
            CLUSTER_ARN=""
          fi

          echo ""
          echo "Cluster:"
          echo "  ${CLUSTER_ARN:-NOT_FOUND}"

          # -----------------------------------------------------------
          # Discover ECS service and its current status.
          # -----------------------------------------------------------

          if [[ -n "$CLUSTER_ARN" ]]; then

            SERVICE_STATUS=$(
              aws ecs describe-services \
                --cluster "$CLUSTER_ARN" \
                --services "$ECS_SERVICE_NAME" \
                --region "$AWS_REGION" \
                --query "services[0].status" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )

            if [[ "$SERVICE_STATUS" == "None" || "$SERVICE_STATUS" == "null" ]]; then
              SERVICE_STATUS=""
            fi

            if [[ -n "$SERVICE_STATUS" ]]; then
              SERVICE_NAME="$ECS_SERVICE_NAME"
            fi

          fi

          echo ""
          echo "Service:"
          echo "  ${SERVICE_NAME:-NOT_FOUND}"

          echo ""
          echo "Service status:"
          echo "  ${SERVICE_STATUS:-NOT_FOUND}"

          echo "cluster=$CLUSTER_ARN" >> "$GITHUB_OUTPUT"
          echo "service=$SERVICE_NAME" >> "$GITHUB_OUTPUT"
          echo "status=$SERVICE_STATUS" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=========================================================="
          echo "ECS DISCOVERY COMPLETE"
          echo "=========================================================="


      # ===============================================================
      # STEP 12
      # STOP ECS SERVICE SAFELY
      # ===============================================================

      - name: "Step 12 - Stop ECS Service Safely"
        if: steps.ecs.outputs.cluster != '' && steps.ecs.outputs.service != ''
        shell: bash
        run: |
          set -euo pipefail

          CLUSTER="${{ steps.ecs.outputs.cluster }}"
          SERVICE="${{ steps.ecs.outputs.service }}"

          echo "=========================================================="
          echo "STOP ECS SERVICE SAFELY"
          echo "=========================================================="

          CURRENT_STATUS=$(
            aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --region "$AWS_REGION" \
              --query "services[0].status" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )

          if [[ "$CURRENT_STATUS" == "None" || "$CURRENT_STATUS" == "null" || -z "$CURRENT_STATUS" ]]; then
            echo ""
            echo "ECS service no longer exists."
            echo "Nothing to stop."
            exit 0
          fi

          echo ""
          echo "Current ECS service status:"
          echo "  $CURRENT_STATUS"

          if [[ "$CURRENT_STATUS" == "ACTIVE" ]]; then

            echo ""
            echo "ECS service is ACTIVE."
            echo "Setting desired count to 0..."

            aws ecs update-service \
              --cluster "$CLUSTER" \
              --service "$SERVICE" \
              --desired-count 0 \
              --region "$AWS_REGION" \
              --no-cli-pager

            echo ""
            echo "ECS desired count successfully set to zero."
            exit 0

          fi

          if [[ "$CURRENT_STATUS" == "DRAINING" ]]; then
            echo ""
            echo "ECS service is already DRAINING."
            echo "No update-service operation is required."
            exit 0
          fi

          if [[ "$CURRENT_STATUS" == "INACTIVE" ]]; then
            echo ""
            echo "ECS service is already INACTIVE."
            echo "The service is already deleted."
            exit 0
          fi

          echo ""
          echo "Unexpected ECS service status:"
          echo "  $CURRENT_STATUS"

          echo ""
          echo "Cleanup will continue without calling update-service."


      # ===============================================================
      # STEP 13
      # WAIT FOR ECS TASKS
      # ===============================================================

      - name: "Step 13 - Wait For ECS Tasks"
        if: steps.ecs.outputs.cluster != '' && steps.ecs.outputs.service != ''
        shell: bash
        run: |
          set -euo pipefail

          CLUSTER="${{ steps.ecs.outputs.cluster }}"
          SERVICE="${{ steps.ecs.outputs.service }}"

          echo "=========================================================="
          echo "WAIT FOR ECS TASKS"
          echo "=========================================================="

          for ATTEMPT in $(seq 1 "$ECS_WAIT_ATTEMPTS"); do

            RESPONSE=$(
              aws ecs describe-services \
                --cluster "$CLUSTER" \
                --services "$SERVICE" \
                --region "$AWS_REGION" \
                --output json \
                --no-cli-pager \
                2>/dev/null || true
            )

            if [[ -z "$RESPONSE" || "$RESPONSE" == "{}" ]]; then
              echo ""
              echo "ECS service is no longer discoverable."
              echo "No ECS tasks require waiting."
              exit 0
            fi

            STATUS=$(
              echo "$RESPONSE" |
              jq -r '.services[0].status // empty'
            )

            if [[ "$STATUS" == "INACTIVE" || -z "$STATUS" ]]; then
              echo ""
              echo "ECS service is INACTIVE or no longer exists."
              exit 0
            fi

            RUNNING=$(
              echo "$RESPONSE" |
              jq -r '.services[0].runningCount // 0'
            )

            if [[ "$RUNNING" == "null" || -z "$RUNNING" ]]; then
              RUNNING="0"
            fi

            echo ""
            echo "Attempt: $ATTEMPT / $ECS_WAIT_ATTEMPTS"
            echo "Service status: $STATUS"
            echo "Running ECS tasks: $RUNNING"

            if [[ "$RUNNING" == "0" ]]; then
              echo ""
              echo "All ECS tasks have stopped."
              exit 0
            fi

            sleep 10

          done

          echo ""
          echo "ERROR: ECS tasks did not stop within the allowed time."
          exit 1


      # ===============================================================
      # STEP 14
      # DELETE ECS SERVICE SAFELY
      # ===============================================================

      - name: "Step 14 - Delete ECS Service Safely"
        if: steps.ecs.outputs.cluster != '' && steps.ecs.outputs.service != ''
        shell: bash
        run: |
          set -euo pipefail

          CLUSTER="${{ steps.ecs.outputs.cluster }}"
          SERVICE="${{ steps.ecs.outputs.service }}"

          echo "=========================================================="
          echo "DELETE ECS SERVICE SAFELY"
          echo "=========================================================="

          CURRENT_STATUS=$(
            aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --region "$AWS_REGION" \
              --query "services[0].status" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )

          if [[ "$CURRENT_STATUS" == "None" || "$CURRENT_STATUS" == "null" || -z "$CURRENT_STATUS" ]]; then
            echo ""
            echo "ECS service does not exist."
            echo "Service deletion is already complete."
            exit 0
          fi

          echo ""
          echo "Current service status:"
          echo "  $CURRENT_STATUS"

          if [[ "$CURRENT_STATUS" == "INACTIVE" ]]; then
            echo ""
            echo "ECS service is already INACTIVE."
            echo "Nothing to delete."
            exit 0
          fi

          if [[ "$CURRENT_STATUS" == "DRAINING" ]]; then
            echo ""
            echo "ECS service is already DRAINING."
            echo "Waiting for deletion to complete..."
          else

            if [[ "$CURRENT_STATUS" == "ACTIVE" ]]; then

              echo ""
              echo "ECS service is ACTIVE."
              echo "Deleting ECS service..."

              aws ecs delete-service \
                --cluster "$CLUSTER" \
                --service "$SERVICE" \
                --force \
                --region "$AWS_REGION" \
                --no-cli-pager

            else

              echo ""
              echo "Unexpected status: $CURRENT_STATUS"
              echo "Attempting deletion anyway..."

              aws ecs delete-service \
                --cluster "$CLUSTER" \
                --service "$SERVICE" \
                --force \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            fi

          fi

          for ATTEMPT in $(seq 1 "$ECS_WAIT_ATTEMPTS"); do

            RESPONSE=$(
              aws ecs describe-services \
                --cluster "$CLUSTER" \
                --services "$SERVICE" \
                --region "$AWS_REGION" \
                --output json \
                --no-cli-pager \
                2>/dev/null || true
            )

            if [[ -z "$RESPONSE" || "$RESPONSE" == "{}" ]]; then
              echo ""
              echo "ECS service is no longer discoverable."
              echo "Service deletion verified."
              exit 0
            fi

            STATUS=$(
              echo "$RESPONSE" |
              jq -r '.services[0].status // empty'
            )

            echo ""
            echo "Attempt: $ATTEMPT / $ECS_WAIT_ATTEMPTS"
            echo "Service status: ${STATUS:-NOT_FOUND}"

            if [[ -z "$STATUS" || "$STATUS" == "null" ]]; then
              echo ""
              echo "ECS service no longer exists."
              exit 0
            fi

            if [[ "$STATUS" == "INACTIVE" ]]; then
              echo ""
              echo "ECS service reached INACTIVE."
              echo "ECS service deletion verified."
              exit 0
            fi

            sleep 10

          done

          echo ""
          echo "ERROR: ECS service deletion timed out."
          exit 1


      # ===============================================================
      # STEP 15
      # DELETE ECS CLUSTER SAFELY
      # ===============================================================

      - name: "Step 15 - Delete ECS Cluster Safely"
        if: steps.ecs.outputs.cluster != ''
        shell: bash
        run: |
          set -euo pipefail

          CLUSTER="${{ steps.ecs.outputs.cluster }}"

          echo "=========================================================="
          echo "DELETE ECS CLUSTER SAFELY"
          echo "=========================================================="

          RESPONSE=$(
            aws ecs describe-clusters \
              --clusters "$CLUSTER" \
              --region "$AWS_REGION" \
              --output json \
              --no-cli-pager \
              2>/dev/null || true
          )

          if [[ -z "$RESPONSE" || "$RESPONSE" == "{}" ]]; then
            echo ""
            echo "ECS cluster no longer exists."
            exit 0
          fi

          STATUS=$(
            echo "$RESPONSE" |
            jq -r '.clusters[0].status // empty'
          )

          echo ""
          echo "Cluster status:"
          echo "  ${STATUS:-NOT_FOUND}"

          if [[ -z "$STATUS" || "$STATUS" == "null" ]]; then
            echo ""
            echo "ECS cluster is not discoverable."
            exit 0
          fi

          if [[ "$STATUS" == "INACTIVE" ]]; then
            echo ""
            echo "ECS cluster is already INACTIVE."
            echo "Cluster deletion is already complete."
            exit 0
          fi

          echo ""
          echo "Deleting ECS cluster..."

          aws ecs delete-cluster \
            --cluster "$CLUSTER" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            2>/dev/null || true

          echo ""
          echo "Waiting for ECS cluster deletion..."

          for ATTEMPT in $(seq 1 "$ECS_WAIT_ATTEMPTS"); do

            RESPONSE=$(
              aws ecs describe-clusters \
                --clusters "$CLUSTER" \
                --region "$AWS_REGION" \
                --output json \
                --no-cli-pager \
                2>/dev/null || true
            )

            if [[ -z "$RESPONSE" || "$RESPONSE" == "{}" ]]; then
              echo ""
              echo "ECS cluster is no longer discoverable."
              exit 0
            fi

            STATUS=$(
              echo "$RESPONSE" |
              jq -r '.clusters[0].status // empty'
            )

            echo ""
            echo "Attempt: $ATTEMPT / $ECS_WAIT_ATTEMPTS"
            echo "Cluster status: ${STATUS:-NOT_FOUND}"

            if [[ -z "$STATUS" || "$STATUS" == "null" || "$STATUS" == "INACTIVE" ]]; then
              echo ""
              echo "ECS cluster deletion verified."
              exit 0
            fi

            sleep 10

          done

          echo ""
          echo "ERROR: ECS cluster deletion timed out."
          exit 1


      # ===============================================================
      # STEP 16
      # DISCOVER ECR
      # ===============================================================

      - name: "Step 16 - Discover ECR Repository"
        id: ecr
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "DISCOVER ECR REPOSITORY"
          echo "=========================================================="

          REPOSITORY=$(
            aws ecr describe-repositories \
              --repository-names "$ECR_REPOSITORY_NAME" \
              --region "$AWS_REGION" \
              --query "repositories[0].repositoryName" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )

          if [[ "$REPOSITORY" == "None" || "$REPOSITORY" == "null" ]]; then
            REPOSITORY=""
          fi

          echo ""
          echo "ECR repository:"
          echo "  ${REPOSITORY:-NOT_FOUND}"

          echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"


      # ===============================================================
      # STEP 17
      # DELETE ECR REPOSITORY
      # ===============================================================

      - name: "Step 17 - Delete ECR Repository"
        if: steps.ecr.outputs.repository != ''
        shell: bash
        run: |
          set -euo pipefail

          REPOSITORY="${{ steps.ecr.outputs.repository }}"

          echo "=========================================================="
          echo "DELETE ECR REPOSITORY"
          echo "=========================================================="

          aws ecr delete-repository \
            --repository-name "$REPOSITORY" \
            --force \
            --region "$AWS_REGION" \
            --no-cli-pager \
            2>/dev/null || true

          echo ""
          echo "ECR repository deletion requested."


      # ===============================================================
      # STEP 18
      # DISCOVER TERRAFORM RDS INSTANCES
      # ===============================================================

      - name: "Step 18 - Discover Terraform RDS Instances"
        id: rds
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "DISCOVER TERRAFORM RDS RESOURCES"
          echo "=========================================================="

          RDS_IDS=""

          STATE_LIST="$(terraform state list 2>/dev/null || true)"

          while IFS= read -r RESOURCE; do

            [[ -z "$RESOURCE" ]] && continue

            if [[ "$RESOURCE" =~ (^|\.)aws_db_instance\. ]]; then

              DB_IDENTIFIER=$(
                terraform state show "$RESOURCE" 2>/dev/null |
                awk -F' = ' '$1 == "identifier" {print $2; exit}' |
                tr -d '"'
              )

              if [[ -z "$DB_IDENTIFIER" ]]; then

                DB_IDENTIFIER=$(
                  terraform state show "$RESOURCE" 2>/dev/null |
                  awk -F' = ' '$1 == "id" {print $2; exit}' |
                  tr -d '"'
                )

              fi

              if [[ -n "$DB_IDENTIFIER" ]]; then

                echo ""
                echo "RDS instance:"
                echo "  $DB_IDENTIFIER"

                RDS_IDS="$RDS_IDS $DB_IDENTIFIER"

              fi

            fi

          done <<< "$STATE_LIST"

          RDS_IDS="$(echo "$RDS_IDS" | xargs || true)"

          echo ""
          echo "RDS instances:"
          echo "${RDS_IDS:-NONE}"

          echo "instances=$RDS_IDS" >> "$GITHUB_OUTPUT"


      # ===============================================================
      # STEP 19
      # DISABLE RDS DELETION PROTECTION
      # ===============================================================

      - name: "Step 19 - Disable RDS Deletion Protection"
        if: steps.rds.outputs.instances != ''
        shell: bash
        run: |
          set -euo pipefail

          RDS_IDS="${{ steps.rds.outputs.instances }}"

          echo "=========================================================="
          echo "RDS DELETION PROTECTION"
          echo "=========================================================="

          for DB_IDENTIFIER in $RDS_IDS; do

            PROTECTION=$(
              aws rds describe-db-instances \
                --db-instance-identifier "$DB_IDENTIFIER" \
                --region "$AWS_REGION" \
                --query "DBInstances[0].DeletionProtection" \
                --output text \
                --no-cli-pager \
                2>/dev/null || echo "NOT_FOUND"
            )

            echo ""
            echo "RDS instance:"
            echo "  $DB_IDENTIFIER"

            echo "Deletion protection:"
            echo "  $PROTECTION"

            if [[ "$PROTECTION" == "True" ]]; then

              echo ""
              echo "Disabling deletion protection..."

              aws rds modify-db-instance \
                --db-instance-identifier "$DB_IDENTIFIER" \
                --no-deletion-protection \
                --apply-immediately \
                --region "$AWS_REGION" \
                --no-cli-pager

              echo ""
              echo "Deletion protection modification requested."

            elif [[ "$PROTECTION" == "NOT_FOUND" || "$PROTECTION" == "None" ]]; then

              echo ""
              echo "RDS instance is already gone."

            else

              echo ""
              echo "RDS deletion protection is already disabled."

            fi

          done


      # ===============================================================
      # STEP 20
      # DISCOVER TERRAFORM S3 BUCKETS
      # ===============================================================

      - name: "Step 20 - Discover Terraform S3 Buckets"
        id: s3
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "DISCOVER TERRAFORM S3 BUCKETS"
          echo "=========================================================="

          BUCKETS=""

          STATE_LIST="$(terraform state list 2>/dev/null || true)"

          while IFS= read -r RESOURCE; do

            [[ -z "$RESOURCE" ]] && continue

            if [[ "$RESOURCE" =~ (^|\.)aws_s3_bucket\. ||
                  "$RESOURCE" =~ (^|\.)aws_s3_bucket_v2\. ]]; then

              BUCKET_NAME=$(
                terraform state show "$RESOURCE" 2>/dev/null |
                awk -F' = ' '$1 == "bucket" {print $2; exit}' |
                tr -d '"'
              )

              if [[ -n "$BUCKET_NAME" ]]; then

                echo ""
                echo "S3 bucket:"
                echo "  $BUCKET_NAME"

                BUCKETS="$BUCKETS $BUCKET_NAME"

              fi

            fi

          done <<< "$STATE_LIST"

          BUCKETS="$(echo "$BUCKETS" | xargs || true)"

          echo ""
          echo "Terraform S3 buckets:"
          echo "${BUCKETS:-NONE}"

          echo "buckets=$BUCKETS" >> "$GITHUB_OUTPUT"


      # ===============================================================
      # STEP 21
      # EMPTY TERRAFORM S3 BUCKETS
      # ===============================================================

      - name: "Step 21 - Empty Terraform S3 Buckets"
        if: steps.s3.outputs.buckets != ''
        shell: bash
        run: |
          set -euo pipefail

          BUCKETS="${{ steps.s3.outputs.buckets }}"
          BACKEND_BUCKET="${{ steps.backend.outputs.backend_bucket }}"

          echo "=========================================================="
          echo "EMPTY TERRAFORM S3 BUCKETS"
          echo "=========================================================="

          for BUCKET in $BUCKETS; do

            echo ""
            echo "Bucket:"
            echo "  $BUCKET"

            if [[ -n "$BACKEND_BUCKET" && "$BUCKET" == "$BACKEND_BUCKET" ]]; then

              echo ""
              echo "IMPORTANT:"
              echo "This bucket is the Terraform backend bucket."
              echo "It will NOT be emptied by this workflow."

              continue

            fi

            if ! aws s3api head-bucket \
              --bucket "$BUCKET" \
              2>/dev/null; then

              echo "Bucket does not exist."
              continue

            fi

            echo ""
            echo "Removing normal S3 objects..."

            aws s3 rm \
              "s3://$BUCKET" \
              --recursive \
              --region "$AWS_REGION" \
              2>/dev/null || true

            for LOOP in $(seq 1 100); do

              DATA=$(
                aws s3api list-object-versions \
                  --bucket "$BUCKET" \
                  --region "$AWS_REGION" \
                  --output json \
                  --no-cli-pager
              )

              TOTAL=$(
                echo "$DATA" |
                jq '
                  ((.Versions // []) + (.DeleteMarkers // []))
                  | length
                '
              )

              echo ""
              echo "S3 cleanup pass: $LOOP"
              echo "Objects/versions/delete-markers: $TOTAL"

              if [[ "$TOTAL" -eq 0 ]]; then

                echo ""
                echo "S3 bucket is empty."
                break

              fi

              echo "$DATA" |
                jq '
                  {
                    Objects:
                      (
                        ((.Versions // []) + (.DeleteMarkers // []))
                        | map({
                            Key: .Key,
                            VersionId: .VersionId
                          })
                        | .[0:1000]
                      ),
                    Quiet: true
                  }
                ' \
                > /tmp/s3-delete.json

              aws s3api delete-objects \
                --bucket "$BUCKET" \
                --delete file:///tmp/s3-delete.json \
                --region "$AWS_REGION" \
                --no-cli-pager

              if [[ "$LOOP" -eq 100 ]]; then

                echo ""
                echo "ERROR: S3 bucket could not be emptied."
                exit 1

              fi

            done

          done


      # ===============================================================
      # STEP 22
      # GENERATE TERRAFORM DESTROY PLAN
      # ===============================================================

      - name: "Step 22 - Generate Terraform Destroy Plan"
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "TERRAFORM DESTROY PLAN"
          echo "=========================================================="

          terraform plan \
            -destroy \
            -input=false \
            -no-color

          echo ""
          echo "Terraform destroy plan completed."


      # ===============================================================
      # STEP 23
      # EXECUTE TERRAFORM DESTROY
      # ===============================================================

      - name: "Step 23 - Execute Terraform Destroy"
        id: terraform_destroy
        continue-on-error: true
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "TERRAFORM DESTROY"
          echo "=========================================================="

          terraform destroy \
            -auto-approve \
            -input=false \
            -no-color

          echo ""
          echo "Terraform destroy completed successfully."


      # ===============================================================
      # STEP 24
      # RECOVERY CLEANUP
      # ===============================================================

      - name: "Step 24 - Terraform Destroy Recovery Cleanup"
        if: steps.terraform_destroy.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "TERRAFORM DESTROY RECOVERY CLEANUP"
          echo "=========================================================="

          echo ""
          echo "The first Terraform destroy attempt reported a failure."
          echo ""
          echo "The workflow will re-check Charlie Cafe Terraform ECS resources."
          echo ""

          CLUSTER_ARN=$(
            aws ecs describe-clusters \
              --clusters "$ECS_CLUSTER_NAME" \
              --region "$AWS_REGION" \
              --query "clusters[0].clusterArn" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )

          if [[ "$CLUSTER_ARN" == "None" || "$CLUSTER_ARN" == "null" ]]; then
            CLUSTER_ARN=""
          fi

          if [[ -z "$CLUSTER_ARN" ]]; then

            echo ""
            echo "Charlie Cafe Terraform ECS cluster is already absent."
            echo "No ECS recovery cleanup required."
            exit 0

          fi

          echo ""
          echo "ECS cluster:"
          echo "  $CLUSTER_ARN"

          SERVICE_STATUS=$(
            aws ecs describe-services \
              --cluster "$CLUSTER_ARN" \
              --services "$ECS_SERVICE_NAME" \
              --region "$AWS_REGION" \
              --query "services[0].status" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )

          if [[ "$SERVICE_STATUS" == "None" ||
                "$SERVICE_STATUS" == "null" ||
                -z "$SERVICE_STATUS" ]]; then

            echo ""
            echo "Charlie Cafe Terraform ECS service is already absent."

          else

            echo ""
            echo "Current ECS service status:"
            echo "  $SERVICE_STATUS"

            if [[ "$SERVICE_STATUS" == "ACTIVE" ]]; then

              echo ""
              echo "Setting ECS desired count to zero..."

              aws ecs update-service \
                --cluster "$CLUSTER_ARN" \
                --service "$ECS_SERVICE_NAME" \
                --desired-count 0 \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            fi

            if [[ "$SERVICE_STATUS" == "ACTIVE" ]]; then

              echo ""
              echo "Deleting ECS service..."

              aws ecs delete-service \
                --cluster "$CLUSTER_ARN" \
                --service "$ECS_SERVICE_NAME" \
                --force \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            fi

          fi

          echo ""
          echo "ECS recovery cleanup completed."


      # ===============================================================
      # STEP 25
      # RETRY TERRAFORM DESTROY
      # ===============================================================

      - name: "Step 25 - Retry Terraform Destroy"
        if: steps.terraform_destroy.outcome == 'failure'
        id: terraform_destroy_retry
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "RETRY TERRAFORM DESTROY"
          echo "=========================================================="

          terraform destroy \
            -auto-approve \
            -input=false \
            -no-color

          echo ""
          echo "Terraform destroy retry completed successfully."


      # ===============================================================
      # STEP 26
      # FAIL IF BOTH TERRAFORM DESTROY ATTEMPTS FAILED
      # ===============================================================

      - name: "Step 26 - Confirm Terraform Destroy Result"
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "CONFIRM TERRAFORM DESTROY RESULT"
          echo "=========================================================="

          if [[ "${{ steps.terraform_destroy.outcome }}" == "success" ]]; then

            echo ""
            echo "Primary Terraform destroy succeeded."
            exit 0

          fi

          if [[ "${{ steps.terraform_destroy_retry.outcome }}" == "success" ]]; then

            echo ""
            echo "Terraform destroy retry succeeded."
            exit 0

          fi

          echo ""
          echo "ERROR: Terraform destroy failed."
          echo ""
          echo "Both the primary destroy and recovery retry failed."
          echo ""
          echo "Terraform infrastructure cleanup is incomplete."

          exit 1


      # ===============================================================
      # STEP 27
      # VERIFY TERRAFORM STATE IS EMPTY
      # ===============================================================

      - name: "Step 27 - Verify Terraform State Is Empty"
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "VERIFY TERRAFORM STATE"
          echo "=========================================================="

          STATE_LIST="$(terraform state list 2>/dev/null || true)"

          if [[ -n "$STATE_LIST" ]]; then

            echo ""
            echo "ERROR: Terraform state still contains resources."
            echo ""
            echo "$STATE_LIST"

            exit 1

          fi

          echo ""
          echo "Terraform state is EMPTY."

          echo ""
          echo "=========================================================="
          echo "TERRAFORM STATE VERIFICATION PASSED"
          echo "=========================================================="


      # ===============================================================
      # STEP 28
      # FINAL ECS VERIFICATION
      # ===============================================================

      - name: "Step 28 - Final ECS Verification"
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "FINAL ECS VERIFICATION"
          echo "=========================================================="

          RESPONSE=$(
            aws ecs describe-clusters \
              --clusters "$ECS_CLUSTER_NAME" \
              --region "$AWS_REGION" \
              --output json \
              --no-cli-pager \
              2>/dev/null || true
          )

          if [[ -z "$RESPONSE" || "$RESPONSE" == "{}" ]]; then

            echo ""
            echo "ECS cluster is not found."
            echo "ECS cleanup verified."
            exit 0

          fi

          STATUS=$(
            echo "$RESPONSE" |
            jq -r '.clusters[0].status // empty'
          )

          if [[ -z "$STATUS" || "$STATUS" == "null" ]]; then

            echo ""
            echo "ECS cluster is not found."
            echo "ECS cleanup verified."
            exit 0

          fi

          echo ""
          echo "Final ECS cluster status:"
          echo "  $STATUS"

          if [[ "$STATUS" == "INACTIVE" ]]; then

            echo ""
            echo "ECS cluster is INACTIVE."
            echo "ECS cleanup verified."
            exit 0

          fi

          echo ""
          echo "ERROR: ECS cluster still exists."
          echo "Current status: $STATUS"

          exit 1


      # ===============================================================
      # STEP 29
      # FINAL ECR VERIFICATION
      # ===============================================================

      - name: "Step 29 - Final ECR Verification"
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "FINAL ECR VERIFICATION"
          echo "=========================================================="

          REPOSITORY=$(
            aws ecr describe-repositories \
              --repository-names "$ECR_REPOSITORY_NAME" \
              --region "$AWS_REGION" \
              --query "repositories[0].repositoryName" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )

          if [[ -z "$REPOSITORY" ||
                "$REPOSITORY" == "None" ||
                "$REPOSITORY" == "null" ]]; then

            echo ""
            echo "ECR repository does not exist."
            echo "ECR cleanup verified."
            exit 0

          fi

          echo ""
          echo "ERROR: ECR repository still exists."
          echo "Repository:"
          echo "  $REPOSITORY"

          exit 1


      # ===============================================================
      # STEP 30
      # FINAL S3 VERIFICATION
      # ===============================================================

      - name: "Step 30 - Final S3 Verification"
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "FINAL S3 VERIFICATION"
          echo "=========================================================="

          BUCKETS="${{ steps.s3.outputs.buckets }}"
          BACKEND_BUCKET="${{ steps.backend.outputs.backend_bucket }}"

          if [[ -z "$BUCKETS" ]]; then

            echo ""
            echo "No Terraform-managed S3 buckets were discovered."
            exit 0

          fi

          for BUCKET in $BUCKETS; do

            echo ""
            echo "Checking bucket:"
            echo "  $BUCKET"

            if [[ -n "$BACKEND_BUCKET" && "$BUCKET" == "$BACKEND_BUCKET" ]]; then

              echo ""
              echo "This is the Terraform backend bucket."
              echo "Backend bucket verification is intentionally skipped."

              continue

            fi

            if aws s3api head-bucket \
              --bucket "$BUCKET" \
              2>/dev/null; then

              echo ""
              echo "ERROR: S3 bucket still exists."
              exit 1

            fi

            echo "S3 bucket deleted."

          done

          echo ""
          echo "S3 verification passed."


      # ===============================================================
      # STEP 31
      # FINAL RDS VERIFICATION
      # ===============================================================

      - name: "Step 31 - Final RDS Verification"
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "FINAL RDS VERIFICATION"
          echo "=========================================================="

          STATE_LIST="$(terraform state list 2>/dev/null || true)"

          if echo "$STATE_LIST" |
             grep -Eq '(^|\.)aws_db_instance\.'; then

            echo ""
            echo "ERROR: Terraform still contains an RDS instance."
            echo ""
            echo "$STATE_LIST" |
              grep -E '(^|\.)aws_db_instance\.' || true

            exit 1

          fi

          echo ""
          echo "No Terraform-managed RDS instances remain in state."
          echo "RDS Terraform cleanup verified."


      # ===============================================================
      # STEP 32
      # FINAL EC2 VERIFICATION
      # ===============================================================

      - name: "Step 32 - Final EC2 Verification"
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "FINAL EC2 VERIFICATION"
          echo "=========================================================="

          STATE_LIST="$(terraform state list 2>/dev/null || true)"

          if echo "$STATE_LIST" |
             grep -Eq '(^|\.)aws_instance\.'; then

            echo ""
            echo "ERROR: Terraform still contains EC2 instances."
            echo ""
            echo "$STATE_LIST" |
              grep -E '(^|\.)aws_instance\.' || true

            exit 1

          fi

          echo ""
          echo "No Terraform-managed EC2 instances remain in state."
          echo "EC2 Terraform cleanup verified."


      # ===============================================================
      # STEP 33
      # FINAL TERRAFORM DESTROY PLAN
      # ===============================================================

      - name: "Step 33 - Final Terraform Destroy Plan"
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "FINAL TERRAFORM DESTROY PLAN"
          echo "=========================================================="

          terraform plan \
            -destroy \
            -input=false \
            -no-color

          echo ""
          echo "Final Terraform destroy plan completed."


      # ===============================================================
      # STEP 34
      # FINAL CLEANUP SUCCESS MESSAGE
      # ===============================================================

      - name: "Step 34 - Cleanup Successful"
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo ""
          echo "================================================================"
          echo ""
          echo "             CHARLIE CAFE CLEANUP SUCCESSFUL"
          echo ""
          echo "================================================================"
          echo ""

          echo "AWS Region:"
          echo "  $AWS_REGION"

          echo ""
          echo "Terraform Directory:"
          echo "  $TERRAFORM_WORKING_DIRECTORY"

          echo ""
          echo "Terraform Version:"
          terraform version | head -n 1

          echo ""
          echo "Resources verified:"
          echo "  [OK] Terraform state is empty"
          echo "  [OK] Terraform destroy completed"
          echo "  [OK] ECS service deleted"
          echo "  [OK] ECS cluster deleted"
          echo "  [OK] ECR repository deleted"
          echo "  [OK] Terraform-managed S3 buckets handled"
          echo "  [OK] RDS Terraform resources removed"
          echo "  [OK] EC2 Terraform resources removed"
          echo "  [OK] Final Terraform destroy plan passed"

          echo ""
          echo "================================================================"
          echo ""
          echo "       CHARLIE CAFE AWS TERRAFORM LAB CLEANUP COMPLETE"
          echo ""
          echo "       All expected Terraform-managed lab resources"
          echo "       have been successfully removed."
          echo ""
          echo "================================================================"


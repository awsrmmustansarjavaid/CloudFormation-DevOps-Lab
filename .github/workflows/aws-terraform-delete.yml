# =====================================================================
# CHARLIE CAFE - AWS TERRAFORM DEVOPS LAB
# COMPLETE TERRAFORM DELETE / CLEANUP WORKFLOW
# =====================================================================
#
# File:
#   .github/workflows/aws-terraform-delete.yml
#
# PURPOSE
# ---------------------------------------------------------------------
# Completely destroy the Charlie Cafe AWS DevOps Lab infrastructure
# managed by Terraform.
#
# IMPORTANT:
# ---------------------------------------------------------------------
# This workflow is the TERRAFORM replacement for:
#
#   aws-cloudformation-delete.yml
#
# CloudFormation stack concepts are intentionally NOT used here.
#
# Terraform is now the infrastructure source of truth.
#
#
# MAIN DELETION FLOW
# ---------------------------------------------------------------------
#
#  1. Checkout repository
#  2. Configure AWS credentials
#  3. Verify AWS account
#  4. Install Terraform
#  5. Initialize Terraform
#  6. Validate Terraform configuration
#  7. Display Terraform workspace/state
#  8. Discover Terraform-managed ECS resources
#  9. Stop ECS service
# 10. Wait for ECS tasks
# 11. Discover ECR repository
# 12. Delete ECR images
# 13. Discover EC2 instances from Terraform state
# 14. Clean Docker containers/images/volumes/networks on EC2
# 15. Discover RDS instances
# 16. Disable RDS deletion protection
# 17. Discover Terraform-managed S3 buckets
# 18. Empty versioned S3 buckets
# 19. Run Terraform destroy plan
# 20. Execute Terraform destroy
# 21. If destroy has dependency problems:
#       - retry ECS cleanup
#       - retry ALB cleanup
#       - retry target group cleanup
#       - retry Terraform destroy
# 22. Verify ECS
# 23. Verify ECR
# 24. Verify S3
# 25. Verify EC2
# 26. Verify Terraform state
# 27. Final cleanup summary
#
#
# IMPORTANT TERRAFORM PRINCIPLE
# ---------------------------------------------------------------------
#
# Terraform manages resources through STATE.
#
# CloudFormation:
#
#   Stack
#      |
#      +-- Resources
#
# Terraform:
#
#   Terraform configuration
#      |
#      +-- Terraform state
#              |
#              +-- AWS resources
#
# Therefore we do NOT:
#
#   aws cloudformation delete-stack
#
# Instead we use:
#
#   terraform plan -destroy
#   terraform destroy
#
#
# IMPORTANT:
# ---------------------------------------------------------------------
# terraform destroy only destroys resources managed by the Terraform
# configuration/state being used by this workflow.
#
# It does NOT automatically delete unrelated AWS resources that are
# outside Terraform state.
#
#
# =====================================================================


# =====================================================================
# CHARLIE CAFE - AWS TERRAFORM DEVOPS LAB
# COMPLETE TERRAFORM DELETE / CLEANUP WORKFLOW
# =====================================================================

name: Complete AWS Terraform Lab Cleanup

# =====================================================================
# MANUAL TRIGGER ONLY
# =====================================================================

on:
  workflow_dispatch:

# =====================================================================
# GLOBAL VARIABLES
# =====================================================================

env:
  AWS_REGION: us-east-1

  # IMPORTANT:
  # This MUST be the directory containing your Terraform root module.
  TERRAFORM_WORKING_DIRECTORY: infrastructure/terraform

  TERRAFORM_VERSION: "1.9.8"

  ECS_CLUSTER_NAME: CharlieCafe-Cluster
  ECS_SERVICE_NAME: CharlieCafe-Service

  ECR_REPOSITORY_NAME: charlie-cafe

# =====================================================================
# JOB
# =====================================================================

jobs:

  delete-lab:

    name: Complete AWS Terraform Lab Cleanup

    runs-on: ubuntu-latest

    steps:

      # ================================================================
      # 1. CHECKOUT
      # ================================================================

      - name: "1. Checkout Repository"
        uses: actions/checkout@v4

      # ================================================================
      # 2. AWS CREDENTIALS
      # ================================================================

      - name: "2. Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ================================================================
      # 3. VERIFY AWS ACCOUNT
      # ================================================================

      - name: "3. Verify AWS Account"
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "AWS ACCOUNT VERIFICATION"
          echo "=========================================================="

          aws --version

          echo ""
          echo "AWS Identity:"
          aws sts get-caller-identity

          echo ""
          echo "AWS Region:"
          echo "$AWS_REGION"

          echo ""
          echo "Terraform Directory:"
          echo "$TERRAFORM_WORKING_DIRECTORY"

          echo ""
          echo "=========================================================="
          echo "AWS ACCOUNT VERIFIED"
          echo "=========================================================="

      # ================================================================
      # 4. SETUP TERRAFORM
      # ================================================================

      - name: "4. Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      # ================================================================
      # 5. VERIFY TERRAFORM DIRECTORY
      # ================================================================

      - name: "5. Verify Terraform Directory"
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "VERIFY TERRAFORM DIRECTORY"
          echo "=========================================================="

          if [[ ! -d "$TERRAFORM_WORKING_DIRECTORY" ]]; then
            echo ""
            echo "ERROR: Terraform directory does not exist."
            echo ""
            echo "Expected:"
            echo "  $TERRAFORM_WORKING_DIRECTORY"
            echo ""

            find . -maxdepth 4 -type f | sort

            exit 1
          fi

          echo ""
          echo "Terraform directory:"
          echo "  $TERRAFORM_WORKING_DIRECTORY"

          echo ""
          echo "Terraform files:"

          find "$TERRAFORM_WORKING_DIRECTORY" \
            -maxdepth 2 \
            -type f \
            \( \
              -name "*.tf" \
              -o -name "*.tfvars" \
              -o -name ".terraform.lock.hcl" \
            \) \
            -print | sort

          echo ""
          echo "=========================================================="
          echo "TERRAFORM DIRECTORY VERIFIED"
          echo "=========================================================="

      # ================================================================
      # 6. TERRAFORM INIT
      # ================================================================

      - name: "6. Initialize Terraform"
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "TERRAFORM INIT"
          echo "=========================================================="

          terraform init -input=false

          echo ""
          echo "Terraform initialization completed."

      # ================================================================
      # 7. TERRAFORM VALIDATE
      # ================================================================

      - name: "7. Validate Terraform"
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "TERRAFORM VALIDATION"
          echo "=========================================================="

          terraform validate

          echo ""
          echo "Terraform configuration is valid."

      # ================================================================
      # 8. SHOW CURRENT STATE
      # ================================================================

      - name: "8. Display Terraform State"
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "CURRENT TERRAFORM STATE"
          echo "=========================================================="

          echo ""
          echo "Terraform resources currently managed:"

          terraform state list || true

          echo ""
          echo "=========================================================="

      # ================================================================
      # 9. TERRAFORM DESTROY PLAN
      # ================================================================

      - name: "9. Generate Terraform Destroy Plan"
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "TERRAFORM DESTROY PLAN"
          echo "=========================================================="

          terraform plan \
            -destroy \
            -input=false \
            -no-color

          echo ""
          echo "Destroy plan generated successfully."

      # ================================================================
      # 10. DISCOVER ECS
      # ================================================================

      - name: "10. Discover ECS Resources"
        id: ecs
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "DISCOVER ECS RESOURCES"
          echo "=========================================================="

          CLUSTER_ARN=""

          CLUSTER_ARN=$(
            aws ecs describe-clusters \
              --clusters "$ECS_CLUSTER_NAME" \
              --region "$AWS_REGION" \
              --query "clusters[0].clusterArn" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )

          if [[ "$CLUSTER_ARN" == "None" ]]; then
            CLUSTER_ARN=""
          fi

          echo ""
          echo "Cluster:"
          echo "${CLUSTER_ARN:-NOT_FOUND}"

          SERVICE_NAME=""

          if [[ -n "$CLUSTER_ARN" ]]; then

            SERVICE_STATUS=$(
              aws ecs describe-services \
                --cluster "$CLUSTER_ARN" \
                --services "$ECS_SERVICE_NAME" \
                --region "$AWS_REGION" \
                --query "services[0].status" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )

            if [[ "$SERVICE_STATUS" != "None" && -n "$SERVICE_STATUS" ]]; then
              SERVICE_NAME="$ECS_SERVICE_NAME"
            fi

          fi

          echo ""
          echo "Service:"
          echo "${SERVICE_NAME:-NOT_FOUND}"

          echo "cluster=$CLUSTER_ARN" >> "$GITHUB_OUTPUT"
          echo "service=$SERVICE_NAME" >> "$GITHUB_OUTPUT"

      # ================================================================
      # 11. STOP ECS SERVICE
      # ================================================================

      - name: "11. Stop ECS Service"
        if: steps.ecs.outputs.cluster != '' && steps.ecs.outputs.service != ''
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "STOP ECS SERVICE"
          echo "=========================================================="

          aws ecs update-service \
            --cluster "${{ steps.ecs.outputs.cluster }}" \
            --service "${{ steps.ecs.outputs.service }}" \
            --desired-count 0 \
            --region "$AWS_REGION" \
            --no-cli-pager

          echo ""
          echo "ECS desired count set to zero."

      # ================================================================
      # 12. WAIT FOR ECS TASKS
      # ================================================================

      - name: "12. Wait For ECS Tasks"
        if: steps.ecs.outputs.cluster != '' && steps.ecs.outputs.service != ''
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "WAIT FOR ECS TASKS"
          echo "=========================================================="

          for ATTEMPT in $(seq 1 36); do

            RUNNING=$(
              aws ecs describe-services \
                --cluster "${{ steps.ecs.outputs.cluster }}" \
                --services "${{ steps.ecs.outputs.service }}" \
                --region "$AWS_REGION" \
                --query "services[0].runningCount" \
                --output text \
                --no-cli-pager \
                2>/dev/null || echo "0"
            )

            [[ "$RUNNING" == "None" ]] && RUNNING="0"

            echo "Attempt $ATTEMPT / 36"
            echo "Running tasks: $RUNNING"

            if [[ "$RUNNING" == "0" ]]; then
              echo ""
              echo "All ECS tasks have stopped."
              exit 0
            fi

            sleep 10

          done

          echo ""
          echo "ERROR: ECS tasks did not stop."
          exit 1

      # ================================================================
      # 13. DISCOVER ECR
      # ================================================================

      - name: "13. Discover ECR Repository"
        id: ecr
        shell: bash
        run: |
          set -euo pipefail

          REPOSITORY=$(
            aws ecr describe-repositories \
              --repository-names "$ECR_REPOSITORY_NAME" \
              --region "$AWS_REGION" \
              --query "repositories[0].repositoryName" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )

          [[ "$REPOSITORY" == "None" ]] && REPOSITORY=""

          echo ""
          echo "ECR Repository:"
          echo "${REPOSITORY:-NOT_FOUND}"

          echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"

      # ================================================================
      # 14. DELETE ECR REPOSITORY
      # ================================================================

      - name: "14. Delete ECR Repository"
        if: steps.ecr.outputs.repository != ''
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "DELETE ECR REPOSITORY"
          echo "=========================================================="

          aws ecr delete-repository \
            --repository-name "${{ steps.ecr.outputs.repository }}" \
            --force \
            --region "$AWS_REGION" \
            --no-cli-pager

          echo ""
          echo "ECR repository deletion requested."

      # ================================================================
      # 15. DISABLE RDS DELETION PROTECTION
      # ================================================================

      - name: "15. Disable RDS Deletion Protection"
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "RDS DELETION PROTECTION CHECK"
          echo "=========================================================="

          STATE_LIST="$(terraform state list)"

          while IFS= read -r RESOURCE; do

            [[ -z "$RESOURCE" ]] && continue

            if [[ "$RESOURCE" == aws_db_instance.* ]]; then

              DB_IDENTIFIER=$(
                terraform state show "$RESOURCE" 2>/dev/null |
                awk -F' = ' '$1 == "identifier" {print $2; exit}' |
                tr -d '"'
              )

              if [[ -z "$DB_IDENTIFIER" ]]; then
                continue
              fi

              PROTECTION=$(
                aws rds describe-db-instances \
                  --db-instance-identifier "$DB_IDENTIFIER" \
                  --region "$AWS_REGION" \
                  --query "DBInstances[0].DeletionProtection" \
                  --output text \
                  --no-cli-pager \
                  2>/dev/null || echo "NOT_FOUND"
              )

              echo ""
              echo "RDS: $DB_IDENTIFIER"
              echo "Deletion protection: $PROTECTION"

              if [[ "$PROTECTION" == "True" ]]; then

                aws rds modify-db-instance \
                  --db-instance-identifier "$DB_IDENTIFIER" \
                  --no-deletion-protection \
                  --apply-immediately \
                  --region "$AWS_REGION" \
                  --no-cli-pager

                echo "Deletion protection disabled."

              fi

            fi

          done <<< "$STATE_LIST"

      # ================================================================
      # 16. EMPTY S3 BUCKETS
      # ================================================================

      - name: "16. Empty Terraform S3 Buckets"
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================================="
          echo "EMPTY TERRAFORM S3 BUCKETS"
          echo "=========================================================="

          STATE_LIST="$(terraform state list)"

          while IFS= read -r RESOURCE; do

            [[ -z "$RESOURCE" ]] && continue

            if [[ "$RESOURCE" == aws_s3_bucket.* ]]; then

              BUCKET=$(
                terraform state show "$RESOURCE" 2>/dev/null |
                awk -F' = ' '$1 == "bucket" {print $2; exit}' |
                tr -d '"'
              )

              if [[ -z "$BUCKET" ]]; then
                continue
              fi

              echo ""
              echo "Bucket: $BUCKET"

              aws s3api head-bucket \
                --bucket "$BUCKET" \
                2>/dev/null || continue

              aws s3 rm \
                "s3://$BUCKET" \
                --recursive \
                --region "$AWS_REGION"

              while true; do

                DATA=$(
                  aws s3api list-object-versions \
                    --bucket "$BUCKET" \
                    --region "$AWS_REGION" \
                    --output json \
                    --no-cli-pager
                )

                TOTAL=$(
                  echo "$DATA" |
                  jq '((.Versions // []) + (.DeleteMarkers // [])) | length'
                )

                if [[ "$TOTAL" -eq 0 ]]; then
                  break
                fi

                echo "$DATA" |
                  jq '{
                    Objects:
                    (
                      ((.Versions // []) + (.DeleteMarkers // []))
                      | map({
                          Key: .Key,
                          VersionId: .VersionId
                        })
                      | .[0:1000]
                    ),
                    Quiet: true
                  }' > /tmp/s3-delete.json

                aws s3api delete-objects \
                  --bucket "$BUCKET" \
                  --delete file:///tmp/s3-delete.json \
                  --region "$AWS_REGION" \
                  --no-cli-pager

              done

              echo "S3 bucket is empty."

            fi

          done <<< "$STATE_LIST"

      # ================================================================
      # 17. TERRAFORM DESTROY
      # ================================================================

      - name: "17. Execute Terraform Destroy"
        id: destroy
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set +e

          echo "=========================================================="
          echo "TERRAFORM DESTROY"
          echo "=========================================================="

          terraform destroy \
            -auto-approve \
            -input=false \
            -no-color

          EXIT_CODE=$?

          echo ""
          echo "Terraform destroy exit code: $EXIT_CODE"

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          exit 0

      # ================================================================
      # 18. FINAL TERRAFORM STATE
      # ================================================================

      - name: "18. Verify Final Terraform State"
        id: terraform_verify
        if: always()
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set +e

          echo "=========================================================="
          echo "FINAL TERRAFORM STATE VERIFICATION"
          echo "=========================================================="

          STATE_OUTPUT="$(terraform state list 2>/dev/null)"
          STATE_EXIT=$?

          echo ""
          echo "Terraform state:"

          if [[ -n "$STATE_OUTPUT" ]]; then
            echo "$STATE_OUTPUT"
          else
            echo "EMPTY"
          fi

          if [[ $STATE_EXIT -ne 0 ]]; then
            echo ""
            echo "ERROR: Unable to read Terraform state."
            echo "state_empty=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$STATE_OUTPUT" ]]; then
            echo ""
            echo "Terraform state is EMPTY."
            echo "state_empty=true" >> "$GITHUB_OUTPUT"
          else
            echo ""
            echo "ERROR: Terraform still contains resources."
            echo "state_empty=false" >> "$GITHUB_OUTPUT"
          fi

      # ================================================================
      # 19. VERIFY ECS
      # ================================================================

      - name: "19. Verify ECS Is Deleted"
        id: verify_ecs
        if: always()
        shell: bash
        run: |
          set +e

          echo "=========================================================="
          echo "VERIFY ECS DELETION"
          echo "=========================================================="

          CLUSTER_STATUS=$(
            aws ecs describe-clusters \
              --clusters "$ECS_CLUSTER_NAME" \
              --region "$AWS_REGION" \
              --query "clusters[0].status" \
              --output text \
              --no-cli-pager \
              2>/dev/null
          )

          if [[ -z "$CLUSTER_STATUS" || "$CLUSTER_STATUS" == "None" ]]; then
            echo "ECS cluster does not exist."
            echo "deleted=true" >> "$GITHUB_OUTPUT"
          else
            echo ""
            echo "ERROR: ECS cluster still exists."
            echo "Status: $CLUSTER_STATUS"
            echo "deleted=false" >> "$GITHUB_OUTPUT"
          fi

      # ================================================================
      # 20. VERIFY ECR
      # ================================================================

      - name: "20. Verify ECR Is Deleted"
        id: verify_ecr
        if: always()
        shell: bash
        run: |
          set +e

          echo "=========================================================="
          echo "VERIFY ECR DELETION"
          echo "=========================================================="

          REPOSITORY=$(
            aws ecr describe-repositories \
              --repository-names "$ECR_REPOSITORY_NAME" \
              --region "$AWS_REGION" \
              --query "repositories[0].repositoryName" \
              --output text \
              --no-cli-pager \
              2>/dev/null
          )

          if [[ -z "$REPOSITORY" || "$REPOSITORY" == "None" ]]; then
            echo "ECR repository does not exist."
            echo "deleted=true" >> "$GITHUB_OUTPUT"
          else
            echo ""
            echo "ERROR: ECR repository still exists."
            echo "Repository: $REPOSITORY"
            echo "deleted=false" >> "$GITHUB_OUTPUT"
          fi

      # ================================================================
      # 21. FINAL TERRAFORM DESTROY PLAN
      # ================================================================

      - name: "21. Final Terraform Destroy Plan"
        id: final_plan
        if: always()
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set +e

          echo "=========================================================="
          echo "FINAL TERRAFORM DESTROY PLAN"
          echo "=========================================================="

          terraform plan \
            -destroy \
            -input=false \
            -no-color

          PLAN_EXIT=$?

          echo ""
          echo "Final Terraform destroy plan exit code:"
          echo "$PLAN_EXIT"

          echo "plan_exit=$PLAN_EXIT" >> "$GITHUB_OUTPUT"

      # ================================================================
      # 22. FINAL SUCCESS / FAILURE GATE
      # ================================================================

      - name: "22. Final Cleanup Verification"
        if: always()
        shell: bash
        run: |

          echo ""
          echo "================================================================"
          echo "              CHARLIE CAFE AWS CLEANUP"
          echo "                 FINAL VERIFICATION"
          echo "================================================================"

          DESTROY_EXIT="${{ steps.destroy.outputs.exit_code }}"
          STATE_EMPTY="${{ steps.terraform_verify.outputs.state_empty }}"
          ECS_DELETED="${{ steps.verify_ecs.outputs.deleted }}"
          ECR_DELETED="${{ steps.verify_ecr.outputs.deleted }}"
          PLAN_EXIT="${{ steps.final_plan.outputs.plan_exit }}"

          echo ""
          echo "Terraform destroy exit code : ${DESTROY_EXIT:-UNKNOWN}"
          echo "Terraform state empty       : ${STATE_EMPTY:-UNKNOWN}"
          echo "ECS deleted                 : ${ECS_DELETED:-UNKNOWN}"
          echo "ECR deleted                 : ${ECR_DELETED:-UNKNOWN}"
          echo "Final destroy plan exit     : ${PLAN_EXIT:-UNKNOWN}"

          echo ""
          echo "================================================================"
          echo "                    CLEANUP RESULT"
          echo "================================================================"

          if [[ "$DESTROY_EXIT" != "0" ]]; then
            echo ""
            echo "❌ CLEANUP FAILED"
            echo ""
            echo "Terraform destroy did not complete successfully."
            exit 1
          fi

          if [[ "$STATE_EMPTY" != "true" ]]; then
            echo ""
            echo "❌ CLEANUP FAILED"
            echo ""
            echo "Terraform state still contains resources."
            exit 1
          fi

          if [[ "$ECS_DELETED" != "true" ]]; then
            echo ""
            echo "❌ CLEANUP FAILED"
            echo ""
            echo "ECS resources still exist."
            exit 1
          fi

          if [[ "$ECR_DELETED" != "true" ]]; then
            echo ""
            echo "❌ CLEANUP FAILED"
            echo ""
            echo "ECR repository still exists."
            exit 1
          fi

          echo ""
          echo "================================================================"
          echo "                 🎉 CLEANUP SUCCESSFUL 🎉"
          echo "================================================================"

          echo ""
          echo "All Terraform-managed infrastructure has been destroyed."
          echo "Terraform state is empty."
          echo "ECS verification passed."
          echo "ECR verification passed."
          echo ""
          echo "Charlie Cafe AWS Terraform Lab cleanup completed successfully."
          echo ""
          echo "================================================================"
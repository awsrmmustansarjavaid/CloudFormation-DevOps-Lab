# =====================================================================
# CHARLIE CAFE - AWS TERRAFORM DEVOPS LAB
# COMPLETE TERRAFORM + AWS ORPHAN CLEANUP WORKFLOW
# =====================================================================
#
# File:
#   .github/workflows/aws-terraform-delete.yml
#
# PURPOSE
# ---------------------------------------------------------------------
#
# This workflow completely removes the Charlie Cafe Terraform lab
# infrastructure from AWS.
#
# The cleanup process has TWO independent mechanisms:
#
#   1. Terraform state/configuration cleanup
#      -> terraform destroy
#
#   2. AWS-side orphan cleanup
#      -> AWS resource discovery + explicit cleanup
#
# NEW FINAL SAFETY NET
# ---------------------------------------------------------------------
#
# A SECOND INDEPENDENT JOB is added at the end:
#
#   final-aws-resource-sweep
#
# This job:
#
#   - Runs even when the main cleanup job fails.
#   - Does NOT depend on Terraform state.
#   - Performs another AWS-side cleanup pass.
#   - Handles multiple matching resource names.
#   - Cleans dependencies before attempting VPC deletion.
#
# FINAL SWEEP TARGETS
# ---------------------------------------------------------------------
#
#   1. VPC
#   2. S3
#   3. EC2
#   4. VPC Endpoints
#   5. RDS
#   6. ECS
#   7. ECR
#   8. Application Load Balancers
#   9. Target Groups
#
# Additional dependency cleanup is also performed where necessary:
#
#   - NAT Gateways
#   - Elastic IPs
#   - Network Interfaces
#   - Security Groups
#   - Subnets
#   - Route Tables
#   - Internet Gateways
#   - EFS mount targets/filesystems
#
# =====================================================================
# SAFETY MODEL
# =====================================================================
#
# The normal cleanup remains primarily restricted to:
#
#   Project = CharlieCafe-TF-Lab
#
# Known Charlie Cafe names/prefixes are also used.
#
# IMPORTANT:
#
# S3 is intentionally different because the user requested cleanup
# equivalent to:
#
#   starts_with(Name, 'terraform-')
#
# Therefore ALL terraform-* buckets are candidates.
#
# The Terraform backend bucket is protected when it can be detected.
#
# =====================================================================
# IMPORTANT
# =====================================================================
#
# THIS WORKFLOW IS DESTRUCTIVE.
#
# The workflow requires:
#
#   DELETE
#
# before cleanup proceeds.
#
# =====================================================================

name: Complete AWS Terraform Lab Cleanup

# =====================================================================
# MANUAL TRIGGER
# =====================================================================

on:
  workflow_dispatch:
    inputs:

      # ---------------------------------------------------------------
      # Destructive-operation confirmation.
      # ---------------------------------------------------------------

      confirmation:
        description: "Type DELETE to permanently destroy Charlie Cafe Terraform AWS infrastructure"
        required: true
        type: string
        default: ""

      # ---------------------------------------------------------------
      # Optional AWS orphan cleanup.
      #
      # true:
      #   Terraform destroy + AWS orphan cleanup
      #
      # false:
      #   Terraform destroy only
      # ---------------------------------------------------------------

      cleanup_orphans:
        description: "Also remove Terraform-created AWS resources that are missing from Terraform state"
        required: true
        type: choice
        options:
          - "true"
          - "false"
        default: "true"

# =====================================================================
# GLOBAL VARIABLES
# =====================================================================

env:

  # -------------------------------------------------------------------
  # AWS REGION
  # -------------------------------------------------------------------

  AWS_REGION: us-east-1

  # -------------------------------------------------------------------
  # TERRAFORM WORKING DIRECTORY
  # -------------------------------------------------------------------

  TERRAFORM_WORKING_DIRECTORY: infrastructure/terraform

  # -------------------------------------------------------------------
  # TERRAFORM VERSION
  # -------------------------------------------------------------------

  TERRAFORM_VERSION: "1.9.8"

  # -------------------------------------------------------------------
  # PRIMARY PROJECT SAFETY TAG
  # -------------------------------------------------------------------

  PROJECT_TAG_KEY: Project
  PROJECT_TAG_VALUE: CharlieCafe-TF-Lab

  # -------------------------------------------------------------------
  # TERRAFORM TAG
  # -------------------------------------------------------------------

  TERRAFORM_TAG_KEY: Terraform
  TERRAFORM_TAG_VALUE: "true"

  # -------------------------------------------------------------------
  # MANAGED-BY TAG
  # -------------------------------------------------------------------

  MANAGED_BY_TAG_KEY: ManagedBy
  MANAGED_BY_TAG_VALUE: Terraform

  # -------------------------------------------------------------------
  # KNOWN CHARLIE CAFE RESOURCE NAMES
  # -------------------------------------------------------------------

  VPC_NAME: CharlieCafe-TF-Lab-VPC

  ALB_NAME: CharlieCafe-TF-ALB

  TARGET_GROUP_NAME: CharlieCafe-TF-TG

  ECS_CLUSTER_NAME: CharlieCafe-TF-Cluster

  ECS_SERVICE_NAME: CharlieCafe-TF-Service

  ECR_REPOSITORY_NAME: charlie-cafe-tf

  ECS_TASK_FAMILY: charlie-cafe-tf

  RDS_IDENTIFIER: charliecafe-tf-mysql

  RDS_SUBNET_GROUP: charliecafe-tf-rds-subnet-group

  EFS_NAME: CharlieCafe-TF-EFS

  LOG_GROUP_NAME: /ecs/charlie-cafe-tf

  DYNAMODB_TABLE_NAME: CafeOrders-TF

  SECRET_NAME: CharlieCafe-TF-DB-Secret

  # -------------------------------------------------------------------
  # WAIT CONFIGURATION
  # -------------------------------------------------------------------

  WAIT_ATTEMPTS: "60"

  WAIT_SECONDS: "10"

# =====================================================================
# JOBS
# =====================================================================

jobs:

  # ===================================================================
  # MAIN TERRAFORM + AWS CLEANUP JOB
  #
  # YOUR EXISTING JOB
  # ===================================================================

  delete-lab:

    name: Complete Charlie Cafe Terraform AWS Cleanup

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ===============================================================
      # STEP 1
      # CHECKOUT REPOSITORY
      # ===============================================================

      - name: "Step 1 - Checkout Repository"
        uses: actions/checkout@v4

      # ===============================================================
      # STEP 2
      # CONFIRM DESTRUCTIVE OPERATION
      # ===============================================================

      - name: "Step 2 - Confirm Destructive Cleanup"
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "CHARLIE CAFE TERRAFORM DESTRUCTIVE CLEANUP"
          echo "=============================================================="

          CONFIRMATION="${{ github.event.inputs.confirmation }}"
          CLEANUP_ORPHANS="${{ github.event.inputs.cleanup_orphans }}"

          if [[ "$CONFIRMATION" != "DELETE" ]]; then
            echo ""
            echo "ERROR: Destructive cleanup was NOT confirmed."
            echo ""
            echo "You must type exactly:"
            echo ""
            echo "DELETE"
            echo ""
            exit 1
          fi

          echo ""
          echo "DELETE confirmation accepted."
          echo ""

          echo "AWS Region:"
          echo "  $AWS_REGION"

          echo ""
          echo "Terraform directory:"
          echo "  $TERRAFORM_WORKING_DIRECTORY"

          echo ""
          echo "Project safety tag:"
          echo "  $PROJECT_TAG_KEY=$PROJECT_TAG_VALUE"

          echo ""
          echo "AWS orphan cleanup:"
          echo "  $CLEANUP_ORPHANS"

          echo ""
          echo "=============================================================="
          echo "DESTRUCTIVE CLEANUP CONFIRMED"
          echo "=============================================================="

      # ===============================================================
      # STEP 3
      # CONFIGURE AWS CREDENTIALS
      # ===============================================================

      - name: "Step 3 - Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ===============================================================
      # STEP 4
      # VERIFY AWS ACCOUNT
      # ===============================================================

      - name: "Step 4 - Verify AWS Account"
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "AWS ACCOUNT VERIFICATION"
          echo "=============================================================="

          aws --version

          echo ""

          IDENTITY="$(aws sts get-caller-identity)"

          echo "$IDENTITY"

          echo ""

          ACCOUNT_ID="$(echo "$IDENTITY" | jq -r '.Account')"
          ARN="$(echo "$IDENTITY" | jq -r '.Arn')"

          echo "AWS Account:"
          echo "  $ACCOUNT_ID"

          echo ""
          echo "Identity:"
          echo "  $ARN"

          echo ""
          echo "Region:"
          echo "  $AWS_REGION"

          echo ""
          echo "AWS account verification completed."

      # ===============================================================
      # STEP 5
      # SETUP TERRAFORM
      # ===============================================================

      - name: "Step 5 - Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      # ===============================================================
      # STEP 6
      # VERIFY TERRAFORM DIRECTORY
      # ===============================================================

      - name: "Step 6 - Verify Terraform Directory"
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "TERRAFORM DIRECTORY VERIFICATION"
          echo "=============================================================="

          if [[ ! -d "$TERRAFORM_WORKING_DIRECTORY" ]]; then

            echo ""
            echo "ERROR: Terraform directory does not exist:"
            echo "  $TERRAFORM_WORKING_DIRECTORY"
            echo ""

            find . \
              -maxdepth 6 \
              -type f \
              \( -name "*.tf" -o -name "*.tfvars" \) \
              -print \
              | sort

            exit 1
          fi

          TF_COUNT="$(
            find "$TERRAFORM_WORKING_DIRECTORY" \
              -type f \
              -name "*.tf" \
              | wc -l
          )"

          if [[ "$TF_COUNT" -eq 0 ]]; then
            echo ""
            echo "ERROR: No Terraform files found."
            exit 1
          fi

          echo ""
          echo "Terraform files detected:"

          find "$TERRAFORM_WORKING_DIRECTORY" \
            -type f \
            \( \
              -name "*.tf" \
              -o -name "*.tfvars" \
              -o -name ".terraform.lock.hcl" \
            \) \
            -print \
            | sort

          echo ""
          echo "Terraform directory verification completed."

      # ===============================================================
      # STEP 7
      # TERRAFORM INIT
      # ===============================================================

      - name: "Step 7 - Terraform Init"
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "TERRAFORM INIT"
          echo "=============================================================="

          terraform init \
            -input=false \
            -no-color

          echo ""
          echo "Terraform initialization completed."

      # ===============================================================
      # STEP 8
      # TERRAFORM VALIDATE
      # ===============================================================

      - name: "Step 8 - Terraform Validate"
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "TERRAFORM VALIDATE"
          echo "=============================================================="

          terraform validate

          echo ""
          echo "Terraform configuration is valid."

      # ===============================================================
      # STEP 9
      # DISPLAY TERRAFORM STATE
      # ===============================================================

      - name: "Step 9 - Display Terraform State"
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "CURRENT TERRAFORM STATE"
          echo "=============================================================="

          STATE_LIST="$(terraform state list 2>/dev/null || true)"

          if [[ -n "$STATE_LIST" ]]; then
            echo "$STATE_LIST"
          else
            echo "Terraform state is currently empty."
          fi

          echo ""
          echo "Terraform state inspection completed."

      # ===============================================================
      # STEP 10
      # CREATE TERRAFORM DESTROY PLAN
      # ===============================================================

      - name: "Step 10 - Generate Terraform Destroy Plan"
        id: terraform_destroy_plan
        continue-on-error: true
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "TERRAFORM DESTROY PLAN"
          echo "=============================================================="

          terraform plan \
            -destroy \
            -input=false \
            -no-color \
            -out=tf-destroy-plan

          echo ""
          echo "Terraform destroy plan generated."

      # ===============================================================
      # STEP 11
      # FIRST TERRAFORM DESTROY
      # ===============================================================

      - name: "Step 11 - Execute Terraform Destroy"
        id: terraform_destroy
        continue-on-error: true
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "FIRST TERRAFORM DESTROY"
          echo "=============================================================="

          terraform destroy \
            -auto-approve \
            -input=false \
            -no-color

          echo ""
          echo "Terraform destroy completed successfully."

      # ===============================================================
      # STEP 12
      # AWS ORPHAN RESOURCE DISCOVERY
      # ===============================================================

      - name: "Step 12 - Discover Terraform AWS Orphan Resources"
        id: discover
        if: ${{ github.event.inputs.cleanup_orphans == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "AWS TERRAFORM ORPHAN RESOURCE DISCOVERY"
          echo "=============================================================="

          echo ""
          echo "Project tag:"
          echo "  $PROJECT_TAG_KEY=$PROJECT_TAG_VALUE"

          echo ""
          echo "Terraform tag:"
          echo "  $TERRAFORM_TAG_KEY=$TERRAFORM_TAG_VALUE"

          echo ""

          RESOURCES="$(
            aws resourcegroupstaggingapi get-resources \
              --region "$AWS_REGION" \
              --tag-filters \
                "Key=$PROJECT_TAG_KEY,Values=$PROJECT_TAG_VALUE" \
              --output json \
              --no-cli-pager \
              2>/dev/null \
              || echo '{"ResourceTagMappingList":[]}'
          )"

          COUNT="$(
            echo "$RESOURCES" |
              jq '.ResourceTagMappingList | length'
          )"

          echo "Tagged AWS resources discovered:"
          echo "  $COUNT"

          echo ""

          if [[ "$COUNT" -gt 0 ]]; then

            echo "$RESOURCES" |
              jq -r '
                .ResourceTagMappingList[]
                | .ResourceARN
              ' |
              sort

          else

            echo "No Project-tagged resources were discovered."

          fi

          echo ""
          echo "AWS orphan discovery completed."

      # ===============================================================
      # STEP 13
      # CLEANUP ECS
      # ===============================================================

      - name: "Step 13 - Cleanup ECS"
        if: ${{ github.event.inputs.cleanup_orphans == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "ECS CLEANUP"
          echo "=============================================================="

          CLUSTER_ARN="$(
            aws ecs describe-clusters \
              --clusters "$ECS_CLUSTER_NAME" \
              --region "$AWS_REGION" \
              --query "clusters[0].clusterArn" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          if [[ "$CLUSTER_ARN" == "None" ||
                "$CLUSTER_ARN" == "null" ||
                -z "$CLUSTER_ARN" ]]; then

            echo ""
            echo "ECS cluster does not exist."
            echo "Continuing cleanup."

          else

            echo ""
            echo "Cluster:"
            echo "  $CLUSTER_ARN"

            SERVICE_STATUS="$(
              aws ecs describe-services \
                --cluster "$CLUSTER_ARN" \
                --services "$ECS_SERVICE_NAME" \
                --region "$AWS_REGION" \
                --query "services[0].status" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            if [[ "$SERVICE_STATUS" == "None" ||
                  "$SERVICE_STATUS" == "null" ||
                  -z "$SERVICE_STATUS" ]]; then

              SERVICE_STATUS=""

            fi

            if [[ "$SERVICE_STATUS" == "ACTIVE" ]]; then

              echo ""
              echo "ECS service is ACTIVE."

              echo ""
              echo "Setting desired count to zero."

              aws ecs update-service \
                --cluster "$CLUSTER_ARN" \
                --service "$ECS_SERVICE_NAME" \
                --desired-count 0 \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

              echo ""
              echo "Waiting for ECS tasks to stop."

              for ATTEMPT in $(seq 1 "$WAIT_ATTEMPTS"); do

                RUNNING="$(
                  aws ecs describe-services \
                    --cluster "$CLUSTER_ARN" \
                    --services "$ECS_SERVICE_NAME" \
                    --region "$AWS_REGION" \
                    --query "services[0].runningCount" \
                    --output text \
                    --no-cli-pager \
                    2>/dev/null || echo "0"
                )"

                if [[ "$RUNNING" == "None" ||
                      "$RUNNING" == "null" ||
                      -z "$RUNNING" ]]; then
                  RUNNING="0"
                fi

                echo "Attempt $ATTEMPT/$WAIT_ATTEMPTS - Running tasks: $RUNNING"

                if [[ "$RUNNING" == "0" ]]; then
                  break
                fi

                sleep "$WAIT_SECONDS"

              done

              echo ""
              echo "Deleting ECS service."

              aws ecs delete-service \
                --cluster "$CLUSTER_ARN" \
                --service "$ECS_SERVICE_NAME" \
                --force \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

              for ATTEMPT in $(seq 1 "$WAIT_ATTEMPTS"); do

                STATUS="$(
                  aws ecs describe-services \
                    --cluster "$CLUSTER_ARN" \
                    --services "$ECS_SERVICE_NAME" \
                    --region "$AWS_REGION" \
                    --query "services[0].status" \
                    --output text \
                    --no-cli-pager \
                    2>/dev/null || true
                )"

                if [[ "$STATUS" == "None" ||
                      "$STATUS" == "null" ||
                      -z "$STATUS" ]]; then

                  echo "ECS service no longer exists."
                  break

                fi

                if [[ "$STATUS" == "INACTIVE" ]]; then

                  echo "ECS service is INACTIVE."
                  break

                fi

                echo "Waiting for ECS service deletion: $ATTEMPT/$WAIT_ATTEMPTS"

                sleep "$WAIT_SECONDS"

              done

            elif [[ "$SERVICE_STATUS" == "INACTIVE" ]]; then

              echo ""
              echo "ECS service is already INACTIVE."
              echo "No service update/delete operation is required."

            else

              echo ""
              echo "ECS service was not found."

            fi

            echo ""
            echo "Deleting ECS cluster."

            aws ecs delete-cluster \
              --cluster "$CLUSTER_ARN" \
              --region "$AWS_REGION" \
              --no-cli-pager \
              2>/dev/null || true

          fi

          echo ""
          echo "Discovering ACTIVE ECS task definitions."

          TASK_DEFINITIONS="$(
            aws ecs list-task-definitions \
              --family-prefix "$ECS_TASK_FAMILY" \
              --status ACTIVE \
              --region "$AWS_REGION" \
              --query "taskDefinitionArns[]" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          for TASK in $TASK_DEFINITIONS; do

            echo ""
            echo "Deregistering task definition:"
            echo "  $TASK"

            aws ecs deregister-task-definition \
              --task-definition "$TASK" \
              --region "$AWS_REGION" \
              --no-cli-pager \
              2>/dev/null || true

          done

          echo ""
          echo "ECS cleanup completed."

      # ===============================================================
      # STEP 14
      # CLEANUP ECR
      # ===============================================================

      - name: "Step 14 - Cleanup ECR"
        if: ${{ github.event.inputs.cleanup_orphans == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "ECR CLEANUP"
          echo "=============================================================="

          EXISTS="$(
            aws ecr describe-repositories \
              --repository-names "$ECR_REPOSITORY_NAME" \
              --region "$AWS_REGION" \
              --query "repositories[0].repositoryName" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          if [[ "$EXISTS" == "None" ||
                "$EXISTS" == "null" ||
                -z "$EXISTS" ]]; then

            echo ""
            echo "ECR repository does not exist."

          else

            echo ""
            echo "Deleting ECR repository:"
            echo "  $ECR_REPOSITORY_NAME"

            aws ecr delete-repository \
              --repository-name "$ECR_REPOSITORY_NAME" \
              --force \
              --region "$AWS_REGION" \
              --no-cli-pager

          fi

          echo ""
          echo "ECR cleanup completed."

      # ===============================================================
      # STEP 15
      # CLEANUP RDS
      #
      # EXISTING RDS CLEANUP PRESERVED.
      # ===============================================================

      - name: "Step 15 - Cleanup RDS"
        if: ${{ github.event.inputs.cleanup_orphans == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "RDS CLEANUP"
          echo "=============================================================="

          DB_EXISTS="$(
            aws rds describe-db-instances \
              --db-instance-identifier "$RDS_IDENTIFIER" \
              --region "$AWS_REGION" \
              --query "DBInstances[0].DBInstanceIdentifier" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          if [[ "$DB_EXISTS" == "None" ||
                "$DB_EXISTS" == "null" ||
                -z "$DB_EXISTS" ]]; then

            echo ""
            echo "RDS instance does not exist."

          else

            echo ""
            echo "RDS instance:"
            echo "  $DB_EXISTS"

            PROTECTION="$(
              aws rds describe-db-instances \
                --db-instance-identifier "$RDS_IDENTIFIER" \
                --region "$AWS_REGION" \
                --query "DBInstances[0].DeletionProtection" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            echo ""
            echo "Deletion protection:"
            echo "  $PROTECTION"

            if [[ "$PROTECTION" == "True" ]]; then

              echo ""
              echo "Disabling RDS deletion protection."

              aws rds modify-db-instance \
                --db-instance-identifier "$RDS_IDENTIFIER" \
                --no-deletion-protection \
                --apply-immediately \
                --region "$AWS_REGION" \
                --no-cli-pager

              echo ""
              echo "Waiting for deletion protection change."

              for ATTEMPT in $(seq 1 "$WAIT_ATTEMPTS"); do

                CURRENT="$(
                  aws rds describe-db-instances \
                    --db-instance-identifier "$RDS_IDENTIFIER" \
                    --region "$AWS_REGION" \
                    --query "DBInstances[0].DeletionProtection" \
                    --output text \
                    --no-cli-pager \
                    2>/dev/null || true
                )"

                echo "Attempt $ATTEMPT/$WAIT_ATTEMPTS - Protection: $CURRENT"

                if [[ "$CURRENT" != "True" ]]; then
                  break
                fi

                sleep "$WAIT_SECONDS"

              done

            fi

            echo ""
            echo "Deleting RDS instance."

            aws rds delete-db-instance \
              --db-instance-identifier "$RDS_IDENTIFIER" \
              --skip-final-snapshot \
              --delete-automated-backups \
              --region "$AWS_REGION" \
              --no-cli-pager \
              2>/dev/null || true

            echo ""
            echo "Waiting for RDS deletion."

            aws rds wait db-instance-deleted \
              --db-instance-identifier "$RDS_IDENTIFIER" \
              --region "$AWS_REGION" \
              2>/dev/null || true

          fi

          echo ""
          echo "Deleting RDS subnet group."

          aws rds delete-db-subnet-group \
            --db-subnet-group-name "$RDS_SUBNET_GROUP" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            2>/dev/null || true

          echo ""
          echo "RDS cleanup completed."

      # ===============================================================
      # STEP 16
      # CLEANUP APPLICATION LOAD BALANCER
      # ===============================================================

      - name: "Step 16 - Cleanup Application Load Balancer"
        if: ${{ github.event.inputs.cleanup_orphans == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "APPLICATION LOAD BALANCER CLEANUP"
          echo "=============================================================="

          ALB_ARN="$(
            aws elbv2 describe-load-balancers \
              --names "$ALB_NAME" \
              --region "$AWS_REGION" \
              --query "LoadBalancers[0].LoadBalancerArn" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          if [[ "$ALB_ARN" != "None" &&
                "$ALB_ARN" != "null" &&
                -n "$ALB_ARN" ]]; then

            echo ""
            echo "ALB:"
            echo "  $ALB_ARN"

            LISTENERS="$(
              aws elbv2 describe-listeners \
                --load-balancer-arn "$ALB_ARN" \
                --region "$AWS_REGION" \
                --query "Listeners[].ListenerArn" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            for LISTENER in $LISTENERS; do

              echo ""
              echo "Deleting listener:"
              echo "  $LISTENER"

              aws elbv2 delete-listener \
                --listener-arn "$LISTENER" \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            done

            echo ""
            echo "Deleting ALB."

            aws elbv2 delete-load-balancer \
              --load-balancer-arn "$ALB_ARN" \
              --region "$AWS_REGION" \
              --no-cli-pager \
              2>/dev/null || true

            for ATTEMPT in $(seq 1 "$WAIT_ATTEMPTS"); do

              CHECK="$(
                aws elbv2 describe-load-balancers \
                  --load-balancer-arns "$ALB_ARN" \
                  --region "$AWS_REGION" \
                  --output text \
                  --no-cli-pager \
                  2>/dev/null || true
              )"

              if [[ -z "$CHECK" ]]; then
                echo "ALB deletion verified."
                break
              fi

              echo "Waiting for ALB deletion: $ATTEMPT/$WAIT_ATTEMPTS"

              sleep "$WAIT_SECONDS"

            done

          else

            echo ""
            echo "ALB does not exist."

          fi

          echo ""
          echo "Discovering target group."

          TARGET_GROUP_ARNS="$(
            aws elbv2 describe-target-groups \
              --names "$TARGET_GROUP_NAME" \
              --region "$AWS_REGION" \
              --query "TargetGroups[].TargetGroupArn" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          for TG in $TARGET_GROUP_ARNS; do

            echo ""
            echo "Deleting target group:"
            echo "  $TG"

            aws elbv2 delete-target-group \
              --target-group-arn "$TG" \
              --region "$AWS_REGION" \
              --no-cli-pager \
              2>/dev/null || true

          done

          echo ""
          echo "Load balancer cleanup completed."

      # ===============================================================
      # STEP 17
      # CLEANUP EFS
      # ===============================================================

      - name: "Step 17 - Cleanup EFS"
        if: ${{ github.event.inputs.cleanup_orphans == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "EFS CLEANUP"
          echo "=============================================================="

          FILE_SYSTEMS="$(
            aws efs describe-file-systems \
              --region "$AWS_REGION" \
              --query "FileSystems[?Name=='$EFS_NAME'].FileSystemId" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          for FS_ID in $FILE_SYSTEMS; do

            echo ""
            echo "EFS filesystem:"
            echo "  $FS_ID"

            MOUNTS="$(
              aws efs describe-mount-targets \
                --file-system-id "$FS_ID" \
                --region "$AWS_REGION" \
                --query "MountTargets[].MountTargetId" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            for MT in $MOUNTS; do

              echo ""
              echo "Deleting EFS mount target:"
              echo "  $MT"

              aws efs delete-mount-target \
                --mount-target-id "$MT" \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            done

            for ATTEMPT in $(seq 1 "$WAIT_ATTEMPTS"); do

              REMAINING_MOUNTS="$(
                aws efs describe-mount-targets \
                  --file-system-id "$FS_ID" \
                  --region "$AWS_REGION" \
                  --query "MountTargets | length(@)" \
                  --output text \
                  --no-cli-pager \
                  2>/dev/null || echo "0"
              )"

              echo "EFS mount targets remaining: $REMAINING_MOUNTS"

              if [[ "$REMAINING_MOUNTS" == "0" ]]; then
                break
              fi

              sleep "$WAIT_SECONDS"

            done

            echo ""
            echo "Deleting EFS filesystem."

            aws efs delete-file-system \
              --file-system-id "$FS_ID" \
              --region "$AWS_REGION" \
              --no-cli-pager \
              2>/dev/null || true

          done

          echo ""
          echo "EFS cleanup completed."

      # ===============================================================
      # STEP 18
      # CLEANUP EC2 INSTANCES
      # ===============================================================

      - name: "Step 18 - Cleanup Terraform EC2 Instances"
        if: ${{ github.event.inputs.cleanup_orphans == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "EC2 CLEANUP"
          echo "=============================================================="

          INSTANCE_IDS="$(
            aws ec2 describe-instances \
              --region "$AWS_REGION" \
              --filters \
                "Name=tag:$PROJECT_TAG_KEY,Values=$PROJECT_TAG_VALUE" \
                "Name=instance-state-name,Values=pending,running,stopping,stopped" \
              --query "Reservations[].Instances[].InstanceId" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          if [[ -z "$INSTANCE_IDS" ||
                "$INSTANCE_IDS" == "None" ]]; then

            echo ""
            echo "No Terraform-tagged EC2 instances found."

          else

            echo ""
            echo "Terraform EC2 instances:"
            echo "$INSTANCE_IDS"

            echo ""
            echo "Terminating instances."

            aws ec2 terminate-instances \
              --instance-ids $INSTANCE_IDS \
              --region "$AWS_REGION" \
              --no-cli-pager

            echo ""
            echo "Waiting for EC2 termination."

            aws ec2 wait instance-terminated \
              --instance-ids $INSTANCE_IDS \
              --region "$AWS_REGION"

          fi

          echo ""
          echo "EC2 cleanup completed."

      # ===============================================================
      # STEP 19
      # CLEANUP NAT GATEWAYS
      # ===============================================================

      - name: "Step 19 - Cleanup NAT Gateways"
        if: ${{ github.event.inputs.cleanup_orphans == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "NAT GATEWAY CLEANUP"
          echo "=============================================================="

          VPC_IDS="$(
            aws ec2 describe-vpcs \
              --region "$AWS_REGION" \
              --filters \
                "Name=tag:$PROJECT_TAG_KEY,Values=$PROJECT_TAG_VALUE" \
              --query "Vpcs[].VpcId" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          if [[ -z "$VPC_IDS" ||
                "$VPC_IDS" == "None" ]]; then

            echo ""
            echo "No Project-tagged VPCs found."

          else

            for VPC_ID in $VPC_IDS; do

              echo ""
              echo "VPC:"
              echo "  $VPC_ID"

              NAT_IDS="$(
                aws ec2 describe-nat-gateways \
                  --region "$AWS_REGION" \
                  --filter \
                    "Name=vpc-id,Values=$VPC_ID" \
                    "Name=state,Values=pending,available,failed,deleting" \
                  --query "NatGateways[].NatGatewayId" \
                  --output text \
                  --no-cli-pager \
                  2>/dev/null || true
              )"

              for NAT_ID in $NAT_IDS; do

                echo ""
                echo "Deleting NAT gateway:"
                echo "  $NAT_ID"

                aws ec2 delete-nat-gateway \
                  --nat-gateway-id "$NAT_ID" \
                  --region "$AWS_REGION" \
                  --no-cli-pager \
                  2>/dev/null || true

              done

            done

            for ATTEMPT in $(seq 1 "$WAIT_ATTEMPTS"); do

              REMAINING=0

              for VPC_ID in $VPC_IDS; do

                COUNT="$(
                  aws ec2 describe-nat-gateways \
                    --region "$AWS_REGION" \
                    --filter \
                      "Name=vpc-id,Values=$VPC_ID" \
                      "Name=state,Values=pending,available,deleting" \
                    --query "NatGateways | length(@)" \
                    --output text \
                    --no-cli-pager \
                    2>/dev/null || echo "0"
                )"

                REMAINING=$((REMAINING + COUNT))

              done

              echo "Attempt $ATTEMPT/$WAIT_ATTEMPTS - NAT gateways remaining: $REMAINING"

              if [[ "$REMAINING" -eq 0 ]]; then
                break
              fi

              sleep "$WAIT_SECONDS"

            done

          fi

          echo ""
          echo "NAT gateway cleanup completed."

      # ===============================================================
      # STEP 20
      # CLEANUP VPC ENDPOINTS
      # ===============================================================

      - name: "Step 20 - Cleanup VPC Endpoints"
        if: ${{ github.event.inputs.cleanup_orphans == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "VPC ENDPOINT CLEANUP"
          echo "=============================================================="

          VPC_IDS="$(
            aws ec2 describe-vpcs \
              --region "$AWS_REGION" \
              --filters \
                "Name=tag:$PROJECT_TAG_KEY,Values=$PROJECT_TAG_VALUE" \
              --query "Vpcs[].VpcId" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          for VPC_ID in $VPC_IDS; do

            ENDPOINT_IDS="$(
              aws ec2 describe-vpc-endpoints \
                --region "$AWS_REGION" \
                --filters "Name=vpc-id,Values=$VPC_ID" \
                --query "VpcEndpoints[].VpcEndpointId" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            for ENDPOINT in $ENDPOINT_IDS; do

              if [[ -z "$ENDPOINT" ||
                    "$ENDPOINT" == "None" ]]; then
                continue
              fi

              echo ""
              echo "Deleting VPC endpoint:"
              echo "  $ENDPOINT"

              aws ec2 delete-vpc-endpoints \
                --vpc-endpoint-ids "$ENDPOINT" \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            done

          done

          echo ""
          echo "Waiting for VPC endpoint deletion."

          sleep "$WAIT_SECONDS"

          echo ""
          echo "VPC endpoint cleanup completed."

      # ===============================================================
      # STEP 21
      # RELEASE ELASTIC IPS
      # ===============================================================

      - name: "Step 21 - Release Terraform Elastic IPs"
        if: ${{ github.event.inputs.cleanup_orphans == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "ELASTIC IP CLEANUP"
          echo "=============================================================="

          ALLOCATIONS="$(
            aws ec2 describe-addresses \
              --region "$AWS_REGION" \
              --filters \
                "Name=tag:$PROJECT_TAG_KEY,Values=$PROJECT_TAG_VALUE" \
              --query "Addresses[].AllocationId" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          for ALLOCATION in $ALLOCATIONS; do

            if [[ -z "$ALLOCATION" ||
                  "$ALLOCATION" == "None" ]]; then
              continue
            fi

            echo ""
            echo "Releasing Elastic IP:"
            echo "  $ALLOCATION"

            aws ec2 release-address \
              --allocation-id "$ALLOCATION" \
              --region "$AWS_REGION" \
              --no-cli-pager \
              2>/dev/null || true

          done

          echo ""
          echo "Elastic IP cleanup completed."

      # ===============================================================
      # STEP 22
      # CLEANUP NETWORK INTERFACES
      # ===============================================================

      - name: "Step 22 - Cleanup Terraform Network Interfaces"
        if: ${{ github.event.inputs.cleanup_orphans == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "NETWORK INTERFACE CLEANUP"
          echo "=============================================================="

          VPC_IDS="$(
            aws ec2 describe-vpcs \
              --region "$AWS_REGION" \
              --filters \
                "Name=tag:$PROJECT_TAG_KEY,Values=$PROJECT_TAG_VALUE" \
              --query "Vpcs[].VpcId" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          for VPC_ID in $VPC_IDS; do

            ENI_IDS="$(
              aws ec2 describe-network-interfaces \
                --region "$AWS_REGION" \
                --filters "Name=vpc-id,Values=$VPC_ID" \
                --query "NetworkInterfaces[?Status=='available'].NetworkInterfaceId" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            for ENI in $ENI_IDS; do

              if [[ -z "$ENI" ||
                    "$ENI" == "None" ]]; then
                continue
              fi

              echo ""
              echo "Deleting available ENI:"
              echo "  $ENI"

              aws ec2 delete-network-interface \
                --network-interface-id "$ENI" \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            done

          done

          echo ""
          echo "Network interface cleanup completed."

      # ===============================================================
      # STEP 23
      # RETRY TERRAFORM DESTROY
      # ===============================================================

      - name: "Step 23 - Retry Terraform Destroy"
        id: terraform_destroy_retry
        continue-on-error: true
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "SECOND TERRAFORM DESTROY ATTEMPT"
          echo "=============================================================="

          terraform destroy \
            -auto-approve \
            -input=false \
            -no-color

          echo ""
          echo "Terraform destroy retry completed successfully."

      # ===============================================================
      # STEP 24
      # CLEANUP S3 BUCKETS
      # ===============================================================

      - name: "Step 24 - Cleanup Terraform S3 Buckets"
        if: ${{ github.event.inputs.cleanup_orphans == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "S3 CLEANUP"
          echo "=============================================================="

          BACKEND_BUCKET=""

          if [[ -f "$TERRAFORM_WORKING_DIRECTORY/.terraform/terraform.tfstate" ]]; then

            BACKEND_BUCKET="$(
              jq -r '
                .backend.config.bucket
                // .backend.config.bucket_name
                // empty
              ' \
              "$TERRAFORM_WORKING_DIRECTORY/.terraform/terraform.tfstate" \
              2>/dev/null || true
            )"

          fi

          echo ""
          echo "Terraform backend bucket:"
          echo "  ${BACKEND_BUCKET:-NOT_DETECTED}"

          BUCKETS="$(
            aws resourcegroupstaggingapi get-resources \
              --region "$AWS_REGION" \
              --resource-type-filters s3:bucket \
              --tag-filters \
                "Key=$PROJECT_TAG_KEY,Values=$PROJECT_TAG_VALUE" \
              --query "ResourceTagMappingList[].ResourceARN" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          for ARN in $BUCKETS; do

            BUCKET="${ARN##*:}"

            if [[ -n "$BACKEND_BUCKET" &&
                  "$BUCKET" == "$BACKEND_BUCKET" ]]; then

              echo ""
              echo "Skipping Terraform backend bucket:"
              echo "  $BUCKET"

              continue

            fi

            echo ""
            echo "Terraform application bucket:"
            echo "  $BUCKET"

            aws s3 rm \
              "s3://$BUCKET" \
              --recursive \
              --region "$AWS_REGION" \
              2>/dev/null || true

            for LOOP in $(seq 1 100); do

              DATA="$(
                aws s3api list-object-versions \
                  --bucket "$BUCKET" \
                  --region "$AWS_REGION" \
                  --output json \
                  --no-cli-pager \
                  2>/dev/null || echo '{}'
              )"

              COUNT="$(
                echo "$DATA" |
                  jq '
                    ((.Versions // []) + (.DeleteMarkers // []))
                    | length
                  '
              )"

              echo "S3 cleanup pass $LOOP - remaining versions/markers: $COUNT"

              if [[ "$COUNT" -eq 0 ]]; then
                break
              fi

              echo "$DATA" |
                jq '
                  {
                    Objects:
                      (
                        ((.Versions // []) + (.DeleteMarkers // []))
                        | map({
                            Key: .Key,
                            VersionId: .VersionId
                          })
                        | .[0:1000]
                      ),
                    Quiet: true
                  }
                ' \
                > /tmp/s3-delete.json

              aws s3api delete-objects \
                --bucket "$BUCKET" \
                --delete file:///tmp/s3-delete.json \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            done

            echo ""
            echo "Deleting S3 bucket."

            aws s3api delete-bucket \
              --bucket "$BUCKET" \
              --region "$AWS_REGION" \
              --no-cli-pager \
              2>/dev/null || true

          done

          echo ""
          echo "S3 cleanup completed."

      # ===============================================================
      # STEP 25
      # CLEANUP DYNAMODB
      # ===============================================================

      - name: "Step 25 - Cleanup Terraform DynamoDB"
        if: ${{ github.event.inputs.cleanup_orphans == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "DYNAMODB CLEANUP"
          echo "=============================================================="

          ACCOUNT_ID="$(
            aws sts get-caller-identity \
              --query Account \
              --output text
          )"

          TABLES="$(
            aws dynamodb list-tables \
              --region "$AWS_REGION" \
              --output text \
              --query "TableNames[]" \
              --no-cli-pager \
              2>/dev/null || true
          )"

          for TABLE in $TABLES; do

            RESOURCE_ARN="arn:aws:dynamodb:$AWS_REGION:$ACCOUNT_ID:table/$TABLE"

            TAGS="$(
              aws dynamodb list-tags-of-resource \
                --resource-arn "$RESOURCE_ARN" \
                --region "$AWS_REGION" \
                --output json \
                --no-cli-pager \
                2>/dev/null || true
            )"

            if echo "$TAGS" |
              jq -e --arg VALUE "$PROJECT_TAG_VALUE" '
                .Tags[]?
                | select(.Key=="Project" and .Value==$VALUE)
              ' >/dev/null 2>&1; then

              echo ""
              echo "Deleting Terraform DynamoDB table:"
              echo "  $TABLE"

              aws dynamodb delete-table \
                --table-name "$TABLE" \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            fi

          done

          echo ""
          echo "DynamoDB cleanup completed."

      # ===============================================================
      # STEP 26
      # CLEANUP CLOUDWATCH LOG GROUP
      # ===============================================================

      - name: "Step 26 - Cleanup CloudWatch Logs"
        if: ${{ github.event.inputs.cleanup_orphans == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "CLOUDWATCH LOG GROUP CLEANUP"
          echo "=============================================================="

          aws logs delete-log-group \
            --log-group-name "$LOG_GROUP_NAME" \
            --region "$AWS_REGION" \
            --no-cli-pager \
            2>/dev/null || true

          echo ""
          echo "CloudWatch log group cleanup completed."

      # ===============================================================
      # STEP 27
      # CLEANUP SECRETS MANAGER
      # ===============================================================

      - name: "Step 27 - Cleanup Terraform Secrets"
        if: ${{ github.event.inputs.cleanup_orphans == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "SECRETS MANAGER CLEANUP"
          echo "=============================================================="

          SECRET_ARN="$(
            aws secretsmanager describe-secret \
              --secret-id "$SECRET_NAME" \
              --region "$AWS_REGION" \
              --query "ARN" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          if [[ "$SECRET_ARN" == "None" ||
                "$SECRET_ARN" == "null" ||
                -z "$SECRET_ARN" ]]; then

            echo ""
            echo "Terraform secret does not exist."

          else

            echo ""
            echo "Deleting secret:"
            echo "  $SECRET_NAME"

            aws secretsmanager delete-secret \
              --secret-id "$SECRET_ARN" \
              --force-delete-without-recovery \
              --region "$AWS_REGION" \
              --no-cli-pager \
              2>/dev/null || true

          fi

          echo ""
          echo "Secrets Manager cleanup completed."

      # ===============================================================
      # STEP 28
      # CLEANUP IAM ROLES
      # ===============================================================

      - name: "Step 28 - Cleanup Terraform IAM Roles"
        if: ${{ github.event.inputs.cleanup_orphans == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "IAM ROLE CLEANUP"
          echo "=============================================================="

          ROLES=(
            "CharlieCafe-TF-ECSTaskExecutionRole"
            "CharlieCafe-TF-ECSTaskRole"
            "CharlieCafe-TF-CloudFormation-ServiceRole"
          )

          for ROLE in "${ROLES[@]}"; do

            if ! aws iam get-role \
              --role-name "$ROLE" \
              --no-cli-pager \
              >/dev/null 2>&1; then

              echo ""
              echo "IAM role does not exist:"
              echo "  $ROLE"

              continue

            fi

            echo ""
            echo "Cleaning IAM role:"
            echo "  $ROLE"

            INLINE_POLICIES="$(
              aws iam list-role-policies \
                --role-name "$ROLE" \
                --query "PolicyNames[]" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            for POLICY in $INLINE_POLICIES; do

              echo "Deleting inline policy:"
              echo "  $POLICY"

              aws iam delete-role-policy \
                --role-name "$ROLE" \
                --policy-name "$POLICY" \
                --no-cli-pager \
                2>/dev/null || true

            done

            ATTACHED_POLICIES="$(
              aws iam list-attached-role-policies \
                --role-name "$ROLE" \
                --query "AttachedPolicies[].PolicyArn" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            for POLICY_ARN in $ATTACHED_POLICIES; do

              echo "Detaching managed policy:"
              echo "  $POLICY_ARN"

              aws iam detach-role-policy \
                --role-name "$ROLE" \
                --policy-arn "$POLICY_ARN" \
                --no-cli-pager \
                2>/dev/null || true

            done

            echo "Deleting IAM role."

            aws iam delete-role \
              --role-name "$ROLE" \
              --no-cli-pager \
              2>/dev/null || true

          done

          echo ""
          echo "IAM cleanup completed."

      # ===============================================================
      # STEP 29
      # CLEANUP SECURITY GROUPS
      # ===============================================================

      - name: "Step 29 - Cleanup Terraform Security Groups"
        if: ${{ github.event.inputs.cleanup_orphans == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "SECURITY GROUP CLEANUP"
          echo "=============================================================="

          VPC_IDS="$(
            aws ec2 describe-vpcs \
              --region "$AWS_REGION" \
              --filters \
                "Name=tag:$PROJECT_TAG_KEY,Values=$PROJECT_TAG_VALUE" \
              --query "Vpcs[].VpcId" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          for VPC_ID in $VPC_IDS; do

            SG_IDS="$(
              aws ec2 describe-security-groups \
                --region "$AWS_REGION" \
                --filters "Name=vpc-id,Values=$VPC_ID" \
                --query "SecurityGroups[?GroupName!='default'].GroupId" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            for SG in $SG_IDS; do

              TAG_PROJECT="$(
                aws ec2 describe-tags \
                  --region "$AWS_REGION" \
                  --filters \
                    "Name=resource-id,Values=$SG" \
                    "Name=key,Values=$PROJECT_TAG_KEY" \
                    "Name=value,Values=$PROJECT_TAG_VALUE" \
                  --query "Tags[0].Value" \
                  --output text \
                  --no-cli-pager \
                  2>/dev/null || true
              )"

              if [[ "$TAG_PROJECT" != "$PROJECT_TAG_VALUE" ]]; then
                continue
              fi

              echo ""
              echo "Deleting Terraform security group:"
              echo "  $SG"

              aws ec2 delete-security-group \
                --group-id "$SG" \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            done

          done

          echo ""
          echo "Security group cleanup completed."

      # ===============================================================
      # STEP 30
      # CLEANUP SUBNETS
      # ===============================================================

      - name: "Step 30 - Cleanup Terraform Subnets"
        if: ${{ github.event.inputs.cleanup_orphans == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "SUBNET CLEANUP"
          echo "=============================================================="

          VPC_IDS="$(
            aws ec2 describe-vpcs \
              --region "$AWS_REGION" \
              --filters \
                "Name=tag:$PROJECT_TAG_KEY,Values=$PROJECT_TAG_VALUE" \
              --query "Vpcs[].VpcId" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          for VPC_ID in $VPC_IDS; do

            SUBNET_IDS="$(
              aws ec2 describe-subnets \
                --region "$AWS_REGION" \
                --filters "Name=vpc-id,Values=$VPC_ID" \
                --query "Subnets[?Tags[?Key=='Project' && Value=='$PROJECT_TAG_VALUE']].SubnetId" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            for SUBNET in $SUBNET_IDS; do

              echo ""
              echo "Deleting subnet:"
              echo "  $SUBNET"

              aws ec2 delete-subnet \
                --subnet-id "$SUBNET" \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            done

          done

          echo ""
          echo "Subnet cleanup completed."

      # ===============================================================
      # STEP 31
      # CLEANUP ROUTE TABLES
      # ===============================================================

      - name: "Step 31 - Cleanup Terraform Route Tables"
        if: ${{ github.event.inputs.cleanup_orphans == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "ROUTE TABLE CLEANUP"
          echo "=============================================================="

          VPC_IDS="$(
            aws ec2 describe-vpcs \
              --region "$AWS_REGION" \
              --filters \
                "Name=tag:$PROJECT_TAG_KEY,Values=$PROJECT_TAG_VALUE" \
              --query "Vpcs[].VpcId" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          for VPC_ID in $VPC_IDS; do

            RT_IDS="$(
              aws ec2 describe-route-tables \
                --region "$AWS_REGION" \
                --filters "Name=vpc-id,Values=$VPC_ID" \
                --query "RouteTables[?Tags[?Key=='Project' && Value=='$PROJECT_TAG_VALUE']].RouteTableId" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            for RT in $RT_IDS; do

              echo ""
              echo "Route table:"
              echo "  $RT"

              ASSOCIATIONS="$(
                aws ec2 describe-route-tables \
                  --route-table-ids "$RT" \
                  --region "$AWS_REGION" \
                  --query "RouteTables[0].Associations[?Main==\`false\`].RouteTableAssociationId" \
                  --output text \
                  --no-cli-pager \
                  2>/dev/null || true
              )"

              for ASSOCIATION in $ASSOCIATIONS; do

                if [[ -z "$ASSOCIATION" ||
                      "$ASSOCIATION" == "None" ]]; then
                  continue
                fi

                echo ""
                echo "Disassociating route table association:"
                echo "  $ASSOCIATION"

                aws ec2 disassociate-route-table \
                  --association-id "$ASSOCIATION" \
                  --region "$AWS_REGION" \
                  --no-cli-pager \
                  2>/dev/null || true

              done

              echo ""
              echo "Deleting route table:"
              echo "  $RT"

              aws ec2 delete-route-table \
                --route-table-id "$RT" \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            done

          done

          echo ""
          echo "Route table cleanup completed."

      # ===============================================================
      # STEP 32
      # CLEANUP INTERNET GATEWAYS
      # ===============================================================

      - name: "Step 32 - Cleanup Internet Gateways"
        if: ${{ github.event.inputs.cleanup_orphans == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "INTERNET GATEWAY CLEANUP"
          echo "=============================================================="

          VPC_IDS="$(
            aws ec2 describe-vpcs \
              --region "$AWS_REGION" \
              --filters \
                "Name=tag:$PROJECT_TAG_KEY,Values=$PROJECT_TAG_VALUE" \
              --query "Vpcs[].VpcId" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          for VPC_ID in $VPC_IDS; do

            IGW_IDS="$(
              aws ec2 describe-internet-gateways \
                --region "$AWS_REGION" \
                --filters \
                  "Name=attachment.vpc-id,Values=$VPC_ID" \
                --query "InternetGateways[].InternetGatewayId" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            for IGW in $IGW_IDS; do

              echo ""
              echo "Detaching internet gateway:"
              echo "  $IGW"

              aws ec2 detach-internet-gateway \
                --internet-gateway-id "$IGW" \
                --vpc-id "$VPC_ID" \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

              echo ""
              echo "Deleting internet gateway."

              aws ec2 delete-internet-gateway \
                --internet-gateway-id "$IGW" \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            done

          done

          echo ""
          echo "Internet gateway cleanup completed."

      # ===============================================================
      # STEP 33
      # FINAL TERRAFORM DESTROY
      # ===============================================================

      - name: "Step 33 - Final Terraform Destroy"
        id: terraform_destroy_final
        continue-on-error: true
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "FINAL TERRAFORM DESTROY"
          echo "=============================================================="

          terraform destroy \
            -auto-approve \
            -input=false \
            -no-color

          echo ""
          echo "Final Terraform destroy completed."

      # ===============================================================
      # STEP 34
      # FINAL VPC CLEANUP
      # ===============================================================

      - name: "Step 34 - Delete Terraform VPC"
        if: ${{ github.event.inputs.cleanup_orphans == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "FINAL VPC CLEANUP"
          echo "=============================================================="

          for ATTEMPT in $(seq 1 "$WAIT_ATTEMPTS"); do

            VPC_IDS="$(
              aws ec2 describe-vpcs \
                --region "$AWS_REGION" \
                --filters \
                  "Name=tag:$PROJECT_TAG_KEY,Values=$PROJECT_TAG_VALUE" \
                --query "Vpcs[].VpcId" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            if [[ -z "$VPC_IDS" ||
                  "$VPC_IDS" == "None" ]]; then

              echo ""
              echo "No Project-tagged VPC remains."
              break

            fi

            echo ""
            echo "VPC cleanup attempt $ATTEMPT/$WAIT_ATTEMPTS"

            for VPC_ID in $VPC_IDS; do

              echo ""
              echo "Deleting Terraform VPC:"
              echo "  $VPC_ID"

              aws ec2 delete-vpc \
                --vpc-id "$VPC_ID" \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            done

            sleep "$WAIT_SECONDS"

          done

          echo ""
          echo "Final VPC cleanup completed."

      # ===============================================================
      # STEP 35
      # FINAL AWS PROJECT-TAGGED RESOURCE SCAN
      # ===============================================================

      - name: "Step 35 - Final AWS Terraform Resource Scan"
        id: final_scan
        if: ${{ github.event.inputs.cleanup_orphans == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "FINAL AWS TERRAFORM RESOURCE SCAN"
          echo "=============================================================="

          RESOURCES="$(
            aws resourcegroupstaggingapi get-resources \
              --region "$AWS_REGION" \
              --tag-filters \
                "Key=$PROJECT_TAG_KEY,Values=$PROJECT_TAG_VALUE" \
              --output json \
              --no-cli-pager \
              2>/dev/null \
              || echo '{"ResourceTagMappingList":[]}'
          )"

          COUNT="$(
            echo "$RESOURCES" |
              jq '.ResourceTagMappingList | length'
          )"

          echo ""
          echo "Remaining Project-tagged resources:"
          echo "  $COUNT"

          if [[ "$COUNT" -gt 0 ]]; then

            echo ""
            echo "WARNING: AWS resources are still present."
            echo ""

            echo "$RESOURCES" |
              jq -r '
                .ResourceTagMappingList[]
                | .ResourceARN
              ' |
              sort

          else

            echo ""
            echo "No Project-tagged resources remain."

          fi

          echo "remaining_count=$COUNT" >> "$GITHUB_OUTPUT"

      # ===============================================================
      # STEP 36
      # FINAL KNOWN RESOURCE SCAN
      # ===============================================================

      - name: "Step 36 - Final Known Charlie Cafe Resource Scan"
        id: known_scan
        if: ${{ github.event.inputs.cleanup_orphans == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "FINAL KNOWN CHARLIE CAFE RESOURCE SCAN"
          echo "=============================================================="

          REMAINING=0

          ECS="$(
            aws ecs describe-clusters \
              --clusters "$ECS_CLUSTER_NAME" \
              --region "$AWS_REGION" \
              --query "clusters[0].status" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          if [[ "$ECS" != "None" &&
                "$ECS" != "null" &&
                -n "$ECS" &&
                "$ECS" != "INACTIVE" ]]; then

            echo "Remaining ECS cluster: $ECS_CLUSTER_NAME"

            REMAINING=$((REMAINING + 1))

          fi

          ECR="$(
            aws ecr describe-repositories \
              --repository-names "$ECR_REPOSITORY_NAME" \
              --region "$AWS_REGION" \
              --query "repositories[0].repositoryName" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          if [[ "$ECR" != "None" &&
                "$ECR" != "null" &&
                -n "$ECR" ]]; then

            echo "Remaining ECR repository: $ECR_REPOSITORY_NAME"

            REMAINING=$((REMAINING + 1))

          fi

          ALB="$(
            aws elbv2 describe-load-balancers \
              --names "$ALB_NAME" \
              --region "$AWS_REGION" \
              --query "LoadBalancers[0].LoadBalancerArn" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          if [[ "$ALB" != "None" &&
                "$ALB" != "null" &&
                -n "$ALB" ]]; then

            echo "Remaining ALB: $ALB_NAME"

            REMAINING=$((REMAINING + 1))

          fi

          RDS="$(
            aws rds describe-db-instances \
              --db-instance-identifier "$RDS_IDENTIFIER" \
              --region "$AWS_REGION" \
              --query "DBInstances[0].DBInstanceIdentifier" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          if [[ "$RDS" != "None" &&
                "$RDS" != "null" &&
                -n "$RDS" ]]; then

            echo "Remaining RDS instance: $RDS_IDENTIFIER"

            REMAINING=$((REMAINING + 1))

          fi

          VPC="$(
            aws ec2 describe-vpcs \
              --region "$AWS_REGION" \
              --filters \
                "Name=tag:$PROJECT_TAG_KEY,Values=$PROJECT_TAG_VALUE" \
              --query "Vpcs[].VpcId" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          if [[ -n "$VPC" &&
                "$VPC" != "None" ]]; then

            echo "Remaining Terraform VPC(s):"
            echo "$VPC"

            REMAINING=$((REMAINING + 1))

          fi

          echo ""
          echo "Known resource remaining count:"
          echo "  $REMAINING"

          echo "remaining_count=$REMAINING" >> "$GITHUB_OUTPUT"

      # ===============================================================
      # STEP 37
      # FINAL TERRAFORM STATE VERIFICATION
      # ===============================================================

      - name: "Step 37 - Verify Terraform State"
        id: state_check
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "FINAL TERRAFORM STATE VERIFICATION"
          echo "=============================================================="

          STATE_LIST="$(
            terraform state list 2>/dev/null || true
          )"

          if [[ -n "$STATE_LIST" ]]; then

            echo ""
            echo "Terraform state still contains:"
            echo ""

            echo "$STATE_LIST"

            echo "state_empty=false" >> "$GITHUB_OUTPUT"

          else

            echo ""
            echo "Terraform state is EMPTY."

            echo "state_empty=true" >> "$GITHUB_OUTPUT"

          fi

      # ===============================================================
      # STEP 38
      # FINAL TERRAFORM DESTROY PLAN
      # ===============================================================

      - name: "Step 38 - Final Terraform Destroy Plan"
        id: final_plan
        continue-on-error: true
        working-directory: ${{ env.TERRAFORM_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "FINAL TERRAFORM DESTROY PLAN"
          echo "=============================================================="

          terraform plan \
            -destroy \
            -input=false \
            -no-color

          echo ""
          echo "Final Terraform destroy plan completed."

      # ===============================================================
      # STEP 39
      # FINAL SUCCESS / FAILURE DECISION
      # ===============================================================

      - name: "Step 39 - Final Cleanup Verification"
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================================"
          echo "FINAL CHARLIE CAFE CLEANUP VERIFICATION"
          echo "================================================================"

          CLEANUP_ORPHANS="${{ github.event.inputs.cleanup_orphans }}"
          STATE_EMPTY="${{ steps.state_check.outputs.state_empty }}"
          FINAL_PLAN_RESULT="${{ steps.final_plan.outcome }}"

          PROJECT_REMAINING="0"
          KNOWN_REMAINING="0"

          if [[ "$CLEANUP_ORPHANS" == "true" ]]; then

            PROJECT_REMAINING="${{ steps.final_scan.outputs.remaining_count }}"
            KNOWN_REMAINING="${{ steps.known_scan.outputs.remaining_count }}"

          fi

          echo ""
          echo "AWS orphan cleanup enabled:"
          echo "  $CLEANUP_ORPHANS"

          echo ""
          echo "Terraform state empty:"
          echo "  $STATE_EMPTY"

          echo ""
          echo "Project-tagged AWS resources remaining:"
          echo "  $PROJECT_REMAINING"

          echo ""
          echo "Known Charlie Cafe resources remaining:"
          echo "  $KNOWN_REMAINING"

          echo ""
          echo "Final Terraform destroy plan:"
          echo "  $FINAL_PLAN_RESULT"

          echo ""

          # ============================================================
          # CRITICAL TERRAFORM CHECK
          # ============================================================

          if [[ "$STATE_EMPTY" != "true" ]]; then

            echo "ERROR:"
            echo "Terraform state is NOT empty."
            echo "Step 39 cannot be considered successful."

            exit 1

          fi

          # ============================================================
          # CRITICAL TERRAFORM PLAN CHECK
          # ============================================================

          if [[ "$FINAL_PLAN_RESULT" != "success" ]]; then

            echo "ERROR:"
            echo "Final Terraform destroy plan failed."
            echo "Step 39 cannot be considered successful."

            exit 1

          fi

          # ============================================================
          # AWS RESOURCE WARNING CHECK
          #
          # Remaining AWS resources are NOT treated as a failure here.
          # The next cleanup job will handle them.
          # ============================================================

          if [[ "$CLEANUP_ORPHANS" == "true" ]]; then

            if [[ "$PROJECT_REMAINING" != "0" ]]; then

              echo "WARNING:"
              echo "Project-tagged AWS resources still exist."
              echo "The next cleanup job will attempt to remove them."

            else

              echo "[OK] No Project-tagged AWS resources remain."

            fi

            if [[ "$KNOWN_REMAINING" != "0" ]]; then

              echo ""
              echo "WARNING:"
              echo "Known Charlie Cafe AWS resources still exist."
              echo "The next cleanup job will attempt to remove them."

              echo ""
              echo "Remaining resource count:"
              echo "  $KNOWN_REMAINING"

            else

              echo ""
              echo "[OK] No known Charlie Cafe resources remain."

            fi

          fi

          # ============================================================
          # STEP 39 ALWAYS COMPLETES SUCCESSFULLY WHEN TERRAFORM
          # VALIDATION CHECKS PASSED.
          # ============================================================

          echo ""
          echo "================================================================"
          echo "STEP 39 VERIFICATION COMPLETE"
          echo "================================================================"
          echo ""

          echo "[OK] Terraform state verification completed"
          echo "[OK] Final Terraform destroy plan completed"

          if [[ "$CLEANUP_ORPHANS" == "true" ]]; then

            if [[ "$PROJECT_REMAINING" != "0" ||
                  "$KNOWN_REMAINING" != "0" ]]; then

              echo ""
              echo "[WARNING] AWS resources remain."
              echo "[INFO] Continuing to the next cleanup job."
              echo "[INFO] The next cleanup job will perform the final sweep."

            else

              echo ""
              echo "[OK] No AWS resources remain."
              echo "[OK] No additional cleanup is required."

            fi

          else

            echo ""
            echo "[INFO] AWS orphan cleanup was disabled."

          fi

          echo ""
          echo "================================================================"
          echo "       STEP 39 COMPLETED SUCCESSFULLY"
          echo "================================================================"

      # ===============================================================
      # STEP 40
      # CLEANUP WORKFLOW SUMMARY
      # ===============================================================

      - name: "Step 40 - Cleanup Summary"
        if: always()
        shell: bash
        run: |

          echo ""
          echo "================================================================"
          echo "CHARLIE CAFE TERRAFORM CLEANUP SUMMARY"
          echo "================================================================"

          echo ""
          echo "AWS Region:"
          echo "  $AWS_REGION"

          echo ""
          echo "Terraform directory:"
          echo "  $TERRAFORM_WORKING_DIRECTORY"

          echo ""
          echo "Project:"
          echo "  $PROJECT_TAG_VALUE"

          echo ""
          echo "AWS orphan cleanup:"
          echo "  ${{ github.event.inputs.cleanup_orphans }}"

          echo ""
          echo "Terraform destroy plan:"
          echo "  ${{ steps.terraform_destroy_plan.outcome }}"

          echo ""
          echo "Terraform destroy first attempt:"
          echo "  ${{ steps.terraform_destroy.outcome }}"

          echo ""
          echo "Terraform destroy second attempt:"
          echo "  ${{ steps.terraform_destroy_retry.outcome }}"

          echo ""
          echo "Terraform destroy final attempt:"
          echo "  ${{ steps.terraform_destroy_final.outcome }}"

          echo ""
          echo "Final AWS tagged-resource scan:"
          echo "  ${{ steps.final_scan.outcome }}"

          echo ""
          echo "Final known-resource scan:"
          echo "  ${{ steps.known_scan.outcome }}"

          echo ""
          echo "Final Terraform state verification:"
          echo "  ${{ steps.state_check.outcome }}"

          echo ""
          echo "Final Terraform destroy plan:"
          echo "  ${{ steps.final_plan.outcome }}"

          echo ""
          echo "================================================================"
          echo "END OF CLEANUP SUMMARY"
          echo "================================================================"


  # ===================================================================
  # NEW JOB
  # FINAL AWS RESOURCE SWEEP
  #
  # IMPORTANT:
  #
  # This is deliberately a SEPARATE JOB.
  #
  # It runs even if delete-lab fails.
  #
  # This solves the situation where:
  #
  #   delete-lab -> detects remaining resource -> exits 1
  #
  # but AWS still contains:
  #
  #   RDS
  #   S3
  #   VPC
  #   EC2
  #   ALB
  #   ECS
  #   ECR
  #
  # The final sweep gets another opportunity to remove them.
  # ===================================================================

  final-aws-resource-sweep:

    name: Final AWS Multi-Resource Cleanup Sweep

    # -----------------------------------------------------------------
    # ALWAYS RUN AFTER MAIN CLEANUP JOB
    #
    # Even if delete-lab fails, this job runs.
    # -----------------------------------------------------------------

    needs:
      - delete-lab

    if: ${{ always() }}

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ===============================================================
      # FINAL STEP 1
      # CONFIRMATION
      #
      # This repeats the destructive confirmation in the independent
      # job so that this job never performs deletion accidentally when
      # called by another event.
      # ===============================================================

      - name: "Final Sweep Step 1 - Verify DELETE Confirmation"
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "FINAL AWS MULTI-RESOURCE CLEANUP SWEEP"
          echo "=============================================================="

          CONFIRMATION="${{ github.event.inputs.confirmation }}"
          CLEANUP_ORPHANS="${{ github.event.inputs.cleanup_orphans }}"

          if [[ "$CONFIRMATION" != "DELETE" ]]; then

            echo ""
            echo "DELETE confirmation is not present."
            echo "Final AWS sweep will NOT execute."

            exit 1

          fi

          if [[ "$CLEANUP_ORPHANS" != "true" ]]; then

            echo ""
            echo "cleanup_orphans is false."
            echo "Final AWS orphan sweep will NOT execute."

            exit 0

          fi

          echo ""
          echo "DELETE confirmation accepted."

          echo ""
          echo "Final AWS sweep enabled."

      # ===============================================================
      # FINAL SWEEP STEP 2
      # CONFIGURE AWS CREDENTIALS
      # ===============================================================

      - name: "Final Sweep Step 2 - Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ===============================================================
      # FINAL SWEEP STEP 3
      # VERIFY AWS ACCOUNT
      # ===============================================================

      - name: "Final Sweep Step 3 - Verify AWS Account"
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "FINAL SWEEP AWS ACCOUNT"
          echo "=============================================================="

          aws sts get-caller-identity

          echo ""
          echo "Region:"
          echo "  $AWS_REGION"

      # ===============================================================
      # FINAL SWEEP STEP 4
      #
      # DISCOVER ALL TARGET VPCS
      #
      # MATCHING:
      #
      #   Project=CharlieCafe-TF-Lab
      #
      # OR:
      #
      #   Name=CharlieCafe-TF-Lab-VPC
      #
      # OR:
      #
      #   Name begins with CharlieCafe-TF-
      #
      # IDs are saved for use by all later cleanup operations.
      # ===============================================================

      - name: "Final Sweep Step 4 - Discover Charlie Cafe VPCs"
        id: discover_vpcs
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "DISCOVERING CHARLIE CAFE VPCS"
          echo "=============================================================="

          TMP_FILE="/tmp/charlie-vpcs.txt"

          : > "$TMP_FILE"

          # -----------------------------------------------------------
          # Project-tagged VPCs.
          # -----------------------------------------------------------

          aws ec2 describe-vpcs \
            --region "$AWS_REGION" \
            --filters \
              "Name=tag:$PROJECT_TAG_KEY,Values=$PROJECT_TAG_VALUE" \
            --query "Vpcs[].VpcId" \
            --output text \
            --no-cli-pager \
            2>/dev/null \
            | tr '\t' '\n' \
            | grep '^vpc-' \
            >> "$TMP_FILE" || true

          # -----------------------------------------------------------
          # Exact known VPC name.
          # -----------------------------------------------------------

          aws ec2 describe-vpcs \
            --region "$AWS_REGION" \
            --filters \
              "Name=tag:Name,Values=$VPC_NAME" \
            --query "Vpcs[].VpcId" \
            --output text \
            --no-cli-pager \
            2>/dev/null \
            | tr '\t' '\n' \
            | grep '^vpc-' \
            >> "$TMP_FILE" || true

          # -----------------------------------------------------------
          # Charlie Cafe Terraform VPC name prefix.
          #
          # This catches multiple differently named Charlie Cafe VPCs.
          # -----------------------------------------------------------

          aws ec2 describe-vpcs \
            --region "$AWS_REGION" \
            --filters \
              "Name=tag:Name,Values=CharlieCafe-TF-*" \
            --query "Vpcs[].VpcId" \
            --output text \
            --no-cli-pager \
            2>/dev/null \
            | tr '\t' '\n' \
            | grep '^vpc-' \
            >> "$TMP_FILE" || true

          sort -u "$TMP_FILE" > /tmp/charlie-vpcs-final.txt

          VPC_COUNT="$(
            grep -c '^vpc-' /tmp/charlie-vpcs-final.txt \
            2>/dev/null || true
          )"

          echo ""
          echo "Charlie Cafe VPCs discovered:"
          echo "  $VPC_COUNT"

          if [[ "$VPC_COUNT" -gt 0 ]]; then
            cat /tmp/charlie-vpcs-final.txt
          else
            echo "No Charlie Cafe VPCs discovered."
          fi

          # -----------------------------------------------------------
          # Store multiline list for later steps.
          # -----------------------------------------------------------

          {
            echo "vpc_ids<<EOF"
            cat /tmp/charlie-vpcs-final.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ===============================================================
      # FINAL SWEEP STEP 5
      # RDS
      #
      # THIS IS THE ADDITIONAL RDS SAFETY NET.
      #
      # It discovers:
      #
      #   1. Exact identifier
      #   2. charliecafe-tf-* identifiers
      #   3. Project-tagged RDS instances
      #
      # Deletion protection is disabled first.
      # ===============================================================

      - name: "Final Sweep Step 5 - Delete All Charlie Cafe RDS"
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "FINAL RDS CLEANUP"
          echo "=============================================================="

          RDS_FILE="/tmp/charlie-rds.txt"

          : > "$RDS_FILE"

          # -----------------------------------------------------------
          # Exact known RDS identifier.
          # -----------------------------------------------------------

          aws rds describe-db-instances \
            --region "$AWS_REGION" \
            --query "DBInstances[?DBInstanceIdentifier=='$RDS_IDENTIFIER'].DBInstanceIdentifier" \
            --output text \
            --no-cli-pager \
            2>/dev/null \
            | tr '\t' '\n' \
            | grep -v '^None$' \
            | grep -v '^$' \
            >> "$RDS_FILE" || true

          # -----------------------------------------------------------
          # Any RDS instance using the Charlie Cafe Terraform prefix.
          # -----------------------------------------------------------

          aws rds describe-db-instances \
            --region "$AWS_REGION" \
            --query "DBInstances[?starts_with(DBInstanceIdentifier, 'charliecafe-tf-')].DBInstanceIdentifier" \
            --output text \
            --no-cli-pager \
            2>/dev/null \
            | tr '\t' '\n' \
            | grep -v '^None$' \
            | grep -v '^$' \
            >> "$RDS_FILE" || true

          # -----------------------------------------------------------
          # Project-tagged RDS instances.
          # -----------------------------------------------------------

          ALL_RDS="$(
            aws rds describe-db-instances \
              --region "$AWS_REGION" \
              --query "DBInstances[].DBInstanceIdentifier" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          for DB in $ALL_RDS; do

            [[ "$DB" == "None" ]] && continue
            [[ -z "$DB" ]] && continue

            TAG_MATCH="$(
              aws rds list-tags-for-resource \
                --resource-name "arn:aws:rds:$AWS_REGION:$(aws sts get-caller-identity --query Account --output text):db:$DB" \
                --region "$AWS_REGION" \
                --query "TagList[?Key=='$PROJECT_TAG_KEY' && Value=='$PROJECT_TAG_VALUE'].Value" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            if [[ "$TAG_MATCH" == "$PROJECT_TAG_VALUE" ]]; then
              echo "$DB" >> "$RDS_FILE"
            fi

          done

          sort -u "$RDS_FILE" -o "$RDS_FILE"

          echo ""
          echo "RDS instances selected for cleanup:"

          if [[ -s "$RDS_FILE" ]]; then
            cat "$RDS_FILE"
          else
            echo "  None"
          fi

          # -----------------------------------------------------------
          # Delete every discovered RDS instance.
          # -----------------------------------------------------------

          while IFS= read -r DB; do

            [[ -z "$DB" ]] && continue

            echo ""
            echo "=============================================================="
            echo "RDS INSTANCE: $DB"
            echo "=============================================================="

            PROTECTION="$(
              aws rds describe-db-instances \
                --db-instance-identifier "$DB" \
                --region "$AWS_REGION" \
                --query "DBInstances[0].DeletionProtection" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            echo "Deletion protection: $PROTECTION"

            if [[ "$PROTECTION" == "True" ]]; then

              echo "Disabling deletion protection..."

              aws rds modify-db-instance \
                --db-instance-identifier "$DB" \
                --no-deletion-protection \
                --apply-immediately \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

              for ATTEMPT in $(seq 1 "$WAIT_ATTEMPTS"); do

                CURRENT="$(
                  aws rds describe-db-instances \
                    --db-instance-identifier "$DB" \
                    --region "$AWS_REGION" \
                    --query "DBInstances[0].DeletionProtection" \
                    --output text \
                    --no-cli-pager \
                    2>/dev/null || true
                )"

                echo "Attempt $ATTEMPT/$WAIT_ATTEMPTS - Protection: $CURRENT"

                if [[ "$CURRENT" != "True" ]]; then
                  break
                fi

                sleep "$WAIT_SECONDS"

              done

            fi

            echo "Deleting RDS instance..."

            aws rds delete-db-instance \
              --db-instance-identifier "$DB" \
              --skip-final-snapshot \
              --delete-automated-backups \
              --region "$AWS_REGION" \
              --no-cli-pager \
              2>/dev/null || true

          done < "$RDS_FILE"

          # -----------------------------------------------------------
          # Wait for all discovered RDS instances to disappear.
          # -----------------------------------------------------------

          while IFS= read -r DB; do

            [[ -z "$DB" ]] && continue

            for ATTEMPT in $(seq 1 "$WAIT_ATTEMPTS"); do

              STATUS="$(
                aws rds describe-db-instances \
                  --db-instance-identifier "$DB" \
                  --region "$AWS_REGION" \
                  --query "DBInstances[0].DBInstanceStatus" \
                  --output text \
                  --no-cli-pager \
                  2>/dev/null || true
              )"

              if [[ "$STATUS" == "None" ||
                    "$STATUS" == "null" ||
                    -z "$STATUS" ]]; then

                echo "RDS $DB no longer exists."
                break

              fi

              echo "RDS $DB status: $STATUS"
              echo "Waiting $ATTEMPT/$WAIT_ATTEMPTS"

              sleep "$WAIT_SECONDS"

            done

          done < "$RDS_FILE"

          # -----------------------------------------------------------
          # Delete matching subnet groups.
          # -----------------------------------------------------------

          SUBNET_GROUPS="$(
            aws rds describe-db-subnet-groups \
              --region "$AWS_REGION" \
              --query "DBSubnetGroups[?starts_with(DBSubnetGroupName, 'charliecafe-tf-')].DBSubnetGroupName" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          for SUBNET_GROUP in $SUBNET_GROUPS; do

            [[ "$SUBNET_GROUP" == "None" ]] && continue
            [[ -z "$SUBNET_GROUP" ]] && continue

            echo ""
            echo "Deleting RDS subnet group:"
            echo "  $SUBNET_GROUP"

            aws rds delete-db-subnet-group \
              --db-subnet-group-name "$SUBNET_GROUP" \
              --region "$AWS_REGION" \
              --no-cli-pager \
              2>/dev/null || true

          done

          echo ""
          echo "Final RDS cleanup completed."

      # ===============================================================
      # FINAL SWEEP STEP 6
      # S3
      #
      # THIS MATCHES THE USER'S POWERSHELL IDEA:
      #
      #   starts_with(Name, 'terraform-')
      #
      # It handles:
      #
      #   - normal objects
      #   - versioned objects
      #   - delete markers
      #   - multiple buckets
      #
      # Terraform backend bucket is protected when detected.
      # ===============================================================

      - name: "Final Sweep Step 6 - Delete All terraform-* S3 Buckets"
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "FINAL S3 MULTI-BUCKET CLEANUP"
          echo "=============================================================="

          BACKEND_BUCKET=""

          # -----------------------------------------------------------
          # Attempt to detect Terraform backend bucket.
          # -----------------------------------------------------------

          if [[ -f "$TERRAFORM_WORKING_DIRECTORY/.terraform/terraform.tfstate" ]]; then

            BACKEND_BUCKET="$(
              jq -r '
                .backend.config.bucket
                // .backend.config.bucket_name
                // empty
              ' \
              "$TERRAFORM_WORKING_DIRECTORY/.terraform/terraform.tfstate" \
              2>/dev/null || true
            )"

          fi

          echo ""
          echo "Detected Terraform backend bucket:"
          echo "  ${BACKEND_BUCKET:-NOT_DETECTED}"

          # -----------------------------------------------------------
          # Discover every bucket whose name starts with terraform-.
          # -----------------------------------------------------------

          BUCKETS="$(
            aws s3api list-buckets \
              --query "Buckets[?starts_with(Name, 'terraform-')].Name" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          echo ""
          echo "terraform-* buckets discovered:"

          if [[ -z "$BUCKETS" ||
                "$BUCKETS" == "None" ]]; then

            echo "  None"

          else

            echo "$BUCKETS"

          fi

          # -----------------------------------------------------------
          # Process every matching bucket.
          # -----------------------------------------------------------

          for BUCKET in $BUCKETS; do

            [[ -z "$BUCKET" ]] && continue
            [[ "$BUCKET" == "None" ]] && continue

            # ---------------------------------------------------------
            # Protect Terraform backend.
            # ---------------------------------------------------------

            if [[ -n "$BACKEND_BUCKET" &&
                  "$BUCKET" == "$BACKEND_BUCKET" ]]; then

              echo ""
              echo "=============================================================="
              echo "PROTECTED TERRAFORM BACKEND BUCKET"
              echo "=============================================================="
              echo "Bucket:"
              echo "  $BUCKET"
              echo ""
              echo "Skipping backend bucket to protect Terraform state."

              continue

            fi

            echo ""
            echo "=============================================================="
            echo "DELETING S3 BUCKET"
            echo "=============================================================="
            echo "Bucket:"
            echo "  $BUCKET"

            # ---------------------------------------------------------
            # Delete current objects.
            # ---------------------------------------------------------

            aws s3 rm \
              "s3://$BUCKET" \
              --recursive \
              --region "$AWS_REGION" \
              --no-progress \
              2>/dev/null || true

            # ---------------------------------------------------------
            # Delete versions and delete markers.
            # ---------------------------------------------------------

            for PASS in $(seq 1 100); do

              VERSION_DATA="$(
                aws s3api list-object-versions \
                  --bucket "$BUCKET" \
                  --region "$AWS_REGION" \
                  --output json \
                  --no-cli-pager \
                  2>/dev/null || echo '{}'
              )"

              OBJECT_COUNT="$(
                echo "$VERSION_DATA" |
                  jq '
                    ((.Versions // []) + (.DeleteMarkers // []))
                    | length
                  '
              )"

              echo ""
              echo "Bucket $BUCKET"
              echo "Version cleanup pass: $PASS"
              echo "Remaining versions/delete markers: $OBJECT_COUNT"

              if [[ "$OBJECT_COUNT" -eq 0 ]]; then
                break
              fi

              echo "$VERSION_DATA" |
                jq '
                  {
                    Objects:
                      (
                        ((.Versions // []) + (.DeleteMarkers // []))
                        | map({
                            Key: .Key,
                            VersionId: .VersionId
                          })
                        | .[0:1000]
                      ),
                    Quiet: true
                  }
                ' \
                > /tmp/s3-delete-final.json

              aws s3api delete-objects \
                --bucket "$BUCKET" \
                --delete file:///tmp/s3-delete-final.json \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            done

            # ---------------------------------------------------------
            # Finally delete bucket.
            # ---------------------------------------------------------

            echo ""
            echo "Deleting bucket itself..."

            aws s3api delete-bucket \
              --bucket "$BUCKET" \
              --region "$AWS_REGION" \
              --no-cli-pager \
              2>/dev/null || true

            echo "S3 bucket cleanup command completed."

          done

          echo ""
          echo "Final S3 multi-bucket cleanup completed."

      # ===============================================================
      # FINAL SWEEP STEP 7
      # ECS
      #
      # Discovers the known cluster and any CharlieCafe-TF-* cluster.
      # ===============================================================

      - name: "Final Sweep Step 7 - Delete ECS Resources"
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "FINAL ECS CLEANUP"
          echo "=============================================================="

          CLUSTER_FILE="/tmp/charlie-clusters.txt"

          : > "$CLUSTER_FILE"

          # -----------------------------------------------------------
          # Exact known cluster.
          # -----------------------------------------------------------

          aws ecs describe-clusters \
            --clusters "$ECS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query "clusters[?status!='INACTIVE'].clusterArn" \
            --output text \
            --no-cli-pager \
            2>/dev/null \
            | tr '\t' '\n' \
            | grep '^arn:aws:ecs:' \
            >> "$CLUSTER_FILE" || true

          # -----------------------------------------------------------
          # Discover all ECS clusters and select Charlie Cafe Terraform
          # names.
          # -----------------------------------------------------------

          ALL_CLUSTERS="$(
            aws ecs list-clusters \
              --region "$AWS_REGION" \
              --query "clusterArns[]" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          for CLUSTER_ARN in $ALL_CLUSTERS; do

            [[ -z "$CLUSTER_ARN" ]] && continue
            [[ "$CLUSTER_ARN" == "None" ]] && continue

            CLUSTER_NAME="${CLUSTER_ARN##*/}"

            if [[ "$CLUSTER_NAME" == CharlieCafe-TF-* ||
                  "$CLUSTER_NAME" == "$ECS_CLUSTER_NAME" ]]; then

              echo "$CLUSTER_ARN" >> "$CLUSTER_FILE"

            fi

          done

          sort -u "$CLUSTER_FILE" -o "$CLUSTER_FILE"

          if [[ -s "$CLUSTER_FILE" ]]; then
            cat "$CLUSTER_FILE"
          else
            echo "No Charlie Cafe ECS clusters found."
          fi

          # -----------------------------------------------------------
          # Cleanup services and tasks for every matching cluster.
          # -----------------------------------------------------------

          while IFS= read -r CLUSTER_ARN; do

            [[ -z "$CLUSTER_ARN" ]] && continue

            echo ""
            echo "=============================================================="
            echo "ECS CLUSTER"
            echo "  $CLUSTER_ARN"
            echo "=============================================================="

            SERVICES="$(
              aws ecs list-services \
                --cluster "$CLUSTER_ARN" \
                --region "$AWS_REGION" \
                --query "serviceArns[]" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            for SERVICE_ARN in $SERVICES; do

              [[ -z "$SERVICE_ARN" ]] && continue
              [[ "$SERVICE_ARN" == "None" ]] && continue

              SERVICE_NAME="${SERVICE_ARN##*/}"

              echo ""
              echo "ECS service:"
              echo "  $SERVICE_NAME"

              aws ecs update-service \
                --cluster "$CLUSTER_ARN" \
                --service "$SERVICE_NAME" \
                --desired-count 0 \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

              # -------------------------------------------------------
              # Wait for service tasks.
              # -------------------------------------------------------

              for ATTEMPT in $(seq 1 30); do

                RUNNING="$(
                  aws ecs describe-services \
                    --cluster "$CLUSTER_ARN" \
                    --services "$SERVICE_NAME" \
                    --region "$AWS_REGION" \
                    --query "services[0].runningCount" \
                    --output text \
                    --no-cli-pager \
                    2>/dev/null || echo "0"
                )"

                [[ "$RUNNING" == "None" ]] && RUNNING="0"
                [[ "$RUNNING" == "null" ]] && RUNNING="0"

                echo "Attempt $ATTEMPT/30 - Running tasks: $RUNNING"

                if [[ "$RUNNING" == "0" ]]; then
                  break
                fi

                sleep 10

              done

              echo ""
              echo "Deleting ECS service..."

              aws ecs delete-service \
                --cluster "$CLUSTER_ARN" \
                --service "$SERVICE_NAME" \
                --force \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            done

            # ---------------------------------------------------------
            # Delete remaining tasks.
            # ---------------------------------------------------------

            TASKS="$(
              aws ecs list-tasks \
                --cluster "$CLUSTER_ARN" \
                --region "$AWS_REGION" \
                --query "taskArns[]" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            for TASK in $TASKS; do

              [[ -z "$TASK" ]] && continue
              [[ "$TASK" == "None" ]] && continue

              echo ""
              echo "Stopping ECS task:"
              echo "  $TASK"

              aws ecs stop-task \
                --cluster "$CLUSTER_ARN" \
                --task "$TASK" \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            done

            echo ""
            echo "Deleting ECS cluster..."

            aws ecs delete-cluster \
              --cluster "$CLUSTER_ARN" \
              --region "$AWS_REGION" \
              --no-cli-pager \
              2>/dev/null || true

          done < "$CLUSTER_FILE"

          # -----------------------------------------------------------
          # Deregister Charlie Cafe task definitions.
          # -----------------------------------------------------------

          TASK_DEFINITIONS="$(
            aws ecs list-task-definitions \
              --region "$AWS_REGION" \
              --status ACTIVE \
              --query "taskDefinitionArns[]" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          for TASK_DEF in $TASK_DEFINITIONS; do

            [[ -z "$TASK_DEF" ]] && continue
            [[ "$TASK_DEF" == "None" ]] && continue

            TASK_FAMILY="$(
              aws ecs describe-task-definition \
                --task-definition "$TASK_DEF" \
                --region "$AWS_REGION" \
                --query "taskDefinition.family" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            if [[ "$TASK_FAMILY" == charlie-cafe-tf* ||
                  "$TASK_FAMILY" == CharlieCafe-TF-* ]]; then

              echo ""
              echo "Deregistering task definition:"
              echo "  $TASK_DEF"

              aws ecs deregister-task-definition \
                --task-definition "$TASK_DEF" \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            fi

          done

          echo ""
          echo "Final ECS cleanup completed."

      # ===============================================================
      # FINAL SWEEP STEP 8
      # ECR
      #
      # Deletes:
      #
      #   charlie-cafe-tf
      #
      # and repositories whose name starts with:
      #
      #   charlie-cafe-tf-
      # ===============================================================

      - name: "Final Sweep Step 8 - Delete ECR Repositories"
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "FINAL ECR CLEANUP"
          echo "=============================================================="

          REPOSITORIES="$(
            aws ecr describe-repositories \
              --region "$AWS_REGION" \
              --query "repositories[?repositoryName=='$ECR_REPOSITORY_NAME' || starts_with(repositoryName, 'charlie-cafe-tf-')].repositoryName" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          for REPOSITORY in $REPOSITORIES; do

            [[ -z "$REPOSITORY" ]] && continue
            [[ "$REPOSITORY" == "None" ]] && continue

            echo ""
            echo "Deleting ECR repository:"
            echo "  $REPOSITORY"

            aws ecr delete-repository \
              --repository-name "$REPOSITORY" \
              --force \
              --region "$AWS_REGION" \
              --no-cli-pager \
              2>/dev/null || true

          done

          echo ""
          echo "Final ECR cleanup completed."

      # ===============================================================
      # FINAL SWEEP STEP 9
      # ALB + TARGET GROUPS
      #
      # Handles multiple ALBs/target groups matching CharlieCafe-TF.
      # ===============================================================

      - name: "Final Sweep Step 9 - Delete ALBs and Target Groups"
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "FINAL ALB AND TARGET GROUP CLEANUP"
          echo "=============================================================="

          ALB_ARNS="$(
            aws elbv2 describe-load-balancers \
              --region "$AWS_REGION" \
              --query "LoadBalancers[?starts_with(LoadBalancerName, 'CharlieCafe-TF-') || LoadBalancerName=='$ALB_NAME'].LoadBalancerArn" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          for ALB_ARN in $ALB_ARNS; do

            [[ -z "$ALB_ARN" ]] && continue
            [[ "$ALB_ARN" == "None" ]] && continue

            echo ""
            echo "ALB:"
            echo "  $ALB_ARN"

            LISTENERS="$(
              aws elbv2 describe-listeners \
                --load-balancer-arn "$ALB_ARN" \
                --region "$AWS_REGION" \
                --query "Listeners[].ListenerArn" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            for LISTENER in $LISTENERS; do

              [[ -z "$LISTENER" ]] && continue
              [[ "$LISTENER" == "None" ]] && continue

              echo ""
              echo "Deleting listener:"
              echo "  $LISTENER"

              aws elbv2 delete-listener \
                --listener-arn "$LISTENER" \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            done

            echo ""
            echo "Deleting ALB..."

            aws elbv2 delete-load-balancer \
              --load-balancer-arn "$ALB_ARN" \
              --region "$AWS_REGION" \
              --no-cli-pager \
              2>/dev/null || true

          done

          # -----------------------------------------------------------
          # Delete target groups independently.
          #
          # This handles target groups even when their ALB has already
          # disappeared.
          # -----------------------------------------------------------

          TARGET_GROUP_ARNS="$(
            aws elbv2 describe-target-groups \
              --region "$AWS_REGION" \
              --query "TargetGroups[?starts_with(TargetGroupName, 'CharlieCafe-TF-') || TargetGroupName=='$TARGET_GROUP_NAME'].TargetGroupArn" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          for TG_ARN in $TARGET_GROUP_ARNS; do

            [[ -z "$TG_ARN" ]] && continue
            [[ "$TG_ARN" == "None" ]] && continue

            echo ""
            echo "Deleting target group:"
            echo "  $TG_ARN"

            aws elbv2 delete-target-group \
              --target-group-arn "$TG_ARN" \
              --region "$AWS_REGION" \
              --no-cli-pager \
              2>/dev/null || true

          done

          echo ""
          echo "Final ALB/Target Group cleanup completed."

      # ===============================================================
      # FINAL SWEEP STEP 10
      # EC2
      #
      # Handles multiple instances through:
      #
      #   Project tag
      #
      # and:
      #
      #   Name=CharlieCafe-TF-*
      # ===============================================================

      - name: "Final Sweep Step 10 - Delete EC2 Instances"
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "FINAL EC2 CLEANUP"
          echo "=============================================================="

          INSTANCE_FILE="/tmp/charlie-instances.txt"

          : > "$INSTANCE_FILE"

          aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters \
              "Name=tag:$PROJECT_TAG_KEY,Values=$PROJECT_TAG_VALUE" \
              "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text \
            --no-cli-pager \
            2>/dev/null \
            | tr '\t' '\n' \
            | grep '^i-' \
            >> "$INSTANCE_FILE" || true

          aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters \
              "Name=tag:Name,Values=CharlieCafe-TF-*" \
              "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text \
            --no-cli-pager \
            2>/dev/null \
            | tr '\t' '\n' \
            | grep '^i-' \
            >> "$INSTANCE_FILE" || true

          sort -u "$INSTANCE_FILE" -o "$INSTANCE_FILE"

          if [[ -s "$INSTANCE_FILE" ]]; then

            echo ""
            echo "EC2 instances selected:"
            cat "$INSTANCE_FILE"

            IDS="$(tr '\n' ' ' < "$INSTANCE_FILE")"

            echo ""
            echo "Terminating EC2 instances..."

            aws ec2 terminate-instances \
              --instance-ids $IDS \
              --region "$AWS_REGION" \
              --no-cli-pager \
              2>/dev/null || true

            echo ""
            echo "Waiting for EC2 termination..."

            aws ec2 wait instance-terminated \
              --instance-ids $IDS \
              --region "$AWS_REGION" \
              2>/dev/null || true

          else

            echo ""
            echo "No Charlie Cafe EC2 instances found."

          fi

          echo ""
          echo "Final EC2 cleanup completed."

      # ===============================================================
      # FINAL SWEEP STEP 11
      # EFS DEPENDENCY CLEANUP
      #
      # This is included because leftover EFS mount targets can prevent
      # VPC deletion.
      # ===============================================================

      - name: "Final Sweep Step 11 - Cleanup EFS Dependencies"
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "FINAL EFS DEPENDENCY CLEANUP"
          echo "=============================================================="

          FILE_SYSTEMS="$(
            aws efs describe-file-systems \
              --region "$AWS_REGION" \
              --query "FileSystems[?starts_with(Name, 'CharlieCafe-TF-') || Name=='$EFS_NAME'].FileSystemId" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          for FS_ID in $FILE_SYSTEMS; do

            [[ -z "$FS_ID" ]] && continue
            [[ "$FS_ID" == "None" ]] && continue

            echo ""
            echo "EFS:"
            echo "  $FS_ID"

            MOUNTS="$(
              aws efs describe-mount-targets \
                --file-system-id "$FS_ID" \
                --region "$AWS_REGION" \
                --query "MountTargets[].MountTargetId" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            for MT in $MOUNTS; do

              [[ -z "$MT" ]] && continue
              [[ "$MT" == "None" ]] && continue

              echo ""
              echo "Deleting EFS mount target:"
              echo "  $MT"

              aws efs delete-mount-target \
                --mount-target-id "$MT" \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            done

            for ATTEMPT in $(seq 1 30); do

              REMAINING="$(
                aws efs describe-mount-targets \
                  --file-system-id "$FS_ID" \
                  --region "$AWS_REGION" \
                  --query "MountTargets | length(@)" \
                  --output text \
                  --no-cli-pager \
                  2>/dev/null || echo "0"
              )"

              echo "EFS mount targets remaining: $REMAINING"

              if [[ "$REMAINING" == "0" ]]; then
                break
              fi

              sleep 10

            done

            echo ""
            echo "Deleting EFS filesystem..."

            aws efs delete-file-system \
              --file-system-id "$FS_ID" \
              --region "$AWS_REGION" \
              --no-cli-pager \
              2>/dev/null || true

          done

          echo ""
          echo "Final EFS dependency cleanup completed."

      # ===============================================================
      # FINAL SWEEP STEP 12
      # VPC ENDPOINTS
      #
      # Uses the VPC IDs discovered at the beginning.
      # ===============================================================

      - name: "Final Sweep Step 12 - Delete VPC Endpoints"
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "FINAL VPC ENDPOINT CLEANUP"
          echo "=============================================================="

          VPC_IDS="$(cat /tmp/charlie-vpcs-final.txt 2>/dev/null || true)"

          for VPC_ID in $VPC_IDS; do

            echo ""
            echo "VPC:"
            echo "  $VPC_ID"

            ENDPOINT_IDS="$(
              aws ec2 describe-vpc-endpoints \
                --region "$AWS_REGION" \
                --filters "Name=vpc-id,Values=$VPC_ID" \
                --query "VpcEndpoints[].VpcEndpointId" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            for ENDPOINT_ID in $ENDPOINT_IDS; do

              [[ -z "$ENDPOINT_ID" ]] && continue
              [[ "$ENDPOINT_ID" == "None" ]] && continue

              echo ""
              echo "Deleting VPC endpoint:"
              echo "  $ENDPOINT_ID"

              aws ec2 delete-vpc-endpoints \
                --vpc-endpoint-ids "$ENDPOINT_ID" \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            done

          done

          echo ""
          echo "Waiting for endpoint ENIs..."

          sleep 15

          echo ""
          echo "Final VPC endpoint cleanup completed."

      # ===============================================================
      # FINAL SWEEP STEP 13
      # NAT GATEWAYS
      # ===============================================================

      - name: "Final Sweep Step 13 - Delete NAT Gateways"
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "FINAL NAT GATEWAY CLEANUP"
          echo "=============================================================="

          VPC_IDS="$(cat /tmp/charlie-vpcs-final.txt 2>/dev/null || true)"

          for VPC_ID in $VPC_IDS; do

            NAT_IDS="$(
              aws ec2 describe-nat-gateways \
                --region "$AWS_REGION" \
                --filter \
                  "Name=vpc-id,Values=$VPC_ID" \
                  "Name=state,Values=pending,available,failed,deleting" \
                --query "NatGateways[].NatGatewayId" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            for NAT_ID in $NAT_IDS; do

              [[ -z "$NAT_ID" ]] && continue
              [[ "$NAT_ID" == "None" ]] && continue

              echo ""
              echo "Deleting NAT gateway:"
              echo "  $NAT_ID"

              aws ec2 delete-nat-gateway \
                --nat-gateway-id "$NAT_ID" \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            done

          done

          echo ""
          echo "Waiting for NAT gateway deletion..."

          for ATTEMPT in $(seq 1 30); do

            REMAINING=0

            for VPC_ID in $VPC_IDS; do

              COUNT="$(
                aws ec2 describe-nat-gateways \
                  --region "$AWS_REGION" \
                  --filter \
                    "Name=vpc-id,Values=$VPC_ID" \
                    "Name=state,Values=pending,available,deleting" \
                  --query "NatGateways | length(@)" \
                  --output text \
                  --no-cli-pager \
                  2>/dev/null || echo "0"
              )"

              REMAINING=$((REMAINING + COUNT))

            done

            echo "Attempt $ATTEMPT/30 - NAT gateways remaining: $REMAINING"

            if [[ "$REMAINING" -eq 0 ]]; then
              break
            fi

            sleep 10

          done

          echo ""
          echo "Final NAT gateway cleanup completed."

      # ===============================================================
      # FINAL SWEEP STEP 14
      # NETWORK INTERFACES
      #
      # Only AVAILABLE ENIs are deleted directly.
      #
      # AWS requester-managed ENIs are not forcibly deleted.
      # They disappear after their parent resource disappears.
      # ===============================================================

      - name: "Final Sweep Step 14 - Cleanup Network Interfaces"
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "FINAL NETWORK INTERFACE CLEANUP"
          echo "=============================================================="

          VPC_IDS="$(cat /tmp/charlie-vpcs-final.txt 2>/dev/null || true)"

          for VPC_ID in $VPC_IDS; do

            echo ""
            echo "VPC:"
            echo "  $VPC_ID"

            ENIS="$(
              aws ec2 describe-network-interfaces \
                --region "$AWS_REGION" \
                --filters "Name=vpc-id,Values=$VPC_ID" \
                --query "NetworkInterfaces[?Status=='available'].NetworkInterfaceId" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            for ENI in $ENIS; do

              [[ -z "$ENI" ]] && continue
              [[ "$ENI" == "None" ]] && continue

              echo ""
              echo "Deleting available ENI:"
              echo "  $ENI"

              aws ec2 delete-network-interface \
                --network-interface-id "$ENI" \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            done

          done

          echo ""
          echo "Final network interface cleanup completed."

      # ===============================================================
      # FINAL SWEEP STEP 15
      # ELASTIC IPS
      # ===============================================================

      - name: "Final Sweep Step 15 - Release Elastic IPs"
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "FINAL ELASTIC IP CLEANUP"
          echo "=============================================================="

          ALLOCATIONS="$(
            aws ec2 describe-addresses \
              --region "$AWS_REGION" \
              --filters \
                "Name=tag:$PROJECT_TAG_KEY,Values=$PROJECT_TAG_VALUE" \
              --query "Addresses[].AllocationId" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          for ALLOCATION in $ALLOCATIONS; do

            [[ -z "$ALLOCATION" ]] && continue
            [[ "$ALLOCATION" == "None" ]] && continue

            echo ""
            echo "Releasing Elastic IP:"
            echo "  $ALLOCATION"

            aws ec2 release-address \
              --allocation-id "$ALLOCATION" \
              --region "$AWS_REGION" \
              --no-cli-pager \
              2>/dev/null || true

          done

          echo ""
          echo "Final Elastic IP cleanup completed."

      # ===============================================================
      # FINAL SWEEP STEP 16
      # SECURITY GROUPS
      #
      # Security groups are deleted after:
      #
      #   ECS
      #   RDS
      #   ALB
      #   ENIs
      # ===============================================================

      - name: "Final Sweep Step 16 - Delete Security Groups"
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "FINAL SECURITY GROUP CLEANUP"
          echo "=============================================================="

          VPC_IDS="$(cat /tmp/charlie-vpcs-final.txt 2>/dev/null || true)"

          for VPC_ID in $VPC_IDS; do

            SG_IDS="$(
              aws ec2 describe-security-groups \
                --region "$AWS_REGION" \
                --filters "Name=vpc-id,Values=$VPC_ID" \
                --query "SecurityGroups[?GroupName!='default'].GroupId" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            for SG_ID in $SG_IDS; do

              [[ -z "$SG_ID" ]] && continue
              [[ "$SG_ID" == "None" ]] && continue

              MATCH="$(
                aws ec2 describe-tags \
                  --region "$AWS_REGION" \
                  --filters \
                    "Name=resource-id,Values=$SG_ID" \
                    "Name=key,Values=$PROJECT_TAG_KEY" \
                    "Name=value,Values=$PROJECT_TAG_VALUE" \
                  --query "Tags[0].Value" \
                  --output text \
                  --no-cli-pager \
                  2>/dev/null || true
              )"

              if [[ "$MATCH" != "$PROJECT_TAG_VALUE" ]]; then
                continue
              fi

              echo ""
              echo "Deleting security group:"
              echo "  $SG_ID"

              aws ec2 delete-security-group \
                --group-id "$SG_ID" \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            done

          done

          echo ""
          echo "Final security group cleanup completed."

      # ===============================================================
      # FINAL SWEEP STEP 17
      # SUBNETS
      # ===============================================================

      - name: "Final Sweep Step 17 - Delete Subnets"
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "FINAL SUBNET CLEANUP"
          echo "=============================================================="

          VPC_IDS="$(cat /tmp/charlie-vpcs-final.txt 2>/dev/null || true)"

          for VPC_ID in $VPC_IDS; do

            SUBNETS="$(
              aws ec2 describe-subnets \
                --region "$AWS_REGION" \
                --filters "Name=vpc-id,Values=$VPC_ID" \
                --query "Subnets[].SubnetId" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            for SUBNET in $SUBNETS; do

              [[ -z "$SUBNET" ]] && continue
              [[ "$SUBNET" == "None" ]] && continue

              MATCH="$(
                aws ec2 describe-tags \
                  --region "$AWS_REGION" \
                  --filters \
                    "Name=resource-id,Values=$SUBNET" \
                    "Name=key,Values=$PROJECT_TAG_KEY" \
                    "Name=value,Values=$PROJECT_TAG_VALUE" \
                  --query "Tags[0].Value" \
                  --output text \
                  --no-cli-pager \
                  2>/dev/null || true
              )"

              if [[ "$MATCH" != "$PROJECT_TAG_VALUE" ]]; then
                continue
              fi

              echo ""
              echo "Deleting subnet:"
              echo "  $SUBNET"

              aws ec2 delete-subnet \
                --subnet-id "$SUBNET" \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            done

          done

          echo ""
          echo "Final subnet cleanup completed."

      # ===============================================================
      # FINAL SWEEP STEP 18
      # ROUTE TABLES
      # ===============================================================

      - name: "Final Sweep Step 18 - Delete Route Tables"
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "FINAL ROUTE TABLE CLEANUP"
          echo "=============================================================="

          VPC_IDS="$(cat /tmp/charlie-vpcs-final.txt 2>/dev/null || true)"

          for VPC_ID in $VPC_IDS; do

            RT_IDS="$(
              aws ec2 describe-route-tables \
                --region "$AWS_REGION" \
                --filters "Name=vpc-id,Values=$VPC_ID" \
                --query "RouteTables[].RouteTableId" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            for RT_ID in $RT_IDS; do

              [[ -z "$RT_ID" ]] && continue
              [[ "$RT_ID" == "None" ]] && continue

              # -------------------------------------------------------
              # Determine whether route table is the main route table.
              # -------------------------------------------------------

              MAIN="$(
                aws ec2 describe-route-tables \
                  --route-table-ids "$RT_ID" \
                  --region "$AWS_REGION" \
                  --query "RouteTables[0].Associations[?Main==\`true\`] | length(@)" \
                  --output text \
                  --no-cli-pager \
                  2>/dev/null || echo "0"
              )"

              if [[ "$MAIN" == "1" ]]; then

                echo ""
                echo "Skipping main route table:"
                echo "  $RT_ID"

                continue

              fi

              MATCH="$(
                aws ec2 describe-tags \
                  --region "$AWS_REGION" \
                  --filters \
                    "Name=resource-id,Values=$RT_ID" \
                    "Name=key,Values=$PROJECT_TAG_KEY" \
                    "Name=value,Values=$PROJECT_TAG_VALUE" \
                  --query "Tags[0].Value" \
                  --output text \
                  --no-cli-pager \
                  2>/dev/null || true
              )"

              if [[ "$MATCH" != "$PROJECT_TAG_VALUE" ]]; then
                continue
              fi

              echo ""
              echo "Route table:"
              echo "  $RT_ID"

              ASSOCIATIONS="$(
                aws ec2 describe-route-tables \
                  --route-table-ids "$RT_ID" \
                  --region "$AWS_REGION" \
                  --query "RouteTables[0].Associations[?Main==\`false\`].RouteTableAssociationId" \
                  --output text \
                  --no-cli-pager \
                  2>/dev/null || true
              )"

              for ASSOCIATION in $ASSOCIATIONS; do

                [[ -z "$ASSOCIATION" ]] && continue
                [[ "$ASSOCIATION" == "None" ]] && continue

                echo "Disassociating:"
                echo "  $ASSOCIATION"

                aws ec2 disassociate-route-table \
                  --association-id "$ASSOCIATION" \
                  --region "$AWS_REGION" \
                  --no-cli-pager \
                  2>/dev/null || true

              done

              echo "Deleting route table..."

              aws ec2 delete-route-table \
                --route-table-id "$RT_ID" \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            done

          done

          echo ""
          echo "Final route table cleanup completed."

      # ===============================================================
      # FINAL SWEEP STEP 19
      # INTERNET GATEWAYS
      # ===============================================================

      - name: "Final Sweep Step 19 - Delete Internet Gateways"
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "FINAL INTERNET GATEWAY CLEANUP"
          echo "=============================================================="

          VPC_IDS="$(cat /tmp/charlie-vpcs-final.txt 2>/dev/null || true)"

          for VPC_ID in $VPC_IDS; do

            IGW_IDS="$(
              aws ec2 describe-internet-gateways \
                --region "$AWS_REGION" \
                --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
                --query "InternetGateways[].InternetGatewayId" \
                --output text \
                --no-cli-pager \
                2>/dev/null || true
            )"

            for IGW_ID in $IGW_IDS; do

              [[ -z "$IGW_ID" ]] && continue
              [[ "$IGW_ID" == "None" ]] && continue

              echo ""
              echo "Detaching internet gateway:"
              echo "  $IGW_ID"

              aws ec2 detach-internet-gateway \
                --internet-gateway-id "$IGW_ID" \
                --vpc-id "$VPC_ID" \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

              echo ""
              echo "Deleting internet gateway..."

              aws ec2 delete-internet-gateway \
                --internet-gateway-id "$IGW_ID" \
                --region "$AWS_REGION" \
                --no-cli-pager \
                2>/dev/null || true

            done

          done

          echo ""
          echo "Final internet gateway cleanup completed."

      # ===============================================================
      # FINAL SWEEP STEP 20
      # FINAL VPC DELETE
      #
      # VPC deletion is attempted repeatedly because AWS dependencies
      # may take time to disappear.
      #
      # IMPORTANT:
      #
      # The VPC itself is restricted to VPCs discovered by the safety
      # filters in Final Sweep Step 4.
      # ===============================================================

      - name: "Final Sweep Step 20 - Delete All Charlie Cafe VPCs"
        id: final_vpc_delete
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================================="
          echo "FINAL CHARLIE CAFE VPC DELETION"
          echo "=============================================================="

          VPC_IDS="$(cat /tmp/charlie-vpcs-final.txt 2>/dev/null || true)"

          if [[ -z "$VPC_IDS" ]]; then

            echo ""
            echo "No Charlie Cafe VPCs were discovered."

          else

            for ATTEMPT in $(seq 1 60); do

              REMAINING=0

              echo ""
              echo "=============================================================="
              echo "VPC DELETE PASS $ATTEMPT/60"
              echo "=============================================================="

              for VPC_ID in $VPC_IDS; do

                [[ -z "$VPC_ID" ]] && continue

                EXISTS="$(
                  aws ec2 describe-vpcs \
                    --vpc-ids "$VPC_ID" \
                    --region "$AWS_REGION" \
                    --query "Vpcs[0].VpcId" \
                    --output text \
                    --no-cli-pager \
                    2>/dev/null || true
                )"

                if [[ "$EXISTS" == "None" ||
                      "$EXISTS" == "null" ||
                      -z "$EXISTS" ]]; then

                  echo ""
                  echo "VPC already deleted:"
                  echo "  $VPC_ID"

                  continue

                fi

                REMAINING=$((REMAINING + 1))

                echo ""
                echo "Attempting VPC deletion:"
                echo "  $VPC_ID"

                aws ec2 delete-vpc \
                  --vpc-id "$VPC_ID" \
                  --region "$AWS_REGION" \
                  --no-cli-pager \
                  2>/dev/null || true

              done

              echo ""
              echo "VPCs remaining:"
              echo "  $REMAINING"

              if [[ "$REMAINING" -eq 0 ]]; then

                echo ""
                echo "ALL TARGET VPCS HAVE BEEN DELETED."

                break

              fi

              sleep 10

            done

          fi

          echo ""
          echo "Final VPC deletion pass completed."

      # ===============================================================
      # FINAL SWEEP STEP 21
      # FINAL RESOURCE VERIFICATION
      #
      # This is deliberately informational.
      #
      # The main cleanup job has already performed its own verification.
      # This second verification tells you what the NEW final sweep was
      # able to remove.
      # ===============================================================

      - name: "Final Sweep Step 21 - Final AWS Resource Verification"
        id: final_verification
        shell: bash
        run: |
          set -u

          echo "================================================================"
          echo "FINAL AWS MULTI-RESOURCE CLEANUP VERIFICATION"
          echo "================================================================"

          REMAINING=0

          echo ""
          echo "1. VPC VERIFICATION"
          echo "---------------------------------------------------------------"

          VPCS="$(
            aws ec2 describe-vpcs \
              --region "$AWS_REGION" \
              --filters \
                "Name=tag:$PROJECT_TAG_KEY,Values=$PROJECT_TAG_VALUE" \
              --query "Vpcs[].VpcId" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          if [[ -n "$VPCS" &&
                "$VPCS" != "None" ]]; then

            echo "Remaining Project-tagged VPCs:"
            echo "$VPCS"

            REMAINING=$((REMAINING + 1))

          else

            echo "[OK] No Project-tagged VPC remains."

          fi

          echo ""
          echo "2. RDS VERIFICATION"
          echo "---------------------------------------------------------------"

          RDS_LEFT="$(
            aws rds describe-db-instances \
              --region "$AWS_REGION" \
              --query "DBInstances[?starts_with(DBInstanceIdentifier, 'charliecafe-tf-')].DBInstanceIdentifier" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          if [[ -n "$RDS_LEFT" &&
                "$RDS_LEFT" != "None" ]]; then

            echo "Remaining Charlie Cafe RDS:"
            echo "$RDS_LEFT"

            REMAINING=$((REMAINING + 1))

          else

            echo "[OK] No charliecafe-tf-* RDS instance remains."

          fi

          echo ""
          echo "3. S3 VERIFICATION"
          echo "---------------------------------------------------------------"

          S3_LEFT="$(
            aws s3api list-buckets \
              --query "Buckets[?starts_with(Name, 'terraform-')].Name" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          if [[ -n "$S3_LEFT" &&
                "$S3_LEFT" != "None" ]]; then

            echo "Remaining terraform-* S3 buckets:"
            echo "$S3_LEFT"

            # Backend may intentionally remain protected.
            if [[ -n "${BACKEND_BUCKET:-}" ]]; then
              echo "Terraform backend may be intentionally protected."
            fi

          else

            echo "[OK] No terraform-* S3 bucket remains."

          fi

          echo ""
          echo "4. ECR VERIFICATION"
          echo "---------------------------------------------------------------"

          ECR_LEFT="$(
            aws ecr describe-repositories \
              --region "$AWS_REGION" \
              --query "repositories[?repositoryName=='$ECR_REPOSITORY_NAME' || starts_with(repositoryName, 'charlie-cafe-tf-')].repositoryName" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          if [[ -n "$ECR_LEFT" &&
                "$ECR_LEFT" != "None" ]]; then

            echo "Remaining ECR:"
            echo "$ECR_LEFT"

            REMAINING=$((REMAINING + 1))

          else

            echo "[OK] No Charlie Cafe ECR repository remains."

          fi

          echo ""
          echo "5. ALB VERIFICATION"
          echo "---------------------------------------------------------------"

          ALB_LEFT="$(
            aws elbv2 describe-load-balancers \
              --region "$AWS_REGION" \
              --query "LoadBalancers[?starts_with(LoadBalancerName, 'CharlieCafe-TF-')].LoadBalancerName" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          if [[ -n "$ALB_LEFT" &&
                "$ALB_LEFT" != "None" ]]; then

            echo "Remaining Charlie Cafe ALB:"
            echo "$ALB_LEFT"

            REMAINING=$((REMAINING + 1))

          else

            echo "[OK] No CharlieCafe-TF-* ALB remains."

          fi

          echo ""
          echo "6. EC2 VERIFICATION"
          echo "---------------------------------------------------------------"

          EC2_LEFT="$(
            aws ec2 describe-instances \
              --region "$AWS_REGION" \
              --filters \
                "Name=tag:$PROJECT_TAG_KEY,Values=$PROJECT_TAG_VALUE" \
                "Name=instance-state-name,Values=pending,running,stopping,stopped" \
              --query "Reservations[].Instances[].InstanceId" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          if [[ -n "$EC2_LEFT" &&
                "$EC2_LEFT" != "None" ]]; then

            echo "Remaining Project-tagged EC2:"
            echo "$EC2_LEFT"

            REMAINING=$((REMAINING + 1))

          else

            echo "[OK] No Project-tagged EC2 remains."

          fi

          echo ""
          echo "7. ECS VERIFICATION"
          echo "---------------------------------------------------------------"

          ECS_LEFT="$(
            aws ecs list-clusters \
              --region "$AWS_REGION" \
              --query "clusterArns[]" \
              --output text \
              --no-cli-pager \
              2>/dev/null || true
          )"

          ECS_MATCH=""

          for CLUSTER_ARN in $ECS_LEFT; do

            [[ -z "$CLUSTER_ARN" ]] && continue
            [[ "$CLUSTER_ARN" == "None" ]] && continue

            CLUSTER_NAME="${CLUSTER_ARN##*/}"

            if [[ "$CLUSTER_NAME" == CharlieCafe-TF-* ]]; then
              ECS_MATCH="$ECS_MATCH $CLUSTER_NAME"
            fi

          done

          if [[ -n "$ECS_MATCH" ]]; then

            echo "Remaining ECS clusters:"
            echo "$ECS_MATCH"

            REMAINING=$((REMAINING + 1))

          else

            echo "[OK] No CharlieCafe-TF-* ECS cluster remains."

          fi

          echo ""
          echo "================================================================"
          echo "FINAL SWEEP RESULT"
          echo "================================================================"

          echo ""
          echo "Remaining critical resource categories:"
          echo "  $REMAINING"

          if [[ "$REMAINING" -eq 0 ]]; then

            echo ""
            echo "================================================================"
            echo ""
            echo "  FINAL AWS MULTI-RESOURCE CLEANUP SUCCESSFUL"
            echo ""
            echo "================================================================"
            echo ""

            echo "[OK] VPC"
            echo "[OK] S3"
            echo "[OK] EC2"
            echo "[OK] VPC Endpoints"
            echo "[OK] RDS"
            echo "[OK] ECS"
            echo "[OK] ECR"
            echo "[OK] Application Load Balancer"
            echo "[OK] Target Groups"
            echo ""
            echo "Final AWS sweep completed successfully."

          else

            echo ""
            echo "================================================================"
            echo ""
            echo "  WARNING: SOME AWS RESOURCES MAY STILL REMAIN"
            echo ""
            echo "================================================================"
            echo ""

            echo "The final sweep attempted cleanup of all requested resources."
            echo "Review the AWS resource output above."

          fi

          echo ""
          echo "================================================================"
          echo "END OF FINAL AWS MULTI-RESOURCE SWEEP"
          echo "================================================================"

      # ===============================================================
      # FINAL SWEEP STEP 22
      # SUMMARY
      #
      # ALWAYS RUNS.
      # ===============================================================

      - name: "Final Sweep Step 22 - Cleanup Summary"
        if: always()
        shell: bash
        run: |

          echo ""
          echo "================================================================"
          echo "CHARLIE CAFE FINAL AWS CLEANUP SUMMARY"
          echo "================================================================"

          echo ""
          echo "Main cleanup job result:"
          echo "  ${{ needs.delete-lab.result }}"

          echo ""
          echo "AWS region:"
          echo "  $AWS_REGION"

          echo ""
          echo "Project safety tag:"
          echo "  $PROJECT_TAG_KEY=$PROJECT_TAG_VALUE"

          echo ""
          echo "Final sweep target resources:"
          echo "  [1]  VPC"
          echo "  [2]  S3 terraform-* buckets"
          echo "  [3]  EC2"
          echo "  [4]  VPC Endpoints"
          echo "  [5]  RDS"
          echo "  [6]  ECS"
          echo "  [7]  ECR"
          echo "  [8]  Application Load Balancers"
          echo "  [9]  Target Groups"

          echo ""
          echo "Additional dependency cleanup:"
          echo "  [A]  NAT Gateways"
          echo "  [B]  Elastic IPs"
          echo "  [C]  Network Interfaces"
          echo "  [D]  Security Groups"
          echo "  [E]  Subnets"
          echo "  [F]  Route Tables"
          echo "  [G]  Internet Gateways"
          echo "  [H]  EFS"

          echo ""
          echo "Terraform working directory:"
          echo "  $TERRAFORM_WORKING_DIRECTORY"

          echo ""
          echo "================================================================"
          echo "END OF COMPLETE CHARLIE CAFE CLEANUP WORKFLOW"
          echo "================================================================"
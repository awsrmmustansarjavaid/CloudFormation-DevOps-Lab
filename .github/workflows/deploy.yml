```yaml
# ==========================================================
# AWS CloudFormation DevOps Lab
# GitHub Actions Deployment Workflow
# ==========================================================
#
# File:
# .github/workflows/deploy.yml
#
# Purpose:
# ----------------------------------------------------------
# This workflow automatically deploys the CloudFormation
# infrastructure defined in:
#
# templates/lab01.yaml
#
# The workflow performs the following tasks:
#
# 1. Checkout GitHub repository
# 2. Configure AWS credentials
# 3. Verify AWS CLI
# 4. Display repository information
# 5. Validate CloudFormation template
# 6. Check whether the CloudFormation stack exists
# 7. Create the stack if it does not exist
# 8. Update the stack if it already exists
# 9. Wait for deployment to complete
# 10. Display stack information
# 11. Display stack resources
#
# ==========================================================


# ----------------------------------------------------------
# Workflow Name
# ----------------------------------------------------------

name: AWS CloudFormation Deployment


# ----------------------------------------------------------
# Workflow Triggers
# ----------------------------------------------------------
#
# The workflow runs:
#
# 1. Automatically when code is pushed to main
# 2. Manually from GitHub Actions
#
# ----------------------------------------------------------

on:

  push:
    branches:
      - main

  workflow_dispatch:


# ----------------------------------------------------------
# Global Environment Variables
# ----------------------------------------------------------

env:

  # AWS Region where the CloudFormation stack will be created
  AWS_REGION: us-east-1

  # CloudFormation stack name
  STACK_NAME: Lab01-CloudFormation

  # Main CloudFormation template
  TEMPLATE_FILE: templates/lab01.yaml


# ==========================================================
# JOBS
# ==========================================================

jobs:

  deploy:

    # --------------------------------------------------------
    # GitHub-hosted runner
    # --------------------------------------------------------

    runs-on: ubuntu-latest

    name: Validate and Deploy CloudFormation Stack


    # ========================================================
    # STEPS
    # ========================================================

    steps:


      # ======================================================
      # Step 1 - Checkout Repository
      # ======================================================

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ======================================================
      # Step 2 - Configure AWS Credentials
      # ======================================================
      #
      # Required GitHub Secrets:
      #
      # AWS_ACCESS_KEY_ID
      # AWS_SECRET_ACCESS_KEY
      # DB_MASTER_PASSWORD
      #
      # DB_MASTER_PASSWORD is used as the RDS password.
      #
      # ======================================================

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: ${{ env.AWS_REGION }}


      # ======================================================
      # Step 3 - Verify AWS CLI
      # ======================================================

      - name: Verify AWS CLI

        run: |

          echo "======================================"
          echo "AWS CLI Version"
          echo "======================================"

          aws --version

          echo ""

          echo "======================================"
          echo "AWS Account Information"
          echo "======================================"

          aws sts get-caller-identity


      # ======================================================
      # Step 4 - Display Repository Information
      # ======================================================

      - name: Display Environment

        run: |

          echo "======================================"
          echo "GitHub Runner Information"
          echo "======================================"

          echo "Current Directory:"
          pwd

          echo ""

          echo "Repository Files:"
          ls -la

          echo ""

          echo "CloudFormation Template:"
          echo "$TEMPLATE_FILE"

          echo ""

          echo "AWS Region:"
          echo "$AWS_REGION"

          echo ""

          echo "CloudFormation Stack:"
          echo "$STACK_NAME"


      # ======================================================
      # Step 5 - Verify CloudFormation Template Exists
      # ======================================================

      - name: Check CloudFormation Template

        run: |

          echo "======================================"
          echo "Checking CloudFormation Template"
          echo "======================================"

          if [ ! -f "$TEMPLATE_FILE" ]; then

            echo "ERROR: CloudFormation template not found:"
            echo "$TEMPLATE_FILE"

            exit 1

          fi

          echo "Template found successfully:"
          echo "$TEMPLATE_FILE"


      # ======================================================
      # Step 6 - Validate CloudFormation Template
      # ======================================================
      #
      # This validates the syntax and structure of the
      # CloudFormation template before deployment.
      #
      # ======================================================

      - name: Validate CloudFormation Template

        run: |

          echo "======================================"
          echo "Validating CloudFormation Template"
          echo "======================================"

          aws cloudformation validate-template \
            --template-body "file://$TEMPLATE_FILE"

          echo ""

          echo "CloudFormation template validation completed."


      # ======================================================
      # Step 7 - Check Whether Stack Exists
      # ======================================================
      #
      # The result is stored in GitHub Actions output:
      #
      # exists=true
      #
      # or
      #
      # exists=false
      #
      # ======================================================

      - name: Check Stack Status

        id: stack

        shell: bash

        run: |

          echo "======================================"
          echo "Checking CloudFormation Stack"
          echo "======================================"

          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            > /dev/null 2>&1
          then

            echo "CloudFormation stack already exists."

            echo "exists=true" >> "$GITHUB_OUTPUT"

          else

            echo "CloudFormation stack does not exist."

            echo "exists=false" >> "$GITHUB_OUTPUT"

          fi


      # ======================================================
      # Step 8 - Display Existing Stack Status
      # ======================================================
      #
      # This step is useful for troubleshooting.
      #
      # If the stack exists, display its current status.
      #
      # ======================================================

      - name: Display Existing Stack Status

        if: steps.stack.outputs.exists == 'true'

        run: |

          echo "======================================"
          echo "Existing Stack Status"
          echo "======================================"

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].StackStatus" \
            --output text


      # ======================================================
      # Step 9 - Create New CloudFormation Stack
      # ======================================================
      #
      # This runs only when the stack does not exist.
      #
      # IMPORTANT:
      #
      # KeyPairName is the AWS EC2 Key Pair NAME:
      #
      #     Lab-KeyPair
      #
      # NOT:
      #
      #     Lab-KeyPair.pem
      #
      # The .pem file must NOT be uploaded to GitHub.
      #
      # DB_MASTER_PASSWORD comes from GitHub Secrets.
      #
      # ======================================================

      - name: Create CloudFormation Stack

        if: steps.stack.outputs.exists == 'false'

        run: |

          echo "======================================"
          echo "Creating CloudFormation Stack"
          echo "======================================"

          echo "Stack Name : $STACK_NAME"
          echo "Template   : $TEMPLATE_FILE"
          echo "Region     : $AWS_REGION"
          echo "Key Pair   : Lab-KeyPair"

          echo ""

          aws cloudformation create-stack \
            --stack-name "$STACK_NAME" \
            --template-body "file://$TEMPLATE_FILE" \
            --parameters \
              "ParameterKey=KeyPairName,ParameterValue=Lab-KeyPair" \
              "ParameterKey=DBMasterPassword,ParameterValue=${{ secrets.DB_MASTER_PASSWORD }}" \
            --region "$AWS_REGION"

          echo ""

          echo "CloudFormation stack creation started."


      # ======================================================
      # Step 10 - Wait for Stack Creation
      # ======================================================
      #
      # This runs only when a new stack was created.
      #
      # The workflow waits until CloudFormation finishes.
      #
      # ======================================================

      - name: Wait for Stack Creation

        if: steps.stack.outputs.exists == 'false'

        run: |

          echo "======================================"
          echo "Waiting for Stack Creation"
          echo "======================================"

          aws cloudformation wait stack-create-complete \
            --stack-name "$STACK_NAME"

          echo ""

          echo "Stack creation completed successfully."


      # ======================================================
      # Step 11 - Update Existing CloudFormation Stack
      # ======================================================
      #
      # This runs when the stack already exists.
      #
      # IMPORTANT:
      #
      # The same parameters are passed during update.
      #
      # KeyPairName:
      #     Lab-KeyPair
      #
      # DBMasterPassword:
      #     GitHub Secret
      #
      # ======================================================

      - name: Update CloudFormation Stack

        if: steps.stack.outputs.exists == 'true'

        run: |

          echo "======================================"
          echo "Updating CloudFormation Stack"
          echo "======================================"

          echo "Stack Name : $STACK_NAME"
          echo "Template   : $TEMPLATE_FILE"
          echo "Region     : $AWS_REGION"
          echo "Key Pair   : Lab-KeyPair"

          echo ""

          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file "$TEMPLATE_FILE" \
            --parameter-overrides \
              "KeyPairName=Lab-KeyPair" \
              "DBMasterPassword=${{ secrets.DB_MASTER_PASSWORD }}" \
            --region "$AWS_REGION"

          echo ""

          echo "CloudFormation deployment/update completed."


      # ======================================================
      # Step 12 - Wait for Existing Stack Update
      # ======================================================
      #
      # This waits for an existing stack update to finish.
      #
      # ======================================================

      - name: Wait for Stack Update

        if: steps.stack.outputs.exists == 'true'

        run: |

          echo "======================================"
          echo "Waiting for Stack Update"
          echo "======================================"

          aws cloudformation wait stack-update-complete \
            --stack-name "$STACK_NAME"

          echo ""

          echo "Stack update completed successfully."


      # ======================================================
      # Step 13 - Display Final Stack Information
      # ======================================================

      - name: Display Stack Information

        run: |

          echo "======================================"
          echo "CloudFormation Stack Details"
          echo "======================================"

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME"


      # ======================================================
      # Step 14 - Display Stack Resources
      # ======================================================

      - name: List Stack Resources

        run: |

          echo "======================================"
          echo "CloudFormation Stack Resources"
          echo "======================================"

          aws cloudformation list-stack-resources \
            --stack-name "$STACK_NAME"


      # ======================================================
      # Step 15 - Display Stack Outputs
      # ======================================================
      #
      # This is especially useful because your lab01.yaml
      # contains outputs for:
      #
      # - VPC
      # - Public subnet
      # - Private subnets
      # - Security group
      # - EC2 instance
      # - EC2 public IP
      # - S3 bucket
      # - RDS database
      # - RDS endpoint
      #
      # ======================================================

      - name: Display Stack Outputs

        run: |

          echo "======================================"
          echo "CloudFormation Stack Outputs"
          echo "======================================"

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs" \
            --output table


      # ======================================================
      # Step 16 - Deployment Complete
      # ======================================================

      - name: Deployment Complete

        run: |

          echo ""

          echo "======================================"
          echo "CloudFormation Deployment Completed"
          echo "======================================"

          echo ""

          echo "Stack Name : $STACK_NAME"

          echo "Region     : $AWS_REGION"

          echo "Template   : $TEMPLATE_FILE"

          echo ""

          echo "Deployment completed successfully."

          echo "======================================"
```

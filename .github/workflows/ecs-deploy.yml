# ============================================================
# Charlie Cafe - ECS Deployment Workflow
# ============================================================
#
# File:
#
# .github/workflows/ecs-deploy.yml
#
# PURPOSE
# ------------------------------------------------------------
#
# This reusable workflow performs the COMPLETE Charlie Cafe
# ECS deployment process.
#
# Deployment flow:
#
#   1. Checkout repository
#   2. Configure AWS credentials
#   3. Verify AWS identity
#   4. Verify required secrets
#   5. Verify CloudFormation template
#   6. Validate CloudFormation template
#   7. Verify VPC
#   8. Verify subnets
#   9. Verify private route table
#  10. Create / update ECS + ECR CloudFormation stack
#  11. Verify CloudFormation stack
#  12. Display CloudFormation outputs
#  13. Verify ECR repository
#  14. Login to ECR
#  15. Get ECR repository URI
#  16. Build Docker image
#  17. Push Docker image to ECR
#  18. Verify Docker image
#  19. Verify ECS cluster
#  20. Verify ECS service
#  21. Start ECS service
#  22. Force new ECS deployment
#  23. Wait for ECS service stabilization
#  24. Display final ECS service status
#  25. Display running ECS tasks
#  26. Get ALB information
#  27. Verify ALB target health
#  28. Test application URL
#  29. Verify CloudWatch log group
#  30. Display final deployment summary
#
#
# IMPORTANT
# ------------------------------------------------------------
#
# This workflow can be executed in TWO ways:
#
# A. Called from deploy.yml
#
#    deploy.yml
#       |
#       +---- secrets: inherit
#       |
#       +---- ecs-deploy.yml
#
# B. Manually using workflow_dispatch
#
# In both cases GitHub repository secrets are available.
#
#
# IMPORTANT SECRET FIX
# ------------------------------------------------------------
#
# DO NOT put:
#
#     secrets: inherit
#
# under workflow_call in THIS FILE.
#
# "secrets: inherit" belongs in the CALLER workflow
# (deploy.yml), not here.
#
#
# ============================================================


name: Charlie Cafe - ECS Deployment


# ============================================================
# WORKFLOW TRIGGERS
# ============================================================

on:

  # ----------------------------------------------------------
  # Reusable workflow trigger
  # ----------------------------------------------------------
  #
  # The calling workflow is responsible for:
  #
  #     secrets: inherit
  #
  # ----------------------------------------------------------

  workflow_call:


  # ----------------------------------------------------------
  # Manual execution
  # ----------------------------------------------------------
  #
  # Allows you to run this workflow directly from:
  #
  # GitHub
  #   -> Actions
  #   -> Charlie Cafe - ECS Deployment
  #   -> Run workflow
  #
  # ----------------------------------------------------------

  workflow_dispatch:


# ============================================================
# GLOBAL ENVIRONMENT VARIABLES
# ============================================================

env:

  # ----------------------------------------------------------
  # AWS REGION
  # ----------------------------------------------------------

  AWS_REGION: ${{ secrets.AWS_REGION }}


  # ----------------------------------------------------------
  # CLOUDFORMATION STACK NAME
  # ----------------------------------------------------------

  ECS_STACK_NAME: CharlieCafe-ECS-Stack


  # ----------------------------------------------------------
  # ECS CLOUDFORMATION TEMPLATE
  # ----------------------------------------------------------

  ECS_TEMPLATE_FILE: templates/aws-ecs-ecr.yaml


  # ----------------------------------------------------------
  # APPLICATION NAME
  # ----------------------------------------------------------

  APPLICATION_NAME: CharlieCafe


  # ----------------------------------------------------------
  # ECR REPOSITORY
  # ----------------------------------------------------------

  ECR_REPOSITORY: charlie-cafe


  # ----------------------------------------------------------
  # ECS CLUSTER
  # ----------------------------------------------------------

  ECS_CLUSTER: CharlieCafe-Cluster


  # ----------------------------------------------------------
  # ECS SERVICE
  # ----------------------------------------------------------

  ECS_SERVICE: CharlieCafe-Service


  # ----------------------------------------------------------
  # CONTAINER PORT
  # ----------------------------------------------------------

  CONTAINER_PORT: 80


  # ----------------------------------------------------------
  # ECS TASK CPU
  # ----------------------------------------------------------

  TASK_CPU: 256


  # ----------------------------------------------------------
  # ECS TASK MEMORY
  # ----------------------------------------------------------

  TASK_MEMORY: 512


  # ----------------------------------------------------------
  # FINAL ECS DESIRED COUNT
  # ----------------------------------------------------------

  ECS_DESIRED_COUNT: 1


  # ----------------------------------------------------------
  # DOCKER IMAGE TAG
  # ----------------------------------------------------------

  IMAGE_TAG: latest


# ============================================================
# JOBS
# ============================================================

jobs:

  deploy:

    name: Create ECS Infrastructure and Deploy Application

    runs-on: ubuntu-latest


    # ========================================================
    # STEPS
    # ========================================================

    steps:


      # ======================================================
      # STEP 1
      # CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # STEP 2
      # CONFIGURE AWS CREDENTIALS
      # ======================================================
      #
      # GitHub Actions uses the AWS credentials stored in
      # GitHub repository secrets.
      #
      # ======================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: ${{ secrets.AWS_REGION }}


      # ======================================================
      # STEP 3
      # VERIFY AWS IDENTITY
      # ======================================================
      #
      # This confirms that GitHub Actions is connected to the
      # same AWS account expected by the lab.
      #
      # ======================================================

      - name: Verify AWS identity
        shell: bash

        run: |

          echo "=================================================="
          echo "AWS IDENTITY"
          echo "=================================================="

          aws sts get-caller-identity

          echo ""

          echo "AWS Region:"
          echo "$AWS_REGION"

          echo ""

          echo "AWS CLI:"
          aws --version


      # ======================================================
      # STEP 4
      # VERIFY REQUIRED GITHUB SECRETS
      # ======================================================
      #
      # Secret values are NEVER printed.
      #
      # We only check whether each required secret exists.
      #
      # ======================================================

      - name: Verify required GitHub secrets
        shell: bash

        run: |

          echo "=================================================="
          echo "VERIFYING REQUIRED GITHUB SECRETS"
          echo "=================================================="


          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "ERROR: AWS_ACCESS_KEY_ID is missing."
            exit 1
          fi


          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "ERROR: AWS_SECRET_ACCESS_KEY is missing."
            exit 1
          fi


          if [ -z "${{ secrets.AWS_REGION }}" ]; then
            echo "ERROR: AWS_REGION is missing."
            exit 1
          fi


          if [ -z "${{ secrets.ECS_VPC_ID }}" ]; then
            echo "ERROR: ECS_VPC_ID is missing."
            exit 1
          fi


          if [ -z "${{ secrets.ECS_PUBLIC_SUBNET_1 }}" ]; then
            echo "ERROR: ECS_PUBLIC_SUBNET_1 is missing."
            exit 1
          fi


          if [ -z "${{ secrets.ECS_PUBLIC_SUBNET_2 }}" ]; then
            echo "ERROR: ECS_PUBLIC_SUBNET_2 is missing."
            exit 1
          fi


          if [ -z "${{ secrets.ECS_PRIVATE_SUBNET_1 }}" ]; then
            echo "ERROR: ECS_PRIVATE_SUBNET_1 is missing."
            exit 1
          fi


          if [ -z "${{ secrets.ECS_PRIVATE_SUBNET_2 }}" ]; then
            echo "ERROR: ECS_PRIVATE_SUBNET_2 is missing."
            exit 1
          fi


          if [ -z "${{ secrets.ECS_PRIVATE_ROUTE_TABLE_ID }}" ]; then
            echo "ERROR: ECS_PRIVATE_ROUTE_TABLE_ID is missing."
            exit 1
          fi


          echo ""
          echo "All required GitHub secrets are available."


      # ======================================================
      # STEP 5
      # VERIFY CLOUDFORMATION TEMPLATE
      # ======================================================

      - name: Verify CloudFormation template
        shell: bash

        run: |

          echo "=================================================="
          echo "VERIFYING CLOUDFORMATION TEMPLATE"
          echo "=================================================="


          if [ ! -f "$ECS_TEMPLATE_FILE" ]; then

            echo ""
            echo "ERROR: CloudFormation template was not found."
            echo ""
            echo "Expected:"
            echo "$ECS_TEMPLATE_FILE"
            echo ""

            find templates -maxdepth 2 -type f -print 2>/dev/null || true

            exit 1

          fi


          echo ""
          echo "Template found:"
          echo "$ECS_TEMPLATE_FILE"


      # ======================================================
      # STEP 6
      # VALIDATE CLOUDFORMATION TEMPLATE
      # ======================================================

      - name: Validate ECS CloudFormation template
        shell: bash

        run: |

          echo "=================================================="
          echo "VALIDATING CLOUDFORMATION TEMPLATE"
          echo "=================================================="


          aws cloudformation validate-template \
            --region "$AWS_REGION" \
            --template-body "file://$ECS_TEMPLATE_FILE"


          echo ""
          echo "CloudFormation template validation SUCCESS."


      # ======================================================
      # STEP 7
      # VERIFY VPC
      # ======================================================

      - name: Verify VPC
        shell: bash

        run: |

          echo "=================================================="
          echo "VERIFYING VPC"
          echo "=================================================="


          aws ec2 describe-vpcs \
            --region "$AWS_REGION" \
            --vpc-ids "${{ secrets.ECS_VPC_ID }}" \
            --query 'Vpcs[0].[VpcId,State,CidrBlock]' \
            --output table


          echo ""
          echo "VPC verification SUCCESS."


      # ======================================================
      # STEP 8
      # VERIFY SUBNETS
      # ======================================================

      - name: Verify ECS subnets
        shell: bash

        run: |

          echo "=================================================="
          echo "VERIFYING ECS SUBNETS"
          echo "=================================================="


          aws ec2 describe-subnets \
            --region "$AWS_REGION" \
            --subnet-ids \
              "${{ secrets.ECS_PUBLIC_SUBNET_1 }}" \
              "${{ secrets.ECS_PUBLIC_SUBNET_2 }}" \
              "${{ secrets.ECS_PRIVATE_SUBNET_1 }}" \
              "${{ secrets.ECS_PRIVATE_SUBNET_2 }}" \
            --query 'Subnets[].[SubnetId,VpcId,AvailabilityZone,CidrBlock,MapPublicIpOnLaunch]' \
            --output table


          echo ""
          echo "Subnet verification SUCCESS."


      # ======================================================
      # STEP 9
      # VERIFY PRIVATE ROUTE TABLE
      # ======================================================

      - name: Verify private route table
        shell: bash

        run: |

          echo "=================================================="
          echo "VERIFYING PRIVATE ROUTE TABLE"
          echo "=================================================="


          aws ec2 describe-route-tables \
            --region "$AWS_REGION" \
            --route-table-ids "${{ secrets.ECS_PRIVATE_ROUTE_TABLE_ID }}" \
            --query 'RouteTables[0].[RouteTableId,VpcId]' \
            --output table


          echo ""
          echo "Private route table verification SUCCESS."


      # ======================================================
      # STEP 10
      # CREATE / UPDATE ECS + ECR CLOUDFORMATION STACK
      # ======================================================
      #
      # This is intentionally equivalent to your successful
      # PowerShell command.
      #
      # PowerShell:
      #
      # aws cloudformation deploy `
      #   --region $AWS_REGION `
      #   --stack-name $ECS_STACK_NAME `
      #   --template-file $ECS_TEMPLATE_FILE `
      #   --capabilities CAPABILITY_NAMED_IAM `
      #   --parameter-overrides `
      #     VpcId=$VPC_ID `
      #     PublicSubnet1=$PUBLIC_SUBNET_1 `
      #     PublicSubnet2=$PUBLIC_SUBNET_2 `
      #     PrivateSubnet1=$PRIVATE_SUBNET_1 `
      #     PrivateSubnet2=$PRIVATE_SUBNET_2 `
      #     PrivateRouteTableId=$PRIVATE_ROUTE_TABLE_ID `
      #     ApplicationName=$APPLICATION_NAME `
      #     ContainerPort=$CONTAINER_PORT `
      #     TaskCpu=256 `
      #     TaskMemory=512 `
      #     DesiredCount=0
      #
      # GitHub Actions uses Bash syntax.
      #
      # ======================================================

      - name: Create or update ECS CloudFormation stack
        shell: bash

        run: |

          echo "=================================================="
          echo "CREATING / UPDATING ECS CLOUDFORMATION STACK"
          echo "=================================================="


          echo ""
          echo "AWS Region:"
          echo "$AWS_REGION"


          echo ""
          echo "Stack:"
          echo "$ECS_STACK_NAME"


          echo ""
          echo "Template:"
          echo "$ECS_TEMPLATE_FILE"


          echo ""
          echo "VPC:"
          echo "${{ secrets.ECS_VPC_ID }}"


          echo ""
          echo "Starting CloudFormation deployment..."


          aws cloudformation deploy \
            --region "$AWS_REGION" \
            --stack-name "$ECS_STACK_NAME" \
            --template-file "$ECS_TEMPLATE_FILE" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              VpcId="${{ secrets.ECS_VPC_ID }}" \
              PublicSubnet1="${{ secrets.ECS_PUBLIC_SUBNET_1 }}" \
              PublicSubnet2="${{ secrets.ECS_PUBLIC_SUBNET_2 }}" \
              PrivateSubnet1="${{ secrets.ECS_PRIVATE_SUBNET_1 }}" \
              PrivateSubnet2="${{ secrets.ECS_PRIVATE_SUBNET_2 }}" \
              PrivateRouteTableId="${{ secrets.ECS_PRIVATE_ROUTE_TABLE_ID }}" \
              ApplicationName="$APPLICATION_NAME" \
              ContainerPort="$CONTAINER_PORT" \
              TaskCpu="$TASK_CPU" \
              TaskMemory="$TASK_MEMORY" \
              DesiredCount="0"


          echo ""
          echo "=================================================="
          echo "ECS CLOUDFORMATION DEPLOYMENT SUCCESS"
          echo "=================================================="


      # ======================================================
      # STEP 11
      # VERIFY CLOUDFORMATION STACK
      # ======================================================

      - name: Verify ECS CloudFormation stack
        shell: bash

        run: |

          echo "=================================================="
          echo "VERIFYING ECS CLOUDFORMATION STACK"
          echo "=================================================="


          STACK_STATUS=$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name "$ECS_STACK_NAME" \
            --query 'Stacks[0].StackStatus' \
            --output text)


          echo ""
          echo "Stack:"
          echo "$ECS_STACK_NAME"


          echo ""
          echo "Status:"
          echo "$STACK_STATUS"


          case "$STACK_STATUS" in

            CREATE_COMPLETE)

              echo ""
              echo "ECS stack CREATED successfully."

              ;;


            UPDATE_COMPLETE)

              echo ""
              echo "ECS stack UPDATED successfully."

              ;;


            *)

              echo ""
              echo "ERROR: Unexpected CloudFormation status."
              echo "$STACK_STATUS"

              echo ""
              echo "CloudFormation events:"

              aws cloudformation describe-stack-events \
                --region "$AWS_REGION" \
                --stack-name "$ECS_STACK_NAME" \
                --query 'StackEvents[0:20].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]' \
                --output table

              exit 1

              ;;

          esac


      # ======================================================
      # STEP 12
      # DISPLAY CLOUDFORMATION OUTPUTS
      # ======================================================

      - name: Display CloudFormation outputs
        shell: bash

        run: |

          echo "=================================================="
          echo "CLOUDFORMATION OUTPUTS"
          echo "=================================================="


          aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name "$ECS_STACK_NAME" \
            --query 'Stacks[0].Outputs[*].[OutputKey,OutputValue]' \
            --output table


      # ======================================================
      # STEP 13
      # VERIFY ECR REPOSITORY
      # ======================================================

      - name: Verify ECR repository
        shell: bash

        run: |

          echo "=================================================="
          echo "VERIFYING ECR REPOSITORY"
          echo "=================================================="


          aws ecr describe-repositories \
            --region "$AWS_REGION" \
            --repository-names "$ECR_REPOSITORY" \
            --query 'repositories[0].[repositoryName,repositoryUri,imageTagMutability]' \
            --output table


          echo ""
          echo "ECR repository verification SUCCESS."


      # ======================================================
      # STEP 14
      # LOGIN TO ECR
      # ======================================================

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # ======================================================
      # STEP 15
      # GET ECR REPOSITORY URI
      # ======================================================

      - name: Get ECR repository URI
        id: ecr
        shell: bash

        run: |

          echo "=================================================="
          echo "GETTING ECR REPOSITORY URI"
          echo "=================================================="


          ECR_URI=$(aws ecr describe-repositories \
            --region "$AWS_REGION" \
            --repository-names "$ECR_REPOSITORY" \
            --query 'repositories[0].repositoryUri' \
            --output text)


          echo ""
          echo "ECR URI:"
          echo "$ECR_URI"


          echo "repository_uri=$ECR_URI" >> "$GITHUB_OUTPUT"


      # ======================================================
      # STEP 16
      # BUILD DOCKER IMAGE
      # ======================================================

      - name: Build Docker image
        shell: bash

        run: |

          echo "=================================================="
          echo "BUILDING DOCKER IMAGE"
          echo "=================================================="


          docker --version


          echo ""
          echo "Building:"
          echo "${{ steps.ecr.outputs.repository_uri }}:$IMAGE_TAG"


          docker build \
            -t "${{ steps.ecr.outputs.repository_uri }}:$IMAGE_TAG" \
            .


          echo ""
          echo "Docker image build SUCCESS."


      # ======================================================
      # STEP 17
      # PUSH DOCKER IMAGE TO ECR
      # ======================================================

      - name: Push Docker image to ECR
        shell: bash

        run: |

          echo "=================================================="
          echo "PUSHING DOCKER IMAGE TO ECR"
          echo "=================================================="


          docker push \
            "${{ steps.ecr.outputs.repository_uri }}:$IMAGE_TAG"


          echo ""
          echo "Docker image push SUCCESS."


      # ======================================================
      # STEP 18
      # VERIFY ECR IMAGE
      # ======================================================

      - name: Verify ECR latest image
        shell: bash

        run: |

          echo "=================================================="
          echo "VERIFYING ECR IMAGE"
          echo "=================================================="


          IMAGE_COUNT=$(aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$ECR_REPOSITORY" \
            --filter tagStatus=TAGGED \
            --query 'imageDetails[?contains(imageTags, `latest`)] | length(@)' \
            --output text)


          echo ""
          echo "Latest image count:"
          echo "$IMAGE_COUNT"


          if [ "$IMAGE_COUNT" -eq 0 ]; then

            echo ""
            echo "ERROR: latest image was not found in ECR."

            exit 1

          fi


          echo ""
          echo "ECR image verification SUCCESS."


      # ======================================================
      # STEP 19
      # VERIFY ECS CLUSTER
      # ======================================================

      - name: Verify ECS cluster
        shell: bash

        run: |

          echo "=================================================="
          echo "VERIFYING ECS CLUSTER"
          echo "=================================================="


          aws ecs describe-clusters \
            --region "$AWS_REGION" \
            --clusters "$ECS_CLUSTER" \
            --query 'clusters[0].[clusterName,status,activeServicesCount,runningTasksCount]' \
            --output table


          echo ""
          echo "ECS cluster verification SUCCESS."


      # ======================================================
      # STEP 20
      # VERIFY ECS SERVICE
      # ======================================================

      - name: Verify ECS service
        shell: bash

        run: |

          echo "=================================================="
          echo "VERIFYING ECS SERVICE"
          echo "=================================================="


          aws ecs describe-services \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].[serviceName,status,desiredCount,runningCount,pendingCount]' \
            --output table


          echo ""
          echo "ECS service verification SUCCESS."


      # ======================================================
      # STEP 21
      # START ECS SERVICE
      # ======================================================
      #
      # CloudFormation intentionally created the ECS service
      # with DesiredCount = 0.
      #
      # Now change it to DesiredCount = 1.
      #
      # ======================================================

      - name: Start ECS service
        shell: bash

        run: |

          echo "=================================================="
          echo "STARTING ECS FARGATE SERVICE"
          echo "=================================================="


          aws ecs update-service \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --desired-count "$ECS_DESIRED_COUNT"


          echo ""
          echo "ECS desired count:"
          echo "$ECS_DESIRED_COUNT"


      # ======================================================
      # STEP 22
      # FORCE NEW ECS DEPLOYMENT
      # ======================================================

      - name: Force new ECS deployment
        shell: bash

        run: |

          echo "=================================================="
          echo "FORCING NEW ECS DEPLOYMENT"
          echo "=================================================="


          aws ecs update-service \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --desired-count "$ECS_DESIRED_COUNT" \
            --force-new-deployment


          echo ""
          echo "New ECS deployment started."


      # ======================================================
      # STEP 23
      # WAIT FOR ECS SERVICE TO STABILIZE
      # ======================================================

      - name: Wait for ECS service to stabilize
        shell: bash

        run: |

          echo "=================================================="
          echo "WAITING FOR ECS SERVICE TO STABILIZE"
          echo "=================================================="


          aws ecs wait services-stable \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"


          echo ""
          echo "=================================================="
          echo "ECS SERVICE IS STABLE"
          echo "=================================================="


      # ======================================================
      # STEP 24
      # SHOW FINAL ECS SERVICE STATUS
      # ======================================================

      - name: Show final ECS service status
        shell: bash

        run: |

          echo "=================================================="
          echo "FINAL ECS SERVICE STATUS"
          echo "=================================================="


          aws ecs describe-services \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].[serviceName,status,desiredCount,runningCount,pendingCount]' \
            --output table


      # ======================================================
      # STEP 25
      # SHOW RUNNING ECS TASKS
      # ======================================================

      - name: Show running ECS tasks
        shell: bash

        run: |

          echo "=================================================="
          echo "RUNNING ECS TASKS"
          echo "=================================================="


          TASK_ARNS=$(aws ecs list-tasks \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --service-name "$ECS_SERVICE" \
            --desired-status RUNNING \
            --query 'taskArns' \
            --output text)


          if [ -z "$TASK_ARNS" ] || [ "$TASK_ARNS" = "None" ]; then

            echo ""
            echo "ERROR: No running ECS tasks found."

            exit 1

          fi


          aws ecs describe-tasks \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --tasks $TASK_ARNS \
            --query 'tasks[*].[taskArn,lastStatus,healthStatus,taskDefinition]' \
            --output table


          echo ""
          echo "Running ECS task verification SUCCESS."


      # ======================================================
      # STEP 26
      # GET ALB INFORMATION
      # ======================================================

      - name: Get ALB information
        id: alb
        shell: bash

        run: |

          echo "=================================================="
          echo "GETTING APPLICATION LOAD BALANCER"
          echo "=================================================="


          ALB_DNS=$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name "$ECS_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ALBDNSName'].OutputValue" \
            --output text)


          APPLICATION_URL=$(aws cloudformation describe-stacks \
            --region "$AWS_REGION" \
            --stack-name "$ECS_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ApplicationURL'].OutputValue" \
            --output text)


          echo ""
          echo "ALB DNS:"
          echo "$ALB_DNS"


          echo ""
          echo "Application URL:"
          echo "$APPLICATION_URL"


          echo "application_url=$APPLICATION_URL" >> "$GITHUB_OUTPUT"


      # ======================================================
      # STEP 27
      # VERIFY ALB TARGET HEALTH
      # ======================================================

      - name: Verify ALB target health
        shell: bash

        run: |

          echo "=================================================="
          echo "VERIFYING ALB TARGET HEALTH"
          echo "=================================================="


          TARGET_GROUP_ARN=$(aws cloudformation describe-stack-resources \
            --region "$AWS_REGION" \
            --stack-name "$ECS_STACK_NAME" \
            --logical-resource-id ALBTargetGroup \
            --query 'StackResources[0].PhysicalResourceId' \
            --output text)


          echo ""
          echo "Target Group:"
          echo "$TARGET_GROUP_ARN"


          echo ""


          aws elbv2 describe-target-health \
            --region "$AWS_REGION" \
            --target-group-arn "$TARGET_GROUP_ARN" \
            --query 'TargetHealthDescriptions[*].[Target.Id,Target.Port,TargetHealth.State,TargetHealth.Reason]' \
            --output table


          echo ""
          echo "ALB target health check completed."


      # ======================================================
      # STEP 28
      # TEST APPLICATION URL
      # ======================================================
      #
      # FIXED:
      #
      # The previous workflow contained invalid Bash syntax:
      #
      #     |*| true)*
      #
      # This version correctly handles curl failures.
      #
      # ======================================================

      - name: Test application URL
        shell: bash

        run: |

          echo "=================================================="
          echo "TESTING APPLICATION URL"
          echo "=================================================="


          APPLICATION_URL="${{ steps.alb.outputs.application_url }}"


          echo ""
          echo "URL:"
          echo "$APPLICATION_URL"


          if [ -z "$APPLICATION_URL" ] || [ "$APPLICATION_URL" = "None" ]; then

            echo ""
            echo "ERROR: ApplicationURL CloudFormation output was not found."

            exit 1

          fi


          echo ""
          echo "Waiting for application..."


          for attempt in {1..10}; do

            echo ""
            echo "HTTP test attempt: $attempt/10"


            HTTP_CODE=$(curl \
              --silent \
              --show-error \
              --output /tmp/application-response.txt \
              --write-out "%{http_code}" \
              --max-time 15 \
              "$APPLICATION_URL" 2>/dev/null || true)


            echo "HTTP status:"
            echo "$HTTP_CODE"


            if [[ "$HTTP_CODE" =~ ^[0-9]+$ ]] && \
               [ "$HTTP_CODE" -ge 200 ] && \
               [ "$HTTP_CODE" -lt 500 ]; then

              echo ""
              echo "Application HTTP test SUCCESS."

              exit 0

            fi


            sleep 15

          done


          echo ""
          echo "ERROR: Application did not return a successful HTTP response."

          exit 1


      # ======================================================

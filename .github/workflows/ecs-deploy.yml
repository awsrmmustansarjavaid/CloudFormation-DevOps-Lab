# ============================================================
# Charlie Cafe - ECS Deployment Workflow
# ============================================================
#
# File:
#
# .github/workflows/ecs-deploy.yml
#
# PURPOSE
# ------------------------------------------------------------
#
# This workflow is ONLY responsible for deploying the Docker
# image that has ALREADY been built and pushed to ECR by the
# MAIN GitHub Actions workflow.
#
#
# IMPORTANT:
# ------------------------------------------------------------
#
# Docker build and ECR push are NOT performed here.
#
# The MAIN workflow already handles:
#
#     Dockerfile
#          |
#          v
#     Docker Image
#          |
#          v
#         ECR
#
#
# This reusable workflow handles only:
#
#     ECR
#       |
#       v
#     ECS
#       |
#       v
#     New ECS Deployment
#       |
#       v
#     ECS Stable
#
#
# ============================================================


# ============================================================
# WORKFLOW NAME
# ============================================================

name: Charlie Cafe - ECS Deployment


# ============================================================
# WORKFLOW TRIGGERS
# ============================================================
#
# There are TWO ways this workflow can start:
#
# 1. workflow_call
#
#    The MAIN workflow calls this workflow automatically.
#
# 2. workflow_dispatch
#
#    You can manually run this workflow from GitHub Actions.
#
# ============================================================

on:

  # ==========================================================
  # REUSABLE WORKFLOW TRIGGER
  # ==========================================================
  #
  # The MAIN workflow calls this file using:
  #
  #     uses: ./.github/workflows/ecs-deploy.yml
  #
  # ==========================================================

  workflow_call:


  # ==========================================================
  # MANUAL TRIGGER
  # ==========================================================
  #
  # Allows you to manually run the ECS deployment workflow.
  #
  # GitHub:
  #
  # Actions
  #   ↓
  # Charlie Cafe - ECS Deployment
  #   ↓
  # Run workflow
  #
  # ==========================================================

  workflow_dispatch:


# ============================================================
# GLOBAL ENVIRONMENT VARIABLES
# ============================================================

env:

  # ==========================================================
  # AWS REGION
  # ==========================================================
  #
  # This comes from your GitHub repository secret:
  #
  #     AWS_REGION
  #
  # Example:
  #
  #     us-east-1
  #
  # ==========================================================

  AWS_REGION: ${{ secrets.AWS_REGION }}


  # ==========================================================
  # ECR REPOSITORY
  # ==========================================================
  #
  # CloudFormation creates this repository.
  #
  # Example CloudFormation resource:
  #
  #     RepositoryName: charlie-cafe
  #
  # ==========================================================

  ECR_REPOSITORY: charlie-cafe


  # ==========================================================
  # ECS CLUSTER
  # ==========================================================
  #
  # CloudFormation creates:
  #
  #     CharlieCafe-Cluster
  #
  # ==========================================================

  ECS_CLUSTER: CharlieCafe-Cluster


  # ==========================================================
  # ECS SERVICE
  # ==========================================================
  #
  # CloudFormation creates:
  #
  #     CharlieCafe-Service
  #
  # ==========================================================

  ECS_SERVICE: CharlieCafe-Service


# ============================================================
# JOBS
# ============================================================

jobs:


  # ==========================================================
  # ECS DEPLOYMENT JOB
  # ==========================================================
  #
  # IMPORTANT:
  #
  # There is NO Docker build here.
  #
  # There is NO ECR push here.
  #
  # Those operations have already been completed by the
  # Docker job in the MAIN workflow.
  #
  # ==========================================================

  deploy:

    name: Deploy Docker Image to ECS


    # ----------------------------------------------------------
    # GitHub-hosted Ubuntu runner
    # ----------------------------------------------------------

    runs-on: ubuntu-latest


    # ========================================================
    # STEP 1
    # CONFIGURE AWS CREDENTIALS
    # ========================================================
    #
    # The reusable workflow receives the GitHub secrets from
    # the MAIN workflow through:
    #
    #     secrets: inherit
    #
    # ========================================================

    steps:

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: ${{ env.AWS_REGION }}


      # ========================================================
      # STEP 2
      # VERIFY ECR IMAGE
      # ========================================================
      #
      # The MAIN workflow has already pushed the Docker image
      # into ECR.
      #
      # This step confirms that the ECR repository contains
      # images before we ask ECS to deploy.
      #
      # ========================================================

      - name: Verify ECR image

        run: |

          echo "Checking ECR repository..."

          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY"

          echo ""

          echo "Checking ECR images..."

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY"

          echo ""

          echo "ECR image verification completed."


      # ========================================================
      # STEP 3
      # VERIFY ECS CLUSTER
      # ========================================================
      #
      # CloudFormation creates the ECS cluster.
      #
      # We do NOT create the cluster here.
      #
      # ========================================================

      - name: Verify ECS cluster

        run: |

          echo "Checking ECS cluster..."

          aws ecs describe-clusters \
            --clusters "$ECS_CLUSTER"

          echo ""

          echo "ECS cluster exists."


      # ========================================================
      # STEP 4
      # VERIFY ECS SERVICE
      # ========================================================
      #
      # CloudFormation creates the ECS service.
      #
      # We do NOT create the service here.
      #
      # ========================================================

      - name: Verify ECS service

        run: |

          echo "Checking ECS service..."

          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          echo ""

          echo "ECS service exists."


      # ========================================================
      # STEP 5
      # FORCE NEW ECS DEPLOYMENT
      # ========================================================
      #
      # This is the MAIN purpose of this workflow.
      #
      #
      # The MAIN workflow has already done:
      #
      #     Docker build
      #          |
      #          v
      #     Docker image
      #          |
      #          v
      #         ECR
      #
      #
      # Now we tell ECS:
      #
      #     "Start a new deployment."
      #
      #
      # This is especially important when your ECS task
      # definition uses:
      #
      #     :latest
      #
      # because pushing a new image to the same ECR tag does
      # not by itself replace the already-running ECS task.
      #
      # ========================================================

      - name: Force new ECS deployment

        run: |

          echo "Starting new ECS deployment..."

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment

          echo ""

          echo "ECS deployment started."


      # ========================================================
      # STEP 6
      # WAIT FOR ECS SERVICE TO STABILIZE
      # ========================================================
      #
      # GitHub now waits while ECS:
      #
      #     starts new task
      #          |
      #          v
      #     pulls image from ECR
      #          |
      #          v
      #     starts container
      #          |
      #          v
      #     ALB health check
      #          |
      #          v
      #     task becomes healthy
      #          |
      #          v
      #     ECS service stable
      #
      # ========================================================

      - name: Wait for ECS service to stabilize

        run: |

          echo "Waiting for ECS service to become stable..."

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          echo ""

          echo "ECS service is stable."


      # ========================================================
      # STEP 7
      # DISPLAY FINAL ECS SERVICE STATUS
      # ========================================================

      - name: Show ECS service status

        run: |

          echo "=========================================="
          echo "ECS SERVICE STATUS"
          echo "=========================================="

          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"


      # ========================================================
      # STEP 8
      # DEPLOYMENT COMPLETE
      # ========================================================

      - name: Deployment complete

        run: |

          echo ""
          echo "=========================================="
          echo "Charlie Cafe ECS deployment completed"
          echo "=========================================="

          echo ""
          echo "ECR Repository:"
          echo "$ECR_REPOSITORY"

          echo ""
          echo "ECS Cluster:"
          echo "$ECS_CLUSTER"

          echo ""
          echo "ECS Service:"
          echo "$ECS_SERVICE"

          echo ""
          echo "=========================================="
          echo "Docker image is in ECR."
          echo "ECS deployment completed."
          echo "=========================================="

